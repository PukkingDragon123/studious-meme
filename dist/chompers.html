'use strict';
// ---------- math & helpers ----------
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const rand = (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
const randi = (a, b) => Math.floor(rand(a, b + 1));
const choice = arr => arr[(Math.random() * arr.length) | 0];
const chance = p => Math.random() < p;
const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
const sqr = v => v * v;
const sign = v => (v < 0 ? -1 : 1);
const angleDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; else if (d < -Math.PI) d += TAU; return d; };
const angleLerp = (a, b, t) => a + angleDiff(a, b) * t;
const approach = (v, target, step) => (v < target ? Math.min(v + step, target) : Math.max(v - step, target));
const easeOut = t => 1 - (1 - t) * (1 - t);
const easeIn = t => t * t;
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const fmt = n => Math.floor(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');

// ---------- deterministic randomness ----------
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function ihash(i, seed = 0) {
  let x = (i | 0) ^ (seed | 0);
  x = Math.imul(x ^ (x >>> 16), 0x45d9f3b);
  x = Math.imul(x ^ (x >>> 16), 0x45d9f3b);
  x ^= x >>> 16;
  return (x >>> 0) / 4294967296;
}
function vnoise(x, seed = 0) {
  const i = Math.floor(x), f = x - i;
  const u = f * f * (3 - 2 * f);
  return lerp(ihash(i, seed), ihash(i + 1, seed), u);
}
function fbm(x, seed = 0, oct = 3) {
  let v = 0, a = 0.5, f = 1, n = 0;
  for (let k = 0; k < oct; k++) { v += a * vnoise(x * f, seed + k * 131); n += a; a *= 0.5; f *= 2.13; }
  return v / n;
}

// ---------- colors ----------
function hexToRgb(h) {
  h = h.replace('#', '');
  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  const n = parseInt(h, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
const rgbToHex = (r, g, b) => '#' + ((1 << 24) | (clamp(r | 0, 0, 255) << 16) | (clamp(g | 0, 0, 255) << 8) | clamp(b | 0, 0, 255)).toString(16).slice(1);
function rgba(h, a) { const [r, g, b] = hexToRgb(h); return `rgba(${r},${g},${b},${a})`; }
function mixColor(h1, h2, t) {
  const a = hexToRgb(h1), b = hexToRgb(h2);
  return rgbToHex(lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t));
}
function shade(h, k) { const [r, g, b] = hexToRgb(h); return rgbToHex(r * k, g * k, b * k); }

// ---------- canvas helpers ----------
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function ctxOf(c) { const x = c.getContext('2d'); x.imageSmoothingEnabled = false; return x; }

  d('"', ['.#.#.', '.#.#.', '.....', '.....', '.....', '.....', '.....']);
  d('#', ['.#.#.', '#####', '.#.#.', '.#.#.', '#####', '.#.#.', '.....']);

  // small icons

  d('↓', ['..#..', '..#..', '..#..', '..#..', '#.#.#', '.###.', '..#..']); // down

  const cache = new Map();
  function glyph(ch, color) {
    const key = color + ch;
    let c = cache.get(key);
    if (c) return c;
    const rows = G[ch];

    c = mkCanvas(5, 7);
    const x = c.getContext('2d');
    x.fillStyle = color;
    for (let j = 0; j < 7; j++) for (let i = 0; i < 5; i++) if (rows[j][i] === '#') x.fillRect(i, j, 1, 1);
    cache.set(key, c);
    return c;
  }
  function width(str, scale = 1) { return Math.max(0, String(str).length * 6 * scale - scale); }
  function draw(ctx, str, x, y, opts = {}) {
    const color = opts.color || '#ffffff', scale = opts.scale || 1, align = opts.align || 'left';
    str = String(str).toUpperCase();
    const w = width(str, scale);
    if (align === 'center') x -= w / 2; else if (align === 'right') x -= w;
    x = Math.round(x); y = Math.round(y);
    if (opts.shadow) {
      const sc = opts.shadow === true ? '#000000' : opts.shadow;
      const off = opts.shadowOff || scale;
      for (let i = 0; i < str.length; i++) { const g = glyph(str[i], sc); if (g) ctx.drawImage(g, x + i * 6 * scale + off, y + off, 5 * scale, 7 * scale); }
    }
    if (opts.outline) {
      const oc = opts.outline;
      for (let i = 0; i < str.length; i++) {
        const g = glyph(str[i], oc); if (!g) continue;
        const gx = x + i * 6 * scale;
        ctx.drawImage(g, gx - scale, y, 5 * scale, 7 * scale); ctx.drawImage(g, gx + scale, y, 5 * scale, 7 * scale);
        ctx.drawImage(g, gx, y - scale, 5 * scale, 7 * scale); ctx.drawImage(g, gx, y + scale, 5 * scale, 7 * scale);
      }
    }
    for (let i = 0; i < str.length; i++) { const g = glyph(str[i], color); if (g) ctx.drawImage(g, x + i * 6 * scale, y, 5 * scale, 7 * scale); }
    return w;
  }
  // word-wrapped paragraph; returns lines drawn
  function drawWrapped(ctx, str, x, y, maxW, opts = {}) {
    const scale = opts.scale || 1, lh = (opts.lineHeight || 9) * scale;
    const words = String(str).split(' ');
    const lines = []; let cur = '';
    for (const w of words) { const test = cur ? cur + ' ' + w : w; if (width(test, scale) > maxW && cur) { lines.push(cur); cur = w; } else cur = test; }
    if (cur) lines.push(cur);
    lines.forEach((l, i) => draw(ctx, l, x, y + i * lh, opts));

  return { draw, width, drawWrapped, glyph, H: 7 };
})();

/* ===== src/audio.js ===== */
'use strict';
// Fully synthesized audio: no asset files. Everything is built from oscillators + filtered noise.
const SFX = {
  ctx: null, master: null, sfxBus: null, musicBus: null, noiseBuf: null,
  muted: false, vol: 0.6, amb: null, mus: null, _last: {},
  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const c = this.ctx = new AC();
    this.master = c.createGain(); this.master.gain.value = this.muted ? 0 : this.vol; this.master.connect(c.destination);
    this.comp = c.createDynamicsCompressor(); this.comp.threshold.value = -14; this.comp.ratio.value = 5; this.comp.connect(this.master);
    this.sfxBus = c.createGain(); this.sfxBus.gain.value = 0.9; this.sfxBus.connect(this.comp);
    this.musicBus = c.createGain(); this.musicBus.gain.value = 0.3; this.musicBus.connect(this.comp);
    const len = c.sampleRate * 2, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noiseBuf = buf;
    this.startAmbient();
    this.startMusic();
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  toggleMute() { this.muted = !this.muted; if (this.master) this.master.gain.value = this.muted ? 0 : this.vol; return this.muted; },
  // rate limiter so 40 gibs don't play 40 sounds
  gate(name, ms) { const n = performance.now(); if (this._last[name] && n - this._last[name] < ms) return false; this._last[name] = n; return true; },
  tone(o) {
    if (!this.ctx) return null;
    const c = this.ctx, t0 = c.currentTime + (o.delay || 0), t = o.t || 0.2, a = o.a ?? 0.005;
    const osc = c.createOscillator(); osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(Math.max(1, o.f || 440), t0);
    if (o.f2 != null) { if (o.lin) osc.frequency.linearRampToValueAtTime(Math.max(1, o.f2), t0 + t); else osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.f2), t0 + t); }
    if (o.detune) osc.detune.value = o.detune;
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(o.v ?? 0.3, t0 + a);
    if (o.hold) g.gain.setValueAtTime(o.v ?? 0.3, t0 + a + o.hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + t);
    let head = osc;
    if (o.filter) { const fl = c.createBiquadFilter(); fl.type = o.filter.type || 'lowpass'; fl.frequency.setValueAtTime(o.filter.f, t0); if (o.filter.f2) fl.frequency.exponentialRampToValueAtTime(Math.max(10, o.filter.f2), t0 + t); fl.Q.value = o.filter.q || 1; head.connect(fl); head = fl; }
    head.connect(g);
    this._out(g, o.pan, o.dest);
    osc.start(t0); osc.stop(t0 + t + 0.05);
    return osc;
  },
  noise(o) {
    if (!this.ctx) return null;
    const c = this.ctx, t0 = c.currentTime + (o.delay || 0), t = o.t || 0.2, a = o.a ?? 0.003;
    const src = c.createBufferSource(); src.buffer = this.noiseBuf; src.loop = true; src.playbackRate.value = o.rate || 1;
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(o.v ?? 0.3, t0 + a);
    if (o.hold) g.gain.setValueAtTime(o.v ?? 0.3, t0 + a + o.hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + t);
    let head = src;
    if (o.filter) { const fl = c.createBiquadFilter(); fl.type = o.filter.type || 'lowpass'; fl.frequency.setValueAtTime(o.filter.f, t0); if (o.filter.f2) fl.frequency.exponentialRampToValueAtTime(Math.max(10, o.filter.f2), t0 + t); fl.Q.value = o.filter.q || 1; head.connect(fl); head = fl; }
    head.connect(g);
    this._out(g, o.pan, o.dest);
    src.start(t0); src.stop(t0 + t + 0.05);
    return src;
  },
  _out(node, pan, dest) {
    dest = dest || this.sfxBus;
    if (pan && this.ctx.createStereoPanner) { const p = this.ctx.createStereoPanner(); p.pan.value = clamp(pan, -1, 1); node.connect(p); p.connect(dest); } else node.connect(dest);
  },
  // ---------- one-shots ----------
  chomp(size = 1, pan = 0) {
    if (!this.gate('chomp', 40)) return;
    const k = Math.pow(size, 0.3);
    this.noise({ t: 0.1, v: 0.5, filter: { f: 900 / k, f2: 200 / k }, pan });
    this.tone({ type: 'square', f: 130 / k, f2: 45 / k, t: 0.13, v: 0.3, pan });
    this.tone({ type: 'sine', f: 2200, f2: 500, t: 0.03, v: 0.18, pan });
  },
  crunch(size = 1, pan = 0) {
    if (!this.gate('crunch', 50)) return;
    const k = Math.pow(size, 0.3);
    [[0, 1900], [0.035, 1200], [0.08, 750], [0.12, 500]].forEach(([dl, f]) => this.noise({ delay: dl, t: 0.06, v: 0.45, filter: { type: 'bandpass', f: f / k, q: 2.5 }, pan }));
    this.noise({ t: 0.18, v: 0.55, filter: { f: 350 / k, f2: 90 }, pan });
    this.tone({ type: 'sawtooth', f: 75 / k, f2: 28, t: 0.22, v: 0.3, filter: { f: 400, f2: 80 }, pan });
  },
  gulp(size = 1, pan = 0) {
    if (!this.gate('gulp', 45)) return;
    const k = Math.pow(size, 0.25);
    this.tone({ type: 'sine', f: 340 / k, f2: 100 / k, t: 0.2, v: 0.3, pan });
    this.noise({ delay: 0.04, t: 0.1, v: 0.14, filter: { f: 700, f2: 200 }, pan });
  },
  gib(pan = 0) {
    if (!this.gate('gib', 60)) return;
    this.noise({ t: 0.14, v: 0.4, filter: { f: 900, f2: 180 }, pan });
    this.tone({ type: 'sine', f: 220, f2: 50, t: 0.12, v: 0.2, pan });
  },
  splash(p = 1, pan = 0) {
    if (!this.gate('splash', 70)) return;
    p = clamp(p, 0.2, 2.5);
    this.noise({ t: 0.08, v: 0.25 * p, filter: { type: 'highpass', f: 1800 }, pan });
    this.noise({ t: 0.35 * p, v: 0.4 * p, a: 0.015, filter: { f: 2600, f2: 250 }, pan });
  },
  hurt(pan = 0) {
    if (!this.gate('hurt', 80)) return;
    this.tone({ type: 'sawtooth', f: 200, f2: 45, t: 0.32, v: 0.35, filter: { f: 1400, f2: 180 }, pan });
    this.noise({ t: 0.16, v: 0.3, filter: { type: 'bandpass', f: 420, q: 1.5 }, pan });
  },
  roar(size = 1, pan = 0) {
    const k = Math.pow(size, 0.35);
    this.tone({ type: 'sawtooth', f: 150 / k, f2: 85 / k, t: 0.75, v: 0.42, a: 0.03, filter: { f: 1100, f2: 250, q: 3 }, pan });
    this.tone({ type: 'sawtooth', f: 152 / k, f2: 84 / k, t: 0.75, v: 0.3, a: 0.03, detune: 9, filter: { f: 800, f2: 200, q: 2 }, pan });
    this.noise({ t: 0.7, v: 0.32, a: 0.03, filter: { f: 750, f2: 180 }, pan });
    this.tone({ type: 'sine', f: 58 / k, f2: 40 / k, t: 0.7, v: 0.35, a: 0.02, pan });
  },
  growl(pan = 0) { if (!this.gate('growl', 400)) return; this.tone({ type: 'sawtooth', f: 90, f2: 70, t: 0.5, v: 0.22, a: 0.05, filter: { f: 500, f2: 200, q: 4 }, pan }); this.noise({ t: 0.45, v: 0.12, filter: { f: 400 }, pan }); },
  shed() {

      m.nextPluck = rand(1.6, 4.2) - m.danger * 1.2;

  },
};

'use strict';
// ---------- sprite construction ----------
function mkSprite(rows, pal) {
  const h = rows.length, w = Math.max(...rows.map(r => r.length));
  const c = mkCanvas(w, h), x = c.getContext('2d');
  for (let j = 0; j < h; j++) for (let i = 0; i < rows[j].length; i++) {
    const ch = rows[j][i]; if (ch === '.' || ch === ' ') continue;
    const col = pal[ch]; if (!col) continue;
    x.fillStyle = col; x.fillRect(i, j, 1, 1);
  }
  return { c, w, h };
}
function spriteFlipX(s) {
  if (s.flipX) return s.flipX;
  const c = mkCanvas(s.w, s.h), x = c.getContext('2d');
  x.translate(s.w, 0); x.scale(-1, 1); x.drawImage(s.c, 0, 0);
  return (s.flipX = { c, w: s.w, h: s.h });
}
function spriteWhite(s) {
  if (s.white) return s.white;
  const c = mkCanvas(s.w, s.h), x = c.getContext('2d');
  x.drawImage(s.c, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = '#ffffff'; x.fillRect(0, 0, s.w, s.h);
  return (s.white = { c, w: s.w, h: s.h });
}
function spriteTint(s, color, alpha) {
  const c = mkCanvas(s.w, s.h), x = c.getContext('2d');
  x.drawImage(s.c, 0, 0); x.globalCompositeOperation = 'source-atop'; x.globalAlpha = alpha; x.fillStyle = color; x.fillRect(0, 0, s.w, s.h);
  return { c, w: s.w, h: s.h };
}
// squash the tail columns to create a swim frame
function fishFrames(s, tailW) {
  const c = mkCanvas(s.w, s.h), x = c.getContext('2d');
  x.imageSmoothingEnabled = false;
  x.drawImage(s.c, tailW, 0, s.w - tailW, s.h, tailW, 0, s.w - tailW, s.h);
  const sq = Math.max(1, Math.round(s.h * 0.55)), oy = Math.round((s.h - sq) / 2);
  x.drawImage(s.c, 0, 0, tailW, s.h, 0, oy, tailW, sq);
  return [s, { c, w: s.w, h: s.h }];
}
// draw sprite centered at (x,y) with rotation; sy negative flips belly-side
function drawSpr(ctx, s, x, y, angle = 0, sx = 1, sy = 1, ox, oy) {
  ctx.save(); ctx.translate(x, y); if (angle) ctx.rotate(angle); ctx.scale(sx, sy);
  ctx.drawImage(s.c, -(ox === undefined ? s.w / 2 : ox), -(oy === undefined ? s.h / 2 : oy));
  ctx.restore();
}
// split a sprite into n rectangular pieces (for gibs)
function sliceSprite(s, n) {
  const pieces = [];
  const horiz = s.w >= s.h;
  const len = horiz ? s.w : s.h;
  const cuts = [0];
  for (let i = 1; i < n; i++) cuts.push(Math.round(len * i / n + rand(-len / (n * 3), len / (n * 3))));
  cuts.push(len); cuts.sort((a, b) => a - b);
  for (let i = 0; i < n; i++) {
    const a = clamp(cuts[i], 0, len), b = clamp(cuts[i + 1], 0, len);
    if (b - a < 1) continue;
    if (horiz) pieces.push({ sx: a, sy: 0, sw: b - a, sh: s.h });
    else pieces.push({ sx: 0, sy: a, sw: s.w, sh: b - a });
  }
  // sometimes split a big piece vertically too
  if (pieces.length && s.h > 8 && s.w > 8 && chance(0.6)) {
    const p = pieces.splice(randi(0, pieces.length - 1), 1)[0];
    if (horiz) { const cy = Math.round(p.sh / 2); pieces.push({ sx: p.sx, sy: 0, sw: p.sw, sh: cy }, { sx: p.sx, sy: cy, sw: p.sw, sh: p.sh - cy }); }
    else { const cx = Math.round(p.sw / 2); pieces.push({ sx: 0, sy: p.sy, sw: cx, sh: p.sh }, { sx: cx, sy: p.sy, sw: p.sw - cx, sh: p.sh }); }
  }
  return pieces;
}

'use strict';

  seed: 1, CHUNK: 640, chunks: new Map(), decor: [], t: 0, onChunkLoad: null,
  reset(seed) { this.seed = seed | 0; this.chunks.clear(); this.decor = []; this.t = 0; },
  // ---------- terrain ----------
  waterFloor(x) { return 360 + fbm(x * 0.0016, this.seed) * 560 + vnoise(x * 0.012, this.seed + 7) * 36; },
  bankN(x) { return fbm(x * 0.0011 + 500, this.seed + 3); },
  bankMask(x) { return smoothstep(0.56, 0.74, this.bankN(x)) * smoothstep(350, 900, Math.abs(x)); },
  landY(x) { const m = this.bankMask(x); return -18 - vnoise(x * 0.009, this.seed + 11) * 22 - m * m * 26; },
  floorY(x) { const m = this.bankMask(x); if (m <= 0) return this.waterFloor(x); return lerp(this.waterFloor(x), this.landY(x), m); },
  isLand(x) { return this.floorY(x) < 0; },
  surface(x) { const t = this.t; return Math.sin(x * 0.021 + t * 2.1) * 1.6 + Math.sin(x * 0.053 - t * 3.3) * 0.9 + Math.sin(x * 0.0071 + t * 0.7) * 1.2; },

    return null;

  ensure(px, range) {

    if (hy0 < -30 || hy0 > H + 30) return;
    // reflection band
    ctx.globalAlpha = 0.16 + 0.1 * light; ctx.fillStyle = sc.bot;
    ctx.fillRect(0, Math.round(hy0), W, Math.max(2, Math.round(10 * z)));
    ctx.globalAlpha = 1;
    // underwater tint (drawn before surface line so the line stays bright)
    ctx.fillStyle = 'rgba(8, 44, 52, 0.22)'; ctx.fillRect(0, Math.max(0, Math.round(hy0)), W, H);
    const dg = ctx.createLinearGradient(0, hy0, 0, cam.toScreen(0, 800)[1]);
    dg.addColorStop(0, 'rgba(0,4,10,0)'); dg.addColorStop(1, 'rgba(0,4,10,0.55)');
    ctx.fillStyle = dg; ctx.fillRect(0, Math.max(0, Math.round(hy0)), W, H);
    // wave line
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let sx = 0; sx <= W; sx += 2) { const wx = cam.toWorldX(sx); const sy = cam.toScreen(wx, this.surface(wx))[1]; if (sx === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy); }
    ctx.strokeStyle = mixColor('#b8ece6', '#3a6a68', 1 - light); ctx.stroke();
    // sparkles
    ctx.fillStyle = '#ffffff';
    for (let sx = 0; sx < W; sx += 3) { const wx = cam.toWorldX(sx); const h = ihash(Math.floor(wx / 3), 21); if (h < 0.08 && Math.sin(this.t * 5 + wx * 0.1) > 0.6) { const sy = cam.toScreen(wx, this.surface(wx))[1]; ctx.globalAlpha = 0.7 * light; ctx.fillRect(sx, Math.round(sy) - 1, 1, 1); } }
    ctx.globalAlpha = 1;
  },
  drawNight(ctx, cam, day) {
    const night = 1 - this.light(day);
    if (night > 0.02) { ctx.fillStyle = `rgba(4,8,26,${(night * 0.55).toFixed(3)})`; ctx.fillRect(0, 0, G.W, G.H); }
  },
};

'use strict';
// ---------------------------------------------------------------------------
// ANIMAL TRAITS: evolution cards themed on real Everglades animals. Each one
// changes stats AND the crocodile's look. Some are locked behind lifetime
// milestones ("crack and eat 100 snapping turtles") that persist between runs.
// ---------------------------------------------------------------------------
const Meta = {
  data: null,
  DEFAULT: () => ({ eat: {}, ev: {}, unlocked: [], seen: {}, ver: 1 }),
  load() {
    try { this.data = Object.assign(this.DEFAULT(), JSON.parse(localStorage.getItem('chompers.meta') || '{}')); }
    catch (e) { this.data = this.DEFAULT(); }
    if (!this.data.eat) this.data.eat = {}; if (!this.data.ev) this.data.ev = {};
    if (!Array.isArray(this.data.unlocked)) this.data.unlocked = []; if (!this.data.seen) this.data.seen = {};
  },
  save() { try { localStorage.setItem('chompers.meta', JSON.stringify(this.data)); } catch (e) { } },
  eaten(name, n = 1) { this.data.eat[name] = (this.data.eat[name] || 0) + n; this.data.seen[name] = true; },
  event(key, n = 1) { this.data.ev[key] = (this.data.ev[key] || 0) + n; },
  countEat(name) { return this.data.eat[name] || 0; },
  countEv(key) { return this.data.ev[key] || 0; },
  isUnlocked(id) { return this.data.unlocked.indexOf(id) >= 0; },
  unlock(id) { if (!this.isUnlocked(id)) { this.data.unlocked.push(id); this.save(); return true; } return false; },
  // progress on a trait's requirement: [current, needed]
  progress(t) {
    if (!t.unlock) return [1, 1];
    const u = t.unlock;
    let cur = 0;
    if (u.eat) cur = u.eat.reduce((s, n) => s + this.countEat(n), 0);
    else if (u.ev) cur = this.countEv(u.ev);
    return [Math.min(cur, u.need), u.need];
  },
  // called after every kill; returns list of newly unlocked traits
  checkUnlocks() {
    const out = [];
    for (const t of ANIMAL_TRAITS) {
      if (!t.unlock || this.isUnlocked(t.id)) continue;
      const [cur, need] = this.progress(t);
      if (cur >= need && this.unlock(t.id)) out.push(t);
    }
    return out;
  },
};

// ---------------------------------------------------------------------------
// NPC predation: the swamp eats itself
// ---------------------------------------------------------------------------
const Eco = {
  // find prey for a predator: smaller, alive, nearby, not the player
  findPrey(hunter, range, maxSize, filter) {
    let best = null, bestD = range;
    for (const e of G.ents) {
      if (e === hunter || e.dead || e.remove || !e.edible) continue;
      if (e.type === 'gib' || e.type === 'proj' || e.type === 'boat' || e.type === 'structure') continue;
      if (e.sizeClass > maxSize) continue;
      if (filter && !filter(e)) continue;
      const d = dist(hunter.x, hunter.y, e.x, e.y);
      if (d < bestD) { bestD = d; best = e; }
    }
    return best;
  },
  // one animal eats another: gore, a popup if on screen, and score for nobody
  devour(hunter, prey, opts = {}) {
    if (!prey || prey.dead) return;
    G.fx.gore(prey.x, prey.y, 70, 0, 0, prey.mass > 60);
    if (prey.feathers) G.fx.feathers(prey.x, prey.y, 8, prey.feathers);
    prey.gulped = !!opts.whole;
    prey.dead = true; prey.remove = true;
    if (!opts.whole) prey.explode(0.5);
    SFX.crunch(prey.sizeClass, prey.pan);
    if (Math.abs(prey.x - G.player.x) < 400) G.fx.text(prey.x, prey.y - 12, opts.label || 'EATEN', { color: '#c0a0a0', scale: 1 });
  },
};

// bottom crawlers: crayfish, crabs, snails
// ---------------------------------------------------------------------------
class Bottom extends Entity {
  constructor(x, kind) {
    super(x, 0); const d = BOTTOM[kind]; this.def = d; this.kind = kind;
    Object.assign(this, { frames: d.frames, r: d.r, hp: d.hp, maxHp: d.hp, mass: d.mass, sizeClass: d.sizeClass, name: d.name, armor: d.armor || 0, gibs: d.gibs });
    this.type = 'bottom'; this.y = World.floorY(x) - 2; this.dir = chance(0.5) ? 1 : -1; this.facing = this.dir; this.layer = -1;
    this.retarget = rand(0.5, 2); this.scuttle = 0; this.bloodColors = ['#7a3010', '#a05020', '#c07040'];
  }
  update(dt) {
    this.tick(dt); const P = G.player;
    this.y = World.floorY(this.x) - 2;
    this.retarget -= dt;
    const scared = this.senses(60) || (P.st.magnet && this.distTo(P) < P.st.magnet);
    if (scared) { this.dir = sign(this.x - P.x) || 1; this.scuttle = 0.8; }
    if (this.retarget <= 0) { this.retarget = rand(1.5, 4); if (!scared) this.dir = chance(0.5) ? 1 : -1; }
    const sp = this.def.speed * (this.scuttle > 0 ? 2.2 : 1) * (1 - this.slow);
    if (this.scuttle > 0) this.scuttle -= dt;
    this.x += this.dir * sp * dt; this.facing = this.dir;
    if (this.def.pinch && !P.dead && P.size < 1.2 && P.nearestDist(this.x, this.y) < 10 && chance(dt * 1.5)) { P.hurt(this.def.pinch, this, 'bite'); SFX.clank(this.pan); }
    this.animate(dt, this.scuttle > 0 ? 12 : 4);
    if (chance(dt * 0.4)) G.fx.add({ type: 'foam', x: this.x, y: this.y + 2, vx: 0, vy: 0, s: 1, life: 0.4 });
  }
  takeDamage(dmg, src, opts) {
    if (this.def.shell && this.armor > 0 && (dmg >= this.armor || opts.pierce)) {
      this.armor = 0; G.fx.splinters(this.x, this.y, 6, 60); SFX.splinter(this.pan);
      if (src === G.player) Meta.event('crack');
    }
    return super.takeDamage(dmg, src, opts);
  }
}

class Ray extends Entity {
  constructor(x) {
    super(x, 0); this.frames = SPR.ray; this.r = 7; this.hp = 26; this.maxHp = 26; this.mass = 30; this.sizeClass = 1.1; this.name = 'SOUTHERN STINGRAY'; this.type = 'ray'; this.gibs = 4;
    this.y = World.floorY(x) - 3; this.buried = true; this.glide = 0; this.retarget = rand(3, 8); this.stingCd = 0; this.layer = -1;
  }
  update(dt) {
    this.tick(dt); const P = G.player; this.stingCd -= dt;
    const near = P.nearestDist(this.x, this.y) < 26 + 6 * P.size;
    if (this.buried) {
      this.y = World.floorY(this.x) - 3; this.vx *= 0.9;
      if (near || this.senses(70)) { this.buried = false; this.glide = rand(1.5, 3); this.vy = -50; this.vx = sign(this.x - P.x) * 60; G.fx.smoke(this.x, this.y + 2, 5, '#6b5a3a'); }
      this.retarget -= dt; if (this.retarget <= 0) { this.retarget = rand(4, 10); this.buried = false; this.glide = rand(1, 2.5); this.vy = -30; this.vx = (chance(0.5) ? 1 : -1) * 40; }
    } else {
      this.glide -= dt; this.vy = approach(this.vy, Math.sin(this.t * 3) * 24, 120 * dt); this.vx = approach(this.vx, sign(this.vx || 1) * 55 * (1 - this.slow), 60 * dt);
      this.move(dt); this.clampWater(6); this.facing = sign(this.vx || 1);
      if (this.glide <= 0 && this.y > World.floorY(this.x) - 14) { this.buried = true; G.fx.smoke(this.x, this.y, 4, '#6b5a3a'); }
    }
    if (near && this.stingCd <= 0 && !P.dead) { this.stingCd = 3; P.hurt(9, this, 'bite'); P.envenom(4, 4); G.fx.text(P.x, P.y - 20, 'STUNG!', { color: '#60ff60' }); SFX.hurt(); }
  }
  draw(ctx) {
    const s = this.spr, img = this.flash > 0 ? spriteWhite(s) : s;
    if (this.buried) { ctx.globalAlpha = 0.55; drawSpr(ctx, img, this.x, this.y, 0, this.facing, 0.7); ctx.globalAlpha = 1; }
    else drawSpr(ctx, img, this.x, this.y, clamp(this.vy / 200, -0.3, 0.3), this.facing, 1 + Math.sin(this.t * 4) * 0.12);
  }
}
// ---------------------------------------------------------------------------
// diving birds: anhinga swims after fish, osprey and pelican plunge from the sky
// ---------------------------------------------------------------------------
class DiveBird extends Bird {
  get diving() { return this.phase === 'plunge' || this.phase === 'swimdive' || !!this.carry; }
  constructor(x, y, kind, dir) {
    super(x, y, kind, 'fly', dir);
    this.hunt = null; this.phase = 'cruise'; this.phaseT = rand(0.5, 2.5); this.carry = null; this.carryT = 0; this.swimT = 0;
  }
  update(dt) {
    const d = this.def, P = G.player;
    if (this.mode === 'drown' || this.phase === 'cruise' || this.phase === 'leave') { this.phaseT -= dt; }
    if (this.carry) { // flying off with a meal, swallowed once clear of the water
      if (this.carry.dead || this.carry.remove) { this.carry = null; this.carryT = 0; }
      else {
        this.carryT += dt;
        this.carry.x = this.x; this.carry.y = this.y + 5; this.carry.vx = this.vx; this.carry.vy = this.vy;
        this.carry.stun = 1; this.carry.aware = true;
        if (chance(dt * 8)) G.fx.blood(this.carry.x, this.carry.y, 1, 0, 0, 20, this.carry.bloodColors);
        if (this.carryT > 2.6 && this.y < World.surface(this.x) - 20) { Eco.devour(this, this.carry, { label: 'SNATCHED' }); this.carry = null; this.carryT = 0; }
      }
    }
    // divers patrol the player's stretch of water instead of flying off forever
    if (this.mode === 'fly' && !this.carry && this.phase !== 'plunge' && this.phase !== 'swimdive') {
      const off = this.x - P.x;
      if (Math.abs(off) > 420 && sign(this.vx || this.dir) === sign(off)) { this.dir = -sign(off); this.escaping = 0; }
    }
    if (this.phase === 'cruise' && this.phaseT <= 0 && !this.carry && this.mode === 'fly') {
      const prey = Eco.findPrey(this, 280, 0.7, e => e.type === 'fish' && e.y < (d.diver === 'swim' ? 240 : 130) && e.y > 0);
      if (prey) { this.hunt = prey; this.phase = d.diver === 'swim' ? 'swimdive' : 'plunge'; this.phaseT = 4; SFX.bird(this.pan); }
      else this.phaseT = rand(1, 3);
    }
    if (this.phase === 'plunge') {
      this.phaseT -= dt;
      const h = this.hunt;
      if (!h || h.dead || h.remove || this.phaseT <= 0) { this.phase = 'leave'; this.phaseT = 3; this.hunt = null; }
      else {
        const dx = h.x - this.x, dy = h.y - this.y, dd = Math.hypot(dx, dy) || 1;
        this.vx = dx / dd * 260; this.vy = dy / dd * 300; this.x += this.vx * dt; this.y += this.vy * dt;
        this.facing = sign(this.vx || 1); this.angle = clamp(Math.atan2(this.vy, Math.abs(this.vx)), -1.2, 1.2);
        this.wingT += dt * 4; this.frame = 0;
        if (this.y > World.surface(this.x) && !this.splashed) { this.splashed = true; G.fx.splash(this.x, 1.2, this.vx); SFX.splash(1); }
        if (dd < 12) { this.carry = h; this.carryT = 0; h.stun = 9; h.aware = true; this.phase = 'leave'; this.phaseT = 3; this.vy = -200; G.fx.splash(this.x, 1.4, 0); G.fx.blood(h.x, h.y, 6, 0, 0, 40, h.bloodColors); if (Math.abs(this.x - P.x) < 400) G.fx.text(this.x, this.y - 14, 'SNATCHED!', { color: '#ffd0a0' }); }
      }
      return;
    }
    if (this.phase === 'swimdive') {
      this.phaseT -= dt; this.swimT += dt;
      const h = this.hunt, s = World.surface(this.x);
      if (!h || h.dead || h.remove || this.phaseT <= 0 || this.swimT > 7) { this.phase = 'leave'; this.phaseT = 3; this.hunt = null; this.swimT = 0; if (this.y > s) { this.vy = -120; G.fx.splash(this.x, 0.8, 0); } }
      else {
        const dx = h.x - this.x, dy = h.y - this.y, dd = Math.hypot(dx, dy) || 1;
        const sp = this.y > s ? 150 : 240;
        this.vx = approach(this.vx, dx / dd * sp, 500 * dt); this.vy = approach(this.vy, dy / dd * sp, 500 * dt);
        this.x += this.vx * dt; this.y += this.vy * dt;
        this.facing = sign(this.vx || 1); this.angle = clamp(Math.atan2(this.vy, Math.abs(this.vx)), -1, 1);
        if (!this.splashed && this.y > s) { this.splashed = true; G.fx.splash(this.x, 0.9, this.vx); }
        if (this.y > s && chance(dt * 6)) G.fx.bubbles(this.x, this.y, 1, 3);
        if (dd < 10) { Eco.devour(this, h, { label: 'SPEARED' }); this.hunt = null; this.phase = 'leave'; this.phaseT = 3; this.vy = -100; }
      }
      // the player can eat a diving bird
      if (!P.dead && P.nearestDist(this.x, this.y) < 4 * P.size && P.size > 1.4) this.aware = true;
      return;
    }
    if (this.phase === 'leave') { this.splashed = false; if (this.phaseT <= 0) { this.phase = 'cruise'; this.phaseT = rand(3, 8); } if (this.mode !== 'drown') { this.escaping = Math.max(this.escaping || 0, 0.2); } }
    super.update(dt);
  }
  get spr() {
    if (this.def.diver === 'swim' && (this.phase === 'swimdive' && this.y > World.surface(this.x))) return SPR.anhingaSwim[this.frame % 2];
    return super.spr;
  }
}

class Vulture extends Bird {
  constructor(x, y, dir) { super(x, y, 'vulture', 'fly', dir); this.target = null; this.circleA = rand(TAU); this.eatT = 0; this.landed = false; }
  update(dt) {

      if (chance(dt * 1.5)) {
        let best = null, bestD = 700;
        for (const e of G.ents) { if (e.type !== 'gib' || !e.edible) continue; if (World.floorY(e.x) > 6) continue; const d = dist(this.x, this.y, e.x, e.y); if (d < bestD) { bestD = d; best = e; } }

// jumping mullet schools: leap out of the water in bursts
// ---------------------------------------------------------------------------
class Mullet extends Fish {
  constructor(x, y, leader) { super(x, y, 'mullet', leader); this.jumpT = rand(2, 8); this.airborne = false; }
  update(dt) {

      this.angle = clamp(Math.atan2(this.vy, this.vx), -1.2, 1.2); this.facing = sign(this.vx || 1);

    }

'use strict';
const Input = {
  keys: {}, pressed: {}, mouse: { x: 0, y: 0, down: false, rdown: false, clicked: false, rclicked: false, moved: false },
  touch: { active: false, joy: false, jx: 0, jy: 0, jid: null, sx: 0, sy: 0, cx: 0, cy: 0, bite: false, dash: false, biteHeld: false, biteId: null, dashId: null, holdT: 0, autoBite: false },
  init(canvas) {
    window.addEventListener('keydown', e => {
      if (!this.keys[e.code]) this.pressed[e.code] = true; this.keys[e.code] = true;
      if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
      SFX.init(); SFX.resume();
    });
    window.addEventListener('keyup', e => { this.keys[e.code] = false; });
    window.addEventListener('blur', () => { this.keys = {}; });
    canvas.addEventListener('mousemove', e => { this.setMouse(e); this.mouse.moved = true; });
    canvas.addEventListener('mousedown', e => { this.setMouse(e); if (e.button === 0) { this.mouse.down = true; this.mouse.clicked = true; } if (e.button === 2) { this.mouse.rdown = true; this.mouse.rclicked = true; } SFX.init(); SFX.resume(); e.preventDefault(); });
    window.addEventListener('mouseup', e => { if (e.button === 0) this.mouse.down = false; if (e.button === 2) this.mouse.rdown = false; });
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    this.initTouch(canvas);
  },
  // ---- on-screen (touch) controls ----
  pads() {
    const W = G.W, H = G.H;
    return {
      bite: { x: W - 54, y: H - 54, r: 30, label: 'BITE' },
      dash: { x: W - 112, y: H - 34, r: 21, label: 'DASH' },
      pause: { x: W - 15, y: 15, r: 13, label: 'II' },
      joyMax: W * 0.52,
    };
  },
  inPad(p, x, y) { return dist(x, y, p.x, p.y) < p.r + 12; },
  initTouch(canvas) {
    const tpos = t => G.toCanvas(t.clientX, t.clientY);
    const T = this.touch;
    canvas.addEventListener('touchstart', e => {
      SFX.init(); SFX.resume(); e.preventDefault(); T.active = true;
      const P = this.pads();
      for (const t of e.changedTouches) {
        const [x, y] = tpos(t);
        this.mouse.x = x; this.mouse.y = y; this.mouse.moved = true;
        if (G.state !== 'play') { this.mouse.clicked = true; if (this.inPad(P.pause, x, y)) this.pressed.Escape = true; continue; }
        if (this.inPad(P.bite, x, y)) { T.bite = true; T.biteHeld = true; T.biteId = t.identifier; T.holdT = 0.16; }
        else if (this.inPad(P.dash, x, y)) { T.dash = true; T.dashId = t.identifier; }
        else if (this.inPad(P.pause, x, y)) this.pressed.KeyP = true;
        else if (x < P.joyMax && !T.joy) { T.joy = true; T.jid = t.identifier; T.sx = x; T.sy = y; T.cx = x; T.cy = y; T.jx = 0; T.jy = 0; }
        else T.bite = true;
      }
    }, { passive: false });
    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      for (const t of e.changedTouches) {
        if (t.identifier !== T.jid) continue;
        const [x, y] = tpos(t); T.cx = x; T.cy = y;
        let dx = x - T.sx, dy = y - T.sy; let d = Math.hypot(dx, dy); const R = 32;
        if (d > R) { T.sx += dx * (1 - R / d); T.sy += dy * (1 - R / d); dx = x - T.sx; dy = y - T.sy; d = Math.hypot(dx, dy); }
        const k = Math.min(1, d / 24);
        T.jx = d > 3 ? dx / (d || 1) * k : 0; T.jy = d > 3 ? dy / (d || 1) * k : 0;
      }
    }, { passive: false });
    const end = e => {
      for (const t of e.changedTouches) {
        if (t.identifier === T.jid) { T.joy = false; T.jid = null; T.jx = 0; T.jy = 0; }
        if (t.identifier === T.biteId) { T.biteHeld = false; T.biteId = null; }
        if (t.identifier === T.dashId) T.dashId = null;
      }
    };
    canvas.addEventListener('touchend', end); canvas.addEventListener('touchcancel', end);
  },
  // holding the bite pad keeps chomping
  tickTouch(dt) {
    const T = this.touch; T.autoBite = false;
    if (T.biteHeld) { T.holdT -= dt; if (T.holdT <= 0) { T.holdT = 0.16; T.autoBite = true; } }
  },
  setMouse(e) { const p = G.toCanvas(e.clientX, e.clientY); this.mouse.x = p[0]; this.mouse.y = p[1]; },
  down(...codes) { return codes.some(c => this.keys[c]); },
  hit(...codes) { return codes.some(c => this.pressed[c]); },
  endFrame() { this.pressed = {}; this.mouse.clicked = false; this.mouse.rclicked = false; this.touch.bite = false; this.touch.dash = false; },
  axis() {
    let x = 0, y = 0;
    if (this.down('ArrowLeft', 'KeyA')) x -= 1; if (this.down('ArrowRight', 'KeyD')) x += 1; if (this.down('ArrowUp', 'KeyW')) y -= 1; if (this.down('ArrowDown', 'KeyS')) y += 1;
    if (this.touch.joy) { x = this.touch.jx; y = this.touch.jy; }
    else if (this.mouse.down && x === 0 && y === 0 && G.settings.mouseMove && G.player) { const [wx, wy] = G.cam.toWorld(this.mouse.x, this.mouse.y); const dx = wx - G.player.x, dy = wy - G.player.y, d = Math.hypot(dx, dy); if (d > 10) { x = dx / d; y = dy / d; } }
    return [x, y];
  },
  bitePressed() { return this.hit('Space', 'KeyJ', 'KeyZ') || this.mouse.rclicked || this.touch.bite || this.touch.autoBite; },
  dashPressed() { return this.hit('ShiftLeft', 'ShiftRight', 'KeyK', 'KeyX') || this.touch.dash; },
};

function weightedPick(table) { const t = table.filter(e => e[1] > 0); let tot = t.reduce((s, e) => s + e[1], 0), r = Math.random() * tot; for (const e of t) { r -= e[1]; if (r <= 0) return e[0]; } return t.length ? t[t.length - 1][0] : null; }

    else if (kind === 'warboat') { const wx = World.findX(x, xx => World.floorY(xx) > 60, 900, 30); if (wx !== null) boss = Spawn.boat(wx, 'warboat', -side); }
    else if (kind === 'python') { boss = this.add(new Snake(x, fy < 0 ? -10 : 6, 'python', Math.max(2.2, P.size * 0.8))); boss.isBoss = true; boss.persistent = true; boss.name = 'MOTHER PYTHON'; boss.hp = boss.maxHp = Math.round(boss.maxHp * 1.6); }
    else if (kind === 'skunkape') { const bx = World.findX(P.x + side * (halfW + 100), xx => World.floorY(xx) < -8, 6000, 40); if (bx !== null) boss = this.add(new SkunkApe(bx)); }
    else if (kind === 'shark') { const wx = World.findX(x, xx => World.floorY(xx) > 200, 1500, 40); if (wx !== null) { boss = this.add(new Fish(wx, clamp(150, 60, World.floorY(wx) - 40), 'shark')); boss.size = 2.2; boss.sizeClass = Math.max(10, P.size * 1.3); boss.hp = boss.maxHp = 1400; boss.mass = 1500; boss.name = 'BIG BULL'; boss.isBoss = true; boss.persistent = true; boss.speed = 200; boss.gibs = 6; } }
    if (!boss) { this.director.bossT = 8; return; }
    this.boss = boss; this.director.bossQueue = null;
    this.banner = { text: 'WARNING', sub: boss.name + ' APPROACHES', t: 4, max: 4, color: '#ff3030' }; SFX.warning(); this.shake(6);
  },
  // ---------- update ----------
  loop(ts) {
    const raw = Math.min(0.05, this.lastTs ? (ts - this.lastTs) / 1000 : 0.016); this.lastTs = ts;
    this.frames++; this.fpsT += raw; if (this.fpsT >= 1) { this.fps = this.frames; this.frames = 0; this.fpsT -= 1; }
    if (this.slowT > 0) { this.slowT -= raw; if (this.slowT <= 0) this.slowScale = 1; }
    this.timeScale = lerp(this.timeScale, this.slowT > 0 ? this.slowScale : 1, 0.2);
    let dt = raw * this.timeScale;
    if (this.hitstopT > 0) { this.hitstopT -= raw; dt = 0; }
    this.update(dt, raw);
    this.render();
    Input.endFrame();
    requestAnimationFrame(t => this.loop(t));
  },
  update(dt, raw) {
    // global keys
    if (Input.hit('KeyM')) { const m = SFX.toggleMute(); if (!SFX.ctx) { SFX.init(); if (m) SFX.master && (SFX.master.gain.value = 0); } }
    switch (this.state) {
      case 'title':
        this.titleT += raw; this.updateWorld(dt, true);
        if (Input.hit('KeyH')) { this.prevState = 'title'; this.state = 'help'; }
        else if (Input.hit('KeyC')) { this.prevState = 'title'; this.state = 'codex'; this.codexScroll = 0; }
        else if (Input.hit('Enter', 'Space', 'KeyZ', 'KeyJ') || Input.mouse.clicked) { SFX.init(); SFX.resume(); SFX.ui(); this.startRun(false); }
        break;
      case 'play':
        if (Input.hit('Escape', 'KeyP')) { this.state = 'pause'; SFX.ui(); break; }
        if (Input.hit('KeyH')) { this.prevState = 'play'; this.state = 'help'; break; }
        this.updateWorld(dt, false); this.runDirector(dt);
        break;
      case 'shedding':
        this.updateWorld(dt, false); this.shedT += raw;
        if (this.shedT > 1.3) { this.state = 'shed'; this.shedCards = rollCards(this.player, 3); this.shedSel = 0; this.shedUiT = 0; this.slowT = 0; this.slowScale = 1; }
        break;
      case 'shed': {
        this.shedUiT += raw;
        const n = this.shedCards.length;
        if (Input.hit('ArrowLeft', 'KeyA')) { this.shedSel = (this.shedSel + n - 1) % n; SFX.ui(); }
        if (Input.hit('ArrowRight', 'KeyD')) { this.shedSel = (this.shedSel + 1) % n; SFX.ui(); }
        const rects = UI.cardRects(n);
        if (Input.mouse.moved) rects.forEach((r, i) => { if (Input.mouse.x >= r.x && Input.mouse.x <= r.x + r.w && Input.mouse.y >= r.y - 6 && Input.mouse.y <= r.y + r.h) this.shedSel = i; });
        let pick = -1;
        if (Input.hit('Digit1')) pick = 0; if (Input.hit('Digit2')) pick = 1; if (Input.hit('Digit3')) pick = 2;
        if (Input.hit('Enter', 'Space', 'KeyZ', 'KeyJ')) pick = this.shedSel;
        if (Input.mouse.clicked) rects.forEach((r, i) => { if (Input.mouse.x >= r.x && Input.mouse.x <= r.x + r.w && Input.mouse.y >= r.y - 6 && Input.mouse.y <= r.y + r.h) pick = i; });
        if (pick >= 0 && pick < n && this.shedUiT > 0.3) this.finishShed(this.shedCards[pick]);
        break;
      }
      case 'dying':
        this.updateWorld(dt, false); this.dyingT += raw;
        if (this.dyingT > 2.6) { this.state = 'dead'; this.deadT = 0; this.slowT = 0; this.slowScale = 1; }
        break;
      case 'dead':
        this.deadT += raw; this.updateWorld(dt * 0.3, false);
        if (this.deadT > 1 && (Input.hit('Enter', 'Space', 'KeyZ', 'KeyJ') || Input.mouse.clicked)) { SFX.ui(); this.startRun(false); }
        if (Input.hit('KeyC')) { this.prevState = 'dead'; this.state = 'codex'; this.codexScroll = 0; SFX.ui(); }
        if (Input.hit('Escape')) { this.startRun(true); this.state = 'title'; }
        break;
      case 'pause':
        if (Input.hit('Escape', 'KeyP', 'Enter')) { this.state = 'play'; SFX.ui(); }
        if (Input.hit('KeyQ')) { this.storeSave(); this.startRun(true); this.state = 'title'; }
        if (Input.hit('Digit1')) { this.settings.gore = !this.settings.gore; SFX.ui(); }
        if (Input.hit('Digit2')) { this.settings.shake = !this.settings.shake; SFX.ui(); }
        if (Input.hit('Digit3')) { this.settings.mouseMove = !this.settings.mouseMove; SFX.ui(); }
        if (Input.hit('Digit4')) { this.settings.touch = this.settings.touch === false; SFX.ui(); }
        if (Input.hit('KeyC')) { this.prevState = 'pause'; this.state = 'codex'; this.codexScroll = 0; SFX.ui(); }
        break;
      case 'help':
        if (Input.hit('Escape', 'KeyH', 'Enter')) { this.state = this.prevState; SFX.ui(); }
        else if (Input.hit('KeyC')) { this.state = 'codex'; this.codexScroll = 0; SFX.ui(); }
        break;
      case 'codex': {
        const maxScroll = Math.max(0, Math.ceil(ANIMAL_TRAITS.length / 2) - 8);
        if (Input.hit('ArrowDown', 'KeyS')) this.codexScroll = Math.min(maxScroll, (this.codexScroll || 0) + 1);
        if (Input.hit('ArrowUp', 'KeyW')) this.codexScroll = Math.max(0, (this.codexScroll || 0) - 1);
        if (Input.hit('Escape', 'KeyC', 'Enter', 'KeyH') || (Input.mouse.clicked && Input.mouse.y > this.H - 26)) { this.state = this.prevState || 'title'; SFX.ui(); }
        break;
      }
    }
    // screen fx decay (real time)
    this.shakeAmt *= Math.exp(-6 * raw);
    if (this.shakeAmt < 0.2) this.shakeAmt = 0;
    this.shakeX = Math.round(rand(-1, 1) * this.shakeAmt); this.shakeY = Math.round(rand(-1, 1) * this.shakeAmt);
    this.red *= Math.exp(-3 * raw); this.white *= Math.exp(-4.5 * raw); this.zoomP = lerp(this.zoomP, 1, 0.08);
    Input.tickTouch(raw);
    Input.mouse.moved = false;
    const P = this.player;
    SFX.update({ dt: raw, night: 1 - World.light(this.day), danger: this.state === 'play' ? this.dangerLevel() : 0, engine: this.engineNear, underwater: P && P.inWater && this.state !== 'title' ? 1 : 0 });
  },
  demoInput() {
    const P = this.player, t = this.titleT;
    P.hunger = 100; P.hp = P.maxHp;
    let x = Math.cos(t * 0.45) * 0.8, y = Math.sin(t * 0.9) * 0.35 + (P.y < 50 ? 0.7 : 0) + (P.y > 150 ? -0.7 : 0);
    if (P.x > 500) x = -1; if (P.x < -500) x = 1;
    let bite = false;
    for (const e of this.ents) if (e.type === 'fish' && !e.dead && dist(e.x, e.y, P.x, P.y) < 60) { const dx = e.x - P.x, dy = e.y - P.y, d = Math.hypot(dx, dy) || 1; x = dx / d; y = dy / d; if (d < 26 && P.biteCd <= 0) bite = true; break; }
    return { x, y, bite, dash: false };
  },
  updateWorld(dt, demo) {
    this.t += dt; World.t += dt;
    const prevDay = this.day; this.day = (this.day + dt / 420) % 1;
    if (this.state === 'play') {
      if (prevDay < 0.62 && this.day >= 0.62) this.nightCounted = false;
      if (!this.nightCounted && this.day >= 0.95) { this.nightCounted = true; Meta.event('night'); for (const t2 of Meta.checkUnlocks()) this.announceUnlock(t2); Meta.save(); }
    }
    const P = this.player;
    const [ax, ay] = Input.axis();
    const inp = demo ? this.demoInput() : { x: ax, y: ay, bite: this.state === 'play' && Input.bitePressed(), dash: this.state === 'play' && Input.dashPressed() };
    this.engineNear = 0;
    P.update(dt, inp);
    World.ensure(P.x, this.W / this.cam.zoom + 900);
    for (let i = 0; i < this.ents.length; i++) {
      const e = this.ents[i]; if (e.remove) continue;
      const dx = Math.abs(e.x - P.x);
      if (dx > 1800 && !e.persistent) { e.remove = true; continue; }
      if (dx < 1400 || e.persistent) e.update(dt);
    }
    if (this.ents.some(e => e.remove)) this.ents = this.ents.filter(e => !e.remove);
    this.fx.update(dt);
    this.updateCamera(dt);
    if (this.banner) { this.banner.t -= dt; if (this.banner.t <= 0) this.banner = null; }
  },
  updateCamera(dt) {
    const P = this.player, c = this.cam;
    const tz = clamp(1.7 / Math.pow(P.size, 0.55), 0.3, 1.7) * this.zoomP * (this.state === 'title' ? 1.1 : 1);
    c.zoom = lerp(c.zoom, tz, 1 - Math.exp(-2.5 * dt));
    const tx = P.x + P.vx * 0.22; let ty = P.y + P.vy * 0.12;
    if (this.state === 'title') ty = Math.max(ty, 75);
    const k = 1 - Math.exp(-5 * dt);
    c.x = lerp(c.x, tx, k); c.y = lerp(c.y, ty, k);
    c.y = Math.max(c.y, -(this.H / 2) / c.zoom + 30);
  },
  // ---------- render ----------
  render() {
    const ctx = this.ctx, cam = this.cam, day = this.day, P = this.player;
    ctx.imageSmoothingEnabled = false;
    World.drawSky(ctx, cam, day);
    World.drawParallax(ctx, cam, day);
    World.drawWater(ctx, cam, day);
    World.drawTerrain(ctx, cam);
    World.drawDecor(ctx, cam, 0, day);
    this.fx.drawClouds(ctx, cam);
    // world space
    ctx.save(); ctx.translate(this.W / 2 + this.shakeX, this.H / 2 + this.shakeY); ctx.scale(cam.zoom, cam.zoom); ctx.translate(-cam.x, -cam.y);
    const left = cam.toWorldX(-120), right = cam.toWorldX(this.W + 120);
    const vis = [];
    for (const e of this.ents) if (e.x > left - e.r * e.size * 4 && e.x < right + e.r * e.size * 4) vis.push(e);
    vis.sort((a, b) => a.layer - b.layer);
    let drewPlayer = false;
    for (const e of vis) { if (!drewPlayer && e.layer >= 2) { P.draw(ctx); drewPlayer = true; } e.draw(ctx); }
    if (!drewPlayer) P.draw(ctx);
    for (const e of vis) if (e.type !== 'gib' && e.type !== 'proj' && !e.isBoss) e.drawHpBar(ctx);
    ctx.restore();
    this.fx.draw(ctx, cam);
    World.drawDecor(ctx, cam, 1, day);
    World.drawSurface(ctx, cam, day);
    World.drawNight(ctx, cam, day);
    this.fx.drawTexts(ctx, cam);
    UI.drawScreenFx(ctx);
    switch (this.state) {
      case 'title': UI.drawTitle(ctx); break;
      case 'play': case 'shedding': case 'dying': UI.drawHUD(ctx); break;
      case 'shed': UI.drawHUD(ctx); UI.drawShed(ctx); break;
      case 'dead': UI.drawDeath(ctx); break;
      case 'pause': UI.drawHUD(ctx); UI.drawPause(ctx); break;
      case 'help': UI.drawHelp(ctx); break;
      case 'codex': UI.drawCodex(ctx); break;
    }
    if (this.state === 'play' && (this.touchUI || Input.touch.active) && this.settings.touch !== false) UI.drawTouch(ctx);
    if (this.settings.fps) Font.draw(ctx, this.fps + ' FPS', 4, this.H - 24, { color: '#80ff80' });
  },
};
window.addEventListener('load', () => G.init());

</script>
</body>
