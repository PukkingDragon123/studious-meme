// ---------------------------------------------------------------------------
// NPC predation: the swamp eats itself
// ---------------------------------------------------------------------------
const Eco = {
  // find prey for a predator: smaller, alive, nearby, not the player
  findPrey(hunter, range, maxSize, filter) {
    let best = null, bestD = range;
    for (const e of G.ents) {
      if (e === hunter || e.dead || e.remove || !e.edible) continue;
      if (e.type === 'gib' || e.type === 'proj' || e.type === 'boat' || e.type === 'structure') continue;
      if (e.sizeClass > maxSize) continue;
      if (filter && !filter(e)) continue;
      const d = dist(hunter.x, hunter.y, e.x, e.y);
      if (d < bestD) { bestD = d; best = e; }
    }
    return best;
  },
  // one animal eats another: gore, a popup if on screen, and score for nobody
  devour(hunter, prey, opts = {}) {
    if (!prey || prey.dead) return;
    G.fx.gore(prey.x, prey.y, 70, 0, 0, prey.mass > 60);
    if (prey.feathers) G.fx.feathers(prey.x, prey.y, 8, prey.feathers);
    prey.gulped = !!opts.whole;
    prey.dead = true; prey.remove = true;
    if (!opts.whole) prey.explode(0.5);
    SFX.crunch(prey.sizeClass, prey.pan);
    if (Math.abs(prey.x - G.player.x) < 400) G.fx.text(prey.x, prey.y - 12, opts.label || 'EATEN', { color: '#c0a0a0', scale: 1 });
  },
};

// ---------------------------------------------------------------------------
// bottom crawlers: crayfish, crabs, snails
// ---------------------------------------------------------------------------
class Bottom extends Entity {
  constructor(x, kind) {
    super(x, 0); const d = BOTTOM[kind]; this.useSpecies(kind); this.def = d;
    this.type = 'bottom'; this.y = World.floorY(x) - this.groundOff; this.dir = chance(0.5) ? 1 : -1; this.facing = this.dir; this.layer = -1;
    this.retarget = rand(0.5, 2); this.scuttle = 0; this.bloodColors = ['#7a3010', '#a05020', '#c07040'];
  }
  update(dt) {
    this.tick(dt); const P = G.player;
    this.y = World.floorY(this.x) - this.groundOff;
    this.retarget -= dt;
    const scared = this.senses(60) || (P.st.magnet && this.distTo(P) < P.st.magnet);
    if (scared) { this.dir = sign(this.x - P.x) || 1; this.scuttle = 0.8; }
    if (this.retarget <= 0) { this.retarget = rand(1.5, 4); if (!scared) this.dir = chance(0.5) ? 1 : -1; }
    const sp = this.def.speed * (this.scuttle > 0 ? 2.2 : 1) * (1 - this.slow);
    if (this.scuttle > 0) this.scuttle -= dt;
    this.x += this.dir * sp * dt; this.facing = this.dir;
    if (this.def.pinch && !P.dead && P.size < 1.2 && P.nearestDist(this.x, this.y) < 10 && chance(dt * 1.5)) { P.hurt(this.def.pinch, this, 'bite'); SFX.clank(this.pan); }
    this.anim.phase += dt * (this.scuttle > 0 ? 12 : 4);
    if (chance(dt * 0.4)) G.fx.add({ type: 'foam', x: this.x, y: this.y + 2, vx: 0, vy: 0, s: 1, life: 0.4 });
  }
  takeDamage(dmg, src, opts) {
    if (this.def.shell && this.armor > 0 && (dmg >= this.armor || opts.pierce)) {
      this.armor = 0; G.fx.splinters(this.x, this.y, 6, 60); SFX.splinter(this.pan);
      if (src === G.player) Meta.event('crack');
    }
    return super.takeDamage(dmg, src, opts);
  }
}
// ---------------------------------------------------------------------------
// stingray: rests on the bottom, stings what steps on it
// ---------------------------------------------------------------------------
class Ray extends Entity {
  constructor(x) {
    super(x, 0); this.useSpecies('ray'); this.type = 'ray';
    this.y = World.floorY(x) - 3; this.buried = true; this.glide = 0; this.retarget = rand(3, 8); this.stingCd = 0; this.layer = -1;
  }
  update(dt) {
    this.tick(dt); const P = G.player; this.stingCd -= dt;
    const near = P.nearestDist(this.x, this.y) < 26 + 6 * P.size;
    if (this.buried) {
      this.y = World.floorY(this.x) - 3; this.vx *= 0.9;
      if (near || this.senses(70)) { this.buried = false; this.glide = rand(1.5, 3); this.vy = -50; this.vx = sign(this.x - P.x) * 60; G.fx.smoke(this.x, this.y + 2, 5, '#6b5a3a'); }
      this.retarget -= dt; if (this.retarget <= 0) { this.retarget = rand(4, 10); this.buried = false; this.glide = rand(1, 2.5); this.vy = -30; this.vx = (chance(0.5) ? 1 : -1) * 40; }
    } else {
      this.glide -= dt; this.vy = approach(this.vy, Math.sin(this.t * 3) * 24, 120 * dt); this.vx = approach(this.vx, sign(this.vx || 1) * 55 * (1 - this.slow), 60 * dt);
      this.move(dt); this.clampWater(6); this.facing = sign(this.vx || 1);
      if (this.glide <= 0 && this.y > World.floorY(this.x) - 14) { this.buried = true; G.fx.smoke(this.x, this.y, 4, '#6b5a3a'); }
    }
    if (near && this.stingCd <= 0 && !P.dead) { this.stingCd = 3; P.hurt(9, this, 'bite'); P.envenom(4, 4); G.fx.text(P.x, P.y - 20, 'STUNG!', { color: '#60ff60' }); SFX.hurt(); }
  }
  draw(ctx) {
    this.anim.phase += 0.016 * 4; this.anim.speed = this.buried ? 0 : 1;
    if (this.buried) ctx.globalAlpha = 0.55;
    this.rig.draw(ctx, this.x, this.y, this.facing, this.buried ? 0 : clamp(this.vy / 200, -0.3, 0.3), this.anim, { scale: this.size * this.rig.scale, white: this.flash > 0 });
    ctx.globalAlpha = 1;
  }
}
// ---------------------------------------------------------------------------
// diving birds: anhinga swims after fish, osprey and pelican plunge from the sky
// ---------------------------------------------------------------------------
class DiveBird extends Bird {
  get diving() { return this.phase === 'plunge' || this.phase === 'swimdive' || !!this.carry; }
  constructor(x, y, kind, dir) {
    super(x, y, kind, 'fly', dir);
    this.hunt = null; this.phase = 'cruise'; this.phaseT = rand(0.5, 2.5); this.carry = null; this.carryT = 0; this.swimT = 0;
  }
  update(dt) {
    const d = this.def, P = G.player;
    if (this.mode === 'drown' || this.phase === 'cruise' || this.phase === 'leave') { this.phaseT -= dt; }
    if (this.carry) { // flying off with a meal, swallowed once clear of the water
      if (this.carry.dead || this.carry.remove) { this.carry = null; this.carryT = 0; }
      else {
        this.carryT += dt;
        this.carry.x = this.x; this.carry.y = this.y + 5; this.carry.vx = this.vx; this.carry.vy = this.vy;
        this.carry.stun = 1; this.carry.aware = true;
        if (chance(dt * 8)) G.fx.blood(this.carry.x, this.carry.y, 1, 0, 0, 20, this.carry.bloodColors);
        if (this.carryT > 2.6 && this.y < World.surface(this.x) - 20) { Eco.devour(this, this.carry, { label: 'SNATCHED' }); this.carry = null; this.carryT = 0; }
      }
    }
    // divers patrol the player's stretch of water instead of flying off forever
    if (this.mode === 'fly' && !this.carry && this.phase !== 'plunge' && this.phase !== 'swimdive') {
      const off = this.x - P.x;
      if (Math.abs(off) > 420 && sign(this.vx || this.dir) === sign(off)) { this.dir = -sign(off); this.escaping = 0; }
    }
    if (this.phase === 'cruise' && this.phaseT <= 0 && !this.carry && this.mode === 'fly') {
      const prey = Eco.findPrey(this, 280, 0.7, e => e.type === 'fish' && e.y < (d.diver === 'swim' ? 240 : 130) && e.y > 0);
      if (prey) { this.hunt = prey; this.phase = d.diver === 'swim' ? 'swimdive' : 'plunge'; this.phaseT = 4; SFX.bird(this.pan); }
      else this.phaseT = rand(1, 3);
    }
    if (this.phase === 'plunge') {
      this.phaseT -= dt;
      const h = this.hunt;
      if (!h || h.dead || h.remove || this.phaseT <= 0) { this.phase = 'leave'; this.phaseT = 3; this.hunt = null; }
      else {
        const dx = h.x - this.x, dy = h.y - this.y, dd = Math.hypot(dx, dy) || 1;
        this.vx = dx / dd * 260; this.vy = dy / dd * 300; this.x += this.vx * dt; this.y += this.vy * dt;
        this.facing = sign(this.vx || 1); this.angle = clamp(Math.atan2(this.vy, Math.abs(this.vx)), -1.2, 1.2);
        this.wingT += dt * 4; this.frame = 0;
        if (this.y > World.surface(this.x) && !this.splashed) { this.splashed = true; G.fx.splash(this.x, 1.2, this.vx); SFX.splash(1); }
        if (dd < 12) { this.carry = h; this.carryT = 0; h.stun = 9; h.aware = true; this.phase = 'leave'; this.phaseT = 3; this.vy = -200; G.fx.splash(this.x, 1.4, 0); G.fx.blood(h.x, h.y, 6, 0, 0, 40, h.bloodColors); if (Math.abs(this.x - P.x) < 400) G.fx.text(this.x, this.y - 14, 'SNATCHED!', { color: '#ffd0a0' }); }
      }
      return;
    }
    if (this.phase === 'swimdive') {
      this.phaseT -= dt; this.swimT += dt;
      const h = this.hunt, s = World.surface(this.x);
      if (!h || h.dead || h.remove || this.phaseT <= 0 || this.swimT > 7) { this.phase = 'leave'; this.phaseT = 3; this.hunt = null; this.swimT = 0; if (this.y > s) { this.vy = -120; G.fx.splash(this.x, 0.8, 0); } }
      else {
        const dx = h.x - this.x, dy = h.y - this.y, dd = Math.hypot(dx, dy) || 1;
        const sp = this.y > s ? 150 : 240;
        this.vx = approach(this.vx, dx / dd * sp, 500 * dt); this.vy = approach(this.vy, dy / dd * sp, 500 * dt);
        this.x += this.vx * dt; this.y += this.vy * dt;
        this.facing = sign(this.vx || 1); this.angle = clamp(Math.atan2(this.vy, Math.abs(this.vx)), -1, 1);
        if (!this.splashed && this.y > s) { this.splashed = true; G.fx.splash(this.x, 0.9, this.vx); }
        if (this.y > s && chance(dt * 6)) G.fx.bubbles(this.x, this.y, 1, 3);
        if (dd < 10) { Eco.devour(this, h, { label: 'SPEARED' }); this.hunt = null; this.phase = 'leave'; this.phaseT = 3; this.vy = -100; }
      }
      // the player can eat a diving bird
      if (!P.dead && P.nearestDist(this.x, this.y) < 4 * P.size && P.size > 1.4) this.aware = true;
      return;
    }
    if (this.phase === 'leave') { this.splashed = false; if (this.phaseT <= 0) { this.phase = 'cruise'; this.phaseT = rand(3, 8); } if (this.mode !== 'drown') { this.escaping = Math.max(this.escaping || 0, 0.2); } }
    super.update(dt);
  }
  draw(ctx) {
    const inWater = this.y > World.surface(this.x);
    const mode = this.phase === 'plunge' ? 'dive' : (this.phase === 'swimdive' && inWater) ? 'swim' : this.mode === 'fly' ? 'fly' : this.mode === 'drown' ? 'swim' : 'stand';
    this.anim.mode = mode;
    this.rig.draw(ctx, this.x, this.y, this.facing, mode === 'stand' ? 0 : this.angle, this.anim, { scale: this.size * this.rig.scale, white: this.flash > 0 });
  }
}
// ---------------------------------------------------------------------------
// vulture: circles carrion, lands on it, eats it
// ---------------------------------------------------------------------------
class Vulture extends Bird {
  constructor(x, y, dir) { super(x, y, 'vulture', 'fly', dir); this.target = null; this.circleA = rand(TAU); this.eatT = 0; this.landed = false; }
  update(dt) {
    const P = G.player;
    if (!this.target || this.target.remove || this.target.dead === false) {
      if (chance(dt * 1.5)) {
        let best = null, bestD = 700;
        for (const e of G.ents) { if (e.type !== 'gib' || !e.edible) continue; if (World.floorY(e.x) > 6) continue; const d = dist(this.x, this.y, e.x, e.y); if (d < bestD) { bestD = d; best = e; } }
        this.target = best;
      }
    }
    if (this.target && !this.target.remove) {
      const t = this.target, gy = World.floorY(t.x) - 6;
      if (this.landed) {
        this.y = gy; this.vx = 0; this.vy = 0; this.eatT += dt; this.frame = 0;
        if (chance(dt * 5)) G.fx.blood(t.x, t.y - 2, 1, 0, 0, 20, BLOOD_COLORS);
        if (this.eatT > 2.5) { t.remove = true; this.target = null; this.landed = false; this.eatT = 0; this.vy = -120; this.escaping = 1.5; }
        if (this.senses(80)) { this.landed = false; this.vy = -140; this.escaping = 2; this.target = null; }
        return;
      }
      const dx = t.x - this.x, dy = gy - this.y, dd = Math.hypot(dx, dy) || 1;
      if (dd < 14) { this.landed = true; this.eatT = 0; return; }
      this.vx = approach(this.vx, dx / dd * 110, 200 * dt); this.vy = approach(this.vy, dy / dd * 110, 200 * dt);
      this.x += this.vx * dt; this.y += this.vy * dt; this.facing = sign(this.vx || 1);
      this.wingT += dt * 5; this.frame = Math.sin(this.wingT) > 0 ? 0 : 1;
      this.angle = clamp(this.vy / 300, -0.3, 0.3);
      return;
    }
    // idle soaring circle
    this.circleA += dt * 0.45;
    this.flyH = -150 + Math.sin(this.circleA) * 30;
    super.update(dt);
  }
}
// ---------------------------------------------------------------------------
// jumping mullet schools: leap out of the water in bursts
// ---------------------------------------------------------------------------
class Mullet extends Fish {
  constructor(x, y, leader) { super(x, y, 'mullet', leader); this.jumpT = rand(2, 8); this.airborne = false; }
  update(dt) {
    const s = World.surface(this.x);
    if (this.airborne) {
      this.tick(dt); this.vy += 620 * dt; this.move(dt);
      this.angle = clamp(Math.atan2(this.vy, this.vx), -1.2, 1.2); this.facing = sign(this.vx || 1);
      this.anim.phase += dt * 14; this.anim.speed = 1;
      if (this.y > s) { this.airborne = false; G.fx.splash(this.x, 0.5, this.vx); SFX.splash(0.4, this.pan); this.vy *= 0.3; }
      return;
    }
    super.update(dt);

// place a structure appropriate to the terrain at x
function trySpawnStructure(x, rng, difficulty) {
  const fy = World.floorY(x), B = Biome.at(x);
  if (!B.structures || !B.structures.length) return false;
  const deepAt = dx => World.floorY(x + dx) > 60;
  const land = fy < -6, open = fy > 70;
  const table = B.structures.filter(([k]) => {
    if (k === 'seawall') return land && (deepAt(110) || deepAt(-110));
    if (k === 'dock') return land && (deepAt(90) || deepAt(-90));
    if (k === 'shop') return land && (deepAt(120) || deepAt(-120));
    if (k === 'stilthouse') return open && fy < 320;
    if (k === 'crabtrap' || k === 'buoy') return open;
    if (k === 'wreck') return fy > 150 && World.floorY(x - 90) > 110 && World.floorY(x + 90) > 110;
    return land;
  });
  if (!table.length) return false;
  let tot = 0; for (const e of table) tot += e[1];
  let r = rng() * tot, kind = table[table.length - 1][0];
  for (const e of table) { r -= e[1]; if (r <= 0) { kind = e[0]; break; } }
  const person = () => (difficulty > 2.4 && rng() < 0.4 ? 'poacher' : rng() < 0.45 ? 'fisherman' : rng() < 0.6 ? 'tourist' : 'camper');
  switch (kind) {
    case 'dock': {
      const s = new Structure(x, 'dock');
      const n = randi(1, 3); for (let i = 0; i < n; i++) s.addOccupant(rng() < 0.6 ? 'fisherman' : 'tourist', s.dir * (16 + i * 20), s.deckY);
      G.add(s);
      if (rng() < 0.45) { const b = new Boat(x + s.dir * (s.len * s.ss + 130), 'jon', -s.dir); b.engineOn = false; b.moored = true; G.add(b); }
      return true;
    }
    case 'shop': {
      const s = new Structure(x, 'shop');
      s.addOccupant('shopkeep', -22, s.deckY);
      const n = randi(1, 3); for (let i = 0; i < n; i++) s.addOccupant(person(), 12 + i * 18, s.deckY);
      G.add(s); return true;
    }
    case 'campsite': {
      const s = new Structure(x, 'campsite');
      const n = randi(1, 3); for (let i = 0; i < n; i++) s.addOccupant(rng() < 0.7 ? 'camper' : 'tourist', 44 + i * 16, 0, 'sit');
      G.add(s);
      if (rng() < 0.4) G.add(new LandAnimal(x + 76, 'dog'));
      return true;
    }
    case 'stilthouse': {
      const s = new Structure(x, 'stilthouse');
      const n = randi(1, 3); for (let i = 0; i < n; i++) s.addOccupant(person(), -18 + i * 17, s.deckY);
      G.add(s); return true;
    }
    case 'tower': { const s = new Structure(x, 'tower'); if (rng() < 0.6) s.addOccupant('ranger', 0, s.deckY); G.add(s); return true; }
    case 'boatramp': G.add(new Structure(x, 'boatramp')); return true;
    case 'crabtrap': G.add(new Structure(x, 'crabtrap')); return true;
    case 'buoy': G.add(new Structure(x, 'buoy')); return true;
    case 'wreck': G.add(new Structure(x, 'wreck')); return true;
    case 'seawall': { const st = new Structure(x, 'seawall'); G.add(st); return true; }
    case 'sign': case 'pipe': G.add(new Structure(x, 'sign')); return true;
  }
  return false;
}

const Missions = {

  tick(dt) {

    const m = G.mission; if (!m) return null;

    if (m.done) return { text: 'TAKE THE RELIC', frac: 1, col: '#ffd060' };
    const d = m.def;
    // a place-based order just says the place; a counted one shows the count
    const txt = d.atX !== undefined ? d.line : d.line + '  ' + Math.floor(m.n) + '/' + m.target + (d.unit || '');
    return { text: txt, frac: m.n / m.target, col: '#8ce8a0' };

// ---------- the relic itself ----------
class Relic extends Entity {

    super(x, y);

    this.latchable = false; this.persistent = true; this.mass = 0; this.hp = this.maxHp = 1e9;

  }

/* ===== src/boss.js ===== */
'use strict';
// ---------------------------------------------------------------------------
// Boss behaviour that sits on top of whatever the creature already does.
// A boss walks down a set of health thresholds; each crossing is a phase break
// that heals nothing but makes it faster, angrier and louder, and calls in
// help. Below the last threshold it staggers, and a stagger is an invitation:
// close the distance and the fight ends in a button sequence instead of one
// more chomp.
// ---------------------------------------------------------------------------
const Boss = {
  // extra scaling laid on top of the creature's own numbers
  init(e, opts = {}) {
    e.isBoss = true; e.persistent = true;
    e.bossPhase = 1; e.bossMax = opts.phases || 3;
    e.bossSpd = 1; e.bossDmg = 1;
    e.bossBreakT = 0; e.staggerT = 0; e.staggered = false; e.finisherDone = false;
    e.bossAdds = opts.adds || null;
    e.bossTell = 0; e.bossTellT = 0;
    e.hp = e.maxHp = Math.round(e.maxHp * (opts.hp || 1));
    e.bossCue = opts.cue || null;
    return e;
  },
  thresholds(e) {
    const n = e.bossMax;
    const out = [];
    for (let i = 1; i < n; i++) out.push(1 - i / n);
    return out;
  },
  // call once per frame from the boss's own update
  tick(e, dt) {
    if (e.dead) return;
    if (e.bossBreakT > 0) { e.bossBreakT -= dt; e.stun = Math.max(e.stun, 0.05); e.invulnB = true; }
    else e.invulnB = false;
    const frac = e.hp / e.maxHp, th = this.thresholds(e);
    const want = 1 + th.filter(t => frac < t).length;
    if (want > e.bossPhase && e.bossPhase < e.bossMax) this.breakPhase(e, want);
    // the last sliver of health is not a health bar, it is an opening
    if (!e.staggered && !e.finisherDone && frac <= 0.13) this.stagger(e);
    // a boss that makes its own light carries it everywhere: lure, wake, glow
    if (e.bossGlow) {
      G.fx.glow(e.x + Math.cos(G.t * 1.4) * 10 * e.size, e.y - 6 * e.size, 6 + Math.sin(G.t * 3) * 2, e.bossGlow, 0.5);
      if (chance(dt * 8)) G.fx.glow(e.x + rand(-24, 24) * e.size, e.y + rand(-14, 14) * e.size, rand(1.5, 3.5), e.bossGlow, rand(0.3, 0.7));
    }
    if (e.staggered) {
      e.staggerT -= dt;
      e.stun = Math.max(e.stun, 0.05);
      if (chance(dt * 24)) G.fx.glow(e.x + rand(-16, 16) * e.size, e.y + rand(-12, 12) * e.size, rand(2, 5), '#ffd060', 0.6);
      if (e.staggerT <= 0) this.recover(e, 0.24);
    }
  },
  breakPhase(e, n) {
    e.bossPhase = n;
    e.bossBreakT = 0.9;
    e.bossSpd *= 1.16; e.bossDmg *= 1.28;
    e.hp = Math.max(e.hp, 1);
    G.slowmo(0.22, 0.8); G.shake(14); G.whiteFlash(0.4); G.hitstop(0.1);
    SFX.roar(3, e.pan); SFX.warning && SFX.warning();
    G.fx.shock(e.x, e.y, 70 * Math.sqrt(e.size || 1), '#ff5030', 0.5);
    for (let i = 0; i < 20; i++) G.fx.glow(e.x + rand(-30, 30), e.y + rand(-24, 24), rand(2, 6), '#ff6030', rand(0.3, 0.8));
    G.fx.text(e.x, e.y - 36, 'PHASE ' + n, { color: '#ff5030', scale: 3, life: 1.6 });
    G.banner = { text: e.name, sub: (e.bossCue && e.bossCue[n - 2]) || 'IT IS NOT DONE', t: 2.6, max: 2.6, color: '#ff5030' };
    if (e.bossAdds) this.summon(e);
  },
  summon(e) {
    const kinds = e.bossAdds, P = G.player;
    for (let i = 0; i < 2; i++) {
      const x = e.x + rand(-160, 160), fy = World.floorY(x), su = World.surface(x);
      const k = choice(kinds);
      if (k === 'gator' && fy > su + 40) Spawn.gator(x, clamp(su + 40, su + 10, fy - 20), Math.max(0.9, P.size * 0.55));
      else if (k === 'moccasin' && fy > su + 20) G.add(new Snake(x, su + 6, 'moccasin'));
      else if (k === 'boar') { const bx = World.findX(x, xx => World.floorY(xx) < -5, 700, 30); if (bx !== null) G.add(new LandAnimal(bx, 'boar')); }
      else if (k === 'poacher') { const wx = World.findX(x, xx => World.floorY(xx) > 60, 600, 30); if (wx !== null) Spawn.boat(wx, 'poacher', sign(e.x - x) || 1); }
      else if (fy > su + 40) Spawn.school(x, clamp(su + 50, su + 10, fy - 20), 'bass');
    }
    G.fx.text(e.x, e.y - 24, 'IT CALLED FOR HELP', { color: '#ffa060', life: 1.4 });
  },
  stagger(e) {
    e.staggered = true; e.staggerT = 6;
    e.vx *= 0.2; e.vy *= 0.2;
    G.slowmo(0.3, 0.7); G.shake(9); SFX.roar(2, e.pan);
    G.fx.text(e.x, e.y - 30, 'STAGGERED', { color: '#ffd060', scale: 3, life: 1.8 });
    G.banner = { text: 'FINISH IT', sub: 'GET CLOSE AND BITE', t: 3, max: 3, color: '#ffd060' };
  },
  recover(e, frac) {
    e.staggered = false; e.finisherDone = true; e.staggerT = 0;
    e.hp = Math.max(e.hp, Math.round(e.maxHp * frac));
    e.bossSpd *= 1.15; e.bossDmg *= 1.2; e.stun = 0;
    G.fx.text(e.x, e.y - 30, 'IT GOT UP', { color: '#ff5030', scale: 2, life: 1.6 });
    SFX.roar(3, e.pan); G.shake(10); G.redFlash(0.35);
  },
  // is the player close enough to start the execution?
  canFinish(e) {
    const P = G.player;
    if (!e || e.dead || !e.staggered || P.dead) return false;
    const d = e.nearestDist ? e.nearestDist(P.x, P.y) : dist(P.x, P.y, e.x, e.y);
    return d < 40 + 14 * P.vis;
  },
};

// ---------------------------------------------------------------------------
// The execution. Three to five prompts, each a different button, each with a
// closing window. Miss two and the boss throws you off and gets back up.
// ---------------------------------------------------------------------------
const FIN_KEYS = ['bite', 'dash', 'brace'];
const FIN_LABEL = { bite: 'BITE', dash: 'DASH', brace: 'BRACE' };
const FIN_SHORT = { bite: 'BT', dash: 'DS', brace: 'BR' };
const Finisher = {
  begin(e) {
    const steps = 3 + Math.min(2, (e.bossPhase || 1) - 1);
    const seq = [];
    let last = null;
    for (let i = 0; i < steps; i++) { let k = choice(FIN_KEYS); if (k === last) k = FIN_KEYS[(FIN_KEYS.indexOf(k) + 1) % 3]; seq.push(k); last = k; }
    G.finisher = { e, seq, res: [], i: 0, t: 0, dur: 2.2, hits: 0, misses: 0, flash: 0, over: 0, won: false, endT: 0, camK: 0 };
    G.banner = null;
    G.slowmo(0.28, 0.5); G.shake(6); SFX.roar(2.4, e.pan); G.zoomPunch(1.18);
    G.fx.text(G.player.x, G.player.y - 34 * G.player.vis, 'EXECUTION', { color: '#ffd060', scale: 3, life: 1.2 });
    e.vx = 0; e.vy = 0;
  },
  // real-time: the sequence must not stretch with the slow-mo it causes
  update(raw) {
    const F = G.finisher; if (!F) return;
    const e = F.e, P = G.player;
    if (F.over > 0) { F.over -= raw; if (F.over <= 0) this.end(); return; }
    if (!e || e.dead || P.dead) { G.finisher = null; return; }
    if (F.flash > 0) F.flash -= raw;
    // hold the two of them together while it plays
    P.vx *= 0.8; P.vy *= 0.8; e.vx *= 0.8; e.vy *= 0.8;
    P.invuln = Math.max(P.invuln, 0.4);
    // keep the camera on the pair and let the croc thrash through it
    F.camK = Math.min(1, (F.camK || 0) + raw * 3);
    // clamp the two of them together: the shot is only readable if the pair
    // stays in frame, and a boss that keeps swimming drags the camera off it
    e.stun = Math.max(e.stun || 0, 0.2);
    const side = sign(P.x - e.x) || 1;
    const reach = 16 * P.vis + (e.r || 6) * (e.size || 1) * 0.7;
    P.x = lerp(P.x, e.x + side * reach, Math.min(1, raw * 9));
    P.y = lerp(P.y, e.y, Math.min(1, raw * 7));
    P.angle = angleLerp(P.angle, side > 0 ? Math.PI : 0, Math.min(1, raw * 8));
    P.facing = side > 0 ? -1 : 1;
    P.roll = lerp(P.roll || 0, 0, Math.min(1, raw * 3));
    P.legPhase += raw * 12;
    if (chance(raw * 30)) G.fx.blood(e.x + rand(-16, 16), e.y + rand(-10, 10), 2, 0, 0, 40, e.bloodColors);
    if (P.inWater && chance(raw * 24)) G.fx.bubbles(P.x, P.y, 2, 14 * P.vis, -20);
    F.t += raw;
    F.dur = 2.2 - F.i * 0.1;          // still shrinking, but from a very long window
    const want = F.seq[F.i];
    let got = null;
    if (Input.bitePressed()) got = 'bite';
    else if (Input.dashPressed()) got = 'dash';
    else if (Input.bracePressed()) got = 'brace';
    if (got) {
      if (got === want) this.score(true); else this.score(false);
    } else if (F.t >= F.dur) this.score(false);
  },
  score(hit) {
    const F = G.finisher, e = F.e, P = G.player;
    F.res.push(hit);
    if (hit) {
      F.hits++;
      G.shake(10); SFX.crunch(2, e.pan); SFX.gib(e.pan);
      Cine.hit(1, '#ffffff'); Cine.wash('#c02020', 0.5);
      G.fx.gore(e.x, e.y, 90, 0, 0, true);
      G.fx.flesh(e.x, e.y, 10, 120);
      // throw the pair around a little so each prompt lands as a camera beat
      P.roll = (P.roll || 0) + 1.3; P.vy -= 40;
      e.vy -= 30; e.flash = 0.12;
      if (e.bleeds && G.settings.gore) { const l = Gore.limbsOf(e).filter(q => !(e.missing && e.missing.has(q.id))); if (l.length) Gore.tear(e, choice(l).id, rand(-1, 1), rand(-1, 0)); }
    } else {
      F.misses++;
      G.shake(5); G.redFlash(0.25); SFX.hurt && SFX.hurt();
      Cine.wash('#602020', 0.4);
    }
    F.flash = 0.14; F.t = 0; F.i++;
    // three whole misses to lose it, and landing a single prompt is enough to win
    if (F.misses >= 3) { F.over = 0.5; F.won = false; return; }
    if (F.i >= F.seq.length) { F.over = 0.75; F.won = F.hits >= 1; }
  },
  end() {
    const F = G.finisher; if (!F) return;
    const e = F.e, P = G.player;
    G.finisher = null;
    if (!e || e.dead) return;
    if (F.won) {
      G.slowmo(0.16, 1.6); G.whiteFlash(0.45); G.shake(22); SFX.roar(3, e.pan);
      Cine.hit(1, '#ffffff'); Cine.wash('#c01818', 1);
      G.fx.gore(e.x, e.y, 220, 0, 0, true); G.fx.flesh(e.x, e.y, 40, 200);
      e.hp = 0;
      P.lastKillHow = 'roll';
      // a boat comes apart rather than dying, and takes its crew with it
      if (e.sink) e.sink(P);
      else { if (e.bleeds && G.settings.gore && Gore.bisect) Gore.bisect(e, P.facing, 0); e.die(P); }
      P.hp = P.maxHp; P.hunger = Math.min(100, P.hunger + 40);
      P.genePoints += 2; P.newPoints += 2;
      G.addScore(8000);
    } else {
      Boss.recover(e, 0.3);
      const dx = sign(P.x - e.x) || 1;
      P.vx = dx * 320; P.vy = -160;
      P.hurt(12 * (e.bossDmg || 1), e, 'crush');
      Cine.wash('#802020', 0.8); G.shake(12);
    }
  },
};

    if (this.st.lifesteal) this.hp = Math.min(this.maxHp, this.hp + this.maxHp * this.st.lifesteal);
    if (this.st.scavenge && e.type === 'gib') this.hp = Math.min(this.maxHp, this.hp + this.maxHp * this.st.scavenge);
    if (this.st.manEater && e.human) G.addScore(Math.round(e.mass * 20));

    Affinity.onEat(this, e); Affinity.onKill(this, e, this.lastKillHow || 'bite'); this.lastKillHow = null;
    G.stats.eaten++; G.stats.genePoints = (G.stats.genePoints || 0) + gp;
    Trials.bump(this, 'eaten');
    if (e.type === 'bird' || (e.species && e.species.cat === 'bird')) Trials.bump(this, 'birds');
    if (e.threat) Trials.bump(this, 'threats');
    if (e.mass > G.stats.biggestMass) { G.stats.biggestMass = e.mass; G.stats.biggest = e.name; }
    if (e.type !== 'gib') G.stats.kinds[e.name] = (G.stats.kinds[e.name] || 0) + 1;
  }
  eatMass(m, x, y) { this.mass += m * this.st.growth; this.hunger = Math.min(100, this.hunger + m * 20 / Math.pow(this.size, 1.8)); G.fx.text(x, y, '+' + Math.round(m), { color: '#ffd860', vy: -18 }); G.addScore(m * 5); }
  hurt(dmg, src, kind = 'bite') {

    const dot = kind === 'crush' || kind === 'venom';
    if (this.invuln > 0 && !dot) return 0;
    if (this.braceT > 0 && kind !== 'venom' && this.tryParry(dmg, src, kind)) return 0;
    let mult = 1 - clamp(this.st.armor, 0, 0.75);
    if (this.braceT > 0) mult *= 0.4;               // late brace still soaks most of it

    if (!dot) {

      G.fx.blood(this.x, this.y, Math.round(6 + Math.min(dmg, 40)), 0, 0, 90); G.fx.cloud(this.x, this.y, (10 + Math.min(dmg, 30) * 0.3) * Math.sqrt(this.vis));
    } else if (chance(0.15)) G.redFlash(0.12);

    if (this.hp <= 0) this.die(kind === 'bullet' ? 'SHOT' : kind === 'crush' ? 'CRUSHED' : kind === 'venom' ? 'POISONED' : 'EATEN', src);

  }
  envenom(dps, dur) { if (this.st.venomImmune) { G.fx.text(this.x, this.y - 20, 'IMMUNE', { color: '#80ff80' }); return; } this.poisonT = Math.max(this.poisonT, dur); this.venomDps = dps; }
  die(cause, src) {

    if (this.grabbed && this.grabbed.release) this.grabbed.release(); this.grabbed = null; this.latched = null;
    if (this.tether) { if (this.tether.boat) this.tether.boat.cutTether(); this.tether = null; }
    G.fx.gore(this.x, this.y, 140 * Math.sqrt(this.vis), 0, 0, true); G.fx.flesh(this.x, this.y, 20, 100); Gore.slick(this.x, this.y, 30);

  }
  updateDead(dt) {
    this.deathT += dt; const under = this.inWater;
    if (under) { this.vx *= 0.97; this.vy = approach(this.vy, 18, 40 * dt); } else this.vy += 600 * dt;
    this.x += this.vx * dt; this.y += this.vy * dt;
    const fy = World.floorY(this.x); if (this.y > fy - 5 * this.vis) { this.y = fy - 5 * this.vis; this.vy = 0; }

  draw(ctx) {
    if (this.hidden) return;

    if (this.st.lure) { ctx.globalCompositeOperation = 'lighter'; Shape.burst(ctx, this.x, this.y, 26 * this.vis, '#40f0c8', 12, 17, 0.8, 0.16); ctx.globalCompositeOperation = 'source-over'; }

      const n = this.chain.nodes, w = this.wet;
      // Darken: water on a hide sinks its value. Drawn as one non-overlapping
      // column per segment — stamping a rect per vertebra double-darkens where
      // they overlap and stripes the animal.
      ctx.globalAlpha = 0.22 * w;
      ctx.fillStyle = '#0d2026';
      for (let i = 0; i < n.length - 1; i++) {
        const a2 = n[i], b2 = n[i + 1];
        const x0 = Math.round(Math.min(a2.x, b2.x)), x1 = Math.round(Math.max(a2.x, b2.x));
        const cy2 = Math.round((a2.y + b2.y) * 0.5), hh = Math.round(4.2 * this.vis * (1 - i / n.length * 0.5));
        ctx.fillRect(x0, cy2 - hh, Math.max(1, x1 - x0), hh * 2);

      // specular: a broken line of highlights riding the back
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.5 * w;
      ctx.fillStyle = '#d8f4ff';
      for (let i = 0; i < n.length; i++) {
        if (ihash(i, 21 + Math.floor(G.t * 1.5)) > 0.55) continue;
        const k = n[i], px2 = Math.round(k.x + Math.cos(k.a - Math.PI / 2) * 3 * this.vis);
        const py2 = Math.round(k.y + Math.sin(k.a - Math.PI / 2) * 3 * this.vis);
        ctx.fillRect(px2, py2, Math.max(1, Math.round(this.vis)), Math.max(1, Math.round(this.vis)));

    }
    if (this.mudT > 0.05) { ctx.globalAlpha = 0.35 * Math.min(1, this.mudT); ctx.fillStyle = '#4a3a24'; for (const n of this.chain.nodes) ctx.fillRect(n.x - 4 * this.vis, n.y - 1 * this.vis, 8 * this.vis, 5 * this.vis); ctx.globalAlpha = 1; }
    if (this.poisonT > 0) { ctx.globalAlpha = 0.25; ctx.fillStyle = '#40ff60'; for (const n of this.chain.nodes) ctx.fillRect(n.x - 3 * this.vis, n.y - 3 * this.vis, 6 * this.vis, 6 * this.vis); ctx.globalAlpha = 1; }
    if (this.spliceGlow > 0) {
      // the splice still settling in: a colour bleed along the body that fades
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = clamp(this.spliceGlow, 0, 1) * 0.35;
      ctx.fillStyle = this.spliceCol;
      for (const n of this.chain.nodes) ctx.fillRect(n.x - 4 * this.vis, n.y - 3 * this.vis, 8 * this.vis, 6 * this.vis);
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    }
    if (this.frenzyT > 0) { ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.5 + 0.3 * Math.sin(G.t * 20); Shape.burst(ctx, this.x, this.y, 22 * this.vis, '#ff3c1e', 14, 29, 0.75, 0.2); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; }
  }
}

/* ===== src/cine.js ===== */
'use strict';
// ---------------------------------------------------------------------------
// The cinematic layer. Two moments in the game are meant to stop being a
// side-scroller for a second — the death roll and a boss execution — and both
// want the same furniture: bars closing in, the camera leaning forward, speed
// lines, and a held impact frame on every hit. This owns all of it so the two
// sequences look like they belong to the same film.
// ---------------------------------------------------------------------------
const Cine = {
  k: 0, mode: null, bar: 0, flash: 0, flashCol: '#ffffff', shockT: 0, tint: 0, tintCol: '#ff3020',
  // what the current game state wants from the camera
  want() {
    if (G.finisher) return { k: 1, zoom: 1.42, bar: 30, mode: 'finish' };
    const P = G.player;
    if (P && !P.dead && P.rollT > 0) {
      // rolling a minnow should not get the full treatment; only something
      // worth the drama pulls the bars in
      const e = P.latched, big = !!e && (e.isBoss || e.threat || e.mass >= 40);
      return { k: 1, zoom: big ? 1.16 : 1.05, bar: big ? 15 : 5, mode: big ? 'roll' : 'rolls' };
    }
    return { k: 0, zoom: 1, bar: 0, mode: null };
  },
  update(raw) {
    const w = this.want();
    // in fast, out slow: the cut should snap and the release should breathe
    const rate = w.k > this.k ? 12 : 4.5;
    this.k += (w.k - this.k) * Math.min(1, rate * raw);
    if (w.mode) this.mode = w.mode; else if (this.k < 0.02) this.mode = null;
    this.bar = lerp(this.bar, w.bar, Math.min(1, rate * raw));
    if (this.flash > 0) this.flash -= raw * 4.5;
    if (this.shockT > 0) this.shockT -= raw * 3;
    if (this.tint > 0) this.tint -= raw * 2.2;
    // Morph runs its own camera; never fight it
    if (this.k > 0.01 && !G.morph) G.zoomP = Math.max(G.zoomP, lerp(1, w.zoom, this.k));
  },
  // a held frame on a landed hit
  hit(power = 1, col = '#ffffff') {
    this.flash = Math.min(1, 0.55 + power * 0.45); this.flashCol = col;
    this.shockT = 1; G.hitstop(0.05 + power * 0.05);
  },
  wash(col = '#ff3020', amount = 1) { this.tint = Math.max(this.tint, amount); this.tintCol = col; },
  draw(ctx) {
    const W = G.W, H = G.H;
    if (this.k <= 0.01 && this.flash <= 0 && this.tint <= 0) return;
    const k = clamp(this.k, 0, 1);
    if (k > 0.01) {
      // the bars
      const b = Math.round(this.bar * k);
      if (b > 0) {
        ctx.fillStyle = 'rgba(0,0,0,0.88)';
        ctx.fillRect(0, 0, W, b); ctx.fillRect(0, H - b, W, b);
        ctx.fillStyle = 'rgba(140,220,200,0.18)';
        ctx.fillRect(0, b, W, 1); ctx.fillRect(0, H - b - 1, W, 1);
      }
      // a corner frame, so it reads as a viewfinder rather than a black border
      const m = 6, len = 10, a = 0.22 * k;
      ctx.fillStyle = `rgba(190,240,225,${a.toFixed(3)})`;
      for (const [cx, cy, dx, dy] of [[m, b + m, 1, 1], [W - m, b + m, -1, 1], [m, H - b - m, 1, -1], [W - m, H - b - m, -1, -1]]) {
        ctx.fillRect(dx > 0 ? cx : cx - len, cy, len, 1);
        ctx.fillRect(cx, dy > 0 ? cy : cy - len, 1, len);
      }
      // speed lines converging on the middle: only while the roll is spinning
      if (this.mode === 'roll') {
        const t = G.t, cx = W / 2, cy = H / 2;
        ctx.globalAlpha = 0.3 * k;
        ctx.fillStyle = '#ffffff';
        for (let i = 0; i < 26; i++) {
          const a2 = ihash(i, 400) * TAU + t * 0.6;
          const r0 = 90 + ihash(i, 401) * 60 + Math.sin(t * 9 + i) * 12;
          const ln = 12 + ihash(i, 402) * 26;
          const dx = Math.cos(a2), dy = Math.sin(a2);
          for (let s = 0; s < ln; s += 3) {
            const x = Math.round(cx + dx * (r0 + s)), y = Math.round(cy + dy * (r0 + s) * 0.62);
            if (x < 0 || x > W || y < 0 || y > H) break;
            ctx.fillRect(x, y, 2, 1);
          }
        }
        ctx.globalAlpha = 1;
      }
      // vignette
      const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.22, W / 2, H / 2, H * 0.72);
      g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${(0.42 * k).toFixed(3)})`);
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }
    // impact: a fat ring plus a one-frame wash, the comic-book hit
    if (this.shockT > 0) {
      const s = 1 - this.shockT, r = 26 + s * 170;
      ctx.globalAlpha = clamp(this.shockT, 0, 1) * 0.5;
      Shape.burst(ctx, W / 2, H / 2, r, '#ffffff', 22, 91, 0.6, 0.16 + this.shockT * 0.2);
      ctx.globalAlpha = 1;
    }
    if (this.flash > 0) { ctx.globalAlpha = clamp(this.flash, 0, 1) * 0.3; ctx.fillStyle = this.flashCol; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
    if (this.tint > 0) { ctx.globalAlpha = clamp(this.tint, 0, 1) * 0.35; ctx.fillStyle = this.tintCol; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  },
};

// ---------------------------------------------------------------------------
// A chunky pixel key cap, used everywhere a button is asked for.
// ---------------------------------------------------------------------------
function drawKeyCap(ctx, x, y, w, h, label, opts = {}) {
  const lit = opts.lit, col = opts.color || '#ffd060', dead = opts.dead;
  const base = dead ? '#1a2224' : lit ? mixColor(col, '#ffffff', 0.35) : '#22323a';
  const top = dead ? '#243036' : lit ? '#ffffff' : mixColor(col, '#101a1e', 0.55);
  const rim = dead ? '#101618' : col;
  x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
  // drop shadow / side
  ctx.fillStyle = '#050a0c'; ctx.fillRect(x + 1, y + 3, w, h);
  // body
  ctx.fillStyle = base; ctx.fillRect(x, y, w, h);
  // bevel: lit top edge, dark bottom
  ctx.fillStyle = top; ctx.fillRect(x, y, w, 2);
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(x, y + h - 2, w, 2);
  // rim
  ctx.fillStyle = rim;
  ctx.fillRect(x, y, w, 1); ctx.fillRect(x, y + h - 1, w, 1);
  ctx.fillRect(x, y, 1, h); ctx.fillRect(x + w - 1, y, 1, h);
  // corner notches, so it reads as a cap and not a box
  ctx.fillStyle = '#050a0c';
  ctx.fillRect(x, y, 1, 1); ctx.fillRect(x + w - 1, y, 1, 1);
  ctx.fillRect(x, y + h - 1, 1, 1); ctx.fillRect(x + w - 1, y + h - 1, 1, 1);
  if (label) {
    const sc = opts.scale || 1;
    Font.draw(ctx, label, x + w / 2, y + Math.round((h - Font.H * sc) / 2), { color: dead ? '#4a5a5e' : lit ? '#10201c' : '#dff4ec', align: 'center', scale: sc });
  }
}

/* ===== src/morph.js ===== */
'use strict';
// ---------------------------------------------------------------------------
// The transformation. Growing a tier or expressing an apex gene is the loudest
// thing that happens to the crocodile, and it used to be a white flash and a
// banner. Now it is a scene: the body seizes, a seam of light runs head to tail
// splitting the old hide off plate by plate, the animal bursts a third bigger
// than it will settle at, and the new form comes down out of the overshoot.
//
// It runs on real time, not the slowed clock it causes, so the beats land the
// same however hard the game is lagging.
// ---------------------------------------------------------------------------
const Morph = {
  DUR: 2.5,
  BURST: 0.5,          // where in the run the change is actually applied
  begin(o) {
    const P = G.player;
    if (G.morph || P.dead) return;
    G.morph = {
      t: 0, dur: this.DUR, color: o.color || '#9ad8b0',
      title: o.title || 'TRANSFORMING', sub: o.sub || '', kind: o.kind || 'tier',
      apply: o.apply || null, applied: false,
      base: P.size, seam: -0.2, husked: 0, ring: 0,
    };
    G.state = 'morph';
    P.frozen = true; P.latched = null; P.latchT = 0; P.rollT = 0; P.qteT = 0;
    if (P.grabbed) { if (P.grabbed.release) P.grabbed.release(); P.grabbed = null; }
    if (P.tether) { if (P.tether.boat) P.tether.boat.cutTether(); P.tether = null; }
    G.banner = null; G.finisher = null;
    G.slowmo(0.4, 0.5); SFX.shed(); SFX.warning && SFX.warning();
  },
  // 1 at rest. Coils in, snaps out past the target, then rings down onto it.
  scaleAt(u) {
    if (u < 0.16) return 1 + Math.sin(u * 190) * 0.014;                       // tremor
    if (u < this.BURST) { const k = (u - 0.16) / (this.BURST - 0.16); return 1 - 0.08 * k * k; }   // coil
    if (u < 0.6) { const k = (u - this.BURST) / (0.6 - this.BURST); return 0.92 + 0.44 * Math.sqrt(k); }  // burst
    const k = u - 0.6;
    return 1 + 0.36 * Math.exp(-k * 9) * Math.cos(k * 20);                    // elastic settle
  },
  update(raw) {
    const M = G.morph, P = G.player; if (!M) return;
    const prev = M.t / M.dur;
    M.t += raw;
    const u = M.t / M.dur;
    P.invuln = Math.max(P.invuln, 0.6);
    P.vx = 0; P.vy = 0;
    // a frozen player skips its own timers, so the strobe has to be decayed
    // here or the first flash sticks and paints the croc white all scene
    if (P.hurtFlash > 0) P.hurtFlash -= raw;
    // the seam runs head to tail across the split
    if (u > 0.16) M.seam = clamp((u - 0.16) / (this.BURST - 0.16), 0, 1) * 1.25 - 0.05;
    // size: the whole animation reads through this one curve
    P.size = M.base * this.scaleAt(u);
    // thrash while it is fighting the change, then hold still while it settles
    const swim = u < this.BURST ? 1.5 : Math.max(0, 1.2 - (u - this.BURST) * 3);
    P.legPhase += raw * (u < this.BURST ? 26 : 6);
    P.chain.solve(P.x, P.y, P.angle, P.vis, raw, swim, false);
    // spin the body through the split, then let it come to rest square
    if (u > 0.16 && u < 0.72) P.roll = (u - 0.16) * TAU * 3.2;
    else if (u >= 0.72) P.roll = lerp(P.roll, Math.round(P.roll / TAU) * TAU, 1 - Math.exp(-8 * raw));
    // push the camera in and let it fall back at the end
    const zi = u < this.BURST ? u / this.BURST : clamp(1 - (u - 0.72) / 0.28, 0, 1);
    G.zoomP = 1 + 0.5 * zi;
    // ---- phase beats
    if (u < 0.16) {
      if (chance(raw * 22)) { G.fx.sparks(P.x + rand(-14, 14) * P.vis, P.y + rand(-8, 8) * P.vis, 2); }
      if (chance(raw * 6)) { G.shake(3); P.hurtFlash = 0.05; }
      if (P.inWater && chance(raw * 20)) G.fx.bubbles(P.x + rand(-16, 16) * P.vis, P.y, 1, 6 * P.vis, -30);
    } else if (u < this.BURST) {
      G.shake(2 + u * 6);
      // shed one plate of the old hide behind the seam as it passes
      const n = P.chain.nodes, want = Math.min(n.length, Math.floor(clamp(M.seam, 0, 1) * n.length + 0.001));
      while (M.husked < want) {
        const i = M.husked++;
        const part = i === 0 ? P.parts.head : i <= 5 ? P.parts.body[i - 1] : P.parts.tail[i - 6];
        // the plate lifts off the spine rather than hanging on it: without a
        // real escape velocity twelve of them stack into one white plank
        if (part) {
          const a = n[i].a - Math.PI / 2 * (i % 2 ? 1 : -1);
          G.fx.husk(part.c, 0, 0, part.w, part.h, n[i].x, n[i].y, n[i].a, P.vis / CROC_PX, P.facing,
            { vx: Math.cos(a) * rand(40, 90) - Math.cos(n[i].a) * 25, vy: Math.sin(a) * rand(40, 90) - 20, vr: rand(-4, 4), life: rand(1.8, 2.8) });
        }
        G.fx.glow(n[i].x, n[i].y, 5 * P.vis, M.color, 0.5);
        G.fx.sparks(n[i].x, n[i].y, 5);
        SFX.crack && SFX.crack(i);
        if (P.inWater) G.fx.bubbles(n[i].x, n[i].y, 2, 7 * P.vis, -20);
      }
    }
    // ---- the burst: this is where the change actually lands
    if (!M.applied && u >= this.BURST) {
      M.applied = true;
      if (M.apply) M.apply();
      P.recomputeStats();
      G.whiteFlash(0.85); G.shake(20); G.hitstop(0.1); G.slowmo(0.22, 1.1);
      G.fx.shock(P.x, P.y, 90 * Math.sqrt(P.vis), M.color, 0.7);
      G.fx.glow(P.x, P.y, 12 * P.vis, '#ffffff', 0.7);

};

'use strict';
// ---------------------------------------------------------------------------
// Animated animal icons + the DNA orb that fronts the evolution interface.
// Icons reuse the game's own creature sprites, so what you see on a card is the

  const I = (frames, kind, scale) => ({ frames: Array.isArray(frames) ? frames : [frames], kind, scale: scale || 1 });
  SPR.mosquito = [mkSprite(['.W.W.', 'WWWWW', '.bbb.', '..t..'], { W: '#b0d0e0', b: '#5a3030', t: '#8a4040' }),
                  mkSprite(['.....', 'WWWWW', '.bbb.', '..t..'], { W: '#b0d0e0', b: '#5a3030', t: '#8a4040' })];
  SPR.eggIcon = mkSprite(['.eee.', 'eeeee', 'eeeee', 'eeeee', '.eee.'], { e: '#e8e0cc' });
  // snapshots of a whole toon rig in a few poses, so icons are the real animals

    const sp = SPECIES[id]; if (!sp) return [SPR.eggIcon];
    const rg = rigOf(sp), frames = [], w = Math.ceil(rg.len * 1.3) + 8, h = Math.ceil((rg.height || rg.len) * 1.5) + 8;
    const yOff = rg.kind === 'biped' ? rg.len * 0.48 : rg.kind === 'bird' ? (mode === 'fly' ? 0 : rg.height * 0.1) : rg.kind === 'quad' ? rg.height * 0.1 : 0;
    for (const ph of [0, Math.PI * 0.5, Math.PI, Math.PI * 1.5]) { const c = mkCanvas(w, h), x = ctxOf(c); rg.draw(x, w / 2, h / 2 + yOff, 1, 0, { phase: ph, speed: 0.7, mode }, { scale: 1 }); frames.push({ c, w, h }); }
    return frames;
  };
  Object.assign(ICONS, {
    gar: I(rigFrames('gar', 'swim'), 'swim'), shark: I(rigFrames('shark', 'swim'), 'swim'), otter: I(rigFrames('otter', 'walk'), 'walk'), heron: I(rigFrames('heron', 'stand'), 'still'),
    turtle: I(rigFrames('turtle', 'swim'), 'still'), python: I(rigFrames('python', 'swim'), 'swim'), manatee: I(rigFrames('manatee', 'swim'), 'swim'), boar: I(rigFrames('boar', 'walk'), 'walk'),
    ray: I(rigFrames('ray', 'swim'), 'swim'), panther: I(rigFrames('panther', 'walk'), 'walk'), vulture: I(rigFrames('vulture', 'fly'), 'fly'), tarpon: I(rigFrames('tarpon', 'swim'), 'swim'),
    crab: I(rigFrames('crab', 'walk'), 'walk'), mosquito: I(SPR.mosquito, 'fly'), frog: I(rigFrames('frog', 'still'), 'still'), egret: I(rigFrames('egret', 'fly'), 'fly'),
    grouper: I(rigFrames('grouper', 'swim'), 'swim'), minnow: I(rigFrames('minnow', 'swim'), 'swim'), eel: I(rigFrames('eel', 'swim'), 'swim'), human: I(rigFrames('tourist', 'walk'), 'walk'),
    boat: I(SPR.kayak, 'still'), croc: I(SPR.babygator, 'swim'), bluegill: I(rigFrames('bluegill', 'swim'), 'swim'), deer: I(rigFrames('deer', 'walk'), 'walk'),
    dragonfly: I(SPR.dragonfly, 'fly'), bass: I(rigFrames('bass', 'swim'), 'swim'), duck: I(rigFrames('duck', 'swim'), 'still'), egg: I(SPR.eggIcon, 'still'),
    rat: I(rigFrames('rat', 'walk'), 'walk'), scientist: I(rigFrames('scientist', 'walk'), 'walk'),

})();
// trait id -> icon key
const TRAIT_ICON = {
  garscale: 'gar', sharkskin: 'shark', otterfoot: 'otter', heronneck: 'heron', carapace: 'turtle', pythonjaw: 'python',
  blubber: 'manatee', tusks: 'boar', stingbarb: 'ray', pantherclaw: 'panther', vulturegut: 'vulture', tarponfin: 'tarpon',
  crabclaw: 'crab', skeeter: 'mosquito', froglung: 'frog', garfish: 'gar', snaptongue: 'turtle', hullbreak: 'boat',
  wingsnatch: 'egret', constrict: 'python', bloodscent: 'shark', nighteye: 'panther', goliath: 'grouper', swarm: 'minnow',
  electric: 'eel', ironshell: 'turtle', manhunter: 'human', ancient: 'croc',
};
const PATH_ICON = { ripper: 'shark', behemoth: 'manatee', phantom: 'otter', abyssal: 'eel' };
function iconFor(card) {
  if (!card) return null;
  if (card.kind === 'trait') return ICONS[TRAIT_ICON[card.trait.id]] || ICONS.croc;
  if (card.kind === 'path') return ICONS[PATH_ICON[card.path]] || ICONS.croc;
  return ICONS.dragonfly;
}
// Draw an animated icon centred at (x,y), fitted into a box of `box` pixels.
function drawIcon(ctx, icon, x, y, box, t, opts = {}) {
  if (!icon) return;
  const n = icon.frames.length;
  let f = 0, bob = 0, rot = 0, sq = 1;
  switch (icon.kind) {
    case 'swim': f = n > 1 ? Math.floor(t * 7) % n : 0; bob = Math.sin(t * 3) * 0.06; rot = Math.sin(t * 3) * 0.09; break;
    case 'fly': f = n > 1 ? (Math.sin(t * 11) > 0 ? 0 : 1) : 0; bob = Math.sin(t * 5.5) * 0.12; break;
    case 'walk': f = n > 1 ? Math.floor(t * 6) % n : 0; bob = Math.abs(Math.sin(t * 5)) * -0.09; break;
    default: f = n > 1 ? Math.floor(t * 2) % n : 0; sq = 1 + Math.sin(t * 2.4) * 0.05; break;
  }
  const s = icon.frames[f];

  const raw = box / Math.max(s.w, s.h) * icon.scale;
  const k = (raw >= 1 ? Math.floor(raw) : raw) * (opts.scale || 1);
  ctx.save();
  ctx.translate(Math.round(x), Math.round(y + bob * box));
  if (opts.alpha !== undefined) ctx.globalAlpha = opts.alpha;
  if (rot) ctx.rotate(rot);
  ctx.scale(k * (opts.flip ? -1 : 1), k * sq);

  ctx.drawImage(s.c, -Math.round(s.w / 2), -Math.round(s.h / 2));
  ctx.restore();
}

// ---------------------------------------------------------------------------
// DNA ORB: a double helix wound around a glowing sphere. Each acquired trait or
// path node is a base pair on the strand, carrying its animal icon.
// ---------------------------------------------------------------------------
const DNA = {
  // beads: [{color, icon, label}] oldest first
  draw(ctx, cx, cy, R, t, beads, opts = {}) {
    const rungs = opts.rungs || 22, spin = t * (opts.speed || 0.9), tilt = opts.tilt ?? 0.34;
    const glow = opts.glow || '#40f0c8';
    // --- sphere body ---
    ctx.globalAlpha = 0.12; Shape.blob(ctx, cx, cy, R * 1.02, glow);
    ctx.globalAlpha = 0.10; Shape.blob(ctx, cx - R * 0.22, cy - R * 0.26, R * 0.66, glow);
    ctx.globalAlpha = 1;
    // latitude rings, for volume
    ctx.strokeStyle = rgba(glow, 0.13); ctx.lineWidth = 1;
    for (let i = 1; i < 5; i++) {
      const yy = cy - R + (2 * R) * i / 5, rr = Math.sqrt(Math.max(0, R * R - (yy - cy) * (yy - cy)));
      Shape.ring(ctx, cx, yy, rr, 1, rgba(glow, 0.13), tilt);
    }
    Shape.ring(ctx, cx, cy, R, 1, rgba(glow, 0.22));
    // --- helix ---
    const pts = [];
    for (let i = 0; i <= rungs; i++) {
      const u = i / rungs, yy = cy - R * 0.94 + u * R * 1.88;
      const rr = Math.sqrt(Math.max(0, R * R - (yy - cy) * (yy - cy))) * 0.92;
      const a = spin + u * Math.PI * 3.4;
      pts.push({
        i, u, y: yy,
        ax: cx + Math.cos(a) * rr, az: Math.sin(a),
        bx: cx + Math.cos(a + Math.PI) * rr, bz: Math.sin(a + Math.PI),
      });
    }
    const dep = z => 0.35 + 0.65 * ((z + 1) / 2);
    // rungs first, back to front
    const order = pts.slice().sort((p, q) => Math.min(p.az, p.bz) - Math.min(q.az, q.bz));
    for (const p of order) {
      const d = dep((p.az + p.bz) / 2);
      ctx.strokeStyle = rgba(glow, 0.10 + 0.28 * d); ctx.lineWidth = Math.max(1, 1.6 * d);
      ctx.beginPath(); ctx.moveTo(p.ax, p.y); ctx.lineTo(p.bx, p.y); ctx.stroke();
    }
    // strand backbones
    for (const side of ['a', 'b']) {
      ctx.beginPath();
      pts.forEach((p, i) => { const X = side === 'a' ? p.ax : p.bx; if (i === 0) ctx.moveTo(X, p.y); else ctx.lineTo(X, p.y); });
      ctx.strokeStyle = rgba(glow, 0.5); ctx.lineWidth = 1.5; ctx.stroke();
    }
    // --- beads on the strand ---
    const slots = [];
    for (let i = 0; i < pts.length; i++) if (i % 2 === 1) slots.push(pts[i]);
    const drawn = [];
    beads.forEach((b, k) => {
      const p = slots[k % slots.length]; if (!p) return;
      const onA = k % 2 === 0;
      drawn.push({ b, x: onA ? p.ax : p.bx, y: p.y, z: onA ? p.az : p.bz });
    });
    drawn.sort((m, n) => m.z - n.z);
    for (const d of drawn) {
      const dp = dep(d.z), r = (opts.beadR || 7) * dp;
      ctx.globalCompositeOperation = 'lighter';
      Shape.star(ctx, d.x, d.y, r * 1.9, d.b.color, 0.32 * dp);
      ctx.globalCompositeOperation = 'source-over';
      Shape.blob(ctx, d.x, d.y, r, rgba('#04100e', 0.9));
      Shape.ring(ctx, d.x, d.y, r, Math.max(1, r * 0.22), rgba(d.b.color, 0.4 + 0.6 * dp));
      if (d.b.icon && dp > 0.55) drawIcon(ctx, d.b.icon, d.x, d.y, r * 1.9, t + d.y * 0.03, { alpha: dp });
    }
    // --- orbiting motes ---
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 14; i++) {
      const a = spin * 1.7 + i * TAU / 14, rr = R * (1.05 + 0.1 * Math.sin(t * 1.3 + i));
      const mx = cx + Math.cos(a) * rr, my = cy + Math.sin(a) * rr * tilt * 1.5;
      ctx.fillStyle = rgba(glow, 0.25 + 0.35 * ((Math.sin(a) + 1) / 2));
      ctx.fillRect(Math.round(mx), Math.round(my), 2, 2);
    }
    ctx.globalCompositeOperation = 'source-over';
  },
  // the player's genome as beads
  beads(P) {
    const out = [];
    for (const key of P.picked) {
      if (key.startsWith('mut:')) { out.push({ color: '#9aa8a0', icon: ICONS.dragonfly, label: key.slice(4) }); continue; }
      const [pk, tier] = key.split(':');
      const path = PATHS[pk]; if (!path) continue;
      out.push({ color: path.color, icon: ICONS[PATH_ICON[pk]], label: path.nodes[+tier].name });
    }
    for (const id of P.traits) { const t = TRAIT_BY_ID[id]; if (t) out.push({ color: t.color, icon: ICONS[TRAIT_ICON[id]], label: t.name }); }
    return out;
  },
  // compact HUD version: a slim helix strip
  drawMini(ctx, x, y, w, h, t, beads, glow) {
    const spin = t * 1.4;
    ctx.strokeStyle = rgba(glow, 0.35); ctx.lineWidth = 1;
    for (const off of [0, Math.PI]) {
      ctx.beginPath();
      for (let i = 0; i <= 24; i++) { const u = i / 24, px = x + u * w, a = spin + u * Math.PI * 2.6 + off; const py = y + h / 2 + Math.sin(a) * h / 2; if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py); }

    }
    beads.slice(-8).forEach((b, k) => {
      const u = (k + 0.5) / 8, px = x + u * w, a = spin + u * Math.PI * 2.6 + (k % 2 ? Math.PI : 0);

    });
  },
};

'use strict';
// ---------------------------------------------------------------------------
// The specimen viewer. Two jobs:
//
//   * a live animated crocodile, using the real in-game body and art, so what
//     you see in the creation bay is literally the animal you will play;
//   * a holographic projection of it running an attack loop — coil, lunge,
//     snap, recoil — for the species select.
//
// The hologram is not a filter over the sprite. The animal is rendered to an
// offscreen buffer, tinted through its own alpha, then composited additively
// with scanlines cut out of it and a projector cone under it, so it reads as
// light in the air rather than a coloured sprite.
// ---------------------------------------------------------------------------
const CrocView = {
  make() {
    return { chain: new CrocChain(0, 0, 0), t: 0, jaw: 0, legPhase: 0, x: 0, y: 0, a: 0, hit: 0, roll: 0 };
  },
  // one attack cycle, in normalised phase. Returns the head pose.
  script(v, u) {
    // 0.00-0.30 hold, drifting          0.30-0.46 coil back, jaw cracks open
    // 0.46-0.58 lunge                   0.58-0.64 snap
    // 0.64-1.00 recoil and settle
    let x = 0, a = 0, jaw = 0;
    if (u < 0.30) { const k = u / 0.30; x = Math.sin(k * TAU) * 2; a = Math.sin(k * TAU * 0.5) * 0.05; jaw = 0.06; }
    else if (u < 0.46) { const k = (u - 0.30) / 0.16, e = k * k; x = -14 * e; a = -0.18 * e; jaw = 0.06 + 0.62 * e; }
    else if (u < 0.58) { const k = (u - 0.46) / 0.12, e = 1 - Math.pow(1 - k, 3); x = lerp(-14, 26, e); a = lerp(-0.18, 0.12, e); jaw = 0.68 + 0.22 * e; }
    else if (u < 0.64) { const k = (u - 0.58) / 0.06; x = 26 + k * 2; a = 0.12 - k * 0.1; jaw = 0.9 * (1 - k * k); v.hit = Math.max(v.hit, 1 - k); }
    else { const k = (u - 0.64) / 0.36, e = 1 - Math.pow(1 - k, 2); x = lerp(28, 0, e); a = lerp(0.02, 0, e); jaw = 0.04; }
    return { x, a, jaw };
  },
  update(v, dt, cycle = 2.9) {
    v.t += dt;
    const u = (v.t % cycle) / cycle;
    const p = this.script(v, u);
    v.x = p.x; v.a = p.a; v.jaw = p.jaw;
    if (v.hit > 0) v.hit -= dt * 3.4;
    // the body follows the head, so the whole animal whips through the lunge
    const swim = u > 0.44 && u < 0.66 ? 1.3 : 0.35;
    v.chain.solve(v.x, v.y, v.a, 1, dt, swim, false);
    v.legPhase += dt * 2.2;
    return u;
  },
  // solid render, for the customise stage: the actual animal, actual art
  draw(ctx, v, parts, cx, cy, worldSize) {
    // drawCroc scales the PARTS by worldSize but lays them on the chain's raw
    // node positions, so a chain solved at size 1 and drawn at 0.6 comes out as
    // a row of disconnected blocks. Scale the whole space instead and hand
    // drawCroc the size the chain was actually solved at.
    ctx.save();
    ctx.translate(Math.round(cx), Math.round(cy));
    if (worldSize !== 1) ctx.scale(worldSize, worldSize);
    drawCroc(ctx, v.chain, parts, 1, { jaw: v.jaw, legPhase: v.legPhase, flipY: 1 });
    ctx.restore();
  },
  // holographic render. `col` tints it; `k` is projector strength 0..1.
  holo(ctx, v, parts, cx, cy, worldSize, col, k, t) {
    const W = 320, H = 150;
    if (!this._cv) { this._cv = mkCanvas(W, H); this._cx = ctxOf(this._cv); }
    const o = this._cx;
    o.clearRect(0, 0, W, H);
    // 1. the animal, in its own art, into the buffer
    o.save();
    o.translate(W * 0.74, H * 0.52);
    // same rule as draw(): scale the space, not the parts, or the chain's raw
    // node spacing no longer matches the art laid on it
    if (worldSize !== 1) o.scale(worldSize, worldSize);
    drawCroc(o, v.chain, parts, 1, { jaw: v.jaw, legPhase: v.legPhase, flipY: 1 });
    o.restore();
    // 2. tint through its own alpha: keeps the internal shading as luminance
    o.save();
    o.globalCompositeOperation = 'source-atop';
    o.globalAlpha = 0.62;
    o.fillStyle = col; o.fillRect(0, 0, W, H);
    o.globalAlpha = 1;
    // 3. Dim scanlines into it rather than punching them out. A full-alpha cut
    // every third row removed a third of the animal and left horizontal bars
    // where a crocodile should be.
    o.globalCompositeOperation = 'destination-out';
    o.globalAlpha = 0.42;
    o.fillStyle = '#000';
    const roll = Math.round((t * 22) % 4);
    for (let y = 0; y < H; y += 4) o.fillRect(0, (y + roll) % H, W, 1);
    o.globalAlpha = 1;
    o.globalCompositeOperation = 'source-over';
    o.restore();

    // 4. composite: a jittered double exposure plus a bright core
    const jx = Math.round(Math.sin(t * 41) * 1.2), jy = Math.round(Math.cos(t * 33) * 0.8);
    const bx = Math.round(cx - W * 0.74), by = Math.round(cy - H * 0.52);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.30 * k; ctx.drawImage(this._cv, bx + jx + 2, by + jy);
    ctx.globalAlpha = 0.22 * k; ctx.drawImage(this._cv, bx + jx - 2, by + jy);
    ctx.globalAlpha = 0.95 * k; ctx.drawImage(this._cv, bx, by);
    ctx.restore();
    // 5. the strike flash, on the snap frame
    if (v.hit > 0.02) {
      const hx = cx + Math.cos(v.a) * 20 * worldSize, hy = cy + Math.sin(v.a) * 20 * worldSize;
      ctx.globalCompositeOperation = 'lighter';
      Shape.star(ctx, hx, hy, 14 + v.hit * 16, '#ffffff', v.hit * 0.8);
      Shape.burst(ctx, hx, hy, 8 + (1 - v.hit) * 26, col, 12, 3, 0.8, 0.3);
      ctx.globalCompositeOperation = 'source-over';
    }
  },
  // the emitter plate and the cone of light it throws up
  projector(ctx, cx, cy, w, col, t, k) {
    const base = cy + 44;
    // plate
    ctx.fillStyle = '#22343a'; ctx.fillRect(cx - 26, base, 52, 6);
    ctx.fillStyle = '#3a5a62'; ctx.fillRect(cx - 26, base, 52, 1);
    ctx.fillStyle = '#0d1518'; ctx.fillRect(cx - 20, base + 2, 40, 2);
    for (let i = 0; i < 5; i++) { ctx.fillStyle = Math.sin(t * 7 + i) > 0 ? col : '#1a2a2e'; ctx.fillRect(cx - 18 + i * 9, base + 2, 3, 2); }
    // cone
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createLinearGradient(0, base, 0, cy - 56);
    g.addColorStop(0, rgba(col, 0.20 * k)); g.addColorStop(1, rgba(col, 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(cx - 20, base); ctx.lineTo(cx + 20, base);
    ctx.lineTo(cx + w / 2, cy - 56); ctx.lineTo(cx - w / 2, cy - 56);
    ctx.closePath(); ctx.fill();
    // motes riding the cone
    ctx.globalAlpha = 0.5 * k; ctx.fillStyle = col;
    for (let i = 0; i < 22; i++) {
      const p = ((t * 0.3 + ihash(i, 71)) % 1);
      const spread = lerp(20, w / 2, p);
      ctx.fillRect(Math.round(cx + (ihash(i, 72) * 2 - 1) * spread), Math.round(base - p * (base - (cy - 56))), 1, 1);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.restore();
  },
};

for (const sp of BASE_SPECIES) sp.trait = SPECIES_TRAITS[sp.id];

const SPECIES_BY_ID = {};
for (const s of BASE_SPECIES) SPECIES_BY_ID[s.id] = s;

// Size is a real trade, not a difficulty slider: bigger starts you higher up
// the food chain but eats hunger and slows you down.
// Hide palettes. Cosmetic, and applied over whatever the species came with.
const HIDE_PAINTS = [
  { id: 'wild', name: 'WILD TYPE', swatch: null, apply: null, line: 'THE HIDE THE SPECIES CAME WITH. NO DYE, NO EDITS.' },
  { id: 'blackwater', name: 'BLACKWATER', swatch: '#2a3238', line: 'NEAR BLACK. INVISIBLE IN TANNIC WATER AND IN PIPES.', apply: L => { L.back = '#22282e'; L.mid = '#333c44'; L.belly = '#7a8288'; L.dark = '#12161a'; } },

  { id: 'leucistic', name: 'LEUCISTIC', swatch: '#e4e0d0', line: 'NO PIGMENT AT ALL. PINK EYED, AND IMPOSSIBLE TO HIDE.', apply: L => { L.back = '#d8d4c2'; L.mid = '#e8e4d4'; L.belly = '#f6f2e6'; L.dark = '#b0a894'; L.eye = '#e06a6a'; } },
  { id: 'sulphur', name: 'SULPHUR', swatch: '#a8a830', line: 'THE LAB DYE NEVER WASHED OUT OF THE SCUTES.', apply: L => { L.back = '#7a7a20'; L.mid = '#a8a830'; L.belly = '#e0e070'; L.dark = '#4a4a12'; L.eye = '#40f0c8'; } },
  { id: 'bloodline', name: 'BLOODLINE', swatch: '#8a2a28', line: 'THE RED ONES WERE NEVER MEANT TO LEAVE THE BUILDING.', apply: L => { L.back = '#6a1c1c'; L.mid = '#8a2a28'; L.belly = '#c07a68'; L.dark = '#3a0e0e'; L.eye = '#ffd040'; } },
  { id: 'abyssal', name: 'ABYSSAL', swatch: '#1e4454', line: 'GREW UP WHERE THE LIGHT DOES NOT REACH. IT GLOWS FAINTLY.', apply: L => { L.back = '#16303c'; L.mid = '#1e4454'; L.belly = '#3a7a86'; L.dark = '#0a1a22'; L.eye = '#80fff0'; L.glow = '#40f0c8'; } },
];
const PAINT_BY_ID = {};
for (const h of HIDE_PAINTS) PAINT_BY_ID[h.id] = h;

// Girth. Depth of body, independent of length: a real trade of health for speed.
const GIRTH_GRADES = [
  { id: 'lean', name: 'LEAN', mul: 0.82, hp: 0.86, spd: 1.14, line: 'NARROW THROUGH THE CHEST. QUICK, AND EASY TO BREAK.' },
  { id: 'normal', name: 'NORMAL', mul: 1.0, hp: 1, spd: 1, line: 'PROPORTIONED AS THE SPECIES INTENDED.' },
  { id: 'heavy', name: 'HEAVY', mul: 1.14, hp: 1.14, spd: 0.92, line: 'DEEP BODIED. SOAKS PUNISHMENT, TURNS LIKE A BARGE.' },
  { id: 'bull', name: 'BULL', mul: 1.28, hp: 1.3, spd: 0.84, line: 'ALL SHOULDER. NOTHING SHIFTS IT AND IT SHIFTS SLOWLY.' },
];

const SIZE_GRADES = [
  { id: 'runt', name: 'RUNT', mul: 0.78, line: 'SMALLEST VIABLE. FAST, STARVES SLOWLY, DIES TO ANYTHING.', hp: 0.8, spd: 1.22, hunger: 0.72 },
  { id: 'standard', name: 'STANDARD', mul: 1.0, line: 'WHAT THE PAPERWORK SAYS.', hp: 1, spd: 1, hunger: 1 },
  { id: 'large', name: 'OVERGROWN', mul: 1.3, line: 'FED PAST SPEC. HITS HARDER, BURNS THROUGH FOOD.', hp: 1.2, spd: 0.9, hunger: 1.34 },
  { id: 'huge', name: 'HYPERTROPHIC', mul: 1.7, line: 'THEY DO NOT AUTHORISE THIS. IT WILL BE HUNGRY.', hp: 1.45, spd: 0.8, hunger: 1.8 },
];

const Create = {
  rows: ['species', 'size', 'girth', 'hide'],
  // Nothing here is given. You come out of the tank as a dwarf alligator in the
  // hide it grew, at the length and depth the paperwork says, and every other
  // option on this screen is a line item somebody has to fund first.
  speciesUnlocked(sp) { return sp.id === 'dwarf' || Research.granted('species').has(sp.id); },
  paintUnlocked(pt) { return pt.id === 'wild' || Research.granted('paint').has(pt.id); },
  sizeUnlocked(i) { return i === 1 || Research.granted('size').has(i); },
  girthUnlocked(i) { return i === 1 || Research.granted('girth').has(i); },
  rowUnlocked(row, i, item) { return row === 0 ? this.sizeUnlocked(i) : row === 1 ? this.girthUnlocked(i) : this.paintUnlocked(item); },
  // What the animal in the chosen enclosure works out to. There is no embryo
  // and no splice bay any more: the thing you play is a crocodile that already
  // exists, living in the habitat, and this reads it off.
  spec(c) {
    const croc = c || (typeof Habitat !== 'undefined' ? Habitat.runner() : null);
    const sp = croc ? (SPECIES_BY_ID[croc.sp] || BASE_SPECIES[0]) : BASE_SPECIES[0];
    const gr = SIZE_GRADES[clamp(croc ? croc.size : 1, 0, SIZE_GRADES.length - 1)] || SIZE_GRADES[1];
    const gi = GIRTH_GRADES[clamp(croc ? croc.girth : 1, 0, GIRTH_GRADES.length - 1)] || GIRTH_GRADES[1];
    const pt = PAINT_BY_ID[croc ? croc.hide : 'wild'] || HIDE_PAINTS[0];
    return {
      croc, sp, gr, gi, pt,
      size: sp.size * gr.mul,
      girth: (sp.girth || 1) * gi.mul,
      hp: sp.hp * gr.hp * gi.hp, spd: sp.spd * gr.spd * gi.spd, bite: sp.bite, hunger: gr.hunger,
      gene: sp.gene ? GENE_BY_ID[sp.gene] : null,
    };
  },
  // the look the animal is actually wearing, for the preview and the run
  look(c) {
    const b = this.spec(c);
    const L = Object.assign({}, CROC_LOOKS.base, b.sp.look || {});
    if (b.pt && b.pt.apply) b.pt.apply(L);
    L.girth = b.girth;
    return L;
  },
  // stamp the chosen animal onto a fresh player
  applyTo(P) {
    const b = this.spec();
    P.baseSpecies = b.sp.id;
    P.st.hpMul *= b.hp; P.st.speed *= b.spd; P.st.bite *= b.bite; P.st.hungerRate *= b.hunger;
    P.startSize = b.size;
    P.bodyGirth = b.girth;
    P.speciesLook = b.sp.look || null;
    P.paintId = b.pt ? b.pt.id : 'wild';
    // the species' signature gene comes free: it is what the animal already is
    if (b.gene && P.genes.indexOf(b.gene.id) < 0) { P.genes.push(b.gene.id); b.gene.apply(P); if (b.gene.downApply) b.gene.downApply(P); P.speciesGene = b.gene.id; }
    // the signature: what makes this animal that animal and not a recolour
    P.speciesTrait = b.sp.trait || null;
    if (b.sp.trait) b.sp.trait.apply(P);
    // and everything the enclosure put into it
    if (typeof Habitat !== 'undefined') Habitat.applyTo(P, b.croc);
    P.recomputeStats(); P.rebuildLook();
  },
};

/* ===== src/habitat.js ===== */
'use strict';
// ---------------------------------------------------------------------------
// THE HABITAT.
//
// Six enclosures down the back wall of the lab, each with water in it and,
// if you have hatched one, a crocodile living in it. An animal here is a
// character and not a loadout slot: it is a species with a signature, a name,
// a level it grew to by being fed, three things you can put points into, and a
// hide. You pick which one goes out on a run, and it is the one that comes
// back — bigger, if it lived.
//
// Nothing here is text if it can be a picture: the enclosure shows the real
// animal, at the real size, in the real colours.
// ---------------------------------------------------------------------------
const HAB_SLOTS = 6;
const HAB_UPGRADES = [
  { id: 'body', name: 'BODY', col: '#ff6a5a', icon: 'heart', per: 0.07, line: 'MASS AND MEAT' },
  { id: 'jaws', name: 'JAWS', col: '#ffd060', icon: 'jaw', per: 0.06, line: 'BITE AND HOLD' },
  { id: 'blood', name: 'BLOOD', col: '#60c8ff', icon: 'drop', per: 0.05, line: 'SPEED AND WIND' },
];
// XP needed to reach each level. Feeding is the only way in, and it is cheap
// early so a first animal grows visibly inside one session.
function habXpFor(lv) { return Math.round(10 + lv * lv * 7 + lv * 9); }

const Habitat = {
  MAX_LV: 12,
  list() {
    const s = G.save;
    if (!s) return [];
    if (!Array.isArray(s.habitat)) s.habitat = [];
    while (s.habitat.length < HAB_SLOTS) s.habitat.push(null);
    return s.habitat;
  },
  // Nothing is handed to you. An empty habitat is the correct state of a new
  // save: the first animal is grown in the creation bay, and the induction
  // walks you there. This only keeps the selection pointing at something real.
  ensure() {
    const L = this.list();
    if (!this.runner()) { const k = L.findIndex(c => c); if (k >= 0) G.save.runner = k; }
    return L;
  },
  make(spId) {
    const sp = SPECIES_BY_ID[spId] || BASE_SPECIES[0];
    const seed = (Math.random() * 1e9) | 0;
    return { sp: sp.id, hide: 'wild', size: 1, girth: 1, lv: 1, xp: 0, up: { body: 0, jaws: 0, blood: 0 }, seed, out: 0 };
  },
  at(i) { const L = this.list(); return L[clamp(i, 0, L.length - 1)] || null; },
  runner() { return this.at(G.save ? (G.save.runner || 0) : 0); },
  runnerIndex() { return clamp((G.save && G.save.runner) || 0, 0, HAB_SLOTS - 1); },
  select(i) { if (this.at(i)) { G.save.runner = i; G.storeSave(); return true; } return false; },
  spec(c) { return c ? (SPECIES_BY_ID[c.sp] || BASE_SPECIES[0]) : BASE_SPECIES[0]; },
  // what a name-plate says. Species initial plus the seed, so every animal in
  // the room is telling you apart from the others without a word of prose.
  tag(c) { return c ? (this.spec(c).name[0] + '-' + (100 + (c.seed % 900))) : '--'; },
  // ---------- growing ----------
  // the first animal the project ever grows for you is on the project
  hatchCost(spId) {
    if (!this.list().some(c => c)) return 0;
    const sp = SPECIES_BY_ID[spId] || BASE_SPECIES[0];
    return Math.round(4 + (sp.size - 1) * 9);
  },
  canHatch(slot, spId) {
    const sp = SPECIES_BY_ID[spId]; if (!sp) return false;
    if (this.at(slot)) return false;
    if (!Create.speciesUnlocked(sp)) return false;
    return Research.data() >= this.hatchCost(spId);
  },
  hatch(slot, spId) {
    if (!this.canHatch(slot, spId)) return false;
    G.save.data -= this.hatchCost(spId);
    this.list()[slot] = this.make(spId);
    G.storeSave();
    return true;
  },
  // like the first animal, the first meal is on the project — otherwise the
  // induction tells a brand new save to feed something it cannot pay for
  feedCost(c) {
    if (typeof Tutor !== 'undefined' && Tutor.at('feed')) return 0;
    return c ? 1 + Math.floor(c.lv / 3) : 1;
  },
  feedXp(c) { return 12 + c.lv * 3; },
  canFeed(c) { return !!c && c.lv < this.MAX_LV && Research.data() >= this.feedCost(c); },
  feed(c) {
    if (!this.canFeed(c)) return 0;
    G.save.data -= this.feedCost(c);
    return this.addXp(c, this.feedXp(c));
  },
  // returns how many levels it gained
  addXp(c, n) {
    if (!c) return 0;
    let up = 0;
    c.xp += n;
    while (c.lv < this.MAX_LV && c.xp >= habXpFor(c.lv)) { c.xp -= habXpFor(c.lv); c.lv++; up++; }
    if (c.lv >= this.MAX_LV) c.xp = 0;
    G.storeSave();
    return up;
  },
  spent(c) { return c ? c.up.body + c.up.jaws + c.up.blood : 0; },
  points(c) { return c ? Math.max(0, (c.lv - 1) - this.spent(c)) : 0; },
  invest(c, id) {
    if (!c || this.points(c) <= 0 || c.up[id] === undefined) return false;
    c.up[id]++; G.storeSave(); return true;
  },
  // ---------- what it is worth in the field ----------
  look(c) {
    const sp = this.spec(c);
    const L = Object.assign({}, CROC_LOOKS.base, sp.look || {});
    const pt = PAINT_BY_ID[c ? c.hide : 'wild'];
    if (pt && pt.apply) pt.apply(L);
    L.girth = (sp.girth || 1) * (GIRTH_GRADES[clamp(c ? c.girth : 1, 0, 3)] || GIRTH_GRADES[1]).mul;
    return L;
  },
  // levels are real: a level 12 animal is meaningfully a different beast
  applyTo(P, c) {
    if (!c) return;
    const lv = c.lv - 1;
    P.st.hpMul *= 1 + lv * 0.04 + c.up.body * HAB_UPGRADES[0].per;
    P.st.bite *= 1 + lv * 0.03 + c.up.jaws * HAB_UPGRADES[1].per;
    P.st.speed *= 1 + lv * 0.015 + c.up.blood * HAB_UPGRADES[2].per;
    P.st.dashCd *= 1 - Math.min(0.35, c.up.blood * 0.03);
    P.habLevel = c.lv;
  },
  // a run that ends feeds the animal that went on it
  onRunEnd(score, tier) {
    const c = this.runner(); if (!c) return 0;
    c.out = (c.out || 0) + 1;
    return this.addXp(c, Math.round(Math.max(0, tier - 1) * 6 + score / 3000));
  },
};
