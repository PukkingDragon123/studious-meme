<!DOCTYPE html>

<div id="wrap"><canvas id="game" width="640" height="360"></canvas></div>
<script>
/* ===== src/util.js ===== */
'use strict';
// ---------- math & helpers ----------
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const rand = (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
const randi = (a, b) => Math.floor(rand(a, b + 1));
const choice = arr => arr[(Math.random() * arr.length) | 0];
const chance = p => Math.random() < p;
const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
const sqr = v => v * v;
const sign = v => (v < 0 ? -1 : 1);
const angleDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; else if (d < -Math.PI) d += TAU; return d; };
const angleLerp = (a, b, t) => a + angleDiff(a, b) * t;
const approach = (v, target, step) => (v < target ? Math.min(v + step, target) : Math.max(v - step, target));
const easeOut = t => 1 - (1 - t) * (1 - t);
const easeIn = t => t * t;
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const fmt = n => Math.floor(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');

// ---------- deterministic randomness ----------
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function ihash(i, seed = 0) {
  let x = (i | 0) ^ (seed | 0);
  x = Math.imul(x ^ (x >>> 16), 0x45d9f3b);
  x = Math.imul(x ^ (x >>> 16), 0x45d9f3b);
  x ^= x >>> 16;
  return (x >>> 0) / 4294967296;
}
function vnoise(x, seed = 0) {
  const i = Math.floor(x), f = x - i;
  const u = f * f * (3 - 2 * f);
  return lerp(ihash(i, seed), ihash(i + 1, seed), u);
}
function fbm(x, seed = 0, oct = 3) {
  let v = 0, a = 0.5, f = 1, n = 0;
  for (let k = 0; k < oct; k++) { v += a * vnoise(x * f, seed + k * 131); n += a; a *= 0.5; f *= 2.13; }
  return v / n;
}

// ---------- colors ----------
function hexToRgb(h) {
  h = h.replace('#', '');
  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  const n = parseInt(h, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
const rgbToHex = (r, g, b) => '#' + ((1 << 24) | (clamp(r | 0, 0, 255) << 16) | (clamp(g | 0, 0, 255) << 8) | clamp(b | 0, 0, 255)).toString(16).slice(1);
function rgba(h, a) { const [r, g, b] = hexToRgb(h); return `rgba(${r},${g},${b},${a})`; }
function mixColor(h1, h2, t) {
  const a = hexToRgb(h1), b = hexToRgb(h2);
  return rgbToHex(lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t));
}
function shade(h, k) { const [r, g, b] = hexToRgb(h); return rgbToHex(r * k, g * k, b * k); }

// ---------- canvas helpers ----------
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function ctxOf(c) { const x = c.getContext('2d'); x.imageSmoothingEnabled = false; return x; }

/* ===== src/shape.js ===== */
'use strict';
// ---------------------------------------------------------------------------
// Pixel shape primitives. Nothing in this game should ever paint a smooth
// vector circle: a canvas arc antialiases its edge, which reads as a soft blob
// pasted over hard pixel art. Everything round here is built out of whole
// pixels — stepped spans, radial dashes, cross flares and octagons — so it sits
// in the same palette and grid as the rest of the frame.
// ---------------------------------------------------------------------------
const Shape = {
  // filled disc as integer horizontal spans; squash < 1 flattens it
  blob(ctx, cx, cy, r, col, squash = 1) {
    if (r < 0.5) return;
    const R = Math.max(1, Math.round(r)), X = Math.round(cx), Y = Math.round(cy);
    ctx.fillStyle = col;
    for (let dy = -R; dy <= R; dy++) {
      const t = dy / R, w = Math.round(R * Math.sqrt(Math.max(0, 1 - t * t)));
      if (w <= 0) continue;
      const y = Y + Math.round(dy * squash);
      ctx.fillRect(X - w, y, w * 2, 1);
    }
  },
  // stepped ring: the same spans, hollowed out
  ring(ctx, cx, cy, r, w, col, squash = 1) {
    if (r < 1) return;
    const R = Math.max(1, Math.round(r)), T = Math.max(1, Math.round(w)), X = Math.round(cx), Y = Math.round(cy);
    ctx.fillStyle = col;
    for (let dy = -R; dy <= R; dy++) {
      const t = dy / R;
      const o = Math.round(R * Math.sqrt(Math.max(0, 1 - t * t)));
      const ti = (R - T) / R, inner = Math.abs(t) < ti ? Math.round((R - T) * Math.sqrt(Math.max(0, 1 - (t / ti) * (t / ti)))) : 0;
      if (o <= 0) continue;
      const y = Y + Math.round(dy * squash);
      if (inner <= 0) ctx.fillRect(X - o, y, o * 2, 1);
      else { ctx.fillRect(X - o, y, o - inner, 1); ctx.fillRect(X + inner, y, o - inner, 1); }
    }
  },
  // an octagon, for pads and frames that want to read as round without being round
  oct(ctx, cx, cy, r, fill, stroke, lw = 1) {
    const R = Math.round(r), c = Math.round(R * 0.42);
    ctx.beginPath();
    ctx.moveTo(cx - R + c, cy - R); ctx.lineTo(cx + R - c, cy - R);
    ctx.lineTo(cx + R, cy - R + c); ctx.lineTo(cx + R, cy + R - c);
    ctx.lineTo(cx + R - c, cy + R); ctx.lineTo(cx - R + c, cy + R);
    ctx.lineTo(cx - R, cy + R - c); ctx.lineTo(cx - R, cy - R + c);
    ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
  },
  // four-point pixel flare: a bright core with beams. This is what replaced the
  // soft radial glow, and it is the only "light" shape in the game.
  star(ctx, cx, cy, r, col, alpha = 1) {
    const X = Math.round(cx), Y = Math.round(cy), R = Math.max(1, Math.round(r));
    const a = clamp(alpha, 0, 1);
    ctx.globalAlpha = a * 0.85;
    ctx.fillStyle = col;
    // beams, tapering in steps
    for (let i = 0; i < R; i++) {
      const w = Math.max(1, Math.round((1 - i / R) * R * 0.34));
      ctx.fillRect(X + i, Y - (w >> 1), 1, Math.max(1, w));
      ctx.fillRect(X - i, Y - (w >> 1), 1, Math.max(1, w));
      ctx.fillRect(X - (w >> 1), Y + i, Math.max(1, w), 1);
      ctx.fillRect(X - (w >> 1), Y - i, Math.max(1, w), 1);
    }
    // diagonal spurs, half length
    const D = Math.max(1, Math.round(R * 0.5));
    ctx.globalAlpha = a * 0.4;
    for (let i = 1; i < D; i++) {
      ctx.fillRect(X + i, Y + i, 1, 1); ctx.fillRect(X - i, Y + i, 1, 1);
      ctx.fillRect(X + i, Y - i, 1, 1); ctx.fillRect(X - i, Y - i, 1, 1);
    }
    // core
    ctx.globalAlpha = a;
    const c = Math.max(1, Math.round(R * 0.34));
    ctx.fillRect(X - c, Y - c, c * 2 + 1, c * 2 + 1);
    ctx.globalAlpha = 1;
  },
  // an expanding shockwave as radial dashes rather than a stroked circle
  burst(ctx, cx, cy, r, col, n = 16, seed = 0, squash = 0.7, len = 0.28) {
    const X = Math.round(cx), Y = Math.round(cy), R = Math.max(1, r);
    ctx.fillStyle = col;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU + ihash(i, seed) * 0.22;
      const dx = Math.cos(a), dy = Math.sin(a) * squash;
      const L = Math.max(2, R * len * (0.6 + ihash(i, seed + 7) * 0.8));
      const w = Math.max(1, Math.round(R * 0.035));
      for (let s = 0; s < L; s += 1.4) {
        ctx.fillRect(Math.round(X + dx * (R + s)), Math.round(Y + dy * (R + s)), w, w);
      }
    }
  },
  // blocky puff, for smoke and dust
  puff(ctx, cx, cy, r, col, seed = 0) {
    const R = Math.max(1, Math.round(r));
    ctx.fillStyle = col;
    const n = clamp(Math.round(R * 0.9), 2, 7);
    for (let i = 0; i < n; i++) {
      const a = ihash(i, seed) * TAU, d = ihash(i, seed + 3) * R * 0.7;
      const s = Math.max(1, Math.round(R * (0.4 + ihash(i, seed + 9) * 0.5)));
      ctx.fillRect(Math.round(cx + Math.cos(a) * d - s / 2), Math.round(cy + Math.sin(a) * d * 0.7 - s / 2), s, s);
    }
  },
  // a flat, ragged puddle: blood on the floor, water off a body
  pool(ctx, cx, cy, r, col, seed = 0, squash = 0.26) {
    const R = Math.max(1, Math.round(r)), X = Math.round(cx), Y = Math.round(cy);
    ctx.fillStyle = col;
    const H = Math.max(1, Math.round(R * squash));
    for (let dy = -H; dy <= H; dy++) {
      const t = dy / (H + 0.001);
      let w = Math.round(R * Math.sqrt(Math.max(0, 1 - t * t)));
      w = Math.max(0, w - Math.round(ihash(dy + 40, seed) * R * 0.16));
      if (w <= 0) continue;
      ctx.fillRect(X - w, Y + dy, w * 2, 1);
    }
  },
  // a surface ripple seen edge on: two ticks travelling apart
  ripple(ctx, cx, cy, r, col, alpha = 1) {
    const X = Math.round(cx), Y = Math.round(cy), R = Math.max(1, Math.round(r));
    ctx.globalAlpha = clamp(alpha, 0, 1);
    ctx.fillStyle = col;
    const w = Math.max(1, Math.round(R * 0.34));
    ctx.fillRect(X - R, Y, w, 1); ctx.fillRect(X + R - w, Y, w, 1);
    if (R > 6) { ctx.globalAlpha = clamp(alpha, 0, 1) * 0.5; ctx.fillRect(X - R + w + 2, Y, Math.max(1, w >> 1), 1); ctx.fillRect(X + R - w - 2, Y, Math.max(1, w >> 1), 1); }
    ctx.globalAlpha = 1;
  },
  // a stepped arc, for cooldown sweeps
  arcSteps(ctx, cx, cy, r, frac, col, n = 16, size = 2) {
    ctx.fillStyle = col;
    const lit = Math.round(clamp(frac, 0, 1) * n);
    for (let i = 0; i < lit; i++) {
      const a = -Math.PI / 2 + (i / n) * TAU;
      ctx.fillRect(Math.round(cx + Math.cos(a) * r - size / 2), Math.round(cy + Math.sin(a) * r - size / 2), size, size);
    }
  },
};

/* ===== src/texture.js ===== */
'use strict';
// ---------------------------------------------------------------------------
// Tiling texture patterns. Everything here is authored once at screen-pixel
// scale and then scrolled with the camera, so grain stays crisp and one fill
// covers the whole screen instead of thousands of little rectangles.
// ---------------------------------------------------------------------------
const Tex = {
  cache: new Map(),
  get(key, size, paint) {
    let p = this.cache.get(key);
    if (p) return p;
    const c = mkCanvas(size, size), x = ctxOf(c);
    paint(x, size);
    p = { pat: G.ctx.createPattern(c, 'repeat'), size, canvas: c };
    this.cache.set(key, p);
    return p;
  },
  // fill a already-clipped region with a pattern locked to world coordinates
  fill(ctx, p, camX, camY, zoom, alpha = 1, comp) {
    const W = G.W, H = G.H, s = p.size;
    let ox = -Math.round(camX * zoom) % s, oy = -Math.round(camY * zoom) % s;
    ctx.save();
    if (comp) ctx.globalCompositeOperation = comp;
    ctx.globalAlpha = alpha;
    ctx.translate(ox, oy);
    ctx.fillStyle = p.pat;
    ctx.fillRect(-s - 2, -s - 2, W + s * 2 + 4, H + s * 2 + 4);
    ctx.restore();
  },
  // 4x4 ordered dither: `level` 0..1 decides how many of the 16 cells are solid
  dither(color, level) {
    return this.get('d|' + color + '|' + level.toFixed(2), 4, (x) => {
      const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
      const on = Math.round(level * 16);
      x.fillStyle = color;
      for (let i = 0; i < 16; i++) if (BAYER[i] < on) x.fillRect(i % 4, (i / 4) | 0, 1, 1);
    });
  },
  // soil grain: specks, grit and a scatter of small stones over transparent
  soil(dark, light, stone) {
    return this.get('s|' + dark + '|' + light + '|' + stone, 96, (x, S) => {
      const r = mulberry32(0x50117);
      x.globalAlpha = 0.5;
      x.fillStyle = dark;
      for (let i = 0; i < 260; i++) x.fillRect((r() * S) | 0, (r() * S) | 0, 1, 1);
      x.globalAlpha = 0.34;
      x.fillStyle = light;
      for (let i = 0; i < 150; i++) x.fillRect((r() * S) | 0, (r() * S) | 0, 1, 1);
      // grit streaks lie flat, the way sediment settles
      x.globalAlpha = 0.3;
      for (let i = 0; i < 26; i++) { x.fillStyle = r() < 0.5 ? light : dark; x.fillRect((r() * S) | 0, (r() * S) | 0, 2 + ((r() * 4) | 0), 1); }
      // small stones with a lit top edge
      x.globalAlpha = 0.55;
      for (let i = 0; i < 16; i++) {
        const px = (r() * S) | 0, py = (r() * S) | 0, w = 2 + ((r() * 3) | 0), h = 1 + ((r() * 2) | 0);
        x.fillStyle = stone; x.fillRect(px, py, w, h);
        x.fillStyle = light; x.fillRect(px, py, w - 1, 1);
      }
      x.globalAlpha = 1;
    });
  },
  // Sediment courses. Sparse and broken: a full-coverage stripe pattern reads as
  // corduroy, so most rows are short lenses rather than lines across the tile.
  strata(dark, light) {
    return this.get('st2|' + dark + '|' + light, 96, (x, S) => {
      const r = mulberry32(0x5ed1);
      let y = 0;
      while (y < S) {
        const gap = 5 + ((r() * 9) | 0);
        const dk = r() < 0.55;
        const col = dk ? dark : light;
        // a course is a run of lenses with breaks, not a continuous rule
        let cx2 = -((r() * 30) | 0);
        while (cx2 < S) {
          const len = 5 + ((r() * 26) | 0);
          if (r() < 0.62) {
            x.globalAlpha = 0.06 + r() * 0.1;
            x.fillStyle = col;
            x.fillRect(cx2, y, len, 1);
            if (r() < 0.35) { x.globalAlpha = 0.05 + r() * 0.06; x.fillStyle = dk ? light : dark; x.fillRect(cx2 + 1, y + 1, len - 2, 1); }
          }
          cx2 += len + 3 + ((r() * 14) | 0);
        }
        y += gap;
      }
      x.globalAlpha = 1;
    });
  },
  // Caustics: only the crest lines of a distorted wave field, so they read as
  // thin drifting filaments rather than a repeating stamp. All frequencies are
  // whole numbers so the tile still wraps.
  caustic(color) {
    return this.get('c|' + color, 128, (x, S) => {
      const val = (px, py) => {
        const u = px / S * TAU, v = py / S * TAU;
        return Math.sin(u * 2 + Math.sin(v * 3) * 1.7) + Math.sin(v * 3 - Math.sin(u * 2) * 1.5)
          + 0.7 * Math.sin(u * 5 + v * 3) + 0.5 * Math.sin(v * 5 - u * 3);
      };
      x.fillStyle = color;
      for (let py = 0; py < S; py++) for (let px = 0; px < S; px++) {
        const n = val(px, py);
        if (n < 1.72) continue;
        // keep the ridge, drop the interior, so lines stay thin
        const nb = Math.min(val((px + 1) % S, py), val(px, (py + 1) % S), val((px + S - 1) % S, py), val(px, (py + S - 1) % S));
        if (nb > 1.72 && n < 2.35) continue;
        x.fillRect(px, py, 1, 1);
      }
    });
  },
  // fine suspended silt for the water column
  motes(color) {
    return this.get('m|' + color, 128, (x, S) => {
      const r = mulberry32(0x9e3);
      x.fillStyle = color;
      for (let i = 0; i < 90; i++) { x.globalAlpha = 0.2 + r() * 0.5; x.fillRect((r() * S) | 0, (r() * S) | 0, 1, r() < 0.25 ? 2 : 1); }
      x.globalAlpha = 1;
    });
  },
  // bark / trunk grain, used by the foliage pass
  bark(dark) {
    return this.get('b|' + dark, 32, (x, S) => {
      const r = mulberry32(0x8a71);
      x.globalAlpha = 0.4; x.fillStyle = dark;
      for (let i = 0; i < 34; i++) x.fillRect((r() * S) | 0, (r() * S) | 0, 1, 2 + ((r() * 5) | 0));
      x.globalAlpha = 1;
    });
  },
};

// ---------------------------------------------------------------------------
// Leaf masses. Canopies used to be plain fillRects, which read as green boxes.
// These are painted once at world scale into a cached canvas and then blitted,
// so a tree costs one drawImage no matter how much shading it carries.
// ---------------------------------------------------------------------------
// snap a colour to a coarse ramp: the day cycle shifts tints every frame, and
// caching on the raw value would mint a new canvas per frame
function qcol(hex, step = 24) {
  const [r, g, b] = hexToRgb(hex);
  return rgbToHex(Math.round(r / step) * step, Math.round(g / step) * step, Math.round(b / step) * step);
}
const Leaf = {
  cache: new Map(),
  // filled ellipse as horizontal spans, so the edge stays hard like the rest of the art
  blob(x, cx, cy, rw, rh, col) {
    x.fillStyle = col;
    const h = Math.max(1, Math.round(rh));
    for (let y = -h; y <= h; y++) {
      const t = y / h, w = Math.round(rw * Math.sqrt(Math.max(0, 1 - t * t)));
      if (w <= 0) continue;
      x.fillRect(Math.round(cx - w), Math.round(cy + y), w * 2, 1);
    }
  },
  // w,h in world pixels. base/mid/lit shade from the underside up to the sunlit crown
  mass(w, h, base, mid, lit, seed, opts = {}) {
    const key = 'L|' + w + '|' + h + '|' + base + '|' + mid + '|' + lit + '|' + seed + '|' + (opts.tag || '');
    let c = this.cache.get(key);
    if (c) return c;
    const P = 3, cw = Math.max(4, Math.round(w) + P * 2), ch = Math.max(4, Math.round(h) + P * 2);
    const cv = mkCanvas(cw, ch), x = ctxOf(cv);
    const cx = cw / 2, cy = ch / 2, rw = w / 2, rh = h / 2;
    const r = mulberry32((seed * 2654435761) >>> 0);
    const n = 4 + ((r() * 4) | 0);
    const lobes = [];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU + r() * 0.8;
      lobes.push({ ox: Math.cos(a) * rw * 0.36, oy: Math.sin(a) * rh * 0.34, k: 0.46 + r() * 0.34 });
    }
    lobes.push({ ox: 0, oy: 0, k: 0.82 });
    // underside
    for (const l of lobes) this.blob(x, cx + l.ox, cy + l.oy, rw * l.k, rh * l.k, base);
    // sunlit body, pulled up and to the left
    const dx = -rw * 0.1, dy = -rh * 0.14;
    for (const l of lobes) this.blob(x, cx + l.ox + dx, cy + l.oy + dy, rw * l.k * 0.86, rh * l.k * 0.84, mid);
    // crown highlight
    for (const l of lobes) if (l.oy <= rh * 0.1) this.blob(x, cx + l.ox + dx * 1.9, cy + l.oy + dy * 2.1, rw * l.k * 0.52, rh * l.k * 0.46, lit);
    // leaf speckle: light on top, dark underneath
    for (let i = 0; i < Math.round(w * h * 0.02); i++) {
      const px2 = (r() * cw) | 0, py2 = (r() * ch) | 0;
      const u = (px2 - cx) / rw, v = (py2 - cy) / rh;
      if (u * u + v * v > 0.92) continue;
      x.fillStyle = v < -0.15 ? lit : v > 0.3 ? base : mid;
      x.fillRect(px2, py2, 1, 1);
    }
    // chew the silhouette so it never reads as a smooth pill
    x.globalCompositeOperation = 'destination-out';
    for (let i = 0; i < Math.max(6, Math.round((w + h) * 0.22)); i++) {
      const a = r() * TAU, rad = 0.86 + r() * 0.2;

'use strict';
// ---------------------------------------------------------------------------
// A spinning pixel globe for the release-site display. The surface is baked
// once into an equirectangular texture using 3D value noise (so it wraps with
// no seam), then every frame each pixel of the disc is unprojected back to a
// latitude and longitude and sampled. Shaded with a dithered terminator, a
// specular glint on the water and an atmosphere rim.
// ---------------------------------------------------------------------------
function noise3(x, y, z, seed) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  const h = (a, b, c) => ihash((Math.imul(a, 73856093) ^ Math.imul(b, 19349663) ^ Math.imul(c, 83492791)) | 0, seed);
  const c00 = lerp(h(xi, yi, zi), h(xi + 1, yi, zi), u);
  const c10 = lerp(h(xi, yi + 1, zi), h(xi + 1, yi + 1, zi), u);
  const c01 = lerp(h(xi, yi, zi + 1), h(xi + 1, yi, zi + 1), u);
  const c11 = lerp(h(xi, yi + 1, zi + 1), h(xi + 1, yi + 1, zi + 1), u);
  return lerp(lerp(c00, c10, v), lerp(c01, c11, v), w);
}
function fbm3(x, y, z, seed, oct = 4) {
  let s = 0, a = 0.5, f = 1, n = 0;
  for (let i = 0; i < oct; i++) { s += a * noise3(x * f, y * f, z * f, seed + i * 977); n += a; a *= 0.5; f *= 2.07; }
  return s / n;
}

const Globe = {
  TW: 220, TH: 110,
  height: null, shade: null, ready: false,
  // bake elevation and a per-texel tint index once
  build() {
    if (this.ready) return;
    const W = this.TW, H = this.TH;
    this.height = new Float32Array(W * H);
    for (let j = 0; j < H; j++) {
      const lat = (j / (H - 1) - 0.5) * Math.PI, cl = Math.cos(lat), sl = Math.sin(lat);
      for (let i = 0; i < W; i++) {
        const lon = (i / W) * TAU;
        const x = cl * Math.cos(lon), y = sl, z = cl * Math.sin(lon);
        // two scales of continent plus a ridge term for coastlines
        let h = fbm3(x * 1.9 + 5, y * 1.9, z * 1.9, 11, 5);
        h += 0.24 * fbm3(x * 5.5, y * 5.5, z * 5.5 + 3, 71, 3);
        h = h / 1.24;
        // squeeze the poles down so ice reads as caps rather than land
        h -= Math.pow(Math.abs(y), 3.2) * 0.22;
        this.height[j * W + i] = h;
      }
    }
    this.ready = true;
  },
  sampleH(lon, lat) {
    const W = this.TW, H = this.TH;
    let u = (lon / TAU) % 1; if (u < 0) u += 1;
    const v = clamp((lat / Math.PI + 0.5), 0, 0.999);
    const i = (u * W) | 0, j = (v * (H - 1)) | 0;
    return this.height[j * W + i];
  },
  // colour ramp for an elevation, before lighting
  tint(h, lat) {
    const ice = Math.abs(lat) > 1.16 - (h - 0.5) * 0.2;
    if (ice) return h > 0.5 ? [232, 240, 246] : [186, 208, 220];
    if (h < 0.455) return [12, 30, 58];        // deep ocean
    if (h < 0.492) return [20, 58, 92];        // ocean
    if (h < 0.507) return [30, 96, 122];       // shelf
    if (h < 0.518) return [186, 176, 132];     // sand
    if (h < 0.556) return [58, 106, 58];       // lowland
    if (h < 0.60) return [44, 84, 46];         // forest
    if (h < 0.645) return [96, 100, 62];       // upland
    if (h < 0.69) return [118, 106, 84];       // rock
    return [206, 208, 200];                    // peaks
  },
  // screen position for a lat/lon, plus whether it faces the camera
  project(lon, lat, cx, cy, r, spin, tilt) {
    const cl = Math.cos(lat), sl = Math.sin(lat);
    const l = lon - spin;
    let x = cl * Math.sin(l), y = sl, z = cl * Math.cos(l);
    const ct = Math.cos(tilt), st = Math.sin(tilt);
    const y2 = y * ct - z * st, z2 = y * st + z * ct;
    return [cx + x * r, cy - y2 * r, z2, z2 > 0.06];
  },
  // --- the per-pixel cache -------------------------------------------------
  // Every pixel of the disc used to re-derive its latitude and longitude from
  // scratch, every frame: a sqrt, an asin and an atan2 each, plus a freshly
  // allocated colour array. Sixty-eight thousand of those a frame is what made
  // the sphere crawl. None of it depends on the spin — only on the size of the
  // disc and the tilt — so it is worked out once and looked up after.
  PAL: null,
  buildPal() {
    if (this.PAL) return;

    const P = new Uint8Array(256 * 3);
    for (let i = 0; i < 256; i++) {
      const h = 0.2 + (i / 255) * 0.7;
      let c;
      if (h < 0.455) c = [12, 30, 58];
      else if (h < 0.492) c = [20, 58, 92];
      else if (h < 0.507) c = [30, 96, 122];
      else if (h < 0.518) c = [186, 176, 132];
      else if (h < 0.556) c = [58, 106, 58];
      else if (h < 0.60) c = [44, 84, 46];
      else if (h < 0.645) c = [96, 100, 62];
      else if (h < 0.69) c = [118, 106, 84];
      else c = [206, 208, 200];
      P[i * 3] = c[0]; P[i * 3 + 1] = c[1]; P[i * 3 + 2] = c[2];
    }

  },
  buildLut(d, ox, oy, cx, cy, r, tilt) {

      d, tilt, r,
      kind: new Uint8Array(N),        // 0 empty, 1 halo, 2 sphere
      halo: new Uint8Array(N),
      row: new Int32Array(N),         // precomputed texture row offset
      lonU: new Float32Array(N),      // longitude as a 0..1 texture coordinate
      absLat: new Float32Array(N),

      lam: new Float32Array(N),
      rim: new Float32Array(N),

        const k = j * d + i;
        const sx = (i + ox + 0.5 - cx) / r;

          if (q < 1.24) { L.kind[k] = 1; L.halo[k] = Math.max(0, Math.min(255, (1 - (Math.sqrt(q) - 1) / 0.115) * 0.5 * 255)) | 0; }
          continue;
        }

        L.absLat[k] = Math.abs(lat);
        const v = lat / Math.PI + 0.5;
        L.row[k] = (((v < 0 ? 0 : v > 0.999 ? 0.999 : v) * (TH - 1)) | 0) * TW;
        const lam = nx * lx + ny * ly + nz * lz;
        L.lam[k] = lam;
        const bay = BAY[(j & 3) * 4 + (i & 3)] * 0.0625 - 0.5;
        let li = lam * 1.35 + 0.16 + bay * 0.16;
        li = li < 0 ? 0 : li > 1 ? 1 : li;
        L.li[k] = 0.16 + li * li * 1.05;
        L.rim[k] = q > 0.80 ? (q - 0.80) / 0.2 : 0;
      }
    }
    return L;
  },
  // paint the sphere into ctx at (cx, cy) with radius r
  draw(ctx, cx, cy, r, spin, tilt, t) {
    this.build(); this.buildPal();
    const d = Math.ceil(r * 1.12) * 2 + 2, ox = Math.round(cx - d / 2), oy = Math.round(cy - d / 2);
    // paint into an offscreen buffer and blit it: putImageData replaces pixels
    // rather than compositing, so writing it straight to the screen punched a
    // transparent square through whatever was behind the globe
    if (!this._cv || this._cv.width !== d) { this._cv = mkCanvas(d, d); this._cx = ctxOf(this._cv); this._img = this._cx.createImageData(d, d); this._lut = null; }

    // times across the whole range instead of once a frame
    const qt = Math.round(tilt / 0.04) * 0.04;

    if (!L || L.d !== d || L.r !== r || L.tilt !== qt) L = this.buildLut(d, ox, oy, cx, cy, r, qt);
    const img = this._img, px = img.data, PAL = this.PAL, H = this.height, TW = this.TW;
    let su = spin / TAU; su -= Math.floor(su);

    for (let k = 0; k < N; k++) {
      const kind = L.kind[k], o = k * 4;
      if (kind === 0) { px[o + 3] = 0; continue; }
      if (kind === 1) { px[o] = 90; px[o + 1] = 170; px[o + 2] = 210; px[o + 3] = L.halo[k]; continue; }
      let u = L.lonU[k] + su; if (u >= 1) u -= 1;
      const row = L.row[k], ti = (u * TW) | 0;
      const h = H[row + ti];
      let cr, cg, cb;
      if (L.absLat[k] > 1.16 - (h - 0.5) * 0.2) {           // ice caps
        if (h > 0.5) { cr = 232; cg = 240; cb = 246; } else { cr = 186; cg = 208; cb = 220; }
      } else {
        let pi = ((h - 0.2) * 365.7) | 0; pi = pi < 0 ? 0 : pi > 255 ? 255 : pi;
        pi *= 3;

        if (h > 0.507) {

          const kk = 1 + (e * 9 < -0.34 ? -0.34 : e * 9 > 0.34 ? 0.34 : e * 9);

      const li = L.li[k];
      cr *= li; cg *= li; cb *= li;
      if (h < 0.507 && L.lam[k] > 0.86) { cr += 90; cg += 110; cb += 120; }

      if (rim > 0) { cr += rim * 26; cg += rim * 60; cb += rim * 84; }

      px[o + 1] = cg > 255 ? 255 : cg | 0;
      px[o + 2] = cb > 255 ? 255 : cb | 0;
      px[o + 3] = 255;
    }
    this._cx.putImageData(img, 0, 0);
    ctx.drawImage(this._cv, ox, oy);
  },
};

'use strict';
// Fully synthesized audio: no asset files. Everything is built from oscillators + filtered noise.
const SFX = {
  ctx: null, master: null, sfxBus: null, musicBus: null, noiseBuf: null,
  muted: false, vol: 0.6, amb: null, mus: null, _last: {},
  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const c = this.ctx = new AC();
    this.master = c.createGain(); this.master.gain.value = this.muted ? 0 : this.vol; this.master.connect(c.destination);
    this.comp = c.createDynamicsCompressor(); this.comp.threshold.value = -14; this.comp.ratio.value = 5; this.comp.connect(this.master);
    this.sfxBus = c.createGain(); this.sfxBus.gain.value = 0.9; this.sfxBus.connect(this.comp);
    this.musicBus = c.createGain(); this.musicBus.gain.value = 0.3; this.musicBus.connect(this.comp);
    const len = c.sampleRate * 2, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noiseBuf = buf;
    this.startAmbient();
    this.startMusic();
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  toggleMute() { this.muted = !this.muted; if (this.master) this.master.gain.value = this.muted ? 0 : this.vol; return this.muted; },
  // rate limiter so 40 gibs don't play 40 sounds
  gate(name, ms) { const n = performance.now(); if (this._last[name] && n - this._last[name] < ms) return false; this._last[name] = n; return true; },
  tone(o) {

// pixel parts (round bodies, dark outlines, big eyes) that a pose() function
// arranges from an animation state, so limbs swing, tails wag, wings beat and
// heads bob. Parts are separate so bites can tear them off and deaths can
// scatter them. Art is authored at world resolution (1 sprite px = 1 world px).

  if (sp.gs) return sp.gs;
  if (sp.cat === 'human') return 44;
  if (sp.cat === 'boss') return 96;

  if (s.cat === 'human') Object.assign(s, humanVariant(s, variant));

  switch (s.rig) {
    case 'fish': rig = buildFish(s); break;
    case 'bird': rig = buildBird(s); break;
    case 'quad': rig = buildQuad(s); break;
    case 'biped': rig = buildBiped(s); break;
    case 'turtle': rig = buildTurtle(s); break;
    case 'frog': rig = buildFrog(s); break;
    case 'crab': rig = buildCrab(s); break;
    case 'ray': rig = buildRay(s); break;
    case 'snail': rig = buildSnail(s); break;
    case 'snake': rig = buildSnakeDisplay(s); break;
    default: rig = buildFish(s);

  rig.spec = s; rig.scale = 1;

const CROC_LEN = CROC_SPACING.length;

  constructor(x, y, a) { this.nodes = []; for (let i = 0; i < CROC_LEN; i++) this.nodes.push({ x: x - i * 8 * Math.cos(a), y: y - i * 8 * Math.sin(a), a }); this.phase = 0; }
  reset(x, y, a) { for (let i = 0; i < CROC_LEN; i++) { const n = this.nodes[i]; n.x = x - i * 8 * Math.cos(a); n.y = y - i * 8 * Math.sin(a); n.a = a; } }

  solve(hx, hy, ha, size, dt, swim, ground = false) {
    const n = this.nodes; n[0].x = hx; n[0].y = hy; n[0].a = ha;
    this.phase += dt * (4 + swim * 9);
    for (let i = 1; i < CROC_LEN; i++) {
      const p = n[i - 1], s = n[i], sp = CROC_SPACING[i] * size;

      let d = angleDiff(back, want);

      d = clamp(d, -maxBend, maxBend) * Math.exp(-3.5 * dt);
      const wig = Math.sin(this.phase - i * 0.75) * (0.05 + swim * 0.16) * Math.pow(i / CROC_LEN, 1.4);
      const a = back + d + wig;

      // only the position is lifted: feeding the lifted angle back into `back`
      // for the next link makes one bump curl the whole tail up into a hook
      if (ground) {

}

/* ===== src/particles.js ===== */
'use strict';
// Particle + popup system. Particles live in world space, are drawn in screen space (crisp pixels at any zoom).
const BLOOD_COLORS = ['#8a0b0b', '#b31212', '#d42020', '#5c0606', '#a51a1a'];
class FXSystem {
  constructor() { this.list = []; this.clouds = []; this.texts = []; this.pops = []; this.max = 3400; }   // dust and bone raised the standing population
  clear() { this.list.length = 0; this.clouds.length = 0; this.texts.length = 0; this.pops.length = 0; }
  add(p) { if (this.list.length >= this.max) this.list.splice(0, 300); p.t = 0; p.maxLife = p.life; this.list.push(p); return p; }
  // ---------- emitters ----------
  blood(x, y, n, dx = 0, dy = 0, power = 60, colors = BLOOD_COLORS) {
    n = Math.round(n * (G.settings.gore ? 1 : 0.3));
    for (let i = 0; i < n; i++) {
      const a = rand(TAU), sp = rand(0.2, 1) * power;
      this.add({ type: 'blood', x: x + rand(-2, 2), y: y + rand(-2, 2), vx: dx * power * rand(0.3, 1.2) + Math.cos(a) * sp, vy: dy * power * rand(0.3, 1.2) + Math.sin(a) * sp, s: chance(0.3) ? 2 : 1, color: choice(colors), life: rand(1.4, 3.2), settled: false });
    }
  }
  cloud(x, y, r, color = '#6a0a0a', life = 2.6) {
    if (this.clouds.length > 120) this.clouds.shift();
    this.clouds.push({ x, y, r: r * 0.4, r1: r, life, maxLife: life, color, vx: rand(-4, 4), vy: rand(-3, 3), a0: 0.55 });
  }
  gore(x, y, power, dx = 0, dy = 0, big = false) {
    // combined splatter: particles + cloud + chunks (non-edible gristle)
    this.blood(x, y, big ? 70 : 28, dx, dy, power);
    this.cloud(x, y, big ? 40 : 18);
    for (let i = 0; i < (big ? 8 : 3); i++) {
      const a = rand(TAU), sp = rand(0.4, 1) * power * 0.8;
      this.add({ type: 'gristle', x, y, vx: Math.cos(a) * sp + dx * power * 0.5, vy: Math.sin(a) * sp + dy * power * 0.5, s: randi(2, 3), color: choice(['#7a1010', '#c04040', '#e8b0a0', '#efe6d6']), life: rand(4, 8), rot: rand(TAU), settled: false });
    }
  }
  bubbles(x, y, n, spread = 6, vel = 0) {
    for (let i = 0; i < n; i++) this.add({ type: 'bubble', x: x + rand(-spread, spread), y: y + rand(-spread, spread), vx: rand(-8, 8), vy: rand(-30, -5) + vel, s: chance(0.3) ? 2 : 1, seed: rand(TAU), life: rand(1.5, 3.5) });
  }
  splash(x, power = 1, vx = 0) {
    Water.splash(x, clamp(power, 0.2, 4) * 60, 10 + power * 8);
    const surf = World.surface(x);
    const n = Math.round(clamp(power * 14, 5, 60));
    for (let i = 0; i < n; i++) this.add({ type: 'drop', x: x + rand(-8, 8) * power, y: surf - 1, vx: vx * 0.3 + rand(-50, 50) * Math.sqrt(power), vy: -rand(60, 240) * Math.sqrt(power), s: chance(0.4) ? 2 : 1, color: choice(['#cfe9e6', '#9fd0cb', '#ffffff', '#7fb8b2']), life: 2 });
    this.ripple(x, 6 * power, power);
    for (let i = 0; i < Math.round(power * 6); i++) this.add({ type: 'foam', x: x + rand(-14, 14) * power, y: surf, vx: rand(-20, 20), vy: 0, s: 1, life: rand(0.6, 1.6) });
  }
  ripple(x, r = 6, power = 1) { Water.splash(x, power * 12, 6); this.add({ type: 'ripple', x, y: World.surface(x), r, gr: 40 * power, life: 0.9 + power * 0.3, alpha: 0.7 }); }
  // silt kicked up off the bottom
  silt(x, y, n = 6, power = 30) { for (let i = 0; i < n; i++) this.add({ type: 'silt', x: x + rand(-4, 4), y: y - 2, vx: rand(-1, 1) * power, vy: -rand(0.2, 1) * power, s: rand(2, 5), color: choice(['#5a4a34', '#6b5a44', '#4a3c2a']), seed: randi(0, 900), life: rand(1.5, 3.2) }); }
  leaf(x, y, color = '#4f7a2a') { this.add({ type: 'leaf', x, y, vx: rand(-20, 20), vy: rand(-10, 10), s: 2, color, seed: rand(TAU), life: rand(3, 6) }); }
  // a footprint or drag mark pressed into the shore mud
  print(x, y, w, dir) { this.add({ type: 'print', x, y, w, dir, life: 40 }); }
  feathers(x, y, n, color = '#f0f0e8') { for (let i = 0; i < n; i++) this.add({ type: 'feather', x, y, vx: rand(-60, 60), vy: rand(-90, 10), s: 1, color: chance(0.7) ? color : '#b8b8b0', seed: rand(TAU), life: rand(2.5, 5) }); }
  sparks(x, y, n, dx = 0, dy = 0) { for (let i = 0; i < n; i++) { const a = rand(TAU), sp = rand(40, 180); this.add({ type: 'spark', x, y, vx: Math.cos(a) * sp + dx * 80, vy: Math.sin(a) * sp + dy * 80, s: 1, color: choice(['#fff8c0', '#ffd060', '#ff9030']), life: rand(0.15, 0.4) }); } }
  bones(x, y, n, power = 90) {
    for (let i = 0; i < n; i++) {
      const a = rand(TAU), sp = rand(0.35, 1) * power;
      this.add({ type: 'bone', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40, s: randi(1, 2), w: randi(3, 7),
        kind: chance(0.24) ? 'rib' : chance(0.3) ? 'chunk' : 'shard',
        color: choice(['#e8e2cc', '#d4ccb2', '#f2eee0', '#c0b89c']), rot: rand(TAU), vr: rand(-9, 9), life: rand(5, 10), settled: false });
    }
  }
  splinters(x, y, n, power = 100) { for (let i = 0; i < n; i++) { const a = rand(TAU), sp = rand(0.3, 1) * power; this.add({ type: 'splinter', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60, s: randi(1, 3), w: randi(2, 6), color: choice(['#6b4a2e', '#8a6a44', '#4a3524', '#a0a0a0']), rot: rand(TAU), vr: rand(-6, 6), life: rand(5, 9) }); } }
  smoke(x, y, n = 1, color = '#888') { for (let i = 0; i < n; i++) this.add({ type: 'smoke', x: x + rand(-3, 3), y: y + rand(-3, 3), vx: rand(-10, 10), vy: rand(-30, -10), s: rand(2, 4), color, seed: randi(0, 900), life: rand(0.6, 1.4) }); }
  husk(img, sx, sy, sw, sh, x, y, angle, size, flipY, vel) { this.add({ type: 'husk', img, sx, sy, sw, sh, x, y, angle, size, flipY, vx: vel ? vel.vx : rand(-15, 15), vy: vel ? vel.vy : rand(-25, 5), vr: vel ? vel.vr : rand(-1.2, 1.2), life: vel && vel.life ? vel.life : rand(2.2, 3.4) }); }
  glow(x, y, r, color, life = 0.5) { this.add({ type: 'glow', x, y, r, color, life }); }
  shock(x, y, r, color = '#ffffff', life = 0.5) { this.add({ type: 'shock', x, y, r0: 4, r, color, seed: randi(0, 900), life }); }
  flesh(x, y, n, power = 90) { // meat flecks used for boss/large gore
    for (let i = 0; i < n; i++) { const a = rand(TAU), sp = rand(0.3, 1) * power; this.add({ type: 'gristle', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, s: randi(1, 3), color: choice(['#9a1a1a', '#c04040', '#e8a090', '#f0e8d8']), life: rand(3, 7), rot: rand(TAU), settled: false }); }
  }
  text() { /* floating word text stays retired: feedback is visual */ }
  // A number, in the HUD's own digits, thrown off whatever you just ate. This
  // is the one piece of type allowed back into the world: a score reads as a
  // number or it does not read at all.
  pop(x, y, value, color = '#ffe060', scale = 1, label = null) {
    if (this.pops.length > 26) this.pops.shift();
    this.pops.push({ x, y, str: label || ((value > 0 ? '+' : '') + fmt(Math.round(value))), color, scale, vy: -34 - scale * 6, vx: rand(-14, 14), life: 1.1 + scale * 0.2, maxLife: 1.1 + scale * 0.2, t: 0 });
  }
  updatePops(dt) {
    for (let i = this.pops.length - 1; i >= 0; i--) {
      const p = this.pops[i];
      p.life -= dt; p.t += dt;
      if (p.life <= 0) { this.pops.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy += 34 * dt; p.vx *= 0.94;
    }
  }
  drawPops(ctx, cam) {
    for (const p of this.pops) {
      const [sx, sy] = cam.toScreen(p.x, p.y);
      if (sx < -40 || sx > G.W + 40 || sy < -20 || sy > G.H + 20) continue;
      const k = p.life / p.maxLife;
      // a short pop-in, then a fade
      const grow = p.t < 0.09 ? 0.55 + (p.t / 0.09) * 0.45 : 1;
      const sc = Math.max(1, Math.round(p.scale * grow));
      ctx.globalAlpha = k < 0.35 ? k / 0.35 : 1;
      Font.draw(ctx, p.str, Math.round(sx), Math.round(sy), { color: p.color, align: 'center', scale: sc, outline: '#0a0a06' });
      ctx.globalAlpha = 1;
    }
  }
  _textUnused(x, y, str, opts = {}) {
    if (G.state === 'title' || G.state === 'shed' || G.state === 'codex' || G.state === 'help') return;
    if (this.texts.length > 40) this.texts.shift();
    this.texts.push({ x, y, str, color: opts.color || '#ffffff', scale: opts.scale || 1, life: opts.life || 1.1, maxLife: opts.life || 1.1, vy: opts.vy ?? -30, vx: opts.vx || 0, outline: opts.outline || '#000000', shake: opts.shake || 0, t: 0 });
  }
  // ---------- simulation ----------
  update(dt) {
    this.updatePops(dt);
    const L = this.list;
    for (let i = L.length - 1; i >= 0; i--) {
      const p = L[i]; p.life -= dt; p.t += dt;
      if (p.life <= 0) { L[i] = L[L.length - 1]; L.pop(); continue; }
      const surf = World.surface(p.x), under = p.y > surf;
      switch (p.type) {
        case 'blood': case 'gristle': case 'bone': {
          if (p.settled) break;
          if (under) {
            const k = Math.exp(-3.2 * dt); p.vx *= k; p.vy *= k; p.vy += (p.type === 'blood' ? 14 : 46) * dt;
            if (p.wasAir) { p.wasAir = false; p.vx *= 0.35; p.vy *= 0.3; if (chance(0.25)) this.ripple(p.x, 2, 0.3); }
          } else { p.vy += 720 * dt; p.wasAir = true; }
          p.x += p.vx * dt; p.y += p.vy * dt;
          if (p.type === 'bone') p.rot += (p.vr || 0) * dt;
          const fy = World.floorY(p.x);
          if (p.y >= fy - 1) { p.y = fy - 1; p.settled = true; p.vr = 0; p.life = Math.min(p.life + 5, 12); }
          break;
        }
        case 'bubble': {
          p.vy = approach(p.vy, -70, 90 * dt); p.x += (p.vx + Math.sin(p.t * 7 + p.seed) * 14) * dt; p.y += p.vy * dt;
          if (p.y <= surf) { p.life = 0; if (chance(0.15)) this.ripple(p.x, 2, 0.25); }
          break;
        }
        case 'drop': {
          p.vy += 620 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
          if (p.vy > 0 && p.y >= surf) { p.life = 0; if (chance(0.2)) this.ripple(p.x, 2, 0.3); }
          break;
        }
        case 'foam': { p.x += p.vx * dt; p.y = World.surface(p.x); p.vx *= 0.96; break; }
        case 'wetmark': break;
        case 'mote': {
          // wanders; slower and heavier once it is in the water
          const wet = p.y > surf;
          p.x += (p.vx * (wet ? 0.35 : 1) + Math.sin(p.t * 1.6 + p.seed) * (wet ? 3 : 7)) * dt;
          p.y += (p.vy * (wet ? 0.4 : 1) + Math.cos(p.t * 1.1 + p.seed) * 4) * dt;
          if (!wet) p.vy += 3 * dt;
          break;
        }
        case 'slick': { p.r = lerp(p.r, p.r1, 1 - Math.exp(-0.7 * dt)); p.x += p.vx * dt; p.y = World.surface(p.x); p.vx *= 0.98; break; }
        case 'pool': { p.r = lerp(p.r, p.r1, 1 - Math.exp(-1.2 * dt)); p.y = World.floorY(p.x); break; }
        case 'ripple': { p.r += p.gr * dt; break; }
        case 'feather': {
          if (under) { p.vy = approach(p.vy, 9, 40 * dt); p.vx *= 0.97; p.x += (p.vx + Math.sin(p.t * 2 + p.seed) * 6) * dt; }
          else { p.vy = approach(p.vy, 28, 120 * dt); p.vx *= 0.99; p.x += (p.vx + Math.sin(p.t * 4 + p.seed) * 22) * dt; }
          p.y += p.vy * dt; break;
        }
        case 'spark': { p.vy += 250 * dt; p.x += p.vx * dt; p.y += p.vy * dt; break; }
        case 'splinter': {
          if (under) { p.vy = approach(p.vy, p.y > surf + 3 ? -35 : 0, 160 * dt); p.vx *= 0.97; p.vr *= 0.9; if (p.y < surf + 3) p.y = surf + Math.sin(p.t * 3) * 1.2; }
          else { p.vy += 560 * dt; }
          p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; break;
        }
        case 'smoke': { p.x += p.vx * dt; p.y += p.vy * dt; p.s += 3 * dt; break; }
        case 'silt': { p.vx *= 0.96; p.vy = approach(p.vy, 6, 20 * dt); p.x += p.vx * dt; p.y += p.vy * dt; p.s += 4 * dt; const fy = World.floorY(p.x); if (p.y > fy - 1) p.y = fy - 1; break; }
        case 'leaf': { if (under) { p.vy = approach(p.vy, 5, 30 * dt); p.vx *= 0.96; } else { p.vy = approach(p.vy, 22, 60 * dt); p.x += Math.sin(p.t * 3 + p.seed) * 18 * dt; } p.x += p.vx * dt; p.y += p.vy * dt; const fy2 = World.floorY(p.x); if (p.y > fy2 - 1) { p.y = fy2 - 1; p.vx = 0; p.vy = 0; } break; }
        case 'rain': {
          p.x += p.vx * dt; p.y += p.vy * dt;
          if (p.y >= surf) { p.life = 0; Water.splash(p.x, 9, 5); if (chance(0.35)) this.add({ type: 'drop', x: p.x, y: surf - 1, vx: rand(-30, 30), vy: -rand(40, 110), s: 1, color: '#d8f0ee', life: 0.6 }); }
          else { const fy3 = World.floorY(p.x); if (fy3 < 0 && p.y >= fy3) { p.life = 0; if (chance(0.3)) this.add({ type: 'drop', x: p.x, y: fy3 - 1, vx: rand(-20, 20), vy: -rand(20, 60), s: 1, color: '#c8d8d0', life: 0.35 }); } }
          break;
        }
        case 'print': break;
        case 'suck': { const [sx, sy] = G.player.snout; const k = Math.min(1, 16 * dt); p.x = lerp(p.x, sx, k); p.y = lerp(p.y, sy, k); break; }
        case 'husk': { p.vy += (under ? 10 : 300) * dt; if (under) { p.vx *= 0.98; p.vy *= 0.97; } p.x += p.vx * dt; p.y += p.vy * dt; p.angle += p.vr * dt; break; }
        default: break;
      }
    }
    const C = this.clouds;
    for (let i = C.length - 1; i >= 0; i--) {
      const c = C[i]; c.life -= dt;
      if (c.life <= 0) { C.splice(i, 1); continue; }
      c.r = lerp(c.r, c.r1, 1 - Math.exp(-2 * dt));
      // blood underwater rides the current and slowly sinks
      const drift = Water.velocity(c.x) * 0.02 + Math.sin(World.t * 0.5 + c.x * 0.01) * 2.2 + Water.wind * 6;
      c.x += (c.vx + drift) * dt; c.y += (c.vy + 3) * dt;
      c.vx *= Math.exp(-0.6 * dt); c.vy *= Math.exp(-0.6 * dt);
    }
    const T = this.texts;
    for (let i = T.length - 1; i >= 0; i--) { const t = T[i]; t.life -= dt; t.t += dt; if (t.life <= 0) { T.splice(i, 1); continue; } t.y += t.vy * dt; t.x += t.vx * dt; t.vy *= 0.95; }
  }
  // ---------- rendering ----------
  drawClouds(ctx, cam) {
    for (const c of this.clouds) {
      const [sx, sy] = cam.toScreen(c.x, c.y); const r = c.r * cam.zoom;
      if (sx < -r || sx > G.W + r || sy < -r || sy > G.H + r) continue;
      ctx.globalAlpha = c.a0 * (c.life / c.maxLife);
      Shape.blob(ctx, sx, sy, r, c.color, 0.75);
      ctx.globalAlpha = c.a0 * 0.6 * (c.life / c.maxLife); Shape.blob(ctx, sx + r * 0.3, sy - r * 0.2, r * 0.6, c.color, 0.8);
    }
    ctx.globalAlpha = 1;
  }
  draw(ctx, cam) {
    const z = cam.zoom, W = G.W, H = G.H;
    for (const p of this.list) {
      const [sx, sy] = cam.toScreen(p.x, p.y);
      if (sx < -40 || sx > W + 40 || sy < -40 || sy > H + 40) continue;
      const lf = p.life / p.maxLife;
      switch (p.type) {
        case 'blood': { const s = Math.max(1, Math.round(p.s * z)); ctx.globalAlpha = lf < 0.35 ? lf / 0.35 : 1; ctx.fillStyle = p.color; ctx.fillRect(Math.round(sx), Math.round(sy), s, s); break; }
        case 'gristle': { const s = Math.max(1, Math.round(p.s * z)); ctx.globalAlpha = lf < 0.3 ? lf / 0.3 : 1; ctx.fillStyle = p.color; ctx.fillRect(Math.round(sx), Math.round(sy), s, s); if (s > 1) { ctx.fillStyle = '#5a0808'; ctx.fillRect(Math.round(sx), Math.round(sy) + s - 1, Math.max(1, s >> 1), 1); } break; }
        case 'bubble': { const s = Math.max(1, Math.round(p.s * z)); ctx.globalAlpha = 0.7; ctx.fillStyle = '#cfeae8'; ctx.fillRect(Math.round(sx), Math.round(sy), s, s); if (s > 1) { ctx.fillStyle = '#ffffff'; ctx.fillRect(Math.round(sx), Math.round(sy), 1, 1); } break; }
        case 'drop': case 'foam': { const s = Math.max(1, Math.round(p.s * z)); ctx.globalAlpha = p.type === 'foam' ? lf : 0.9; ctx.fillStyle = p.color || '#e8f4f2'; ctx.fillRect(Math.round(sx), Math.round(sy), s, s); break; }
        case 'slick': { const r = p.r * z; ctx.globalAlpha = clamp(lf, 0, 1) * 0.6; Shape.pool(ctx, sx, sy, r, '#6a0c0c', p.seed || 3, 0.22); ctx.globalAlpha = clamp(lf, 0, 1) * 0.45; Shape.pool(ctx, sx - r * 0.2, sy, r * 0.55, '#a01a1a', (p.seed || 3) + 5, 0.2); break; }
        case 'pool': { const r = p.r * z; ctx.globalAlpha = clamp(lf, 0, 1) * 0.78; Shape.pool(ctx, sx, sy, r, '#5a0a0a', p.seed || 7, 0.3); ctx.globalAlpha = clamp(lf, 0, 1) * 0.5; Shape.pool(ctx, sx - r * 0.15, sy - r * 0.06, r * 0.6, '#8a1414', (p.seed || 7) + 11, 0.24); break; }
        case 'ripple': { Shape.ripple(ctx, sx, sy, p.r * z, '#d8f0ee', p.alpha * lf); break; }
        case 'feather': { const s = Math.max(1, Math.round(2 * z)); ctx.globalAlpha = lf < 0.3 ? lf / 0.3 : 1; ctx.fillStyle = p.color; ctx.fillRect(Math.round(sx), Math.round(sy), s, Math.max(1, s >> 1)); break; }
        case 'mote': {
          const k = lf < 0.3 ? lf / 0.3 : lf > 0.85 ? (1 - lf) / 0.15 : 1;
          ctx.globalAlpha = 0.42 * k; ctx.fillStyle = p.color;
          ctx.fillRect(Math.round(sx), Math.round(sy), Math.max(1, Math.round(z * 0.8)), Math.max(1, Math.round(z * 0.8)));
          break;
        }
        case 'spark': { ctx.globalAlpha = lf; ctx.fillStyle = p.color; const s = Math.max(1, Math.round(z)); ctx.fillRect(Math.round(sx), Math.round(sy), s, s); break; }
        case 'splinter': { ctx.globalAlpha = lf < 0.3 ? lf / 0.3 : 1; ctx.fillStyle = p.color; ctx.save(); ctx.translate(sx, sy); ctx.rotate(p.rot); ctx.fillRect(0, 0, Math.max(1, p.w * z), Math.max(1, p.s * z)); ctx.restore(); break; }
        case 'bone': {
          ctx.globalAlpha = lf < 0.25 ? lf / 0.25 : 1;
          ctx.save(); ctx.translate(Math.round(sx), Math.round(sy)); ctx.rotate(p.rot);

// ---------------------------------------------------------------------------
// Roof profile. Only the enclosed stretches have one: the sewer network the
// whole way, and the ocean caves cut into the trench wall. Between control
// points the roof is interpolated exactly like the floor, so a tunnel can
// pinch to a crawl, open into a chamber, or rise into a shaft.
// ---------------------------------------------------------------------------
const ROOF_PROFILE = SEWER_SECTION.map(p => [p[0], p[2]]);
const OCEAN_CAVES = [
  // [x0, x1, roof] — overhangs and cave mouths in the trench wall
  [26050, 26600, 420], [27400, 27900, 760], [29100, 29700, 900],
  [30600, 31400, 1180], [32200, 32900, 1360],
];
const MapData = {
  x0: MAP_PROFILE[0][0], x1: MAP_PROFILE[MAP_PROFILE.length - 1][0],
  // smooth interpolation between control points, plus fine noise for texture
  floorY(x) {
    const P = MAP_PROFILE;
    if (x <= P[0][0]) return P[0][1];
    if (x >= P[P.length - 1][0]) { const last = P[P.length - 1][1]; return last + Math.sin(x * 0.004) * 40 + vnoise(x * 0.01, 5) * 30; }
    let lo = 0, hi = P.length - 1;
    while (lo < hi - 1) { const m = (lo + hi) >> 1; if (P[m][0] <= x) lo = m; else hi = m; }
    const a = P[lo], b = P[lo + 1], t = (x - a[0]) / (b[0] - a[0]);
    const base = lerp(a[1], b[1], t * t * (3 - 2 * t));
    const wob = vnoise(x * 0.045, 11) * 6 - 3 + vnoise(x * 0.012, 3) * 10 - 5;
    return base + wob * (Math.abs(base) > 8 ? 1 : 0.35);
  },
  // interpolated roof, or null where the sky is open
  roofY(x) {
    const R = ROOF_PROFILE;
    // west of the first control point is the bulkhead the system dead-ends on
    if (x < R[0][0] && x > R[0][0] - 3000) return R[0][1];
    if (x >= R[0][0] && x <= R[R.length - 1][0]) {
      let lo = 0, hi = R.length - 1;
      while (lo < hi - 1) { const m = (lo + hi) >> 1; if (R[m][0] <= x) lo = m; else hi = m; }
      const a = R[lo], b = R[lo + 1], t = (x - a[0]) / (b[0] - a[0]);
      const base = lerp(a[1], b[1], t * t * (3 - 2 * t));
      return base + vnoise(x * 0.05, 31) * 8 - 4 + Math.sin(x * 0.021) * 3;
    }
    // ocean caves: an overhang that closes over the water for a stretch
    for (const [cx0, cx1, r] of OCEAN_CAVES) {
      if (x < cx0 || x > cx1) continue;
      const u = (x - cx0) / (cx1 - cx0);
      // the mouth flares open at both ends so it never reads as a hard wall
      const flare = Math.min(1, Math.min(u, 1 - u) * 5);
      if (flare <= 0.02) return null;
      return r * flare + vnoise(x * 0.04, 41) * 14 - 7;
    }
    return null;
  },
};

// Sandbox physics: a simulated water surface, deformable shore mud with tracks,
// silt plumes, reactive vegetation and weather. Everything here is a small

const Water = {
  DX: 4, N: 720, x0: 0, h: null, v: null, t: 0, wind: 0,
  init(cx) { this.h = new Float32Array(this.N); this.v = new Float32Array(this.N); this.x0 = cx - this.N * this.DX / 2; },
  recenter(cx) {

    for (let i = 0; i < this.N; i++) { const j = i + shift; if (j >= 0 && j < this.N) { h[i] = this.h[j]; v[i] = this.v[j]; } }

  ambient(x) {

    // so the field never reads as a single sliding sheet. The mid wave is phase
    // modulated by the long roller, which is what stops the pattern repeating
    // visibly across a screen.

    // Adding a term in s^2 lifts the peaks and fills the hollows; the constant

    const a = 4.4 + w * 5.2;

const Mud = {
  DX: 6, N: 400, x0: 0, d: null,
  init(cx) { this.d = new Float32Array(this.N); this.x0 = cx - this.N * this.DX / 2; },
  recenter(cx) {
    const mid = this.x0 + this.N * this.DX / 2, shift = Math.round((cx - mid) / this.DX);
    if (Math.abs(shift) < this.N / 6) return;
    const d = new Float32Array(this.N);
    for (let i = 0; i < this.N; i++) { const j = i + shift; if (j >= 0 && j < this.N) d[i] = this.d[j]; }

  rain: 0, target: 0, timer: 40, thunder: 0, flash: 0, wind: 0,
  update(dt) {

  // The deep is not an empty black rectangle. Below the light there is marine

    for (let i = 1; i < n - 1; i++) {
      if (!wet[i]) continue;
      const wx = wxs[i], vv = Math.abs(Water.velocity(wx));
      const sl = Math.abs((T.sus[i + 1] - T.sus[i - 1]) / (2 * (step / Math.max(0.05, z))));
      const f = clamp((vv - 26) / 70, 0, 1) + clamp((sl - 0.42) / 0.9, 0, 1);
      if (f <= 0.14) continue;
      const sy = ys[i], w = Math.max(1, Math.round((1 + f * 2) * px));
      ctx.globalAlpha = clamp(f, 0, 1) * 0.9; ctx.fillStyle = '#f4fffb';
      ctx.fillRect(xs[i], sy - w, step, w);
      if (f > 0.8) { ctx.globalAlpha = clamp(f - 0.6, 0, 1) * 0.85; ctx.fillRect(xs[i] - step, sy - w - px, step * 3, px); }
      ctx.globalAlpha = 1;
    }

    // --- scum and pollen riding the film
    ctx.globalAlpha = 0.2; ctx.fillStyle = B.scum || '#6a7a4a';
    for (let i = 0; i < n; i += 2) { if (!wet[i]) continue; const wx = wxs[i]; if (ihash(Math.floor(wx / 7), 44) > 0.74) ctx.fillRect(xs[i], ys[i] + px, step, px); }
    ctx.globalAlpha = 1;

    // --- pollen drifting in the air over the water
    if (light > 0.15) {
      ctx.globalAlpha = 0.28 * light; ctx.fillStyle = '#f4ecc0';
      for (let i = 0; i < 22; i++) {
        const wx = cam.x + ((ihash(i, 80) * 800 - 400) + this.t * (4 + ihash(i, 81) * 6)) % 800;
        const wy = -6 - ihash(i, 82) * 40 + Math.sin(this.t * 1.2 + i) * 4;
        const [px2, py2] = cam.toScreen(wx, wy);
        if (px2 < 0 || px2 > W || py2 < 0 || py2 > H) continue;
        ctx.fillRect(Math.round(px2), Math.round(py2), 1, 1);
      }
      ctx.globalAlpha = 1;
    }

    // --- sun glitter, only on the backs of waves that face the light
    if (light > 0.2) {
      ctx.fillStyle = '#ffffff';
      for (let i = 1; i < n - 1; i += 2) {
        if (!wet[i]) continue;
        const slope = (T.sus[i + 1] - T.sus[i - 1]) / (2 * (step / Math.max(0.05, z)));
        if (slope < 0.08) continue;
        const wx = wxs[i];
        if (ihash(Math.floor(wx / 5), 21) > 0.22) continue;
        if (Math.sin(this.t * 5 + wx * 0.19) < 0.3) continue;
        ctx.globalAlpha = 0.85 * light;
        ctx.fillRect(xs[i], ys[i] - px * 2, px, px);
      }
      ctx.globalAlpha = 1;
    }
  },
  drawMist(ctx, cam, day) {
    const W = G.W, H = G.H, hy = cam.toScreen(0, 0)[1];
    // mist gathers at dawn and after sundown
    const m = Math.max(smoothstep(0.02, 0.10, day) * (1 - smoothstep(0.14, 0.24, day)), smoothstep(0.46, 0.56, day) * (1 - smoothstep(0.62, 0.76, day)));
    if (m < 0.02 || hy < -40 || hy > H + 40) return;
    for (let k = 0; k < 3; k++) {
      const band = hy - 6 - k * 9 * cam.zoom, drift = (cam.x * (0.35 + k * 0.2) + this.t * (6 + k * 4));
      ctx.globalAlpha = m * (0.30 - k * 0.06);
      ctx.fillStyle = k === 0 ? '#e8f4f0' : '#cfe2de';
      for (let sx = -40; sx < W + 40; sx += 8) {
        const n = fbm((sx + drift) * 0.012, 90 + k * 13, 2);
        const h = (6 + n * 20) * cam.zoom;
        ctx.fillRect(sx, Math.round(band - h), 8, Math.round(h));
      }
    }
    ctx.globalAlpha = 1;
  },
  drawNight(ctx, cam, day) {
    const night = 1 - this.light(day);
    if (night > 0.02) { ctx.fillStyle = `rgba(4,8,26,${(night * 0.55).toFixed(3)})`; ctx.fillRect(0, 0, G.W, G.H); }
  },
};

'use strict';
// ---------------------------------------------------------------------------
// ANIMAL TRAITS: evolution cards themed on real Everglades animals. Each one
// changes stats AND the crocodile's look. Some are locked behind lifetime
// milestones ("crack and eat 100 snapping turtles") that persist between runs.
// ---------------------------------------------------------------------------
const Meta = {
  data: null,
  DEFAULT: () => ({ eat: {}, ev: {}, unlocked: [], seen: {}, ver: 1 }),
  load() {
    try { this.data = Object.assign(this.DEFAULT(), JSON.parse(localStorage.getItem('chompers.meta') || '{}')); }
    catch (e) { this.data = this.DEFAULT(); }
    if (!this.data.eat) this.data.eat = {}; if (!this.data.ev) this.data.ev = {};
    if (!Array.isArray(this.data.unlocked)) this.data.unlocked = []; if (!this.data.seen) this.data.seen = {};
  },
  save() { try { localStorage.setItem('chompers.meta', JSON.stringify(this.data)); } catch (e) { } },
  eaten(name, n = 1) { this.data.eat[name] = (this.data.eat[name] || 0) + n; this.data.seen[name] = true; },
  event(key, n = 1) { this.data.ev[key] = (this.data.ev[key] || 0) + n; },
  countEat(name) { return this.data.eat[name] || 0; },
  countEv(key) { return this.data.ev[key] || 0; },
  isUnlocked(id) { return this.data.unlocked.indexOf(id) >= 0; },
  unlock(id) { if (!this.isUnlocked(id)) { this.data.unlocked.push(id); this.save(); return true; } return false; },
  // progress on a trait's requirement: [current, needed]
  progress(t) {
    if (!t.unlock) return [1, 1];
    const u = t.unlock;
    let cur = 0;
    if (u.eat) cur = u.eat.reduce((s, n) => s + this.countEat(n), 0);
    else if (u.ev) cur = this.countEv(u.ev);
    return [Math.min(cur, u.need), u.need];
  },
  // called after every kill; returns list of newly unlocked traits
  checkUnlocks() {
    const out = [];
    for (const t of ANIMAL_TRAITS) {
      if (!t.unlock || this.isUnlocked(t.id)) continue;
      const [cur, need] = this.progress(t);
      if (cur >= need && this.unlock(t.id)) out.push(t);
    }
    return out;
  },
};

  // hex ring walk: start at dir 4 scaled by N, then N steps along each direction
  const ring = N => { const out = []; let q = HEX_DIR[4][0] * N, r = HEX_DIR[4][1] * N; for (let i = 0; i < 6; i++) for (let j = 0; j < N; j++) { out.push([q, r, i, j]); q += HEX_DIR[i][0]; r += HEX_DIR[i][1]; } return out; };

      const rr = i + 1;

// ---------------------------------------------------------------------------
// Trials. The tree is not just a shop: the genes at the ends of it have to be
// earned by playing a particular way. A trial is counted live, per run, and
// resets with the run — the gene is a reward for what you did this time out,
// not a permanent unlock you can bank and forget.
// ---------------------------------------------------------------------------
const TRIALS = {
  leaper:   { name: 'LEAP 20 TIMES', key: 'jumps', need: 20 },
  fowler:   { name: 'EAT 20 BIRDS', key: 'birds', need: 20 },
  butcher:  { name: 'TEAR 12 LIMBS OFF', key: 'limbs', need: 12 },
  hunter:   { name: 'KILL 8 PREDATORS', key: 'threats', need: 8 },
  ghost:    { name: 'AMBUSH 15 TIMES', key: 'ambush', need: 15 },
  duelist:  { name: 'PARRY 12 BLOWS', key: 'parries', need: 12 },
  wrecker:  { name: 'WRECK 5 BOATS OR BUILDS', key: 'wrecks', need: 5 },
  glutton:  { name: 'EAT 60 THINGS', key: 'eaten', need: 60 },
  strider:  { name: 'WALK 900M ON LAND', key: 'land', need: 900 },
  nocturne: { name: 'HUNT 60S AFTER DARK', key: 'night', need: 60 },
  roller:   { name: 'LAND 25 ROLL BEATS', key: 'rollHits', need: 25 },
  diver:    { name: 'DIVE BELOW 400M DEEP', key: 'deep', need: 400 },
};
// which gene each trial gates. Apexes and chimeras are the prize; two of the
// deeper spine genes are gated too so the mid game has something to chase.
const GENE_TRIAL = {
  'ripper:apex': 'butcher', 'bulwark:fortress': 'duelist', 'phantom:wraith': 'ghost',
  'abyssal:leviathan': 'diver', 'colossus:titan': 'glutton', 'savage:manhunter': 'wrecker',
  'ch:siegejaw': 'hunter', 'ch:mirror': 'duelist', 'ch:ghostvenom': 'ghost',
  'ch:deepgorge': 'glutton', 'ch:stampede': 'strider', 'ch:bloodhunt': 'roller',
  'savage:claws': 'leaper', 'phantom:silent': 'fowler', 'abyssal:lure': 'nocturne',
};
const Trials = {
  reset(P) { P.trial = { jumps: 0, birds: 0, limbs: 0, threats: 0, ambush: 0, parries: 0, wrecks: 0, eaten: 0, land: 0, night: 0, rollHits: 0, deep: 0 }; },
  bump(P, key, n = 1) { if (!P.trial) this.reset(P); P.trial[key] = (P.trial[key] || 0) + n; },
  best(P, key, v) { if (!P.trial) this.reset(P); if (v > (P.trial[key] || 0)) P.trial[key] = v; },
  of(g) { return g && GENE_TRIAL[g.id] ? TRIALS[GENE_TRIAL[g.id]] : null; },
  progress(P, g) {
    const t = this.of(g); if (!t) return null;
    const have = (P.trial && P.trial[t.key]) || 0;
    return { t, have: Math.min(have, t.need), need: t.need, done: have >= t.need };
  },
  met(P, g) { const p = this.progress(P, g); return !p || p.done; },
};

const GENE_BY_ID = {};
for (const g of GENES) GENE_BY_ID[g.id] = g;
// hex neighbours, for the "must be adjacent to something you own" rule
function hexNbrs(g) { return GENES.filter(o => HEX_DIR.some(d => o.q === g.q + d[0] && o.r === g.r + d[1])); }
const Genome = {
  // pixel position of a hex cell
  pos(g, cx, cy, R) { return [cx + R * 1.5 * g.q, cy + R * 1.732 * (g.r + g.q / 2)]; },
  owned(P) { return P.genes; },
  // adjacency and points are fine, only the trial is missing
  trialBlocked(P, g) {
    if (g.root || this.has(P, g.id) || (g.apex && P.apex)) return false;
    if (Trials.met(P, g)) return false;
    return hexNbrs(g).some(n => this.has(P, n.id));
  },
  has(P, id) { return P.genes.indexOf(id) >= 0; },
  // Two lineages are native to a crocodile. The rest is surgery, and surgery is
  // a research programme — a gene on an unfunded line will not take at all.
  researchBlocked(g) {
    if (typeof Research === 'undefined' || g.root) return false;
    if ((g.hybrid || g.chimera) && !Research.hybridsOpen()) return true;
    if (g.lin && !Research.lineageOpen(g.lin)) return true;
    if (g.lin2 && !Research.lineageOpen(g.lin2)) return true;
    return false;
  },
  // a gene can be taken when it touches one you already have
  unlocked(P, g) {
    if (g.root) return false;
    if (this.has(P, g.id)) return false;
    if (this.has(P, 'core') === false) return false;
    // one apex per crocodile: the four ends of the tree are exclusive
    if (g.apex && P.apex) return false;
    if (this.researchBlocked(g)) return false;

    if (!Trials.met(P, g)) return false;

  // how many separate lineages the build has already opened
  spread(P) { const set = {}; for (const id of P.genes) { const g = GENE_BY_ID[id]; if (g && g.lin) set[g.lin] = 1; if (g && g.lin2) set[g.lin2] = 1; } return Object.keys(set).length; },
  // Cost has three parts: the gene's own price, an affinity discount for
  // playing to that lineage, and a splice tax for every OTHER lineage already
  // in you. Scattering across the tree is the expensive way to build.
  tax(P, g) {
    const open = this.spread(P);
    const mine = (g.lin && this.depth(P, g.lin) > 0) ? 1 : 0;
    return 1 + 0.2 * Math.max(0, open - mine);
  },
  cost(P, g) {
    const a = g.lin ? (P.affinity[LINEAGES[g.lin].affinity] || 0) : 0;
    const disc = clamp(a / 60, 0, 0.5);
    return Math.max(1, Math.round(g.cost * (1 - disc) * this.tax(P, g)));
  },
  affinityPct(P, lin) { return clamp((P.affinity[LINEAGES[lin].affinity] || 0) / 60, 0, 1); },
  buy(P, g) {
    if (!this.unlocked(P, g)) return false;
    const c = this.cost(P, g);
    if (P.genePoints < c) return false;
    P.genePoints -= c; P.genes.push(g.id); P.geneSpent += c;
    g.apply(P);
    if (g.downApply) g.downApply(P);
    if (g.apex) { P.apex = g.lin; Meta.event('apex'); }
    P.recomputeStats(); P.rebuildLook();
    return true;
  },
  // total instability from everything spliced in
  load(P) { let n = 0; for (const id of P.genes) { const g = GENE_BY_ID[id]; if (g && g.load) n += g.load; } return n; },
  // what the body can carry: it grows with you, so late genes need late mass
  limit(P) { return 9 + P.tier * 2.2 + (P.strainBonus || 0); },
  // 0 while stable, rising past 1 once the genome is over its limit
  strain(P) { const l = this.limit(P); return l <= 0 ? 0 : Math.max(0, (this.load(P) - l) / Math.max(4, l * 0.5)); },
  // how far down each lineage the player has gone
  depth(P, lin) { let d = 0; for (const id of P.genes) { const g = GENE_BY_ID[id]; if (g && g.lin === lin && !g.hybrid && !g.minor) d = Math.max(d, g.ring); } return d; },
  // Gene points from a meal. Deliberately scarce: a run should fund maybe two
  // lineages, not the whole tree. Minnows feed you, they do not evolve you —
  // only prey that is a real share of your own mass, a threat, a person or a
  // boss counts, and eating a species for the first time pays a discovery bonus.
  pointsFor(e, P) {
    const mine = Math.max(1, P ? P.mass : 1), rel = e.mass / mine;
    let p = 0;
    if (e.isBoss) p = 10;
    else if (e.threat) p = rel >= 0.16 ? 3 : 1;
    else if (e.human) p = 2;
    else if (rel >= 0.22) p = rel >= 0.6 ? 2 : 1;
    // first of a kind this run pays a discovery bonus, but only for prey worth
    // studying: a new species of minnow teaches you nothing
    if (P && e.spec && e.spec.id && e.mass >= 10) {
      P.seen = P.seen || new Set();
      if (!P.seen.has(e.spec.id)) { P.seen.add(e.spec.id); p += 1; }
    }
    return p;
  },
};
// playstyle affinity: what you do decides which lineages come cheap
const Affinity = {
  add(P, key, n) { P.affinity[key] = (P.affinity[key] || 0) + n; },
  // called from combat and movement
  onKill(P, e, how) {
    if (how === 'roll' || (e.dismembered || 0) > 0) this.add(P, 'gore', 2);
    if (how === 'ambush') this.add(P, 'stealth', 3);
    if (e.human || e.type === 'boat' || e.type === 'structure') this.add(P, 'land', 2.5);
    if (e.type === 'land' || e.type === 'bird') this.add(P, 'land', 1.5);
    if (e.mass >= 60) this.add(P, 'glut', 2);
    if (P.st.venom && e.poison > 0) this.add(P, 'venom', 2);
    if (e.armor > 0 || e.type === 'turtle') this.add(P, 'tank', 2);
  },
  onHurtTaken(P, dmg) { this.add(P, 'tank', clamp(dmg * 0.05, 0, 1.5)); },
  onEat(P, e) { this.add(P, 'glut', clamp(e.mass * 0.02, 0.1, 2)); },
};

const Research = {
  done() { const r = G.save && G.save.research; return Array.isArray(r) ? r : (G.save ? (G.save.research = []) : []); },
  has(id) { return this.done().indexOf(id) >= 0; },
  data() { return (G.save && G.save.data) || 0; },
  addData(n) { if (!G.save) return 0; const g = Math.max(0, Math.round(n)); G.save.data = (G.save.data || 0) + g; return g; },
  // every node whose prerequisites are all bought
  open(n) { return !n.need || n.need.every(id => this.has(id)); },
  canBuy(n) { return !this.has(n.id) && this.open(n) && this.data() >= n.cost; },
  buy(n) {

    this.done().push(n.id);
    G.storeSave();
    return true;
  },
  // everything a given grant key has handed out so far
  granted(key) {
    const out = new Set();
    for (const id of this.done()) {
      const n = RES_NODE[id]; if (!n || !n.grant) continue;
      const v = n.grant[key];
      if (Array.isArray(v)) for (const k of v) out.add(k);
      else if (v !== undefined) out.add(v);
    }
    return out;
  },
  // Two gene lineages are native to the animal. The other four are surgery.
  lineageOpen(lin) { return lin === 'ripper' || lin === 'bulwark' || this.granted('lineage').has(lin); },
  hybridsOpen() { return this.has('g.hybrid'); },
  zoneOpen(id) { return id === 'glades' || this.granted('zone').has(id); },
  siteOpen(id) { return this.granted('site').has(id); },
  // the standing treatments, stamped onto every new animal
  applyTo(P) { for (const id of this.done()) { const n = RES_NODE[id]; if (n && n.perk) n.perk(P); } },
  progress(cat) {
    let got = 0; for (const n of cat.nodes) if (this.has(n.id)) got++;
    return { got, total: cat.nodes.length, frac: got / cat.nodes.length };
  },
  totalProgress() {
    let got = 0, tot = 0;
    for (const c of RESEARCH) for (const n of c.nodes) { tot++; if (this.has(n.id)) got++; }
    return { got, tot, frac: tot ? got / tot : 0 };
  },
  // What a finished run was worth. Deliberately readable: the numbers on the
  // death card add up to the number in the corner.
  payout(stats, score, tier, relics) {
    return {
      score: Math.floor((score || 0) / 2200),
      tier: Math.max(0, (tier || 0) - 1),
      relics: (relics || 0) * 5,
      get total() { return this.score + this.tier + this.relics; },
    };
  },
};

// ---------- A TRAPLINE ----------
// Somebody is running crab traps along this bank, and will be back for them.
function spawnTrapline(x, n = 4) {
  let placed = 0;
  for (let i = 0; i < n; i++) {
    const tx = World.findX(x + i * rand(60, 110), xx => World.floorY(xx) > 40, 240, 16);

// Called when the site has seen enough of you. They do not want you dead —
// there is a tank back at the facility with your name stencilled on it — so
// they carry a net gun and a spotlight and they are very patient.
class CaptureBoat extends Boat {
  constructor(x) {
    super(x, 'warboat', 1);
    this.kind = 'capture'; this.capture = true; this.isBoss = false; this.persistent = true;
    this.name = 'CAPTURE CREW'; this.threat = 1;
    this.hp = 260; this.maxHp = 260; this.speed = 62;
    this.netCd = 3.2; this.lampA = 0; this.searchT = 0; this.lastPing = 0;
    for (const p of this.pass) p.type = 'scientist';
  }
  update(dt) {
    const P = G.player;
    super.update(dt);
    if (this.sinking || this.dead || !P || P.dead) return;
    // the lamp sweeps until it finds you, then it holds
    const conceal = Alarm.concealment(P);
    const seen = conceal < 0.55 && Math.abs(P.x - this.x) < 340;
    const want = Math.atan2((P.y - 6) - (this.y - 14), P.x - this.x);
    this.lampA = seen ? lerp(this.lampA, want, 0.14) : this.lampA + dt * 0.9 * (Math.sin(this.t * 0.5) > 0 ? 1 : -1);
    if (seen) {
      this.searchT = 0;
      // being under their lamp is being seen, continuously
      Alarm.notice(dt * 0.05, this, 'UNDER THE LAMP');
      // close the distance, but keep off so you cannot simply eat them
      const want2 = P.x + sign(this.x - P.x) * 120;
      this.x = approach(this.x, want2, this.speed * dt);
      this.facing = sign(P.x - this.x) || this.facing;
      this.netCd -= dt;
      if (this.netCd <= 0 && Math.abs(P.x - this.x) < 260) {
        this.netCd = rand(2.6, 4.2);
        const hx = this.x + this.facing * this.r * 0.5, hy = this.y - 12;
        const tx = P.x + P.vx * 0.45, ty = P.y + P.vy * 0.35;
        const a = Math.atan2(ty - hy, tx - hx);
        G.add(new Projectile(hx, hy, Math.cos(a) * 340, Math.sin(a) * 340 - 40, 'net', this));
        SFX.gunshot && SFX.gunshot(this.pan);
        G.fx.smoke(hx, hy, 2, '#b0b8a8');
      }
    } else {
      this.searchT += dt;
      // quartering the last place anybody saw anything
      const target = Alarm.lastSeenX + Math.sin(this.t * 0.6) * 180;
      this.x = approach(this.x, target, this.speed * 0.7 * dt);
      if (this.searchT > 26 && Alarm.level < 0.5) { this.sinking = false; this.remove = true; Alarm.crew = null; }
    }
  }
  draw(ctx) {
    super.draw(ctx);
    if (this.sinking || this.dead) return;
    // the searchlight: a cone of dust you very much do not want to be in
    const lx = this.x + this.facing * this.r * 0.4, ly = this.y - 14;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.17;
    ctx.translate(lx, ly); ctx.rotate(this.lampA);
    const g = ctx.createLinearGradient(0, 0, 300, 0);
    g.addColorStop(0, 'rgba(230,244,210,0.9)'); g.addColorStop(1, 'rgba(230,244,210,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(0, -3); ctx.lineTo(300, -54); ctx.lineTo(300, 54); ctx.lineTo(0, 3); ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#f4ffd0'; ctx.fillRect(Math.round(lx) - 2, Math.round(ly) - 2, 4, 4);
  }
}
