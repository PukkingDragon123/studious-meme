'use strict';
// ---------- math & helpers ----------
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const rand = (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
const randi = (a, b) => Math.floor(rand(a, b + 1));
const choice = arr => arr[(Math.random() * arr.length) | 0];
const chance = p => Math.random() < p;
const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
const sqr = v => v * v;
const sign = v => (v < 0 ? -1 : 1);
const angleDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; else if (d < -Math.PI) d += TAU; return d; };
const angleLerp = (a, b, t) => a + angleDiff(a, b) * t;
const approach = (v, target, step) => (v < target ? Math.min(v + step, target) : Math.max(v - step, target));
const easeOut = t => 1 - (1 - t) * (1 - t);
const easeIn = t => t * t;
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const fmt = n => Math.floor(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');

// ---------- deterministic randomness ----------
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function ihash(i, seed = 0) {
  let x = (i | 0) ^ (seed | 0);
  x = Math.imul(x ^ (x >>> 16), 0x45d9f3b);
  x = Math.imul(x ^ (x >>> 16), 0x45d9f3b);
  x ^= x >>> 16;
  return (x >>> 0) / 4294967296;
}
function vnoise(x, seed = 0) {
  const i = Math.floor(x), f = x - i;
  const u = f * f * (3 - 2 * f);
  return lerp(ihash(i, seed), ihash(i + 1, seed), u);
}
function fbm(x, seed = 0, oct = 3) {
  let v = 0, a = 0.5, f = 1, n = 0;
  for (let k = 0; k < oct; k++) { v += a * vnoise(x * f, seed + k * 131); n += a; a *= 0.5; f *= 2.13; }
  return v / n;
}

// ---------- colors ----------
function hexToRgb(h) {
  h = h.replace('#', '');
  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  const n = parseInt(h, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
const rgbToHex = (r, g, b) => '#' + ((1 << 24) | (clamp(r | 0, 0, 255) << 16) | (clamp(g | 0, 0, 255) << 8) | clamp(b | 0, 0, 255)).toString(16).slice(1);
function rgba(h, a) { const [r, g, b] = hexToRgb(h); return `rgba(${r},${g},${b},${a})`; }
function mixColor(h1, h2, t) {
  const a = hexToRgb(h1), b = hexToRgb(h2);
  return rgbToHex(lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t));
}
function shade(h, k) { const [r, g, b] = hexToRgb(h); return rgbToHex(r * k, g * k, b * k); }

// ---------- canvas helpers ----------
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function ctxOf(c) { const x = c.getContext('2d'); x.imageSmoothingEnabled = false; return x; }

  d('"', ['.#.#.', '.#.#.', '.....', '.....', '.....', '.....', '.....']);
  d('#', ['.#.#.', '#####', '.#.#.', '.#.#.', '#####', '.#.#.', '.....']);

  // small icons

  d('↓', ['..#..', '..#..', '..#..', '..#..', '#.#.#', '.###.', '..#..']); // down

  const cache = new Map();
  function glyph(ch, color) {
    const key = color + ch;
    let c = cache.get(key);
    if (c) return c;
    const rows = G[ch];

    c = mkCanvas(5, 7);
    const x = c.getContext('2d');
    x.fillStyle = color;
    for (let j = 0; j < 7; j++) for (let i = 0; i < 5; i++) if (rows[j][i] === '#') x.fillRect(i, j, 1, 1);
    cache.set(key, c);
    return c;
  }
  function width(str, scale = 1) { return Math.max(0, String(str).length * 6 * scale - scale); }
  function draw(ctx, str, x, y, opts = {}) {
    const color = opts.color || '#ffffff', scale = opts.scale || 1, align = opts.align || 'left';
    str = String(str).toUpperCase();
    const w = width(str, scale);
    if (align === 'center') x -= w / 2; else if (align === 'right') x -= w;
    x = Math.round(x); y = Math.round(y);
    if (opts.shadow) {
      const sc = opts.shadow === true ? '#000000' : opts.shadow;
      const off = opts.shadowOff || scale;
      for (let i = 0; i < str.length; i++) { const g = glyph(str[i], sc); if (g) ctx.drawImage(g, x + i * 6 * scale + off, y + off, 5 * scale, 7 * scale); }
    }
    if (opts.outline) {
      const oc = opts.outline;
      for (let i = 0; i < str.length; i++) {
        const g = glyph(str[i], oc); if (!g) continue;
        const gx = x + i * 6 * scale;
        ctx.drawImage(g, gx - scale, y, 5 * scale, 7 * scale); ctx.drawImage(g, gx + scale, y, 5 * scale, 7 * scale);
        ctx.drawImage(g, gx, y - scale, 5 * scale, 7 * scale); ctx.drawImage(g, gx, y + scale, 5 * scale, 7 * scale);
      }
    }
    for (let i = 0; i < str.length; i++) { const g = glyph(str[i], color); if (g) ctx.drawImage(g, x + i * 6 * scale, y, 5 * scale, 7 * scale); }
    return w;
  }
  // word-wrapped paragraph; returns lines drawn
  function drawWrapped(ctx, str, x, y, maxW, opts = {}) {
    const scale = opts.scale || 1, lh = (opts.lineHeight || 9) * scale;
    const words = String(str).split(' ');
    const lines = []; let cur = '';
    for (const w of words) { const test = cur ? cur + ' ' + w : w; if (width(test, scale) > maxW && cur) { lines.push(cur); cur = w; } else cur = test; }
    if (cur) lines.push(cur);
    lines.forEach((l, i) => draw(ctx, l, x, y + i * lh, opts));

  return { draw, width, drawWrapped, glyph, H: 7 };
})();

/* ===== src/audio.js ===== */
'use strict';
// Fully synthesized audio: no asset files. Everything is built from oscillators + filtered noise.
const SFX = {
  ctx: null, master: null, sfxBus: null, musicBus: null, noiseBuf: null,
  muted: false, vol: 0.6, amb: null, mus: null, _last: {},
  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const c = this.ctx = new AC();
    this.master = c.createGain(); this.master.gain.value = this.muted ? 0 : this.vol; this.master.connect(c.destination);
    this.comp = c.createDynamicsCompressor(); this.comp.threshold.value = -14; this.comp.ratio.value = 5; this.comp.connect(this.master);
    this.sfxBus = c.createGain(); this.sfxBus.gain.value = 0.9; this.sfxBus.connect(this.comp);
    this.musicBus = c.createGain(); this.musicBus.gain.value = 0.3; this.musicBus.connect(this.comp);
    const len = c.sampleRate * 2, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noiseBuf = buf;
    this.startAmbient();
    this.startMusic();
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  toggleMute() { this.muted = !this.muted; if (this.master) this.master.gain.value = this.muted ? 0 : this.vol; return this.muted; },
  // rate limiter so 40 gibs don't play 40 sounds
  gate(name, ms) { const n = performance.now(); if (this._last[name] && n - this._last[name] < ms) return false; this._last[name] = n; return true; },
  tone(o) {
    if (!this.ctx) return null;
    const c = this.ctx, t0 = c.currentTime + (o.delay || 0), t = o.t || 0.2, a = o.a ?? 0.005;
    const osc = c.createOscillator(); osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(Math.max(1, o.f || 440), t0);
    if (o.f2 != null) { if (o.lin) osc.frequency.linearRampToValueAtTime(Math.max(1, o.f2), t0 + t); else osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.f2), t0 + t); }
    if (o.detune) osc.detune.value = o.detune;
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(o.v ?? 0.3, t0 + a);
    if (o.hold) g.gain.setValueAtTime(o.v ?? 0.3, t0 + a + o.hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + t);
    let head = osc;
    if (o.filter) { const fl = c.createBiquadFilter(); fl.type = o.filter.type || 'lowpass'; fl.frequency.setValueAtTime(o.filter.f, t0); if (o.filter.f2) fl.frequency.exponentialRampToValueAtTime(Math.max(10, o.filter.f2), t0 + t); fl.Q.value = o.filter.q || 1; head.connect(fl); head = fl; }
    head.connect(g);
    this._out(g, o.pan, o.dest);
    osc.start(t0); osc.stop(t0 + t + 0.05);
    return osc;
  },
  noise(o) {
    if (!this.ctx) return null;
    const c = this.ctx, t0 = c.currentTime + (o.delay || 0), t = o.t || 0.2, a = o.a ?? 0.003;
    const src = c.createBufferSource(); src.buffer = this.noiseBuf; src.loop = true; src.playbackRate.value = o.rate || 1;
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(o.v ?? 0.3, t0 + a);
    if (o.hold) g.gain.setValueAtTime(o.v ?? 0.3, t0 + a + o.hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + t);
    let head = src;
    if (o.filter) { const fl = c.createBiquadFilter(); fl.type = o.filter.type || 'lowpass'; fl.frequency.setValueAtTime(o.filter.f, t0); if (o.filter.f2) fl.frequency.exponentialRampToValueAtTime(Math.max(10, o.filter.f2), t0 + t); fl.Q.value = o.filter.q || 1; head.connect(fl); head = fl; }
    head.connect(g);
    this._out(g, o.pan, o.dest);
    src.start(t0); src.stop(t0 + t + 0.05);
    return src;
  },
  _out(node, pan, dest) {
    dest = dest || this.sfxBus;
    if (pan && this.ctx.createStereoPanner) { const p = this.ctx.createStereoPanner(); p.pan.value = clamp(pan, -1, 1); node.connect(p); p.connect(dest); } else node.connect(dest);
  },
  // ---------- one-shots ----------
  chomp(size = 1, pan = 0) {
    if (!this.gate('chomp', 40)) return;
    const k = Math.pow(size, 0.3);
    this.noise({ t: 0.1, v: 0.5, filter: { f: 900 / k, f2: 200 / k }, pan });
    this.tone({ type: 'square', f: 130 / k, f2: 45 / k, t: 0.13, v: 0.3, pan });
    this.tone({ type: 'sine', f: 2200, f2: 500, t: 0.03, v: 0.18, pan });
  },
  crunch(size = 1, pan = 0) {
    if (!this.gate('crunch', 50)) return;
    const k = Math.pow(size, 0.3);
    [[0, 1900], [0.035, 1200], [0.08, 750], [0.12, 500]].forEach(([dl, f]) => this.noise({ delay: dl, t: 0.06, v: 0.45, filter: { type: 'bandpass', f: f / k, q: 2.5 }, pan }));
    this.noise({ t: 0.18, v: 0.55, filter: { f: 350 / k, f2: 90 }, pan });
    this.tone({ type: 'sawtooth', f: 75 / k, f2: 28, t: 0.22, v: 0.3, filter: { f: 400, f2: 80 }, pan });
  },
  gulp(size = 1, pan = 0) {
    if (!this.gate('gulp', 45)) return;
    const k = Math.pow(size, 0.25);
    this.tone({ type: 'sine', f: 340 / k, f2: 100 / k, t: 0.2, v: 0.3, pan });
    this.noise({ delay: 0.04, t: 0.1, v: 0.14, filter: { f: 700, f2: 200 }, pan });
  },
  gib(pan = 0) {
    if (!this.gate('gib', 60)) return;
    this.noise({ t: 0.14, v: 0.4, filter: { f: 900, f2: 180 }, pan });
    this.tone({ type: 'sine', f: 220, f2: 50, t: 0.12, v: 0.2, pan });
  },
  splash(p = 1, pan = 0) {
    if (!this.gate('splash', 70)) return;
    p = clamp(p, 0.2, 2.5);
    this.noise({ t: 0.08, v: 0.25 * p, filter: { type: 'highpass', f: 1800 }, pan });
    this.noise({ t: 0.35 * p, v: 0.4 * p, a: 0.015, filter: { f: 2600, f2: 250 }, pan });
  },
  hurt(pan = 0) {
    if (!this.gate('hurt', 80)) return;
    this.tone({ type: 'sawtooth', f: 200, f2: 45, t: 0.32, v: 0.35, filter: { f: 1400, f2: 180 }, pan });
    this.noise({ t: 0.16, v: 0.3, filter: { type: 'bandpass', f: 420, q: 1.5 }, pan });
  },
  roar(size = 1, pan = 0) {
    const k = Math.pow(size, 0.35);
    this.tone({ type: 'sawtooth', f: 150 / k, f2: 85 / k, t: 0.75, v: 0.42, a: 0.03, filter: { f: 1100, f2: 250, q: 3 }, pan });
    this.tone({ type: 'sawtooth', f: 152 / k, f2: 84 / k, t: 0.75, v: 0.3, a: 0.03, detune: 9, filter: { f: 800, f2: 200, q: 2 }, pan });
    this.noise({ t: 0.7, v: 0.32, a: 0.03, filter: { f: 750, f2: 180 }, pan });
    this.tone({ type: 'sine', f: 58 / k, f2: 40 / k, t: 0.7, v: 0.35, a: 0.02, pan });
  },

const CROC_SPACING = [0, 7, 9, 9, 9, 9, 8, 7, 7, 7, 7, 7]; // distance from previous node
const CROC_LEN = CROC_SPACING.length;
class CrocChain {
  constructor(x, y, a) { this.nodes = []; for (let i = 0; i < CROC_LEN; i++) this.nodes.push({ x: x - i * 8 * Math.cos(a), y: y - i * 8 * Math.sin(a), a }); this.phase = 0; }
  reset(x, y, a) { for (let i = 0; i < CROC_LEN; i++) { const n = this.nodes[i]; n.x = x - i * 8 * Math.cos(a); n.y = y - i * 8 * Math.sin(a); n.a = a; } }
  // solve follow-the-leader with bend limit and swimming undulation
  solve(hx, hy, ha, size, dt, swim, ground = false) {
    const n = this.nodes; n[0].x = hx; n[0].y = hy; n[0].a = ha;
    this.phase += dt * (4 + swim * 9);
    for (let i = 1; i < CROC_LEN; i++) {
      const p = n[i - 1], s = n[i], sp = CROC_SPACING[i] * size;
      let want = Math.atan2(s.y - p.y, s.x - p.x); // direction from prev to this (pointing backwards)
      const back = p.a + Math.PI;
      let d = angleDiff(back, want);
      const maxBend = 0.25;
      d = clamp(d, -maxBend, maxBend) * Math.exp(-3.5 * dt);
      const wig = Math.sin(this.phase - i * 0.75) * (0.05 + swim * 0.16) * Math.pow(i / CROC_LEN, 1.4);
      const a = back + d + wig;
      s.x = p.x + Math.cos(a) * sp; s.y = p.y + Math.sin(a) * sp;
      // walking, the belly rides the ground instead of sinking through the bank.
      // only the position is lifted: feeding the lifted angle back into `back`
      // for the next link makes one bump curl the whole tail up into a hook
      if (ground) {
        const fy = World.floorY(s.x) - 3 * size;
        if (s.y > fy) s.y = fy;
      }
      s.a = a + Math.PI;
    }
  }
}

'use strict';
// Particle + popup system. Particles live in world space, are drawn in screen space (crisp pixels at any zoom).
const BLOOD_COLORS = ['#8a0b0b', '#b31212', '#d42020', '#5c0606', '#a51a1a'];
class FXSystem {
  constructor() { this.list = []; this.clouds = []; this.texts = []; this.max = 2400; }
  clear() { this.list.length = 0; this.clouds.length = 0; this.texts.length = 0; }
  add(p) { if (this.list.length >= this.max) this.list.splice(0, 300); p.t = 0; p.maxLife = p.life; this.list.push(p); return p; }
  // ---------- emitters ----------
  blood(x, y, n, dx = 0, dy = 0, power = 60, colors = BLOOD_COLORS) {
    n = Math.round(n * (G.settings.gore ? 1 : 0.3));
    for (let i = 0; i < n; i++) {
      const a = rand(TAU), sp = rand(0.2, 1) * power;
      this.add({ type: 'blood', x: x + rand(-2, 2), y: y + rand(-2, 2), vx: dx * power * rand(0.3, 1.2) + Math.cos(a) * sp, vy: dy * power * rand(0.3, 1.2) + Math.sin(a) * sp, s: chance(0.3) ? 2 : 1, color: choice(colors), life: rand(1.4, 3.2), settled: false });
    }
  }
  cloud(x, y, r, color = '#6a0a0a', life = 2.6) {
    if (this.clouds.length > 120) this.clouds.shift();
    this.clouds.push({ x, y, r: r * 0.4, r1: r, life, maxLife: life, color, vx: rand(-4, 4), vy: rand(-3, 3), a0: 0.55 });
  }
  gore(x, y, power, dx = 0, dy = 0, big = false) {
    // combined splatter: particles + cloud + chunks (non-edible gristle)
    this.blood(x, y, big ? 70 : 28, dx, dy, power);
    this.cloud(x, y, big ? 40 : 18);
    for (let i = 0; i < (big ? 8 : 3); i++) {
      const a = rand(TAU), sp = rand(0.4, 1) * power * 0.8;
      this.add({ type: 'gristle', x, y, vx: Math.cos(a) * sp + dx * power * 0.5, vy: Math.sin(a) * sp + dy * power * 0.5, s: randi(2, 3), color: choice(['#7a1010', '#c04040', '#e8b0a0', '#efe6d6']), life: rand(4, 8), rot: rand(TAU), settled: false });
    }
  }
  bubbles(x, y, n, spread = 6, vel = 0) {
    for (let i = 0; i < n; i++) this.add({ type: 'bubble', x: x + rand(-spread, spread), y: y + rand(-spread, spread), vx: rand(-8, 8), vy: rand(-30, -5) + vel, s: chance(0.3) ? 2 : 1, seed: rand(TAU), life: rand(1.5, 3.5) });
  }
  splash(x, power = 1, vx = 0) {
    Water.splash(x, clamp(power, 0.2, 4) * 60, 10 + power * 8);
    const surf = World.surface(x);
    const n = Math.round(clamp(power * 14, 5, 60));
    for (let i = 0; i < n; i++) this.add({ type: 'drop', x: x + rand(-8, 8) * power, y: surf - 1, vx: vx * 0.3 + rand(-50, 50) * Math.sqrt(power), vy: -rand(60, 240) * Math.sqrt(power), s: chance(0.4) ? 2 : 1, color: choice(['#cfe9e6', '#9fd0cb', '#ffffff', '#7fb8b2']), life: 2 });
    this.ripple(x, 6 * power, power);
    for (let i = 0; i < Math.round(power * 6); i++) this.add({ type: 'foam', x: x + rand(-14, 14) * power, y: surf, vx: rand(-20, 20), vy: 0, s: 1, life: rand(0.6, 1.6) });
  }
  ripple(x, r = 6, power = 1) { Water.splash(x, power * 12, 6); this.add({ type: 'ripple', x, y: World.surface(x), r, gr: 40 * power, life: 0.9 + power * 0.3, alpha: 0.7 }); }
  // silt kicked up off the bottom
  silt(x, y, n = 6, power = 30) { for (let i = 0; i < n; i++) this.add({ type: 'silt', x: x + rand(-4, 4), y: y - 2, vx: rand(-1, 1) * power, vy: -rand(0.2, 1) * power, s: rand(2, 5), color: choice(['#5a4a34', '#6b5a44', '#4a3c2a']), life: rand(1.5, 3.2) }); }
  leaf(x, y, color = '#4f7a2a') { this.add({ type: 'leaf', x, y, vx: rand(-20, 20), vy: rand(-10, 10), s: 2, color, seed: rand(TAU), life: rand(3, 6) }); }
  // a footprint or drag mark pressed into the shore mud
  print(x, y, w, dir) { this.add({ type: 'print', x, y, w, dir, life: 40 }); }
  feathers(x, y, n, color = '#f0f0e8') { for (let i = 0; i < n; i++) this.add({ type: 'feather', x, y, vx: rand(-60, 60), vy: rand(-90, 10), s: 1, color: chance(0.7) ? color : '#b8b8b0', seed: rand(TAU), life: rand(2.5, 5) }); }
  sparks(x, y, n, dx = 0, dy = 0) { for (let i = 0; i < n; i++) { const a = rand(TAU), sp = rand(40, 180); this.add({ type: 'spark', x, y, vx: Math.cos(a) * sp + dx * 80, vy: Math.sin(a) * sp + dy * 80, s: 1, color: choice(['#fff8c0', '#ffd060', '#ff9030']), life: rand(0.15, 0.4) }); } }
  splinters(x, y, n, power = 100) { for (let i = 0; i < n; i++) { const a = rand(TAU), sp = rand(0.3, 1) * power; this.add({ type: 'splinter', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60, s: randi(1, 3), w: randi(2, 6), color: choice(['#6b4a2e', '#8a6a44', '#4a3524', '#a0a0a0']), rot: rand(TAU), vr: rand(-6, 6), life: rand(5, 9) }); } }
  smoke(x, y, n = 1, color = '#888') { for (let i = 0; i < n; i++) this.add({ type: 'smoke', x: x + rand(-3, 3), y: y + rand(-3, 3), vx: rand(-10, 10), vy: rand(-30, -10), s: rand(2, 4), color, life: rand(0.6, 1.4) }); }
  husk(img, sx, sy, sw, sh, x, y, angle, size, flipY) { this.add({ type: 'husk', img, sx, sy, sw, sh, x, y, angle, size, flipY, vx: rand(-15, 15), vy: rand(-25, 5), vr: rand(-1.2, 1.2), life: rand(2.2, 3.4) }); }
  glow(x, y, r, color, life = 0.5) { this.add({ type: 'glow', x, y, r, color, life }); }

'use strict';

// Sandbox physics: a simulated water surface, deformable shore mud with tracks,
// silt plumes, reactive vegetation and weather. Everything here is a small
// spring system; the visuals fall out of the state.
// ---------------------------------------------------------------------------
const Water = {
  DX: 4, N: 720, x0: 0, h: null, v: null, t: 0, wind: 0,
  init(cx) { this.h = new Float32Array(this.N); this.v = new Float32Array(this.N); this.x0 = cx - this.N * this.DX / 2; },
  recenter(cx) {
    const mid = this.x0 + this.N * this.DX / 2, shift = Math.round((cx - mid) / this.DX);

};

// shore mud: a recovering depression field along x, plus footprints
const Mud = {
  DX: 6, N: 400, x0: 0, d: null,
  init(cx) { this.d = new Float32Array(this.N); this.x0 = cx - this.N * this.DX / 2; },
  recenter(cx) {
    const mid = this.x0 + this.N * this.DX / 2, shift = Math.round((cx - mid) / this.DX);

  reset(seed) { this.seed = seed | 0; this.chunks.clear(); this.decor = []; this.t = 0; },
  // ---------- terrain ----------

  // inside the lab and sewer the world has a ceiling; elsewhere it is open sky
  roofY(x) {

  },

    ctx.globalAlpha = 1;
    // scum and pollen riding the film
    ctx.globalAlpha = 0.2; ctx.fillStyle = B.scum || '#6a7a4a';
    for (let i = 0; i < xs.length; i += 2) { const wx = xs[i][1]; if (ihash(Math.floor(wx / 7), 44) > 0.74) ctx.fillRect(xs[i][0], Math.round(ys[i]) - 1, step, Math.max(1, Math.round(z))); }
    ctx.globalAlpha = 1;
    if (light > 0.15) {
      ctx.globalAlpha = 0.28 * light; ctx.fillStyle = '#f4ecc0';
      for (let i = 0; i < 22; i++) {
        const wx = cam.x + ((ihash(i, 80) * 800 - 400) + this.t * (4 + ihash(i, 81) * 6)) % 800;
        const wy = -6 - ihash(i, 82) * 40 + Math.sin(this.t * 1.2 + i) * 4;
        const [px2, py2] = cam.toScreen(wx, wy);
        if (px2 < 0 || px2 > W || py2 < 0 || py2 > H) continue;
        ctx.fillRect(Math.round(px2), Math.round(py2), 1, 1);
      }
      ctx.globalAlpha = 1;
    }
    // sparkle chips on the crests
    ctx.fillStyle = '#ffffff';
    for (let i = 0; i < xs.length; i += 2) { const wx = xs[i][1]; if (ihash(Math.floor(wx / 4), 21) < 0.07 && Math.sin(this.t * 4 + wx * 0.12) > 0.65) { ctx.globalAlpha = 0.8 * light; ctx.fillRect(xs[i][0], Math.round(ys[i]) - bandH - 1, Math.max(1, Math.round(z)), Math.max(1, Math.round(z))); } }
    ctx.globalAlpha = 1;
  },
  drawMist(ctx, cam, day) {
    const W = G.W, H = G.H, hy = cam.toScreen(0, 0)[1];
    // mist gathers at dawn and after sundown
    const m = Math.max(smoothstep(0.02, 0.10, day) * (1 - smoothstep(0.14, 0.24, day)), smoothstep(0.46, 0.56, day) * (1 - smoothstep(0.62, 0.76, day)));
    if (m < 0.02 || hy < -40 || hy > H + 40) return;
    for (let k = 0; k < 3; k++) {
      const band = hy - 6 - k * 9 * cam.zoom, drift = (cam.x * (0.35 + k * 0.2) + this.t * (6 + k * 4));
      ctx.globalAlpha = m * (0.30 - k * 0.06);
      ctx.fillStyle = k === 0 ? '#e8f4f0' : '#cfe2de';
      for (let sx = -40; sx < W + 40; sx += 8) {
        const n = fbm((sx + drift) * 0.012, 90 + k * 13, 2);
        const h = (6 + n * 20) * cam.zoom;
        ctx.fillRect(sx, Math.round(band - h), 8, Math.round(h));
      }
    }
    ctx.globalAlpha = 1;
  },
  drawNight(ctx, cam, day) {
    const night = 1 - this.light(day);
    if (night > 0.02) { ctx.fillStyle = `rgba(4,8,26,${(night * 0.55).toFixed(3)})`; ctx.fillRect(0, 0, G.W, G.H); }
  },
};

'use strict';
// ---------------------------------------------------------------------------
// ANIMAL TRAITS: evolution cards themed on real Everglades animals. Each one
// changes stats AND the crocodile's look. Some are locked behind lifetime
// milestones ("crack and eat 100 snapping turtles") that persist between runs.
// ---------------------------------------------------------------------------
const Meta = {
  data: null,
  DEFAULT: () => ({ eat: {}, ev: {}, unlocked: [], seen: {}, ver: 1 }),
  load() {
    try { this.data = Object.assign(this.DEFAULT(), JSON.parse(localStorage.getItem('chompers.meta') || '{}')); }
    catch (e) { this.data = this.DEFAULT(); }
    if (!this.data.eat) this.data.eat = {}; if (!this.data.ev) this.data.ev = {};
    if (!Array.isArray(this.data.unlocked)) this.data.unlocked = []; if (!this.data.seen) this.data.seen = {};
  },
  save() { try { localStorage.setItem('chompers.meta', JSON.stringify(this.data)); } catch (e) { } },
  eaten(name, n = 1) { this.data.eat[name] = (this.data.eat[name] || 0) + n; this.data.seen[name] = true; },
  event(key, n = 1) { this.data.ev[key] = (this.data.ev[key] || 0) + n; },
  countEat(name) { return this.data.eat[name] || 0; },
  countEv(key) { return this.data.ev[key] || 0; },
  isUnlocked(id) { return this.data.unlocked.indexOf(id) >= 0; },
  unlock(id) { if (!this.isUnlocked(id)) { this.data.unlocked.push(id); this.save(); return true; } return false; },
  // progress on a trait's requirement: [current, needed]
  progress(t) {
    if (!t.unlock) return [1, 1];
    const u = t.unlock;
    let cur = 0;
    if (u.eat) cur = u.eat.reduce((s, n) => s + this.countEat(n), 0);
    else if (u.ev) cur = this.countEv(u.ev);
    return [Math.min(cur, u.need), u.need];
  },
  // called after every kill; returns list of newly unlocked traits
  checkUnlocks() {
    const out = [];
    for (const t of ANIMAL_TRAITS) {
      if (!t.unlock || this.isUnlocked(t.id)) continue;
      const [cur, need] = this.progress(t);
      if (cur >= need && this.unlock(t.id)) out.push(t);
    }
    return out;
  },
};

      const spd = Math.hypot(this.vx, this.vy);

    if (this.roarCd <= 0 && dP < 400) { this.roarCd = rand(6, 10); SFX.roar(2.5, this.pan); }

// ---------------------------------------------------------------------------
// NPC predation: the swamp eats itself
// ---------------------------------------------------------------------------
const Eco = {
  // find prey for a predator: smaller, alive, nearby, not the player
  findPrey(hunter, range, maxSize, filter) {
    let best = null, bestD = range;
    for (const e of G.ents) {
      if (e === hunter || e.dead || e.remove || !e.edible) continue;
      if (e.type === 'gib' || e.type === 'proj' || e.type === 'boat' || e.type === 'structure') continue;
      if (e.sizeClass > maxSize) continue;
      if (filter && !filter(e)) continue;
      const d = dist(hunter.x, hunter.y, e.x, e.y);
      if (d < bestD) { bestD = d; best = e; }
    }
    return best;
  },
  // one animal eats another: gore, a popup if on screen, and score for nobody
  devour(hunter, prey, opts = {}) {
    if (!prey || prey.dead) return;
    G.fx.gore(prey.x, prey.y, 70, 0, 0, prey.mass > 60);
    if (prey.feathers) G.fx.feathers(prey.x, prey.y, 8, prey.feathers);
    prey.gulped = !!opts.whole;
    prey.dead = true; prey.remove = true;
    if (!opts.whole) prey.explode(0.5);
    SFX.crunch(prey.sizeClass, prey.pan);
    if (Math.abs(prey.x - G.player.x) < 400) G.fx.text(prey.x, prey.y - 12, opts.label || 'EATEN', { color: '#c0a0a0', scale: 1 });
  },
};

class Bottom extends Entity {
  constructor(x, kind) {
    super(x, 0); const d = BOTTOM[kind]; this.useSpecies(kind); this.def = d;
    this.type = 'bottom'; this.y = World.floorY(x) - this.groundOff; this.dir = chance(0.5) ? 1 : -1; this.facing = this.dir; this.layer = -1;
    this.retarget = rand(0.5, 2); this.scuttle = 0; this.bloodColors = ['#7a3010', '#a05020', '#c07040'];
  }
  update(dt) {
    this.tick(dt); const P = G.player;
    this.y = World.floorY(this.x) - this.groundOff;
    this.retarget -= dt;
    const scared = this.senses(60) || (P.st.magnet && this.distTo(P) < P.st.magnet);
    if (scared) { this.dir = sign(this.x - P.x) || 1; this.scuttle = 0.8; }
    if (this.retarget <= 0) { this.retarget = rand(1.5, 4); if (!scared) this.dir = chance(0.5) ? 1 : -1; }
    const sp = this.def.speed * (this.scuttle > 0 ? 2.2 : 1) * (1 - this.slow);

    this.x += this.dir * sp * dt; this.facing = this.dir;

  }

      this.armor = 0; G.fx.splinters(this.x, this.y, 6, 60); SFX.splinter(this.pan);
      if (src === G.player) Meta.event('crack');

  }
}

// ---------------------------------------------------------------------------
// diving birds: anhinga swims after fish, osprey and pelican plunge from the sky
// ---------------------------------------------------------------------------
class DiveBird extends Bird {
  get diving() { return this.phase === 'plunge' || this.phase === 'swimdive' || !!this.carry; }
  constructor(x, y, kind, dir) {
    super(x, y, kind, 'fly', dir);
    this.hunt = null; this.phase = 'cruise'; this.phaseT = rand(0.5, 2.5); this.carry = null; this.carryT = 0; this.swimT = 0;
  }
  update(dt) {
    const d = this.def, P = G.player;
    if (this.mode === 'drown' || this.phase === 'cruise' || this.phase === 'leave') { this.phaseT -= dt; }
    if (this.carry) { // flying off with a meal, swallowed once clear of the water
      if (this.carry.dead || this.carry.remove) { this.carry = null; this.carryT = 0; }
      else {
        this.carryT += dt;
        this.carry.x = this.x; this.carry.y = this.y + 5; this.carry.vx = this.vx; this.carry.vy = this.vy;
        this.carry.stun = 1; this.carry.aware = true;
        if (chance(dt * 8)) G.fx.blood(this.carry.x, this.carry.y, 1, 0, 0, 20, this.carry.bloodColors);
        if (this.carryT > 2.6 && this.y < World.surface(this.x) - 20) { Eco.devour(this, this.carry, { label: 'SNATCHED' }); this.carry = null; this.carryT = 0; }
      }
    }
    // divers patrol the player's stretch of water instead of flying off forever
    if (this.mode === 'fly' && !this.carry && this.phase !== 'plunge' && this.phase !== 'swimdive') {
      const off = this.x - P.x;
      if (Math.abs(off) > 420 && sign(this.vx || this.dir) === sign(off)) { this.dir = -sign(off); this.escaping = 0; }
    }
    if (this.phase === 'cruise' && this.phaseT <= 0 && !this.carry && this.mode === 'fly') {
      const prey = Eco.findPrey(this, 280, 0.7, e => e.type === 'fish' && e.y < (d.diver === 'swim' ? 240 : 130) && e.y > 0);
      if (prey) { this.hunt = prey; this.phase = d.diver === 'swim' ? 'swimdive' : 'plunge'; this.phaseT = 4; SFX.bird(this.pan); }
      else this.phaseT = rand(1, 3);
    }
    if (this.phase === 'plunge') {
      this.phaseT -= dt;
      const h = this.hunt;
      if (!h || h.dead || h.remove || this.phaseT <= 0) { this.phase = 'leave'; this.phaseT = 3; this.hunt = null; }
      else {
        const dx = h.x - this.x, dy = h.y - this.y, dd = Math.hypot(dx, dy) || 1;
        this.vx = dx / dd * 260; this.vy = dy / dd * 300; this.x += this.vx * dt; this.y += this.vy * dt;
        this.facing = sign(this.vx || 1); this.angle = clamp(Math.atan2(this.vy, Math.abs(this.vx)), -1.2, 1.2);
        this.wingT += dt * 4; this.frame = 0;
        if (this.y > World.surface(this.x) && !this.splashed) { this.splashed = true; G.fx.splash(this.x, 1.2, this.vx); SFX.splash(1); }
        if (dd < 12) { this.carry = h; this.carryT = 0; h.stun = 9; h.aware = true; this.phase = 'leave'; this.phaseT = 3; this.vy = -200; G.fx.splash(this.x, 1.4, 0); G.fx.blood(h.x, h.y, 6, 0, 0, 40, h.bloodColors); if (Math.abs(this.x - P.x) < 400) G.fx.text(this.x, this.y - 14, 'SNATCHED!', { color: '#ffd0a0' }); }
      }
      return;
    }
    if (this.phase === 'swimdive') {
      this.phaseT -= dt; this.swimT += dt;
      const h = this.hunt, s = World.surface(this.x);
      if (!h || h.dead || h.remove || this.phaseT <= 0 || this.swimT > 7) { this.phase = 'leave'; this.phaseT = 3; this.hunt = null; this.swimT = 0; if (this.y > s) { this.vy = -120; G.fx.splash(this.x, 0.8, 0); } }
      else {
        const dx = h.x - this.x, dy = h.y - this.y, dd = Math.hypot(dx, dy) || 1;
        const sp = this.y > s ? 150 : 240;
        this.vx = approach(this.vx, dx / dd * sp, 500 * dt); this.vy = approach(this.vy, dy / dd * sp, 500 * dt);
        this.x += this.vx * dt; this.y += this.vy * dt;
        this.facing = sign(this.vx || 1); this.angle = clamp(Math.atan2(this.vy, Math.abs(this.vx)), -1, 1);
        if (!this.splashed && this.y > s) { this.splashed = true; G.fx.splash(this.x, 0.9, this.vx); }
        if (this.y > s && chance(dt * 6)) G.fx.bubbles(this.x, this.y, 1, 3);
        if (dd < 10) { Eco.devour(this, h, { label: 'SPEARED' }); this.hunt = null; this.phase = 'leave'; this.phaseT = 3; this.vy = -100; }
      }
      // the player can eat a diving bird
      if (!P.dead && P.nearestDist(this.x, this.y) < 4 * P.size && P.size > 1.4) this.aware = true;
      return;
    }
    if (this.phase === 'leave') { this.splashed = false; if (this.phaseT <= 0) { this.phase = 'cruise'; this.phaseT = rand(3, 8); } if (this.mode !== 'drown') { this.escaping = Math.max(this.escaping || 0, 0.2); } }
    super.update(dt);
  }
  draw(ctx) {
    const inWater = this.y > World.surface(this.x);
    const mode = this.phase === 'plunge' ? 'dive' : (this.phase === 'swimdive' && inWater) ? 'swim' : this.mode === 'fly' ? 'fly' : this.mode === 'drown' ? 'swim' : 'stand';
    this.anim.mode = mode;
    this.rig.draw(ctx, this.x, this.y, this.facing, mode === 'stand' ? 0 : this.angle, this.anim, { scale: this.size * this.rig.scale, white: this.flash > 0 });
  }
}
// ---------------------------------------------------------------------------
// vulture: circles carrion, lands on it, eats it
// ---------------------------------------------------------------------------
class Vulture extends Bird {
  constructor(x, y, dir) { super(x, y, 'vulture', 'fly', dir); this.target = null; this.circleA = rand(TAU); this.eatT = 0; this.landed = false; }
  update(dt) {
    const P = G.player;
    if (!this.target || this.target.remove || this.target.dead === false) {
      if (chance(dt * 1.5)) {
        let best = null, bestD = 700;
        for (const e of G.ents) { if (e.type !== 'gib' || !e.edible) continue; if (World.floorY(e.x) > 6) continue; const d = dist(this.x, this.y, e.x, e.y); if (d < bestD) { bestD = d; best = e; } }
        this.target = best;
      }
    }
    if (this.target && !this.target.remove) {
      const t = this.target, gy = World.floorY(t.x) - 6;
      if (this.landed) {
        this.y = gy; this.vx = 0; this.vy = 0; this.eatT += dt; this.frame = 0;
        if (chance(dt * 5)) G.fx.blood(t.x, t.y - 2, 1, 0, 0, 20, BLOOD_COLORS);
        if (this.eatT > 2.5) { t.remove = true; this.target = null; this.landed = false; this.eatT = 0; this.vy = -120; this.escaping = 1.5; }
        if (this.senses(80)) { this.landed = false; this.vy = -140; this.escaping = 2; this.target = null; }
        return;
      }
      const dx = t.x - this.x, dy = gy - this.y, dd = Math.hypot(dx, dy) || 1;
      if (dd < 14) { this.landed = true; this.eatT = 0; return; }
      this.vx = approach(this.vx, dx / dd * 110, 200 * dt); this.vy = approach(this.vy, dy / dd * 110, 200 * dt);
      this.x += this.vx * dt; this.y += this.vy * dt; this.facing = sign(this.vx || 1);
      this.wingT += dt * 5; this.frame = Math.sin(this.wingT) > 0 ? 0 : 1;
      this.angle = clamp(this.vy / 300, -0.3, 0.3);
      return;
    }
    // idle soaring circle
    this.circleA += dt * 0.45;
    this.flyH = -150 + Math.sin(this.circleA) * 30;
    super.update(dt);
  }
}
// ---------------------------------------------------------------------------
// jumping mullet schools: leap out of the water in bursts
// ---------------------------------------------------------------------------
class Mullet extends Fish {
  constructor(x, y, leader) { super(x, y, 'mullet', leader); this.jumpT = rand(2, 8); this.airborne = false; }
  update(dt) {
    const s = World.surface(this.x);
    if (this.airborne) {
      this.tick(dt); this.vy += 620 * dt; this.move(dt);
      this.angle = clamp(Math.atan2(this.vy, this.vx), -1.2, 1.2); this.facing = sign(this.vx || 1);
      this.anim.phase += dt * 14; this.anim.speed = 1;
      if (this.y > s) { this.airborne = false; G.fx.splash(this.x, 0.5, this.vx); SFX.splash(0.4, this.pan); this.vy *= 0.3; }
      return;

    super.update(dt);

    if ((this.jumpT <= 0 || (spooked && chance(dt * 2))) && this.y < s + 40 && this.y > s) {
      this.jumpT = rand(4, 12); this.airborne = true; this.vy = -rand(150, 260); this.vx = rand(-70, 70) + (spooked ? sign(this.x - G.player.x) * 90 : 0);
      G.fx.splash(this.x, 0.5, this.vx); SFX.splash(0.4, this.pan);
    }
  }
}

// Human activity: docks, stilt fish camps, boat ramps, ranger towers, crab

  constructor(x, kind) {

        this.pilings = []; for (let i = 0; i < 4; i++) this.pilings.push({ ox: -18 + i * 12, hp: 45, dead: false });
        this.r = 30 * this.ss; break;
      }
      case 'boatramp': { this.name = 'BOAT RAMP'; this.hp = 400; this.armor = 40; this.r = 30 * this.ss; this.dir = World.floorY(x - 50) < 0 ? 1 : -1; break; }
      case 'tower': { this.name = 'RANGER TOWER'; this.hp = 200; this.r = 16 * this.ss; this.deckY = -58; break; }
      case 'crabtrap': { this.name = 'CRAB TRAP'; this.hp = 20; this.r = 8 * this.ss; this.floatY = 0; this.deep = World.floorY(x) - 4; this.baited = true; break; }
      case 'buoy': { this.name = 'CHANNEL MARKER'; this.hp = 40; this.r = 6 * this.ss; break; }
      case 'sign': { this.name = 'WARNING SIGN'; this.hp = 20; this.r = 8 * this.ss; break; }
      case 'console': { this.name = 'CONSOLE'; this.hp = 26; this.r = 9 * this.ss; break; }
      case 'campfire': { this.name = 'CAMPFIRE'; this.hp = 20; this.r = 10 * this.ss; break; }
      case 'tank': { this.name = 'CONTAINMENT TANK'; this.hp = 999; this.r = 40; this.cracks = 0; this.broken = false; break; }
      case 'grate': { this.name = 'OUTFALL GRATE'; this.hp = 46; this.armor = 0; this.r = 30; this.broken = false; break; }
      case 'shop': { this.name = 'BAIT SHOP'; this.hp = 300; this.deckY = -20; this.w = 96; this.r = 60 * this.ss; this.pilings = []; for (let i = 0; i < 5; i++) this.pilings.push({ ox: -40 + i * 20, hp: 60, dead: false }); break; }
      case 'campsite': { this.name = 'CAMPSITE'; this.hp = 90; this.r = 44 * this.ss; this.tent = Math.floor(this.seed * 3); break; }
    }
    this.maxHp = this.hp;
    this.y = kind === 'crabtrap' ? World.surface(x) : kind === 'buoy' ? World.surface(x) : World.floorY(x);
    if (kind === 'dock' || kind === 'stilthouse' || kind === 'tower' || kind === 'campfire' || kind === 'shop' || kind === 'campsite' || kind === 'tank') this.y = World.floorY(x);
    if (kind === 'grate') this.y = World.floorY(x);

const TRAIT_ICON = {

  blubber: 'manatee', tusks: 'boar', stingbarb: 'ray', pantherclaw: 'panther', vulturegut: 'vulture', tarponfin: 'tarpon',
  crabclaw: 'crab', skeeter: 'mosquito', froglung: 'frog', garfish: 'gar', snaptongue: 'turtle', hullbreak: 'boat',
  wingsnatch: 'egret', constrict: 'python', bloodscent: 'shark', nighteye: 'panther', goliath: 'grouper', swarm: 'minnow',
  electric: 'eel', ironshell: 'turtle', manhunter: 'human', ancient: 'croc',

const PATH_ICON = { ripper: 'shark', behemoth: 'manatee', phantom: 'otter', abyssal: 'eel' };
function iconFor(card) {
  if (!card) return null;
  if (card.kind === 'trait') return ICONS[TRAIT_ICON[card.trait.id]] || ICONS.croc;
  if (card.kind === 'path') return ICONS[PATH_ICON[card.path]] || ICONS.croc;
  return ICONS.dragonfly;

// Draw an animated icon centred at (x,y), fitted into a box of `box` pixels.
function drawIcon(ctx, icon, x, y, box, t, opts = {}) {
  if (!icon) return;
  const n = icon.frames.length;
  let f = 0, bob = 0, rot = 0, sq = 1;
  switch (icon.kind) {
    case 'swim': f = n > 1 ? Math.floor(t * 7) % n : 0; bob = Math.sin(t * 3) * 0.06; rot = Math.sin(t * 3) * 0.09; break;
    case 'fly': f = n > 1 ? (Math.sin(t * 11) > 0 ? 0 : 1) : 0; bob = Math.sin(t * 5.5) * 0.12; break;
    case 'walk': f = n > 1 ? Math.floor(t * 6) % n : 0; bob = Math.abs(Math.sin(t * 5)) * -0.09; break;
    default: f = n > 1 ? Math.floor(t * 2) % n : 0; sq = 1 + Math.sin(t * 2.4) * 0.05; break;
  }
  const s = icon.frames[f];
  // big rig snapshots scale down smoothly; tiny sprites snap to whole pixels
  const raw = box / Math.max(s.w, s.h) * icon.scale;
  const k = (raw >= 1 ? Math.floor(raw) : raw) * (opts.scale || 1);
  ctx.save();
  ctx.translate(Math.round(x), Math.round(y + bob * box));
  if (opts.alpha !== undefined) ctx.globalAlpha = opts.alpha;
  if (rot) ctx.rotate(rot);
  ctx.scale(k * (opts.flip ? -1 : 1), k * sq);
  if (opts.shadow) { ctx.globalAlpha = (opts.alpha ?? 1) * 0.35; ctx.drawImage(spriteWhite(s).c, -s.w / 2 + 1, -s.h / 2 + 1); ctx.globalAlpha = opts.alpha ?? 1; }
  ctx.drawImage(s.c, -Math.round(s.w / 2), -Math.round(s.h / 2));
  ctx.restore();
}

// ---------------------------------------------------------------------------
// DNA ORB: a double helix wound around a glowing sphere. Each acquired trait or
// path node is a base pair on the strand, carrying its animal icon.
// ---------------------------------------------------------------------------
const DNA = {
  // beads: [{color, icon, label}] oldest first
  draw(ctx, cx, cy, R, t, beads, opts = {}) {
    const rungs = opts.rungs || 22, spin = t * (opts.speed || 0.9), tilt = opts.tilt ?? 0.34;
    const glow = opts.glow || '#40f0c8';
    // --- sphere body ---
    const g = ctx.createRadialGradient(cx - R * 0.3, cy - R * 0.35, R * 0.1, cx, cy, R * 1.05);
    g.addColorStop(0, rgba(glow, 0.20)); g.addColorStop(0.55, rgba(glow, 0.07)); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, R * 1.05, 0, TAU); ctx.fill();
    // latitude rings, for volume
    ctx.strokeStyle = rgba(glow, 0.13); ctx.lineWidth = 1;
    for (let i = 1; i < 5; i++) {
      const yy = cy - R + (2 * R) * i / 5, rr = Math.sqrt(Math.max(0, R * R - (yy - cy) * (yy - cy)));
      ctx.beginPath(); ctx.ellipse(cx, yy, rr, rr * tilt, 0, 0, TAU); ctx.stroke();
    }
    ctx.strokeStyle = rgba(glow, 0.22); ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.stroke();
    // --- helix ---
    const pts = [];
    for (let i = 0; i <= rungs; i++) {
      const u = i / rungs, yy = cy - R * 0.94 + u * R * 1.88;
      const rr = Math.sqrt(Math.max(0, R * R - (yy - cy) * (yy - cy))) * 0.92;
      const a = spin + u * Math.PI * 3.4;
      pts.push({
        i, u, y: yy,
        ax: cx + Math.cos(a) * rr, az: Math.sin(a),
        bx: cx + Math.cos(a + Math.PI) * rr, bz: Math.sin(a + Math.PI),
      });
    }
    const dep = z => 0.35 + 0.65 * ((z + 1) / 2);
    // rungs first, back to front
    const order = pts.slice().sort((p, q) => Math.min(p.az, p.bz) - Math.min(q.az, q.bz));
    for (const p of order) {
      const d = dep((p.az + p.bz) / 2);
      ctx.strokeStyle = rgba(glow, 0.10 + 0.28 * d); ctx.lineWidth = Math.max(1, 1.6 * d);
      ctx.beginPath(); ctx.moveTo(p.ax, p.y); ctx.lineTo(p.bx, p.y); ctx.stroke();
    }
    // strand backbones
    for (const side of ['a', 'b']) {
      ctx.beginPath();
      pts.forEach((p, i) => { const X = side === 'a' ? p.ax : p.bx; if (i === 0) ctx.moveTo(X, p.y); else ctx.lineTo(X, p.y); });
      ctx.strokeStyle = rgba(glow, 0.5); ctx.lineWidth = 1.5; ctx.stroke();
    }
    // --- beads on the strand ---
    const slots = [];
    for (let i = 0; i < pts.length; i++) if (i % 2 === 1) slots.push(pts[i]);
    const drawn = [];
    beads.forEach((b, k) => {
      const p = slots[k % slots.length]; if (!p) return;
      const onA = k % 2 === 0;
      drawn.push({ b, x: onA ? p.ax : p.bx, y: p.y, z: onA ? p.az : p.bz });
    });
    drawn.sort((m, n) => m.z - n.z);
    for (const d of drawn) {
      const dp = dep(d.z), r = (opts.beadR || 7) * dp;
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = rgba(d.b.color, 0.30 * dp); ctx.beginPath(); ctx.arc(d.x, d.y, r * 1.9, 0, TAU); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = rgba('#04100e', 0.85); ctx.beginPath(); ctx.arc(d.x, d.y, r, 0, TAU); ctx.fill();
      ctx.strokeStyle = rgba(d.b.color, 0.4 + 0.6 * dp); ctx.lineWidth = 1.5; ctx.stroke();
      if (d.b.icon && dp > 0.55) drawIcon(ctx, d.b.icon, d.x, d.y, r * 1.9, t + d.y * 0.03, { alpha: dp });
    }
    // --- orbiting motes ---
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 14; i++) {
      const a = spin * 1.7 + i * TAU / 14, rr = R * (1.05 + 0.1 * Math.sin(t * 1.3 + i));
      const mx = cx + Math.cos(a) * rr, my = cy + Math.sin(a) * rr * tilt * 1.5;
      ctx.fillStyle = rgba(glow, 0.25 + 0.35 * ((Math.sin(a) + 1) / 2));
      ctx.fillRect(Math.round(mx), Math.round(my), 2, 2);
    }
    ctx.globalCompositeOperation = 'source-over';
  },
  // the player's genome as beads
  beads(P) {
    const out = [];
    for (const key of P.picked) {
      if (key.startsWith('mut:')) { out.push({ color: '#9aa8a0', icon: ICONS.dragonfly, label: key.slice(4) }); continue; }
      const [pk, tier] = key.split(':');
      const path = PATHS[pk]; if (!path) continue;
      out.push({ color: path.color, icon: ICONS[PATH_ICON[pk]], label: path.nodes[+tier].name });
    }
    for (const id of P.traits) { const t = TRAIT_BY_ID[id]; if (t) out.push({ color: t.color, icon: ICONS[TRAIT_ICON[id]], label: t.name }); }
    return out;
  },
  // compact HUD version: a slim helix strip
  drawMini(ctx, x, y, w, h, t, beads, glow) {
    const spin = t * 1.4;
    ctx.strokeStyle = rgba(glow, 0.35); ctx.lineWidth = 1;
    for (const off of [0, Math.PI]) {
      ctx.beginPath();
      for (let i = 0; i <= 24; i++) { const u = i / 24, px = x + u * w, a = spin + u * Math.PI * 2.6 + off; const py = y + h / 2 + Math.sin(a) * h / 2; if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py); }
      ctx.stroke();
    }
    beads.slice(-8).forEach((b, k) => {
      const u = (k + 0.5) / 8, px = x + u * w, a = spin + u * Math.PI * 2.6 + (k % 2 ? Math.PI : 0);
      const py = y + h / 2 + Math.sin(a) * h / 2, d = 0.45 + 0.55 * ((Math.cos(a) + 1) / 2);
      ctx.fillStyle = rgba(b.color, 0.5 + 0.5 * d); ctx.fillRect(Math.round(px - 1.5 * d), Math.round(py - 1.5 * d), Math.max(2, Math.round(3 * d)), Math.max(2, Math.round(3 * d)));
    });
  },
};

  // a filled hexagon with a border

  geneCells() {

    let warn = null;
    switch (k) {
      case 'bass': if (fy > 40) Spawn.school(x, 60, 'bass'); break;
      case 'moccasin': if (fy > 20) this.add(new Snake(x, 4, 'moccasin')); break;
      case 'gator': if (fy > 40) { Spawn.gator(x, clamp(rand(20, 150), 10, fy - 20), clamp(P.size * rand(0.65, 1.35), 0.8, 30)); warn = 'SOMETHING IS HUNTING YOU'; } break;
      case 'python': { const bx = World.findX(x, xx => World.floorY(xx) < -3, 800, 30); this.add(new Snake(bx !== null ? bx : x, 4, 'python', clamp(0.8 + D * 0.12, 0.8, 2.2))); break; }
      case 'poacher': case 'tourist': { const wx = World.findX(x, xx => World.floorY(xx) > 60, 600, 30); if (wx !== null) { Spawn.boat(wx, k, -side); if (k === 'poacher') warn = 'POACHERS NEARBY'; } break; }
      case 'shark': this.add(new Fish(x, clamp(rand(100, 400), 60, fy - 30), 'shark')); warn = 'SOMETHING IS HUNTING YOU'; break;
      case 'boar': case 'panther': case 'bear': { const bx = World.findX(x, xx => World.floorY(xx) < -5, 1200, 40); if (bx !== null) { this.add(new LandAnimal(bx, k)); if (k !== 'boar') warn = k === 'bear' ? 'A BEAR IS ON THE BANK' : 'SOMETHING STALKS THE BANK'; } break; }
      case 'sawfish': this.add(new Fish(x, clamp(rand(150, 400), 60, fy - 30), 'sawfish')); break;
      case 'grouper': this.add(new Fish(x, clamp(rand(400, 700), 60, fy - 40), 'grouper')); break;
    }
    if (warn) { this.banner = { text: warn, t: 2.5, max: 2.5, color: '#ff8060' }; SFX.growl(side); }
  },
  spawnBoss(kind) {
    const P = this.player, halfW = this.W / this.cam.zoom / 2, side = chance(0.5) ? 1 : -1, x = P.x + side * (halfW + 220), fy = World.floorY(x);
    let boss = null;
    if (kind === 'oldscar') { const wx = World.findX(x, xx => World.floorY(xx) > 80, 900, 30); if (wx !== null) boss = Spawn.gator(wx, clamp(80, 10, World.floorY(wx) - 20), Math.max(1.6, P.size * 1.35), true); }
    else if (kind === 'warboat') { const wx = World.findX(x, xx => World.floorY(xx) > 60, 900, 30); if (wx !== null) boss = Spawn.boat(wx, 'warboat', -side); }
    else if (kind === 'python') { boss = this.add(new Snake(x, fy < 0 ? -10 : 6, 'python', Math.max(2.2, P.size * 0.8))); boss.isBoss = true; boss.persistent = true; boss.name = 'MOTHER PYTHON'; boss.hp = boss.maxHp = Math.round(boss.maxHp * 1.6); }
    else if (kind === 'skunkape') { const bx = World.findX(P.x + side * (halfW + 100), xx => World.floorY(xx) < -8, 6000, 40); if (bx !== null) boss = this.add(new SkunkApe(bx)); }
    else if (kind === 'shark') { const wx = World.findX(x, xx => World.floorY(xx) > 200, 1500, 40); if (wx !== null) { boss = this.add(new Fish(wx, clamp(150, 60, World.floorY(wx) - 40), 'shark')); boss.size = 2.2; boss.sizeClass = Math.max(10, P.size * 1.3); boss.hp = boss.maxHp = 1400; boss.mass = 1500; boss.name = 'BIG BULL'; boss.isBoss = true; boss.persistent = true; boss.speed = 200; boss.gibs = 6; } }
    if (!boss) { this.director.bossT = 8; return; }
    this.boss = boss; this.director.bossQueue = null;
    this.banner = { text: 'WARNING', sub: boss.name + ' APPROACHES', t: 4, max: 4, color: '#ff3030' }; SFX.warning(); this.shake(6);
  },
  // ---------- update ----------
  loop(ts) {
    const raw = Math.min(0.05, this.lastTs ? (ts - this.lastTs) / 1000 : 0.016); this.lastTs = ts;
    this.frames++; this.fpsT += raw; if (this.fpsT >= 1) { this.fps = this.frames; this.frames = 0; this.fpsT -= 1; }
    if (this.slowT > 0) { this.slowT -= raw; if (this.slowT <= 0) this.slowScale = 1; }
    this.timeScale = lerp(this.timeScale, this.slowT > 0 ? this.slowScale : 1, 0.2);
    let dt = raw * this.timeScale;
    if (this.hitstopT > 0) { this.hitstopT -= raw; dt = 0; }
    this.update(dt, raw);
    this.render();
    Input.endFrame();
    requestAnimationFrame(t => this.loop(t));
  },
  update(dt, raw) {
    // global keys
    if (Input.hit('KeyM')) { const m = SFX.toggleMute(); if (!SFX.ctx) { SFX.init(); if (m) SFX.master && (SFX.master.gain.value = 0); } }
    switch (this.state) {
      case 'title':
        this.titleT += raw; this.updateWorld(dt, true);
        if (Input.hit('KeyH')) { this.prevState = 'title'; this.state = 'help'; }
        else if (Input.hit('KeyC')) { this.prevState = 'title'; this.state = 'codex'; this.codexScroll = 0; }
        else if (Input.hit('Enter', 'Space', 'KeyZ', 'KeyJ') || Input.mouse.clicked) { SFX.init(); SFX.resume(); SFX.ui(); this.startRun(false); }
        break;
      case 'intro': {
        const e = this.intro;
        e.t += raw; e.prompt += raw; e.shake = Math.max(0, e.shake - raw * 3.5);
        this.updateWorld(dt, false);
        if (e.phase === 'tank') {
          const P = this.player;
          // curled into a C inside the glass, drifting in the acid
          P.frozen = true; P.facing = 1;
          const tx = e.tank ? e.tank.x : P.x, ty = World.floorY(tx) - 52 + Math.sin(e.t * 1.4) * 2;
          const R0 = 17, spin = Math.sin(e.t * 0.7) * 0.25 + e.taps * 0.12;
          const n = P.chain.nodes;
          for (let i = 0; i < n.length; i++) {
            const u = i / (n.length - 1), a = -1.5 + spin + u * 4.4;
            n[i].x = tx + Math.cos(a) * R0 * (1 - u * 0.16); n[i].y = ty + Math.sin(a) * R0 * (1 - u * 0.16);
            n[i].a = a + Math.PI / 2;
          }
          P.x = n[0].x; P.y = n[0].y; P.angle = n[0].a;
          if (chance(raw * 7)) this.fx.bubbles(tx + rand(-10, 10), ty + 14, 1, 4, -14);
          this.cam.zoom = lerp(this.cam.zoom, 2.6 - e.taps * 0.12, 0.05);
          if (Input.bitePressed() || Input.hit('Enter') || Input.mouse.clicked || Input.dashPressed()) this.crackTank();
          if (e.t > 22) this.breakTank();
        } else {
          this.runDirector(dt);
          if (this.player.x > -110 && (!e.grate || e.grate.broken)) { this.state = 'play'; this.intro = null; }
        }
        if (Input.hit('Escape', 'KeyP')) { this.state = 'pause'; SFX.ui(); }
        break;
      }
      case 'play':
        if (Input.hit('Escape', 'KeyP')) { this.state = 'pause'; SFX.ui(); break; }
        if (Input.hit('KeyG', 'KeyE', 'Tab')) { this.openGenes(); break; }
        if (Input.hit('KeyH')) { this.prevState = 'play'; this.state = 'help'; break; }
        this.updateWorld(dt, false); this.runDirector(dt);
        break;
      case 'shedding':
        this.updateWorld(dt, false); this.shedT += raw;
        if (this.shedT > 1.3) { this.state = 'shed'; this.shedCards = rollCards(this.player, 3); this.shedSel = 0; this.shedUiT = 0; this.slowT = 0; this.slowScale = 1; }
        break;
      case 'shed': {
        this.shedUiT += raw;
        const n = this.shedCards.length;
        if (Input.hit('ArrowLeft', 'KeyA')) { this.shedSel = (this.shedSel + n - 1) % n; SFX.ui(); }
        if (Input.hit('ArrowRight', 'KeyD')) { this.shedSel = (this.shedSel + 1) % n; SFX.ui(); }
        const rects = UI.cardRects(n);
        if (Input.mouse.moved) rects.forEach((r, i) => { if (Input.mouse.x >= r.x && Input.mouse.x <= r.x + r.w && Input.mouse.y >= r.y - 6 && Input.mouse.y <= r.y + r.h) this.shedSel = i; });
        let pick = -1;
        if (Input.hit('Digit1')) pick = 0; if (Input.hit('Digit2')) pick = 1; if (Input.hit('Digit3')) pick = 2;
        if (Input.hit('Enter', 'Space', 'KeyZ', 'KeyJ')) pick = this.shedSel;
        if (Input.mouse.clicked) rects.forEach((r, i) => { if (Input.mouse.x >= r.x && Input.mouse.x <= r.x + r.w && Input.mouse.y >= r.y - 6 && Input.mouse.y <= r.y + r.h) pick = i; });
        if (pick >= 0 && pick < n && this.shedUiT > 0.3) this.finishShed(this.shedCards[pick]);
        break;
      }
      case 'dying':
        this.updateWorld(dt, false); this.dyingT += raw;
        if (this.dyingT > 2.6) { this.state = 'dead'; this.deadT = 0; this.slowT = 0; this.slowScale = 1; }
        break;
      case 'dead':
        this.deadT += raw; this.updateWorld(dt * 0.3, false);
        if (this.deadT > 1 && (Input.hit('Enter', 'Space', 'KeyZ', 'KeyJ') || Input.mouse.clicked)) { SFX.ui(); this.startRun(false); }
        if (Input.hit('KeyC')) { this.prevState = 'dead'; this.state = 'codex'; this.codexScroll = 0; SFX.ui(); }
        if (Input.hit('Escape')) { this.startRun(true); this.state = 'title'; }
        break;
      case 'pause':
        if (Input.hit('Escape', 'KeyP', 'Enter')) { this.state = 'play'; SFX.ui(); }
        if (Input.hit('KeyQ')) { this.storeSave(); this.startRun(true); this.state = 'title'; }
        if (Input.hit('Digit1')) { this.settings.gore = !this.settings.gore; SFX.ui(); }
        if (Input.hit('Digit2')) { this.settings.shake = !this.settings.shake; SFX.ui(); }
        if (Input.hit('Digit3')) { this.settings.mouseMove = !this.settings.mouseMove; SFX.ui(); }
        if (Input.hit('Digit4')) { this.settings.touch = this.settings.touch === false; SFX.ui(); }
        if (Input.hit('KeyC')) { this.prevState = 'pause'; this.state = 'codex'; this.codexScroll = 0; SFX.ui(); }
        break;
      case 'help':
        if (Input.hit('Escape', 'KeyH', 'Enter')) { this.state = this.prevState; SFX.ui(); }
        else if (Input.hit('KeyC')) { this.state = 'codex'; this.codexScroll = 0; SFX.ui(); }
        break;
      case 'genes': {
        const P = this.player;
        if (Input.hit('Escape', 'KeyG', 'KeyE', 'Tab', 'Enter')) { this.state = 'play'; SFX.ui(); break; }
        const cells = UI.geneCells();
        if (Input.mouse.moved || Input.mouse.clicked) {
          let best = null, bd = (cells[0] ? cells[0].R : 25) + 1;
          for (const c of cells) { const d = dist(Input.mouse.x, Input.mouse.y, c.sx, c.sy); if (d < bd) { bd = d; best = c; } }
          if (best) this.geneSel = best.g.id;
        }
        if (Input.hit('ArrowLeft', 'KeyA') || Input.hit('ArrowRight', 'KeyD') || Input.hit('ArrowUp', 'KeyW') || Input.hit('ArrowDown', 'KeyS')) {
          const cur = cells.find(c => c.g.id === this.geneSel) || cells[0];
          const dx = Input.hit('ArrowLeft', 'KeyA') ? -1 : Input.hit('ArrowRight', 'KeyD') ? 1 : 0;
          const dy = Input.hit('ArrowUp', 'KeyW') ? -1 : Input.hit('ArrowDown', 'KeyS') ? 1 : 0;
          let best = null, bd = 1e9;
          for (const c of cells) { if (c === cur) continue; const ox = c.sx - cur.sx, oy = c.sy - cur.sy; if (ox * dx + oy * dy <= 4) continue; const d = Math.hypot(ox, oy) + Math.abs(ox * dy - oy * dx) * 1.5; if (d < bd) { bd = d; best = c; } }
          if (best) { this.geneSel = best.g.id; SFX.ui(); }
        }
        const take = Input.hit('Space', 'KeyJ', 'KeyZ') || (Input.mouse.clicked && cells.some(c => c.g.id === this.geneSel && dist(Input.mouse.x, Input.mouse.y, c.sx, c.sy) < c.R + 1));
        if (take) {
          const g = GENE_BY_ID[this.geneSel];
          if (g && Genome.buy(P, g)) {
            SFX.pick(); SFX.levelup(); this.whiteFlash(0.3); this.shake(4);
            this.fx.glow(P.x, P.y, 60 * P.vis, LINEAGES[g.lin] ? LINEAGES[g.lin].color : '#ffffff', 0.8);
            this.banner = { text: g.name, sub: g.apex ? 'APEX GENE SPLICED' : 'GENE SPLICED', t: 2.6, max: 2.6, color: g.lin ? LINEAGES[g.lin].color : '#ffffff' };
          } else SFX.clank();
        }
        break;
      }
      case 'codex': {
        const maxScroll = Math.max(0, Math.ceil(ANIMAL_TRAITS.length / 2) - 8);
        if (Input.hit('ArrowDown', 'KeyS')) this.codexScroll = Math.min(maxScroll, (this.codexScroll || 0) + 1);
        if (Input.hit('ArrowUp', 'KeyW')) this.codexScroll = Math.max(0, (this.codexScroll || 0) - 1);
        if (Input.hit('Escape', 'KeyC', 'Enter', 'KeyH') || (Input.mouse.clicked && Input.mouse.y > this.H - 26)) { this.state = this.prevState || 'title'; SFX.ui(); }
        break;
      }
    }
    // screen fx decay (real time)
    this.shakeAmt *= Math.exp(-6 * raw);
    if (this.shakeAmt < 0.2) this.shakeAmt = 0;
    this.shakeX = Math.round(rand(-1, 1) * this.shakeAmt); this.shakeY = Math.round(rand(-1, 1) * this.shakeAmt);
    this.red *= Math.exp(-3 * raw); this.white *= Math.exp(-4.5 * raw); this.zoomP = lerp(this.zoomP, 1, 0.08);
    Input.tickTouch(raw);
    Input.mouse.moved = false;
    const P = this.player;
    SFX.update({ dt: raw, night: 1 - World.light(this.day), danger: this.state === 'play' ? this.dangerLevel() : 0, engine: this.engineNear, underwater: P && P.inWater && this.state !== 'title' ? 1 : 0, rain: Weather.rain });
  },
  demoInput() {
    const P = this.player, t = this.titleT;
    P.hunger = 100; P.hp = P.maxHp;
    let x = Math.cos(t * 0.45) * 0.8, y = Math.sin(t * 0.9) * 0.3 + (P.y < 34 ? 0.8 : 0) + (P.y > 104 ? -0.8 : 0);
    if (P.x > 500) x = -1; if (P.x < -500) x = 1;
    let bite = false;
    for (const e of this.ents) if (e.type === 'fish' && !e.dead && dist(e.x, e.y, P.x, P.y) < 60) { const dx = e.x - P.x, dy = e.y - P.y, d = Math.hypot(dx, dy) || 1; x = dx / d; y = dy / d; if (d < 26 && P.biteCd <= 0) bite = true; break; }
    return { x, y, bite, dash: false };
  },
  updateWorld(dt, demo) {
    this.t += dt; World.t += dt;
    const prevDay = this.day; this.day = (this.day + dt / 420) % 1;
    if (this.state === 'play') {
      if (prevDay < 0.62 && this.day >= 0.62) this.nightCounted = false;
      if (!this.nightCounted && this.day >= 0.95) { this.nightCounted = true; Meta.event('night'); for (const t2 of Meta.checkUnlocks()) this.announceUnlock(t2); Meta.save(); }
    }
    const P = this.player;
    const [ax, ay] = Input.axis();
    if (demo === 'egg') demo = false;
    const act = this.state === 'play' || (this.state === 'intro' && this.intro && this.intro.phase !== 'tank');
    const inp = demo ? this.demoInput() : { x: ax, y: ay, bite: act && Input.bitePressed(), dash: act && Input.dashPressed() };
    this.engineNear = 0;
    P.update(dt, inp);
    World.ensure(P.x, this.W / this.cam.zoom + 900);
    Water.recenter(this.cam.x); Mud.recenter(this.cam.x);
    Water.update(dt); Mud.update(dt); Foliage.update(dt); Weather.update(dt); Weather.spawn(dt, this.cam);
    for (let i = 0; i < this.ents.length; i++) {
      const e = this.ents[i]; if (e.remove) continue;
      const dx = Math.abs(e.x - P.x);
      if (dx > 1800 && !e.persistent) { e.remove = true; continue; }
      if (dx < 1400 || e.persistent) e.update(dt);
    }
    if (this.ents.some(e => e.remove)) this.ents = this.ents.filter(e => !e.remove);
    this.fx.update(dt);
    this.updateCamera(dt);
    if (this.banner) { this.banner.t -= dt; if (this.banner.t <= 0) this.banner = null; }
  },
  updateCamera(dt) {
    const P = this.player, c = this.cam;
    const tz = clamp(1.2 / Math.pow(P.vis, 0.92), 0.22, 1.35) * this.zoomP * (this.state === 'title' ? 1.1 : 1);
    c.zoom = lerp(c.zoom, tz, 1 - Math.exp(-2.5 * dt));
    const tx = P.x + P.vx * 0.22; let ty = P.y + P.vy * 0.12;
    if (this.state === 'title') ty = Math.max(ty, 75);
    const k = 1 - Math.exp(-5 * dt);
    c.x = lerp(c.x, tx, k); c.y = lerp(c.y, ty, k);
    c.y = Math.max(c.y, -(this.H / 2) / c.zoom + 30);
  },
  drawEgg(ctx) {
    const e = this.egg; if (!e || e.hatched) return;
    const n = SPR.nest, nx = Math.round(e.x - n.w / 2), ny = Math.round(e.y - n.h + 4);
    ctx.drawImage(n.c, nx, ny);                                   // nest, back to front
    const st = Math.min(3, e.taps), s = SPR.egg[st];
    const jx = e.shake > 0 ? rand(-1, 1) * e.shake * 2 : 0;
    ctx.save();
    ctx.translate(e.x + jx, e.y - 1);
    ctx.rotate(e.wob + (e.shake > 0 ? rand(-0.08, 0.08) * e.shake : 0));
    ctx.drawImage(s.c, -Math.round(s.w / 2), -s.h + 2);           // egg sits down in the bowl
    ctx.restore();
    ctx.drawImage(n.c, 0, 4, n.w, 4, nx, ny + 4, n.w, 4);         // front rim overlaps the shell
  },
  // ---------- render ----------
  render() {
    const ctx = this.ctx, cam = this.cam, day = this.day, P = this.player;
    ctx.imageSmoothingEnabled = false;
    const indoor = World.isIndoor(cam.x);
    if (indoor) World.drawIndoor(ctx, cam, day);
    else { World.drawSky(ctx, cam, day); World.drawParallax(ctx, cam, day); }
    World.drawWater(ctx, cam, day);
    World.drawTerrain(ctx, cam);
    World.drawDepthShade(ctx, cam);
    World.drawDecor(ctx, cam, 0, day);
    this.fx.drawClouds(ctx, cam);
    // world space
    ctx.save(); ctx.translate(this.W / 2 + this.shakeX, this.H / 2 + this.shakeY); ctx.scale(cam.zoom, cam.zoom); ctx.translate(-cam.x, -cam.y);
    // zoomed out past 1:1 the rigged sprites are minified; nearest sampling turns their dithered scales into moire,
    // so let the browser box-filter them (mipmapped at 'medium') and go back to crisp pixels for the HUD
    ctx.imageSmoothingEnabled = cam.zoom < 0.97; ctx.imageSmoothingQuality = 'medium';
    const left = cam.toWorldX(-120), right = cam.toWorldX(this.W + 120);
    const vis = [];
    for (const e of this.ents) if (e.x > left - e.r * e.size * 4 && e.x < right + e.r * e.size * 4) vis.push(e);
    vis.sort((a, b) => a.layer - b.layer);
    let drewPlayer = false;
    for (const e of vis) { if (!drewPlayer && e.layer >= 2) { P.draw(ctx); drewPlayer = true; } e.draw(ctx); }
    if (!drewPlayer) P.draw(ctx);
    if (this.state === 'egg') this.drawEgg(ctx);
    for (const e of vis) if (e.type !== 'gib' && e.type !== 'proj' && !e.isBoss) e.drawHpBar(ctx);
    ctx.restore();
    ctx.imageSmoothingEnabled = false;
    this.fx.draw(ctx, cam);
    World.drawDecor(ctx, cam, 1, day);
    World.drawSurface(ctx, cam, day);
    World.drawMist(ctx, cam, day);
    World.drawNight(ctx, cam, day);
    UI.drawScreenFx(ctx);
    switch (this.state) {
      case 'title': UI.drawTitle(ctx); break;
      case 'intro': UI.drawIntro(ctx); break;
      case 'play': case 'shedding': case 'dying': UI.drawHUD(ctx); break;
      case 'genes': UI.drawGenes(ctx); break;
      case 'shed': UI.drawShed(ctx); break;
      case 'dead': UI.drawDeath(ctx); break;
      case 'pause': UI.drawHUD(ctx); UI.drawPause(ctx); break;
      case 'help': UI.drawHelp(ctx); break;
      case 'codex': UI.drawCodex(ctx); break;
    }
    if ((this.state === 'play' || this.state === 'intro') && (this.touchUI || Input.touch.active) && this.settings.touch !== false) UI.drawTouch(ctx);
    if (this.settings.fps) Font.draw(ctx, this.fps + ' FPS', 4, this.H - 24, { color: '#80ff80' });
  },
};
window.addEventListener('load', () => G.init());

</script>
