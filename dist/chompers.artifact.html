// ---------- deterministic randomness ----------
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function ihash(i, seed = 0) {
  let x = (i | 0) ^ (seed | 0);
  x = Math.imul(x ^ (x >>> 16), 0x45d9f3b);
  x = Math.imul(x ^ (x >>> 16), 0x45d9f3b);
  x ^= x >>> 16;
  return (x >>> 0) / 4294967296;
}
function vnoise(x, seed = 0) {
  const i = Math.floor(x), f = x - i;

function fbm(x, seed = 0, oct = 3) {

}

function hexToRgb(h) {

const rgbToHex = (r, g, b) => '#' + ((1 << 24) | (clamp(r | 0, 0, 255) << 16) | (clamp(g | 0, 0, 255) << 8) | clamp(b | 0, 0, 255)).toString(16).slice(1);

'use strict';
// Fully synthesized audio: no asset files. Everything is built from oscillators + filtered noise.
const SFX = {
  ctx: null, master: null, sfxBus: null, musicBus: null, noiseBuf: null,
  muted: false, vol: 0.6, amb: null, mus: null, _last: {},
  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const c = this.ctx = new AC();
    this.master = c.createGain(); this.master.gain.value = this.muted ? 0 : this.vol; this.master.connect(c.destination);
    this.comp = c.createDynamicsCompressor(); this.comp.threshold.value = -14; this.comp.ratio.value = 5; this.comp.connect(this.master);
    this.sfxBus = c.createGain(); this.sfxBus.gain.value = 0.9; this.sfxBus.connect(this.comp);
    this.musicBus = c.createGain(); this.musicBus.gain.value = 0.3; this.musicBus.connect(this.comp);
    const len = c.sampleRate * 2, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noiseBuf = buf;
    this.startAmbient();
    this.startMusic();
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  toggleMute() { this.muted = !this.muted; if (this.master) this.master.gain.value = this.muted ? 0 : this.vol; return this.muted; },
  // rate limiter so 40 gibs don't play 40 sounds
  gate(name, ms) { const n = performance.now(); if (this._last[name] && n - this._last[name] < ms) return false; this._last[name] = n; return true; },
  tone(o) {
    if (!this.ctx) return null;
    const c = this.ctx, t0 = c.currentTime + (o.delay || 0), t = o.t || 0.2, a = o.a ?? 0.005;
    const osc = c.createOscillator(); osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(Math.max(1, o.f || 440), t0);
    if (o.f2 != null) { if (o.lin) osc.frequency.linearRampToValueAtTime(Math.max(1, o.f2), t0 + t); else osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.f2), t0 + t); }
    if (o.detune) osc.detune.value = o.detune;
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(o.v ?? 0.3, t0 + a);
    if (o.hold) g.gain.setValueAtTime(o.v ?? 0.3, t0 + a + o.hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + t);
    let head = osc;
    if (o.filter) { const fl = c.createBiquadFilter(); fl.type = o.filter.type || 'lowpass'; fl.frequency.setValueAtTime(o.filter.f, t0); if (o.filter.f2) fl.frequency.exponentialRampToValueAtTime(Math.max(10, o.filter.f2), t0 + t); fl.Q.value = o.filter.q || 1; head.connect(fl); head = fl; }
    head.connect(g);
    this._out(g, o.pan, o.dest);
    osc.start(t0); osc.stop(t0 + t + 0.05);
    return osc;
  },
  noise(o) {
    if (!this.ctx) return null;
    const c = this.ctx, t0 = c.currentTime + (o.delay || 0), t = o.t || 0.2, a = o.a ?? 0.003;
    const src = c.createBufferSource(); src.buffer = this.noiseBuf; src.loop = true; src.playbackRate.value = o.rate || 1;
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(o.v ?? 0.3, t0 + a);
    if (o.hold) g.gain.setValueAtTime(o.v ?? 0.3, t0 + a + o.hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + t);
    let head = src;
    if (o.filter) { const fl = c.createBiquadFilter(); fl.type = o.filter.type || 'lowpass'; fl.frequency.setValueAtTime(o.filter.f, t0); if (o.filter.f2) fl.frequency.exponentialRampToValueAtTime(Math.max(10, o.filter.f2), t0 + t); fl.Q.value = o.filter.q || 1; head.connect(fl); head = fl; }
    head.connect(g);
    this._out(g, o.pan, o.dest);
    src.start(t0); src.stop(t0 + t + 0.05);
    return src;
  },
  _out(node, pan, dest) {
    dest = dest || this.sfxBus;
    if (pan && this.ctx.createStereoPanner) { const p = this.ctx.createStereoPanner(); p.pan.value = clamp(pan, -1, 1); node.connect(p); p.connect(dest); } else node.connect(dest);
  },
  // ---------- one-shots ----------
  chomp(size = 1, pan = 0) {
    if (!this.gate('chomp', 40)) return;
    const k = Math.pow(size, 0.3);
    this.noise({ t: 0.1, v: 0.5, filter: { f: 900 / k, f2: 200 / k }, pan });
    this.tone({ type: 'square', f: 130 / k, f2: 45 / k, t: 0.13, v: 0.3, pan });
    this.tone({ type: 'sine', f: 2200, f2: 500, t: 0.03, v: 0.18, pan });
  },
  crunch(size = 1, pan = 0) {
    if (!this.gate('crunch', 50)) return;
    const k = Math.pow(size, 0.3);
    [[0, 1900], [0.035, 1200], [0.08, 750], [0.12, 500]].forEach(([dl, f]) => this.noise({ delay: dl, t: 0.06, v: 0.45, filter: { type: 'bandpass', f: f / k, q: 2.5 }, pan }));
    this.noise({ t: 0.18, v: 0.55, filter: { f: 350 / k, f2: 90 }, pan });
    this.tone({ type: 'sawtooth', f: 75 / k, f2: 28, t: 0.22, v: 0.3, filter: { f: 400, f2: 80 }, pan });
  },
  gulp(size = 1, pan = 0) {
    if (!this.gate('gulp', 45)) return;
    const k = Math.pow(size, 0.25);
    this.tone({ type: 'sine', f: 340 / k, f2: 100 / k, t: 0.2, v: 0.3, pan });

  },
  gib(pan = 0) {
    if (!this.gate('gib', 60)) return;
    this.noise({ t: 0.14, v: 0.4, filter: { f: 900, f2: 180 }, pan });
    this.tone({ type: 'sine', f: 220, f2: 50, t: 0.12, v: 0.2, pan });
  },
  splash(p = 1, pan = 0) {
    if (!this.gate('splash', 70)) return;
    p = clamp(p, 0.2, 2.5);
    this.noise({ t: 0.08, v: 0.25 * p, filter: { type: 'highpass', f: 1800 }, pan });
    this.noise({ t: 0.35 * p, v: 0.4 * p, a: 0.015, filter: { f: 2600, f2: 250 }, pan });
  },
  hurt(pan = 0) {
    if (!this.gate('hurt', 80)) return;
    this.tone({ type: 'sawtooth', f: 200, f2: 45, t: 0.32, v: 0.35, filter: { f: 1400, f2: 180 }, pan });
    this.noise({ t: 0.16, v: 0.3, filter: { type: 'bandpass', f: 420, q: 1.5 }, pan });
  },
  roar(size = 1, pan = 0) {
    const k = Math.pow(size, 0.35);
    this.tone({ type: 'sawtooth', f: 150 / k, f2: 85 / k, t: 0.75, v: 0.42, a: 0.03, filter: { f: 1100, f2: 250, q: 3 }, pan });
    this.tone({ type: 'sawtooth', f: 152 / k, f2: 84 / k, t: 0.75, v: 0.3, a: 0.03, detune: 9, filter: { f: 800, f2: 200, q: 2 }, pan });
    this.noise({ t: 0.7, v: 0.32, a: 0.03, filter: { f: 750, f2: 180 }, pan });
    this.tone({ type: 'sine', f: 58 / k, f2: 40 / k, t: 0.7, v: 0.35, a: 0.02, pan });
  },
  growl(pan = 0) { if (!this.gate('growl', 400)) return; this.tone({ type: 'sawtooth', f: 90, f2: 70, t: 0.5, v: 0.22, a: 0.05, filter: { f: 500, f2: 200, q: 4 }, pan }); this.noise({ t: 0.45, v: 0.12, filter: { f: 400 }, pan }); },
  shed() {
    [523, 659, 784, 988, 1175, 1568, 1976].forEach((f, i) => this.tone({ type: 'sine', f, t: 0.6, v: 0.16, delay: i * 0.085 }));
    [523, 659, 784].forEach((f, i) => this.tone({ type: 'triangle', f: f / 2, t: 1.4, v: 0.1, delay: 0.5 + i * 0.05 }));
    this.noise({ t: 1.3, v: 0.07, a: 0.3, filter: { type: 'highpass', f: 3500 } });
  },
  pick() { this.tone({ type: 'sine', f: 660, t: 0.14, v: 0.2 }); this.tone({ type: 'sine', f: 990, t: 0.25, v: 0.2, delay: 0.09 }); this.tone({ type: 'triangle', f: 1320, t: 0.35, v: 0.12, delay: 0.18 }); },
  ui() { this.tone({ type: 'square', f: 900, t: 0.045, v: 0.08 }); },
  crack(n = 0) {
    const k = 1 + n * 0.35;

'use strict';
// ---------- sprite construction ----------
function mkSprite(rows, pal) {
  const h = rows.length, w = Math.max(...rows.map(r => r.length));
  const c = mkCanvas(w, h), x = c.getContext('2d');
  for (let j = 0; j < h; j++) for (let i = 0; i < rows[j].length; i++) {
    const ch = rows[j][i]; if (ch === '.' || ch === ' ') continue;
    const col = pal[ch]; if (!col) continue;
    x.fillStyle = col; x.fillRect(i, j, 1, 1);
  }
  return { c, w, h };
}
function spriteFlipX(s) {
  if (s.flipX) return s.flipX;
  const c = mkCanvas(s.w, s.h), x = c.getContext('2d');
  x.translate(s.w, 0); x.scale(-1, 1); x.drawImage(s.c, 0, 0);
  return (s.flipX = { c, w: s.w, h: s.h });
}
function spriteWhite(s) {
  if (s.white) return s.white;
  const c = mkCanvas(s.w, s.h), x = c.getContext('2d');
  x.drawImage(s.c, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = '#ffffff'; x.fillRect(0, 0, s.w, s.h);
  return (s.white = { c, w: s.w, h: s.h });
}
function spriteTint(s, color, alpha) {
  const c = mkCanvas(s.w, s.h), x = c.getContext('2d');
  x.drawImage(s.c, 0, 0); x.globalCompositeOperation = 'source-atop'; x.globalAlpha = alpha; x.fillStyle = color; x.fillRect(0, 0, s.w, s.h);
  return { c, w: s.w, h: s.h };
}
// squash the tail columns to create a swim frame
function fishFrames(s, tailW) {
  const c = mkCanvas(s.w, s.h), x = c.getContext('2d');
  x.imageSmoothingEnabled = false;
  x.drawImage(s.c, tailW, 0, s.w - tailW, s.h, tailW, 0, s.w - tailW, s.h);
  const sq = Math.max(1, Math.round(s.h * 0.55)), oy = Math.round((s.h - sq) / 2);
  x.drawImage(s.c, 0, 0, tailW, s.h, 0, oy, tailW, sq);
  return [s, { c, w: s.w, h: s.h }];
}
// draw sprite centered at (x,y) with rotation; sy negative flips belly-side
function drawSpr(ctx, s, x, y, angle = 0, sx = 1, sy = 1, ox, oy) {
  ctx.save(); ctx.translate(x, y); if (angle) ctx.rotate(angle); ctx.scale(sx, sy);
  ctx.drawImage(s.c, -(ox === undefined ? s.w / 2 : ox), -(oy === undefined ? s.h / 2 : oy));
  ctx.restore();
}
// split a sprite into n rectangular pieces (for gibs)
function sliceSprite(s, n) {
  const pieces = [];
  const horiz = s.w >= s.h;
  const len = horiz ? s.w : s.h;
  const cuts = [0];
  for (let i = 1; i < n; i++) cuts.push(Math.round(len * i / n + rand(-len / (n * 3), len / (n * 3))));
  cuts.push(len); cuts.sort((a, b) => a - b);
  for (let i = 0; i < n; i++) {
    const a = clamp(cuts[i], 0, len), b = clamp(cuts[i + 1], 0, len);
    if (b - a < 1) continue;
    if (horiz) pieces.push({ sx: a, sy: 0, sw: b - a, sh: s.h });
    else pieces.push({ sx: 0, sy: a, sw: s.w, sh: b - a });
  }
  // sometimes split a big piece vertically too
  if (pieces.length && s.h > 8 && s.w > 8 && chance(0.6)) {
    const p = pieces.splice(randi(0, pieces.length - 1), 1)[0];
    if (horiz) { const cy = Math.round(p.sh / 2); pieces.push({ sx: p.sx, sy: 0, sw: p.sw, sh: cy }, { sx: p.sx, sy: cy, sw: p.sw, sh: p.sh - cy }); }
    else { const cx = Math.round(p.sw / 2); pieces.push({ sx: 0, sy: p.sy, sw: cx, sh: p.sh }, { sx: cx, sy: p.sy, sw: p.sw - cx, sh: p.sh }); }
  }
  return pieces;
}

      const top = Math.round(cy - hh), bot = Math.round(cy + hh);
      if (s.tail === 'fork' || s.tail === 'lunate') {
        const notch = Math.round(hh * (u > 0.45 ? (u - 0.45) * 1.4 : 0));
        R.px(o, xx, top, fin, 1, Math.max(1, hh - notch)); R.px(o, xx, cy + notch, fin, 1, Math.max(1, hh - notch));
      } else R.px(o, xx, top, fin, 1, bot - top + 1);
      if (i % 3 === 1) R.px(o, xx, top, R.lo(fin), 1, bot - top + 1);
      R.px(o, xx, top, R.lo2(fin)); R.px(o, xx, bot, R.lo2(fin));
    }
    // root is at x=tl (right side) since fish body is to the right; flip canvas horizontally
    const f = R.mk(o.w, o.h); f.x.translate(o.w, 0); f.x.scale(-1, 1); f.x.drawImage(o.c, 0, 0);
    parts.tail = R.part(f, o.w - 1, cy);
  }
  // ---- pectoral fin (pivot at its base) ----
  {
    const pl = Math.max(4, Math.round(L * 0.16)), ph = Math.max(3, Math.round(H * 0.3));
    const o = R.mk(pl + 1, ph + 1);
    for (let i = 0; i < pl; i++) { const hh = Math.round(ph * Math.sin((i / pl) * Math.PI * 0.5 + 0.2)); R.px(o, i, 0, fin, 1, hh); if (i % 2) R.px(o, i, 0, R.lo(fin), 1, hh); }
    // base at left, fin sweeps back to the right -> flipped so base is at right (toward head)
    const f = R.mk(o.w, o.h); f.x.translate(o.w, 0); f.x.scale(-1, 1); f.x.drawImage(o.c, 0, 0);
    parts.pec = R.part(f, o.w - 1, 1);
  }
  const rig = { kind: 'fish', parts, len: L * 1.22, height: H, foot: H * 0.5 };
  // anim: {phase, speed 0..1}; facing 1 = right
  rig.draw = (ctx, x, y, facing, angle, anim, opts = {}) => {
    const k = (opts.scale || 1) / RIG_PX, ph = anim.phase || 0, sw = 0.25 + (anim.speed || 0) * 0.55;
    const img = p => (opts.white ? spriteWhite(p).c : p.c);
    ctx.save(); ctx.translate(x, y); ctx.rotate(angle * facing); ctx.scale(k * facing, k);
    // tail swings around its root
    const ta = Math.sin(ph) * sw;
    ctx.save(); ctx.translate(parts.tailRootX + 1, 0); ctx.rotate(ta); ctx.drawImage(img(parts.tail), -parts.tail.ox, -parts.tail.oy); ctx.restore();
    ctx.drawImage(img(parts.body), -parts.body.ox, -parts.body.oy);
    // pectoral fin flaps
    const pa = Math.sin(ph * 1.3 + 1) * 0.45 + 0.35;
    ctx.save(); ctx.translate(parts.pecX, parts.pecY); ctx.rotate(pa); ctx.drawImage(img(parts.pec), -parts.pec.ox, -parts.pec.oy); ctx.restore();
    ctx.restore();
  };
  rig.main = parts.body;
  return rig;
}

// =========================================================== BIRD
// spec: {len (body px), neck (0..1), legs (0..1), beak: 'spear'|'hook'|'spoon'|'pouch'|'short'|'curve', body, wing, head, beak col, legs col, crest}
function buildBird(s) {
  const L = s.len || 44, H = Math.round(L * 0.5), cols = { back: s.body, mid: s.body, belly: s.belly || R.hi(s.body), dark: s.dark || R.lo2(s.body) };
  const parts = {};
  // body: oval, tail feathers at left
  {
    const w = L + 10, h = H + 6, o = R.mk(w, h), cx = w / 2, cy = h / 2;
    R.ellipse(o, cx + 2, cy, L / 2, H / 2, cols);
    R.dith(o, cx - L / 2 + 4, cy - H / 2 + 2, L - 8, H - 4, R.lo(s.body), 0, 3);
    // tail feathers
    for (let k = -1; k <= 1; k++) { R.px(o, 0, cy + k * 2 - 1, R.lo(s.body), L * 0.2, 2); R.px(o, 0, cy + k * 2 - 1, cols.dark, 1, 2); }
    parts.body = R.part(o, cx, cy);
  }
  // neck + head + beak as one part pivoting at the shoulder
  {
    const nl = Math.round(L * (0.25 + (s.neck || 0.3) * 0.9)), hs = Math.max(5, Math.round(H * 0.55));
    const bl = s.beak === 'spear' || s.beak === 'spoon' ? hs * 1.6 : s.beak === 'pouch' ? hs * 1.5 : s.beak === 'curve' ? hs * 1.3 : hs * 0.7;
    const w = Math.round(hs * 1.6 + bl + 6), h = nl + hs + 6, o = R.mk(w, h);
    const nx = 3, hy = 3;                           // head at top-left, neck runs down to pivot at bottom
    // neck (S-curve for long necks)
    for (let j = 0; j < nl; j++) { const u = j / nl; const bend = s.neck > 0.5 ? Math.sin(u * Math.PI) * hs * 0.5 : 0; const x = nx + hs * 0.35 + bend; R.px(o, x, hy + hs * 0.7 + j, s.body, Math.max(2, hs * 0.3), 1); R.px(o, x, hy + hs * 0.7 + j, cols.dark, 1, 1); R.px(o, x + Math.max(2, hs * 0.3) - 1, hy + hs * 0.7 + j, cols.dark, 1, 1); }
    // head
    R.ellipse(o, nx + hs / 2, hy + hs / 2, hs / 2, hs / 2, { back: s.head || s.body, mid: s.head || s.body, belly: R.hi(s.head || s.body), dark: cols.dark });
    if (s.crest) for (let k = 0; k < 3; k++) R.px(o, nx + hs * 0.2 - k * 2, hy - 1 - k, s.crest, 2, 2);
    // eye
    R.px(o, nx + hs * 0.6, hy + hs * 0.32, '#ffffff', 2, 2); R.px(o, nx + hs * 0.6 + 1, hy + hs * 0.32, '#101010', 1, 2);
    // beak
    const bx = nx + hs, by = hy + hs * 0.45, bc = s.beakCol || '#e0b040';
    if (s.beak === 'spear') { for (let i = 0; i < bl; i++) R.px(o, bx + i, by - 1 + Math.round(i * 0.08), bc, 1, Math.max(1, 3 - i / (bl / 3))); R.px(o, bx, by + 1, R.lo(bc), bl * 0.5, 1); }
    else if (s.beak === 'spoon') { R.px(o, bx, by, bc, bl * 0.65, 2); R.px(o, bx + bl * 0.65, by - 1, bc, bl * 0.35, 4); }
    else if (s.beak === 'pouch') { R.px(o, bx, by - 1, bc, bl, 2); R.px(o, bx, by + 1, R.lo(bc), bl * 0.7, 3); }
    else if (s.beak === 'hook') { R.px(o, bx, by - 1, bc, bl, 2); R.px(o, bx + bl - 2, by + 1, R.lo(bc), 2, 2); }
    else if (s.beak === 'curve') { for (let i = 0; i < bl; i++) R.px(o, bx + i, by + Math.round(i * i * 0.06), bc, 1, 2); }
    else { R.px(o, bx, by, bc, bl, 2); }
    parts.head = R.part(o, nx + hs * 0.5, hy + hs * 0.7 + nl);   // pivot = base of neck
    parts.neckLen = nl;
    // flight head: neck runs horizontally, pivot at its root on the left, beak forward
    { const fl = Math.round(nl * (s.neck > 0.5 ? 0.45 : 0.8)), w2 = fl + hs + bl + 6, h2 = hs + 6, f = R.mk(w2, h2), hy2 = 3;
      for (let i = 0; i < fl; i++) { R.px(f, i, hy2 + hs * 0.35, s.body, 1, Math.max(2, hs * 0.3)); R.px(f, i, hy2 + hs * 0.35, cols.dark); R.px(f, i, hy2 + hs * 0.35 + Math.max(2, hs * 0.3) - 1, cols.dark); }
      const hx2 = fl;
      R.ellipse(f, hx2 + hs / 2, hy2 + hs / 2, hs / 2, hs / 2, { back: s.head || s.body, mid: s.head || s.body, belly: R.hi(s.head || s.body), dark: cols.dark });
      R.px(f, hx2 + hs * 0.6, hy2 + hs * 0.32, '#ffffff', 2, 2); R.px(f, hx2 + hs * 0.6 + 1, hy2 + hs * 0.32, '#101010', 1, 2);
      const bx2 = hx2 + hs, by2 = hy2 + hs * 0.45;
      if (s.beak === 'spear') { for (let i = 0; i < bl; i++) R.px(f, bx2 + i, by2 - 1 + Math.round(i * 0.08), bc, 1, Math.max(1, 3 - i / (bl / 3))); }
      else if (s.beak === 'spoon') { R.px(f, bx2, by2, bc, bl * 0.65, 2); R.px(f, bx2 + bl * 0.65, by2 - 1, bc, bl * 0.35, 4); }
      else if (s.beak === 'pouch') { R.px(f, bx2, by2 - 1, bc, bl, 2); R.px(f, bx2, by2 + 1, R.lo(bc), bl * 0.7, 3); }
      else if (s.beak === 'hook') { R.px(f, bx2, by2 - 1, bc, bl, 2); R.px(f, bx2 + bl - 2, by2 + 1, R.lo(bc), 2, 2); }
      else if (s.beak === 'curve') { for (let i = 0; i < bl; i++) R.px(f, bx2 + i, by2 + Math.round(i * i * 0.06), bc, 1, 2); }
      else R.px(f, bx2, by2, bc, bl, 2);
      parts.headFly = R.part(f, 0, hy2 + hs * 0.5);
    }
  }
  // wing: pivots at the shoulder, drawn folded when standing
  {
    const wl = Math.round(L * 0.95), wh = Math.round(H * 0.42);
    const o = R.mk(wl + 2, wh + 2);
    for (let i = 0; i < wl; i++) { const u = i / wl; const hh = Math.round(wh * (u < 0.7 ? 0.6 + 0.4 * u : 1 - (u - 0.7) / 0.3 * 0.7)); R.px(o, i, 0, s.wing || R.lo(s.body), 1, hh); if (i % 4 === 0) R.px(o, i, 0, R.lo(s.wing || s.body), 1, hh); R.px(o, i, hh - 1, cols.dark); }
    // primaries
    for (let k = 0; k < 4; k++) R.px(o, wl - 2 - k * 3, wh * 0.5, cols.dark, 1, wh * 0.5);
    parts.wing = R.part(o, 1, 1);   // pivot at the leading root (drawn pointing left = trailing)
  }
  // leg
  {
    const ll = Math.max(6, Math.round(L * (0.3 + (s.legs || 0.3) * 1.2)));
    const o = R.mk(6, ll + 3);
    R.px(o, 2, 0, s.legCol || '#4a4a3a', 2, ll); R.px(o, 0, ll, s.legCol || '#4a4a3a', 6, 1); R.px(o, 2, ll * 0.5, R.lo(s.legCol || '#4a4a3a'), 2, 1);
    parts.leg = R.part(o, 3, 0); parts.legLen = ll;
  }
  const rig = { kind: 'bird', parts, len: L + parts.neckLen * 0.6, height: H + parts.legLen, foot: H * 0.35 + parts.legLen, flyLen: L * 1.9 };
  // anim: {phase, mode: 'stand'|'fly'|'dive'|'swim', speed}
  rig.draw = (ctx, x, y, facing, angle, anim, opts = {}) => {
    const k = (opts.scale || 1) / RIG_PX, ph = anim.phase || 0, mode = anim.mode || 'stand';
    const img = p => (opts.white ? spriteWhite(p).c : p.c);
    ctx.save(); ctx.translate(x, y); ctx.rotate(angle * facing); ctx.scale(k * facing, k);
    const P = parts, shoulderX = L * 0.15, shoulderY = -H * 0.3;
    if (mode === 'fly' || mode === 'dive') {
      // wings beat together around the shoulder: up-stroke points above the back, down-stroke below the belly
      const flap = mode === 'dive' ? 0.9 : Math.sin(ph) * 1.0;
      const wingA = Math.PI + 0.25 + flap * 0.85;  // pointing back-left, swung by the stroke
      ctx.save(); ctx.translate(shoulderX + 2, shoulderY + 2); ctx.rotate(wingA + 0.18); ctx.globalAlpha *= 0.7; ctx.scale(1, -0.9); ctx.drawImage(img(P.wing), -P.wing.ox, -P.wing.oy); ctx.restore();
      ctx.drawImage(img(P.body), -P.body.ox, -P.body.oy);
      // trailing legs
      ctx.save(); ctx.translate(-L * 0.25, H * 0.2); ctx.rotate(1.15); ctx.scale(1, 0.6); ctx.drawImage(img(P.leg), -P.leg.ox, -P.leg.oy); ctx.restore();
      // head with the neck stretched forward (herons tuck theirs)
      const hf = P.headFly; ctx.save(); ctx.translate(L * 0.42, -H * 0.1); ctx.drawImage(img(hf), -hf.ox, -hf.oy); ctx.restore();
      ctx.save(); ctx.translate(shoulderX, shoulderY); ctx.rotate(wingA); ctx.scale(1, -1); ctx.drawImage(img(P.wing), -P.wing.ox, -P.wing.oy); ctx.restore();
    } else if (mode === 'swim') {
      // paddling low in the water, neck up
      ctx.save(); ctx.translate(0, H * 0.15); ctx.drawImage(img(P.body), -P.body.ox, -P.body.oy); ctx.restore();
      ctx.save(); ctx.translate(shoulderX, shoulderY + 4); ctx.scale(-1, 0.85); ctx.drawImage(img(P.wing), -P.wing.ox, -P.wing.oy); ctx.restore();
      ctx.save(); ctx.translate(L * 0.32, -H * 0.15); ctx.rotate(0.1 + Math.sin(ph * 0.5) * 0.05); ctx.drawImage(img(P.head), -P.head.ox, -P.head.oy); ctx.restore();
    } else {
      // standing / wading / swimming: legs, body, folded wing, upright neck
      const stride = mode === 'walk' ? Math.sin(ph) * 0.5 : 0;
      if (mode !== 'swim') {
        ctx.save(); ctx.translate(-L * 0.05, H * 0.35); ctx.rotate(stride); ctx.drawImage(img(P.leg), -P.leg.ox, -P.leg.oy); ctx.restore();
        ctx.save(); ctx.translate(L * 0.12, H * 0.35); ctx.rotate(-stride); ctx.drawImage(img(P.leg), -P.leg.ox, -P.leg.oy); ctx.restore();
      }
      ctx.drawImage(img(P.body), -P.body.ox, -P.body.oy);
      ctx.save(); ctx.translate(shoulderX, shoulderY + 2); ctx.scale(-1, 0.85); ctx.drawImage(img(P.wing), -P.wing.ox, -P.wing.oy); ctx.restore();
      const bob = (anim.peck || 0);
      ctx.save(); ctx.translate(L * 0.32, -H * 0.3); ctx.rotate(0.12 + bob * 1.1 + Math.sin(ph * 0.5) * 0.04); ctx.drawImage(img(P.head), -P.head.ox, -P.head.oy); ctx.restore();
    }
    ctx.restore();
  };
  rig.main = parts.body;
  return rig;
}

// =========================================================== QUADRUPED
// spec: {len, h, legs (0..1 length), snout (0..1), ears, antlers, horns, tusks, tail: 'short'|'long'|'bushy'|'none', body, belly, dark, pattern: 'none'|'spots'|'stripes'|'mask', mane}
function buildQuad(s) {
  const L = s.len || 60, H = Math.round(L * (s.h || 0.42)), cols = { back: s.body, mid: s.body, belly: s.belly || R.hi(s.body), dark: s.dark || R.lo2(s.body) };
  const parts = {};
  {
    const w = L + 6, h = H + 6, o = R.mk(w, h), cx = w / 2, cy = h / 2;
    R.ellipse(o, cx, cy, L / 2, H / 2, cols, { taper: f => 1 });
    R.dith(o, cx - L / 2 + 3, cy - H / 2 + 2, L - 6, H - 4, R.lo(s.body), 0, 3);
    R.px(o, cx - L / 2 + 4, cy - H / 2 + 1, R.hi(s.body), L - 8, 1);
    if (s.pattern === 'spots') for (let k = 0; k < 10; k++) R.px(o, cx - L / 2 + 4 + ihash(k, 11) * (L - 10), cy - H / 2 + 2 + ihash(k, 12) * (H - 6), s.spot || '#f0ead8', 2, 2);
    if (s.pattern === 'stripes') for (let k = 0; k < 6; k++) R.dith(o, cx - L / 2 + 6 + k * (L / 6.5), cy - H / 2 + 1, 3, H - 2, cols.dark, k % 2, 1);
    if (s.pattern === 'bands') for (let k = 0; k < 7; k++) R.px(o, cx - L / 2 + 3 + k * (L / 7.5), cy - H / 2 + 1, cols.dark, 1, H * 0.6);
    if (s.mane) R.px(o, cx + L * 0.1, cy - H / 2 - 2, s.mane, L * 0.3, 3);
    parts.body = R.part(o, cx, cy);
  }
  // head with snout, pivot at neck base (left side of the head canvas)
  {
    const hs = Math.max(8, Math.round(H * 0.7)), sn = Math.round(hs * (0.4 + (s.snout || 0.4) * 0.9));
    const w = hs + sn + 8, h = hs + 12, o = R.mk(w, h), hy = 8;
    R.ellipse(o, 3 + hs / 2, hy + hs / 2, hs / 2, hs / 2, { back: s.head || s.body, mid: s.head || s.body, belly: R.hi(s.head || s.body), dark: cols.dark });
    // snout
    for (let i = 0; i < sn; i++) { const u = i / sn; const hh = Math.round(hs * 0.5 * (1 - u * 0.45)); R.px(o, 3 + hs - 1 + i, hy + hs * 0.5 - hh * 0.5, s.head || s.body, 1, hh); R.px(o, 3 + hs - 1 + i, hy + hs * 0.5 - hh * 0.5, cols.dark); R.px(o, 3 + hs - 1 + i, hy + hs * 0.5 + hh * 0.5 - 1, cols.dark); }
    R.px(o, 3 + hs + sn - 2, hy + hs * 0.35, '#1a1a1a', 2, 2);   // nose
    R.px(o, 3 + hs + sn - 4, hy + hs * 0.6, cols.dark, 3, 1);       // mouth
    if (s.mask) R.px(o, 3 + hs * 0.35, hy + hs * 0.25, cols.dark, hs * 0.55, hs * 0.22);
    R.px(o, 3 + hs * 0.55, hy + hs * 0.3, '#ffffff', 3, 2); R.px(o, 3 + hs * 0.55 + 1, hy + hs * 0.3, s.eye || '#101010', 2, 2);
    // ears
    const ec = s.head || s.body;
    if (s.ears !== 'none') { const el = s.ears === 'long' ? hs * 0.6 : hs * 0.32; R.px(o, 3 + hs * 0.15, hy - el + 2, ec, 3, el); R.px(o, 3 + hs * 0.15, hy - el + 2, cols.dark, 1, el); R.px(o, 3 + hs * 0.15 + 1, hy - el + 3, R.hi(ec), 1, el * 0.5); R.px(o, 3 + hs * 0.45, hy - el * 0.8 + 2, ec, 3, el * 0.8); R.px(o, 3 + hs * 0.45 + 2, hy - el * 0.8 + 2, cols.dark, 1, el * 0.8); }
    if (s.antlers) { const ac = '#6b4a2a'; for (let k = 0; k < 6; k++) { R.px(o, 3 + hs * 0.3, hy - k, ac, 1, 1); R.px(o, 3 + hs * 0.3 + (k % 2 ? 1 : -1) * Math.floor(k / 2), hy - k - 1, ac, 1, 1); } R.px(o, 3 + hs * 0.3 - 3, hy - 4, ac, 7, 1); R.px(o, 3 + hs * 0.3 - 4, hy - 6, ac, 1, 3); R.px(o, 3 + hs * 0.3 + 4, hy - 7, ac, 1, 4); }
    if (s.tusks) { R.px(o, 3 + hs + sn - 4, hy + hs * 0.62, '#f0e8d8', 1, 3); R.px(o, 3 + hs + sn - 5, hy + hs * 0.62 + 2, '#f0e8d8', 1, 2); }
    parts.head = R.part(o, 3, hy + hs * 0.5);
  }
  // leg (upper+lower with a hoof/paw), pivot at hip
  {
    const ll = Math.max(6, Math.round(H * (0.6 + (s.legs || 0.5) * 0.9)));
    const o = R.mk(7, ll + 3), lc = s.legCol || s.body;
    R.px(o, 2, 0, lc, 3, ll * 0.55); R.px(o, 2, ll * 0.55, R.lo(lc), 2, ll * 0.45); R.px(o, 1, ll, s.hoof || cols.dark, 4, 2);
    R.px(o, 2, 0, cols.dark, 1, ll); R.px(o, 4, 0, cols.dark, 1, ll * 0.55);
    parts.leg = R.part(o, 3, 0); parts.legLen = ll;
  }
  // tail, pivot at base
  {
    const tl = s.tail === 'long' || s.tail === 'bushy' ? Math.round(L * 0.5) : s.tail === 'none' ? 0 : Math.round(L * 0.15);
    const o = R.mk(Math.max(1, tl + 2), s.tail === 'bushy' ? 7 : 4), tc = s.tailCol || s.body;
    if (tl) { for (let i = 0; i < tl; i++) { const th = s.tail === 'bushy' ? 3 + Math.round(Math.sin(i / tl * Math.PI) * 3) : 2; R.px(o, i, (o.h - th) / 2, tc, 1, th); if (s.tail === 'bushy' && i % 4 < 2) R.px(o, i, (o.h - th) / 2, R.lo(tc), 1, th); } if (s.tailTip) R.px(o, 0, (o.h - 3) / 2, s.tailTip, 3, 3); }
    parts.tail = R.part(o, o.w - 1, o.h / 2); parts.tailLen = tl;
  }
  const rig = { kind: 'quad', parts, len: L + parts.head.w * 0.5, height: H + parts.legLen, foot: H * 0.3 + parts.legLen };
  // anim: {phase, speed, graze}
  rig.draw = (ctx, x, y, facing, angle, anim, opts = {}) => {
    const k = (opts.scale || 1) / RIG_PX, ph = anim.phase || 0, sp = anim.speed || 0;
    const img = p => (opts.white ? spriteWhite(p).c : p.c);
    ctx.save(); ctx.translate(x, y); ctx.rotate(angle * facing); ctx.scale(k * facing, k);
    const P = parts, hipY = H * 0.3, bob = Math.abs(Math.sin(ph)) * -sp * 1.5;
    ctx.translate(0, bob);
    // far legs
    const gait = a => Math.sin(ph + a) * 0.55 * sp;
    ctx.save(); ctx.translate(-L * 0.33, hipY); ctx.rotate(gait(Math.PI)); ctx.globalAlpha = 0.75; ctx.drawImage(img(P.leg), -P.leg.ox, -P.leg.oy); ctx.restore();
    ctx.save(); ctx.translate(L * 0.3, hipY); ctx.rotate(gait(0)); ctx.globalAlpha = 0.75; ctx.drawImage(img(P.leg), -P.leg.ox, -P.leg.oy); ctx.restore();
    // tail
    if (P.tailLen) { ctx.save(); ctx.translate(-L * 0.48, -H * 0.2); ctx.rotate(Math.sin(ph * 0.7) * 0.25 + (s.tail === 'long' ? 0.5 : -0.2)); ctx.drawImage(img(P.tail), -P.tail.ox, -P.tail.oy); ctx.restore(); }
    ctx.drawImage(img(P.body), -P.body.ox, -P.body.oy);
    // near legs
    ctx.save(); ctx.translate(-L * 0.3, hipY); ctx.rotate(gait(0)); ctx.drawImage(img(P.leg), -P.leg.ox, -P.leg.oy); ctx.restore();
    ctx.save(); ctx.translate(L * 0.33, hipY); ctx.rotate(gait(Math.PI)); ctx.drawImage(img(P.leg), -P.leg.ox, -P.leg.oy); ctx.restore();
    // head: lowered when grazing
    ctx.save(); ctx.translate(L * 0.42, -H * 0.3); ctx.rotate((anim.graze || 0) * 0.9 - 0.1 + Math.sin(ph * 0.5) * 0.03); ctx.drawImage(img(P.head), -P.head.ox, -P.head.oy); ctx.restore();
    ctx.restore();
  };
  rig.main = parts.body;
  return rig;
}

// =========================================================== BIPED (people)
// spec: {len (height px), skin, shirt, pants, hair, hat, rifle, rod}
function buildBiped(s) {
  const Hh = s.len || 60, W = Math.round(Hh * 0.36), parts = {};
  const dark = '#1a1410';
  { // torso + head, pivot at hips
    const o = R.mk(W + 6, Math.round(Hh * 0.62) + 4), cx = o.w / 2;
    const headR = Math.round(Hh * 0.09), torsoH = Math.round(Hh * 0.32), neckY = 3 + headR * 2 + 1;

    R.ellipse(o, cx, 3 + headR, headR, headR, { back: s.hair || '#3a2a1a', mid: s.skin, belly: s.skin, dark });

    R.px(o, cx - W / 2 + 2, neckY, R.hi(s.shirt), 2, torsoH * 0.5);

    const al = Math.round(Hh * 0.3), o = R.mk(5, al + 2);

    parts.arm = R.part(o, 2, 1); parts.armLen = al;
  }
  { // leg, pivot at hip
    const ll = Math.round(Hh * 0.42), o = R.mk(6, ll + 3);
    R.px(o, 1, 0, s.pants, 4, ll); R.px(o, 1, 0, dark, 1, ll); R.px(o, 0, ll, s.boots || '#222', 6, 3);
    parts.leg = R.part(o, 3, 0); parts.legLen = ll;

  if (s.rod) { const o = R.mk(Math.round(Hh * 0.7), 3); R.px(o, 0, 1, '#3a2a1a', o.w, 1); parts.rod = R.part(o, 2, 1); }

  rig.draw = (ctx, x, y, facing, angle, anim, opts = {}) => {
    const k = (opts.scale || 1) / RIG_PX, ph = anim.phase || 0, sp = anim.speed || 0;

    ctx.save(); ctx.translate(1, hipY); ctx.rotate(swing); ctx.drawImage(img(P.leg), -P.leg.ox, -P.leg.oy); ctx.restore();
    ctx.drawImage(img(P.torso), -P.torso.ox, -P.torso.oy + hipY);

    const panic = anim.panic || 0;
    const armA = anim.aim ? -Math.PI / 2 + 0.1 : panic ? -Math.PI + Math.sin(ph * 3) * 0.5 : swing * 0.8;
    ctx.save(); ctx.translate(-2, sh); ctx.rotate(-armA * 0.5); ctx.globalAlpha = 0.8; ctx.drawImage(img(P.arm), -P.arm.ox, -P.arm.oy); ctx.restore();
    ctx.save(); ctx.translate(2, sh); ctx.rotate(armA);
    ctx.drawImage(img(P.arm), -P.arm.ox, -P.arm.oy);
    if (P.rifle && anim.aim) { ctx.translate(0, P.armLen - 2); ctx.rotate(Math.PI / 2 + 0.05); ctx.drawImage(img(P.rifle), -P.rifle.ox, -P.rifle.oy); }

    ctx.restore();
    ctx.restore();
  };
  rig.main = parts.torso;
  return rig;
}

// spec: {base, band, belly, dark, eye, pattern: 'bands'|'blotch'|'plain', hood}
const snakeCache = new Map();
function snakeParts(spec) {
  if (snakeCache.has(spec.id)) return snakeCache.get(spec.id);
  const S = 12, parts = {};                              // segment is 12x12 at RIG_PX
  const seg = (v) => {
    const o = R.mk(S, S);
    R.px(o, 0, 2, R.lo2(spec.dark), S, 1); R.px(o, 0, 3, spec.base, S, 3); R.px(o, 0, 6, R.lo(spec.base), S, 3); R.px(o, 0, 9, spec.belly, S, 2); R.px(o, 0, 11, R.lo2(spec.dark), S, 1);
    R.dith(o, 0, 3, S, 6, R.lo(spec.base), v, 3);        // keeled scales
    R.px(o, 0, 3, R.hi(spec.base), S, 1);
    if (spec.pattern === 'bands' && v === 0) { R.px(o, 2, 2, spec.band, 6, 8); R.px(o, 3, 3, R.hi(spec.band), 1, 2); }
    if (spec.pattern === 'blotch') { R.px(o, v ? 1 : 5, 3, spec.band, 5, 4); R.px(o, v ? 2 : 6, 4, R.hi(spec.band), 2, 1); R.px(o, v ? 7 : 1, 6, spec.band, 3, 3); }
    for (let i = 1; i < S; i += 4) R.px(o, i, 10, R.lo(spec.belly), 1, 1);
    return R.part(o, S / 2, S / 2 + 1);
  };
  parts.segs = [seg(0), seg(1)];
  { const w = 20, o = R.mk(w, S);
    for (let i = 0; i < w; i++) { const u = i / w, hh = Math.round(4.5 * (u < 0.6 ? 1 : 1 - (u - 0.6) * 1.5)); R.px(o, i, 6 - hh, spec.base, 1, hh); R.px(o, i, 6, R.lo(spec.base), 1, hh - 1); R.px(o, i, 6 - hh, R.lo2(spec.dark)); R.px(o, i, 6 + hh - 2, R.lo2(spec.dark)); }
    R.px(o, 0, 8, spec.belly, w - 4, 2);
    if (spec.hood) { R.px(o, 2, 1, spec.base, 8, 1); R.px(o, 2, 0, R.lo2(spec.dark), 8, 1); }
    R.px(o, 12, 3, spec.eye || '#c0a030', 2, 2); R.px(o, 13, 3, '#101010', 1, 2);
    R.px(o, w - 2, 6, spec.tongue || '#e02020', 2, 1); R.px(o, w - 1, 7, spec.tongue || '#e02020', 1, 1);
    R.px(o, 6, 4, R.lo2(spec.dark), 1, 1); R.px(o, 9, 5, R.lo2(spec.dark), 1, 1);
    parts.head = R.part(o, 4, 6); }

}
function buildSnakeDisplay(spec) {
  const P = snakeParts(spec), n = Math.min(spec.n || 12, 14), sp = 10;
  const rig = { kind: 'snake', parts: { body: P.segs[0] }, len: sp * (n + 1) * 0.7, height: 24, foot: 6 };
  rig.draw = (ctx, x, y, facing, angle, anim, opts = {}) => {
    const k = (opts.scale || 1) / RIG_PX, ph = anim.phase || 0, img = p => (opts.white ? spriteWhite(p).c : p.c);
    ctx.save(); ctx.translate(x, y); ctx.rotate(angle * facing); ctx.scale(k * facing, k);
    for (let i = n; i >= 1; i--) { const u = i / n, sx = -i * sp * 0.7 + sp * n * 0.3, sy = Math.sin(ph + i * 0.8) * 6 * u; const s = P.segs[i % 2]; ctx.drawImage(img(s), Math.round(sx - s.ox), Math.round(sy - s.oy)); }
    ctx.drawImage(img(P.head), Math.round(sp * n * 0.3 - P.head.ox), Math.round(-P.head.oy));
    ctx.restore();
  };
  rig.main = P.segs[0];

}
// =========================================================== SNAIL
function buildSnail(s) {
  const L = s.len || 18, parts = {}, dark = R.lo2(s.shell);
  { const o = R.mk(L + 4, L + 2), cx = o.w / 2, cy = L * 0.5;
    R.ellipse(o, cx + 1, cy, L * 0.45, L * 0.42, { back: s.shell, mid: s.shell, belly: R.lo(s.shell), dark });
    // spiral
    for (let k = 0; k < 4; k++) { const rr = L * 0.42 - k * L * 0.1; R.px(o, cx + 1 - rr * 0.6, cy - rr * 0.3, R.lo(s.shell), rr * 1.2, 1); }

    R.dith(o, 3, cy - L * 0.3 + 2, L - 4, L * 0.6 - 4, R.lo(s.body), 0, 3);
    for (let k = 0; k < 8; k++) R.px(o, 3 + ihash(k, 31) * (L - 6), cy - L * 0.3 + 2 + ihash(k, 32) * (L * 0.5), s.spot || R.hi(s.body), 2, 1);

/* ===== src/particles.js ===== */
'use strict';
// Particle + popup system. Particles live in world space, are drawn in screen space (crisp pixels at any zoom).
const BLOOD_COLORS = ['#8a0b0b', '#b31212', '#d42020', '#5c0606', '#a51a1a'];
class FXSystem {
  constructor() { this.list = []; this.clouds = []; this.texts = []; this.max = 2400; }
  clear() { this.list.length = 0; this.clouds.length = 0; this.texts.length = 0; }
  add(p) { if (this.list.length >= this.max) this.list.splice(0, 300); p.t = 0; p.maxLife = p.life; this.list.push(p); return p; }
  // ---------- emitters ----------
  blood(x, y, n, dx = 0, dy = 0, power = 60, colors = BLOOD_COLORS) {
    n = Math.round(n * (G.settings.gore ? 1 : 0.3));
    for (let i = 0; i < n; i++) {
      const a = rand(TAU), sp = rand(0.2, 1) * power;
      this.add({ type: 'blood', x: x + rand(-2, 2), y: y + rand(-2, 2), vx: dx * power * rand(0.3, 1.2) + Math.cos(a) * sp, vy: dy * power * rand(0.3, 1.2) + Math.sin(a) * sp, s: chance(0.3) ? 2 : 1, color: choice(colors), life: rand(1.4, 3.2), settled: false });
    }
  }
  cloud(x, y, r, color = '#6a0a0a', life = 2.6) {
    if (this.clouds.length > 120) this.clouds.shift();
    this.clouds.push({ x, y, r: r * 0.4, r1: r, life, maxLife: life, color, vx: rand(-4, 4), vy: rand(-3, 3), a0: 0.55 });
  }
  gore(x, y, power, dx = 0, dy = 0, big = false) {
    // combined splatter: particles + cloud + chunks (non-edible gristle)
    this.blood(x, y, big ? 70 : 28, dx, dy, power);
    this.cloud(x, y, big ? 40 : 18);
    for (let i = 0; i < (big ? 8 : 3); i++) {
      const a = rand(TAU), sp = rand(0.4, 1) * power * 0.8;
      this.add({ type: 'gristle', x, y, vx: Math.cos(a) * sp + dx * power * 0.5, vy: Math.sin(a) * sp + dy * power * 0.5, s: randi(2, 3), color: choice(['#7a1010', '#c04040', '#e8b0a0', '#efe6d6']), life: rand(4, 8), rot: rand(TAU), settled: false });
    }
  }
  bubbles(x, y, n, spread = 6, vel = 0) {
    for (let i = 0; i < n; i++) this.add({ type: 'bubble', x: x + rand(-spread, spread), y: y + rand(-spread, spread), vx: rand(-8, 8), vy: rand(-30, -5) + vel, s: chance(0.3) ? 2 : 1, seed: rand(TAU), life: rand(1.5, 3.5) });
  }
  splash(x, power = 1, vx = 0) {
    Water.splash(x, clamp(power, 0.2, 4) * 60, 10 + power * 8);
    const surf = World.surface(x);
    const n = Math.round(clamp(power * 14, 5, 60));
    for (let i = 0; i < n; i++) this.add({ type: 'drop', x: x + rand(-8, 8) * power, y: surf - 1, vx: vx * 0.3 + rand(-50, 50) * Math.sqrt(power), vy: -rand(60, 240) * Math.sqrt(power), s: chance(0.4) ? 2 : 1, color: choice(['#cfe9e6', '#9fd0cb', '#ffffff', '#7fb8b2']), life: 2 });
    this.ripple(x, 6 * power, power);
    for (let i = 0; i < Math.round(power * 6); i++) this.add({ type: 'foam', x: x + rand(-14, 14) * power, y: surf, vx: rand(-20, 20), vy: 0, s: 1, life: rand(0.6, 1.6) });
  }
  ripple(x, r = 6, power = 1) { Water.splash(x, power * 12, 6); this.add({ type: 'ripple', x, y: World.surface(x), r, gr: 40 * power, life: 0.9 + power * 0.3, alpha: 0.7 }); }
  // silt kicked up off the bottom
  silt(x, y, n = 6, power = 30) { for (let i = 0; i < n; i++) this.add({ type: 'silt', x: x + rand(-4, 4), y: y - 2, vx: rand(-1, 1) * power, vy: -rand(0.2, 1) * power, s: rand(2, 5), color: choice(['#5a4a34', '#6b5a44', '#4a3c2a']), life: rand(1.5, 3.2) }); }
  leaf(x, y, color = '#4f7a2a') { this.add({ type: 'leaf', x, y, vx: rand(-20, 20), vy: rand(-10, 10), s: 2, color, seed: rand(TAU), life: rand(3, 6) }); }
  // a footprint or drag mark pressed into the shore mud
  print(x, y, w, dir) { this.add({ type: 'print', x, y, w, dir, life: 40 }); }
  feathers(x, y, n, color = '#f0f0e8') { for (let i = 0; i < n; i++) this.add({ type: 'feather', x, y, vx: rand(-60, 60), vy: rand(-90, 10), s: 1, color: chance(0.7) ? color : '#b8b8b0', seed: rand(TAU), life: rand(2.5, 5) }); }
  sparks(x, y, n, dx = 0, dy = 0) { for (let i = 0; i < n; i++) { const a = rand(TAU), sp = rand(40, 180); this.add({ type: 'spark', x, y, vx: Math.cos(a) * sp + dx * 80, vy: Math.sin(a) * sp + dy * 80, s: 1, color: choice(['#fff8c0', '#ffd060', '#ff9030']), life: rand(0.15, 0.4) }); } }
  splinters(x, y, n, power = 100) { for (let i = 0; i < n; i++) { const a = rand(TAU), sp = rand(0.3, 1) * power; this.add({ type: 'splinter', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60, s: randi(1, 3), w: randi(2, 6), color: choice(['#6b4a2e', '#8a6a44', '#4a3524', '#a0a0a0']), rot: rand(TAU), vr: rand(-6, 6), life: rand(5, 9) }); } }
  smoke(x, y, n = 1, color = '#888') { for (let i = 0; i < n; i++) this.add({ type: 'smoke', x: x + rand(-3, 3), y: y + rand(-3, 3), vx: rand(-10, 10), vy: rand(-30, -10), s: rand(2, 4), color, life: rand(0.6, 1.4) }); }
  husk(img, sx, sy, sw, sh, x, y, angle, size, flipY) { this.add({ type: 'husk', img, sx, sy, sw, sh, x, y, angle, size, flipY, vx: rand(-15, 15), vy: rand(-25, 5), vr: rand(-1.2, 1.2), life: rand(2.2, 3.4) }); }
  glow(x, y, r, color, life = 0.5) { this.add({ type: 'glow', x, y, r, color, life }); }
  shock(x, y, r, color = '#ffffff', life = 0.5) { this.add({ type: 'shock', x, y, r0: 4, r, color, life }); }
  flesh(x, y, n, power = 90) { // meat flecks used for boss/large gore
    for (let i = 0; i < n; i++) { const a = rand(TAU), sp = rand(0.3, 1) * power; this.add({ type: 'gristle', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, s: randi(1, 3), color: choice(['#9a1a1a', '#c04040', '#e8a090', '#f0e8d8']), life: rand(3, 7), rot: rand(TAU), settled: false }); }
  }
  text() { /* floating text was retired: feedback is visual now */ }
  _textUnused(x, y, str, opts = {}) {
    if (G.state === 'title' || G.state === 'shed' || G.state === 'codex' || G.state === 'help') return;
    if (this.texts.length > 40) this.texts.shift();
    this.texts.push({ x, y, str, color: opts.color || '#ffffff', scale: opts.scale || 1, life: opts.life || 1.1, maxLife: opts.life || 1.1, vy: opts.vy ?? -30, vx: opts.vx || 0, outline: opts.outline || '#000000', shake: opts.shake || 0, t: 0 });
  }
  // ---------- simulation ----------
  update(dt) {
    const L = this.list;
    for (let i = L.length - 1; i >= 0; i--) {
      const p = L[i]; p.life -= dt; p.t += dt;
      if (p.life <= 0) { L[i] = L[L.length - 1]; L.pop(); continue; }
      const surf = World.surface(p.x), under = p.y > surf;
      switch (p.type) {
        case 'blood': case 'gristle': {
          if (p.settled) break;
          if (under) {
            const k = Math.exp(-3.2 * dt); p.vx *= k; p.vy *= k; p.vy += (p.type === 'gristle' ? 40 : 14) * dt;
            if (p.wasAir) { p.wasAir = false; p.vx *= 0.35; p.vy *= 0.3; if (chance(0.25)) this.ripple(p.x, 2, 0.3); }
          } else { p.vy += 720 * dt; p.wasAir = true; }
          p.x += p.vx * dt; p.y += p.vy * dt;
          const fy = World.floorY(p.x);
          if (p.y >= fy - 1) { p.y = fy - 1; p.settled = true; p.life = Math.min(p.life + 3, 6); }
          break;
        }
        case 'bubble': {
          p.vy = approach(p.vy, -70, 90 * dt); p.x += (p.vx + Math.sin(p.t * 7 + p.seed) * 14) * dt; p.y += p.vy * dt;
          if (p.y <= surf) { p.life = 0; if (chance(0.15)) this.ripple(p.x, 2, 0.25); }
          break;
        }
        case 'drop': {
          p.vy += 620 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
          if (p.vy > 0 && p.y >= surf) { p.life = 0; if (chance(0.2)) this.ripple(p.x, 2, 0.3); }
          break;
        }
        case 'foam': { p.x += p.vx * dt; p.y = World.surface(p.x); p.vx *= 0.96; break; }
        case 'ripple': { p.r += p.gr * dt; break; }
        case 'feather': {
          if (under) { p.vy = approach(p.vy, 9, 40 * dt); p.vx *= 0.97; p.x += (p.vx + Math.sin(p.t * 2 + p.seed) * 6) * dt; }
          else { p.vy = approach(p.vy, 28, 120 * dt); p.vx *= 0.99; p.x += (p.vx + Math.sin(p.t * 4 + p.seed) * 22) * dt; }
          p.y += p.vy * dt; break;
        }
        case 'spark': { p.vy += 250 * dt; p.x += p.vx * dt; p.y += p.vy * dt; break; }
        case 'splinter': {
          if (under) { p.vy = approach(p.vy, p.y > surf + 3 ? -35 : 0, 160 * dt); p.vx *= 0.97; p.vr *= 0.9; if (p.y < surf + 3) p.y = surf + Math.sin(p.t * 3) * 1.2; }
          else { p.vy += 560 * dt; }
          p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; break;
        }
        case 'smoke': { p.x += p.vx * dt; p.y += p.vy * dt; p.s += 3 * dt; break; }
        case 'silt': { p.vx *= 0.96; p.vy = approach(p.vy, 6, 20 * dt); p.x += p.vx * dt; p.y += p.vy * dt; p.s += 4 * dt; const fy = World.floorY(p.x); if (p.y > fy - 1) p.y = fy - 1; break; }
        case 'leaf': { if (under) { p.vy = approach(p.vy, 5, 30 * dt); p.vx *= 0.96; } else { p.vy = approach(p.vy, 22, 60 * dt); p.x += Math.sin(p.t * 3 + p.seed) * 18 * dt; } p.x += p.vx * dt; p.y += p.vy * dt; const fy2 = World.floorY(p.x); if (p.y > fy2 - 1) { p.y = fy2 - 1; p.vx = 0; p.vy = 0; } break; }
        case 'rain': {
          p.x += p.vx * dt; p.y += p.vy * dt;
          if (p.y >= surf) { p.life = 0; Water.splash(p.x, 9, 5); if (chance(0.35)) this.add({ type: 'drop', x: p.x, y: surf - 1, vx: rand(-30, 30), vy: -rand(40, 110), s: 1, color: '#d8f0ee', life: 0.6 }); }
          else { const fy3 = World.floorY(p.x); if (fy3 < 0 && p.y >= fy3) { p.life = 0; if (chance(0.3)) this.add({ type: 'drop', x: p.x, y: fy3 - 1, vx: rand(-20, 20), vy: -rand(20, 60), s: 1, color: '#c8d8d0', life: 0.35 }); } }
          break;
        }
        case 'print': break;
        case 'suck': { const [sx, sy] = G.player.snout; const k = Math.min(1, 16 * dt); p.x = lerp(p.x, sx, k); p.y = lerp(p.y, sy, k); break; }
        case 'husk': { p.vy += (under ? 10 : 300) * dt; if (under) { p.vx *= 0.98; p.vy *= 0.97; } p.x += p.vx * dt; p.y += p.vy * dt; p.angle += p.vr * dt; break; }
        default: break;
      }
    }
    const C = this.clouds;
    for (let i = C.length - 1; i >= 0; i--) { const c = C[i]; c.life -= dt; if (c.life <= 0) { C.splice(i, 1); continue; } c.r = lerp(c.r, c.r1, 1 - Math.exp(-2 * dt)); c.x += c.vx * dt; c.y += c.vy * dt; }
    const T = this.texts;
    for (let i = T.length - 1; i >= 0; i--) { const t = T[i]; t.life -= dt; t.t += dt; if (t.life <= 0) { T.splice(i, 1); continue; } t.y += t.vy * dt; t.x += t.vx * dt; t.vy *= 0.95; }
  }
  // ---------- rendering ----------
  drawClouds(ctx, cam) {
    for (const c of this.clouds) {
      const [sx, sy] = cam.toScreen(c.x, c.y); const r = c.r * cam.zoom;
      if (sx < -r || sx > G.W + r || sy < -r || sy > G.H + r) continue;
      ctx.globalAlpha = c.a0 * (c.life / c.maxLife);
      ctx.fillStyle = c.color; ctx.beginPath(); ctx.ellipse(sx, sy, r, r * 0.75, 0, 0, TAU); ctx.fill();
      ctx.globalAlpha = c.a0 * 0.6 * (c.life / c.maxLife); ctx.beginPath(); ctx.ellipse(sx + r * 0.3, sy - r * 0.2, r * 0.6, r * 0.5, 0, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  draw(ctx, cam) {
    const z = cam.zoom, W = G.W, H = G.H;
    for (const p of this.list) {
      const [sx, sy] = cam.toScreen(p.x, p.y);
      if (sx < -40 || sx > W + 40 || sy < -40 || sy > H + 40) continue;
      const lf = p.life / p.maxLife;
      switch (p.type) {
        case 'blood': { const s = Math.max(1, Math.round(p.s * z)); ctx.globalAlpha = lf < 0.35 ? lf / 0.35 : 1; ctx.fillStyle = p.color; ctx.fillRect(Math.round(sx), Math.round(sy), s, s); break; }
        case 'gristle': { const s = Math.max(1, Math.round(p.s * z)); ctx.globalAlpha = lf < 0.3 ? lf / 0.3 : 1; ctx.fillStyle = p.color; ctx.fillRect(Math.round(sx), Math.round(sy), s, s); if (s > 1) { ctx.fillStyle = '#5a0808'; ctx.fillRect(Math.round(sx), Math.round(sy) + s - 1, Math.max(1, s >> 1), 1); } break; }
        case 'bubble': { const s = Math.max(1, Math.round(p.s * z)); ctx.globalAlpha = 0.7; ctx.fillStyle = '#cfeae8'; ctx.fillRect(Math.round(sx), Math.round(sy), s, s); if (s > 1) { ctx.fillStyle = '#ffffff'; ctx.fillRect(Math.round(sx), Math.round(sy), 1, 1); } break; }
        case 'drop': case 'foam': { const s = Math.max(1, Math.round(p.s * z)); ctx.globalAlpha = p.type === 'foam' ? lf : 0.9; ctx.fillStyle = p.color || '#e8f4f2'; ctx.fillRect(Math.round(sx), Math.round(sy), s, s); break; }
        case 'ripple': { ctx.globalAlpha = p.alpha * lf; ctx.strokeStyle = '#d8f0ee'; ctx.lineWidth = 1; ctx.beginPath(); ctx.ellipse(sx, sy, p.r * z, Math.max(1, p.r * z * 0.22), 0, 0, TAU); ctx.stroke(); break; }
        case 'feather': { const s = Math.max(1, Math.round(2 * z)); ctx.globalAlpha = lf < 0.3 ? lf / 0.3 : 1; ctx.fillStyle = p.color; ctx.fillRect(Math.round(sx), Math.round(sy), s, Math.max(1, s >> 1)); break; }
        case 'spark': { ctx.globalAlpha = lf; ctx.fillStyle = p.color; const s = Math.max(1, Math.round(z)); ctx.fillRect(Math.round(sx), Math.round(sy), s, s); break; }
        case 'splinter': { ctx.globalAlpha = lf < 0.3 ? lf / 0.3 : 1; ctx.fillStyle = p.color; ctx.save(); ctx.translate(sx, sy); ctx.rotate(p.rot); ctx.fillRect(0, 0, Math.max(1, p.w * z), Math.max(1, p.s * z)); ctx.restore(); break; }
        case 'smoke': { ctx.globalAlpha = 0.35 * lf; ctx.fillStyle = p.color; const r = p.s * z; ctx.beginPath(); ctx.arc(sx, sy, r, 0, TAU); ctx.fill(); break; }
        case 'silt': { ctx.globalAlpha = 0.28 * lf; ctx.fillStyle = p.color; const r = p.s * z; ctx.beginPath(); ctx.ellipse(sx, sy, r, r * 0.7, 0, 0, TAU); ctx.fill(); break; }
        case 'leaf': { ctx.globalAlpha = lf < 0.3 ? lf / 0.3 : 1; ctx.fillStyle = p.color; const s = Math.max(1, Math.round(2 * z)); ctx.fillRect(Math.round(sx), Math.round(sy), s, Math.max(1, s >> 1)); break; }
        case 'rain': { ctx.globalAlpha = 0.45; ctx.strokeStyle = '#c8e0e8'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx - p.vx * 0.02 * z, sy - p.vy * 0.02 * z); ctx.stroke(); break; }
        case 'print': { ctx.globalAlpha = 0.5 * Math.min(1, lf * 3); ctx.fillStyle = '#2a1f14'; const w = Math.max(2, Math.round(p.w * z)); ctx.fillRect(Math.round(sx - w / 2), Math.round(sy), w, Math.max(1, Math.round(1.5 * z))); ctx.fillStyle = '#4a3a26'; ctx.fillRect(Math.round(sx - w / 2), Math.round(sy) - 1, w, 1); break; }
        case 'suck': { const k = Math.max(0.05, lf); ctx.save(); ctx.translate(sx, sy); ctx.scale(p.size * z * k * p.facing, p.size * z * k); ctx.drawImage(p.img, -p.w / 2, -p.h / 2); ctx.restore(); break; }

'use strict';
// ---------------------------------------------------------------------------
// Sandbox physics: a simulated water surface, deformable shore mud with tracks,
// silt plumes, reactive vegetation and weather. Everything here is a small
// spring system; the visuals fall out of the state.
// ---------------------------------------------------------------------------
const Water = {
  DX: 4, N: 720, x0: 0, h: null, v: null, t: 0, wind: 0,
  init(cx) { this.h = new Float32Array(this.N); this.v = new Float32Array(this.N); this.x0 = cx - this.N * this.DX / 2; },
  recenter(cx) {
    const mid = this.x0 + this.N * this.DX / 2, shift = Math.round((cx - mid) / this.DX);
    if (Math.abs(shift) < this.N / 6) return;
    const h = new Float32Array(this.N), v = new Float32Array(this.N);
    for (let i = 0; i < this.N; i++) { const j = i + shift; if (j >= 0 && j < this.N) { h[i] = this.h[j]; v[i] = this.v[j]; } }
    this.h = h; this.v = v; this.x0 += shift * this.DX;
  },
  ambient(x) { const t = this.t; return Math.sin(x * 0.021 + t * 2.1) * 1.2 + Math.sin(x * 0.053 - t * 3.3) * 0.7 + Math.sin(x * 0.0071 + t * 0.7) * (1 + this.wind * 2); },
  surface(x) {

  },
  // vertical velocity of the surface at x (for foam and spray)
  velocity(x) { if (!this.h) return 0; const i = Math.round((x - this.x0) / this.DX); return i >= 0 && i < this.N ? this.v[i] : 0; },
  update(dt) {
    if (!this.h) return; this.t += dt;

    dt = Math.min(dt, 1 / 40);
    for (let i = 0; i < N; i++) v[i] += (-h[i] * K - v[i] * D) * dt;
    for (let pass = 0; pass < 3; pass++) {
      for (let i = 1; i < N - 1; i++) v[i] += S * (h[i - 1] + h[i + 1] - 2 * h[i]) * dt / 3;
    }
    for (let i = 0; i < N; i++) { h[i] += v[i] * dt; if (h[i] > 60) h[i] = 60; else if (h[i] < -60) h[i] = -60; }

};

// shore mud: a recovering depression field along x, plus footprints
const Mud = {
  DX: 6, N: 400, x0: 0, d: null,
  init(cx) { this.d = new Float32Array(this.N); this.x0 = cx - this.N * this.DX / 2; },
  recenter(cx) {
    const mid = this.x0 + this.N * this.DX / 2, shift = Math.round((cx - mid) / this.DX);
    if (Math.abs(shift) < this.N / 6) return;
    const d = new Float32Array(this.N);
    for (let i = 0; i < this.N; i++) { const j = i + shift; if (j >= 0 && j < this.N) d[i] = this.d[j]; }

  weed: { top: d => d.y - d.h, water: true }, algae: { top: d => d.y - d.h, water: true }, reed: { top: d => d.top }, cattail: { top: d => d.top },
  sawgrass: { top: d => d.y - 12 * d.s }, palmetto: { top: d => d.y - 16 * d.s }, fern: { top: d => d.y - 13 * d.s }, bush: { top: d => d.y - 12 * d.s },
  hyacinth: { top: d => -10, water: true }, duckweed: { top: d => -3, water: true }, lily: { top: d => -3, water: true },
  cypress: { top: d => d.y - d.h, tree: true, leaf: '#3a6a30' }, oak: { top: d => d.y - d.h, tree: true, leaf: '#4a7a3a' }, palm: { top: d => d.y - d.h, tree: true, leaf: '#5a8a3a' },

'use strict';
// Procedural Everglades: heightmap terrain with banks, chunked decor, sky/day cycle, water rendering.
const World = {
  seed: 1, CHUNK: 640, chunks: new Map(), decor: [], t: 0, onChunkLoad: null,
  reset(seed) { this.seed = seed | 0; this.chunks.clear(); this.decor = []; this.t = 0; },
  // ---------- terrain ----------
  waterFloor(x) { return 360 + fbm(x * 0.0016, this.seed) * 560 + vnoise(x * 0.012, this.seed + 7) * 36; },
  bankN(x) { return fbm(x * 0.0011 + 500, this.seed + 3); },
  bankMask(x) { return smoothstep(0.56, 0.74, this.bankN(x)) * smoothstep(350, 900, Math.abs(x)); },
  landY(x) { const m = this.bankMask(x); return -18 - vnoise(x * 0.009, this.seed + 11) * 22 - m * m * 26; },
  floorY(x) { const m = this.bankMask(x); if (m <= 0) return this.waterFloor(x); return lerp(this.waterFloor(x), this.landY(x), m); },
  isLand(x) { return this.floorY(x) < 0; },
  surface(x) { return Water.surface(x); },
  // nearest x (searching outward) where predicate holds, or null
  findX(fromX, pred, maxD = 4000, step = 24) {
    for (let d = 0; d < maxD; d += step) { if (pred(fromX + d)) return fromX + d; if (pred(fromX - d)) return fromX - d; }
    return null;
  },
  // ---------- chunks ----------
  ensure(px, range) {

'use strict';
// ---------------------------------------------------------------------------
// ANIMAL TRAITS: evolution cards themed on real Everglades animals. Each one
// changes stats AND the crocodile's look. Some are locked behind lifetime
// milestones ("crack and eat 100 snapping turtles") that persist between runs.
// ---------------------------------------------------------------------------
const Meta = {
  data: null,
  DEFAULT: () => ({ eat: {}, ev: {}, unlocked: [], seen: {}, ver: 1 }),
  load() {
    try { this.data = Object.assign(this.DEFAULT(), JSON.parse(localStorage.getItem('chompers.meta') || '{}')); }
    catch (e) { this.data = this.DEFAULT(); }
    if (!this.data.eat) this.data.eat = {}; if (!this.data.ev) this.data.ev = {};
    if (!Array.isArray(this.data.unlocked)) this.data.unlocked = []; if (!this.data.seen) this.data.seen = {};
  },
  save() { try { localStorage.setItem('chompers.meta', JSON.stringify(this.data)); } catch (e) { } },
  eaten(name, n = 1) { this.data.eat[name] = (this.data.eat[name] || 0) + n; this.data.seen[name] = true; },
  event(key, n = 1) { this.data.ev[key] = (this.data.ev[key] || 0) + n; },
  countEat(name) { return this.data.eat[name] || 0; },
  countEv(key) { return this.data.ev[key] || 0; },
  isUnlocked(id) { return this.data.unlocked.indexOf(id) >= 0; },
  unlock(id) { if (!this.isUnlocked(id)) { this.data.unlocked.push(id); this.save(); return true; } return false; },
  // progress on a trait's requirement: [current, needed]
  progress(t) {
    if (!t.unlock) return [1, 1];
    const u = t.unlock;
    let cur = 0;
    if (u.eat) cur = u.eat.reduce((s, n) => s + this.countEat(n), 0);
    else if (u.ev) cur = this.countEv(u.ev);
    return [Math.min(cur, u.need), u.need];
  },
  // called after every kill; returns list of newly unlocked traits
  checkUnlocks() {
    const out = [];
    for (const t of ANIMAL_TRAITS) {
      if (!t.unlock || this.isUnlocked(t.id)) continue;
      const [cur, need] = this.progress(t);
      if (cur >= need && this.unlock(t.id)) out.push(t);
    }
    return out;
  },
};

// ---------------------------------------------------------------------------
// NPC predation: the swamp eats itself
// ---------------------------------------------------------------------------
const Eco = {
  // find prey for a predator: smaller, alive, nearby, not the player
  findPrey(hunter, range, maxSize, filter) {
    let best = null, bestD = range;
    for (const e of G.ents) {
      if (e === hunter || e.dead || e.remove || !e.edible) continue;
      if (e.type === 'gib' || e.type === 'proj' || e.type === 'boat' || e.type === 'structure') continue;
      if (e.sizeClass > maxSize) continue;
      if (filter && !filter(e)) continue;
      const d = dist(hunter.x, hunter.y, e.x, e.y);
      if (d < bestD) { bestD = d; best = e; }
    }
    return best;
  },
  // one animal eats another: gore, a popup if on screen, and score for nobody
  devour(hunter, prey, opts = {}) {
    if (!prey || prey.dead) return;
    G.fx.gore(prey.x, prey.y, 70, 0, 0, prey.mass > 60);
    if (prey.feathers) G.fx.feathers(prey.x, prey.y, 8, prey.feathers);
    prey.gulped = !!opts.whole;
    prey.dead = true; prey.remove = true;
    if (!opts.whole) prey.explode(0.5);
    SFX.crunch(prey.sizeClass, prey.pan);
    if (Math.abs(prey.x - G.player.x) < 400) G.fx.text(prey.x, prey.y - 12, opts.label || 'EATEN', { color: '#c0a0a0', scale: 1 });
  },
};

// bottom crawlers: crayfish, crabs, snails
// ---------------------------------------------------------------------------
class Bottom extends Entity {
  constructor(x, kind) {
    super(x, 0); const d = BOTTOM[kind]; this.useSpecies(kind); this.def = d;
    this.type = 'bottom'; this.y = World.floorY(x) - this.groundOff; this.dir = chance(0.5) ? 1 : -1; this.facing = this.dir; this.layer = -1;
    this.retarget = rand(0.5, 2); this.scuttle = 0; this.bloodColors = ['#7a3010', '#a05020', '#c07040'];
  }
  update(dt) {
    this.tick(dt); const P = G.player;
    this.y = World.floorY(this.x) - this.groundOff;
    this.retarget -= dt;
    const scared = this.senses(60) || (P.st.magnet && this.distTo(P) < P.st.magnet);
    if (scared) { this.dir = sign(this.x - P.x) || 1; this.scuttle = 0.8; }
    if (this.retarget <= 0) { this.retarget = rand(1.5, 4); if (!scared) this.dir = chance(0.5) ? 1 : -1; }
    const sp = this.def.speed * (this.scuttle > 0 ? 2.2 : 1) * (1 - this.slow);
    if (this.scuttle > 0) this.scuttle -= dt;
    this.x += this.dir * sp * dt; this.facing = this.dir;
    if (this.def.pinch && !P.dead && P.size < 1.2 && P.nearestDist(this.x, this.y) < 10 && chance(dt * 1.5)) { P.hurt(this.def.pinch, this, 'bite'); SFX.clank(this.pan); }
    this.anim.phase += dt * (this.scuttle > 0 ? 12 : 4);
    if (chance(dt * 0.4)) G.fx.add({ type: 'foam', x: this.x, y: this.y + 2, vx: 0, vy: 0, s: 1, life: 0.4 });
  }
  takeDamage(dmg, src, opts) {
    if (this.def.shell && this.armor > 0 && (dmg >= this.armor || opts.pierce)) {
      this.armor = 0; G.fx.splinters(this.x, this.y, 6, 60); SFX.splinter(this.pan);
      if (src === G.player) Meta.event('crack');
    }
    return super.takeDamage(dmg, src, opts);
  }
}

class Ray extends Entity {
  constructor(x) {
    super(x, 0); this.useSpecies('ray'); this.type = 'ray';
    this.y = World.floorY(x) - 3; this.buried = true; this.glide = 0; this.retarget = rand(3, 8); this.stingCd = 0; this.layer = -1;
  }
  update(dt) {
    this.tick(dt); const P = G.player; this.stingCd -= dt;
    const near = P.nearestDist(this.x, this.y) < 26 + 6 * P.size;
    if (this.buried) {
      this.y = World.floorY(this.x) - 3; this.vx *= 0.9;
      if (near || this.senses(70)) { this.buried = false; this.glide = rand(1.5, 3); this.vy = -50; this.vx = sign(this.x - P.x) * 60; G.fx.smoke(this.x, this.y + 2, 5, '#6b5a3a'); }
      this.retarget -= dt; if (this.retarget <= 0) { this.retarget = rand(4, 10); this.buried = false; this.glide = rand(1, 2.5); this.vy = -30; this.vx = (chance(0.5) ? 1 : -1) * 40; }
    } else {
      this.glide -= dt; this.vy = approach(this.vy, Math.sin(this.t * 3) * 24, 120 * dt); this.vx = approach(this.vx, sign(this.vx || 1) * 55 * (1 - this.slow), 60 * dt);
      this.move(dt); this.clampWater(6); this.facing = sign(this.vx || 1);
      if (this.glide <= 0 && this.y > World.floorY(this.x) - 14) { this.buried = true; G.fx.smoke(this.x, this.y, 4, '#6b5a3a'); }
    }
    if (near && this.stingCd <= 0 && !P.dead) { this.stingCd = 3; P.hurt(9, this, 'bite'); P.envenom(4, 4); G.fx.text(P.x, P.y - 20, 'STUNG!', { color: '#60ff60' }); SFX.hurt(); }
  }
  draw(ctx) {

class DiveBird extends Bird {

const PATH_ICON = { ripper: 'shark', behemoth: 'manatee', phantom: 'otter', abyssal: 'eel' };
function iconFor(card) {
  if (!card) return null;
  if (card.kind === 'trait') return ICONS[TRAIT_ICON[card.trait.id]] || ICONS.croc;
  if (card.kind === 'path') return ICONS[PATH_ICON[card.path]] || ICONS.croc;
  return ICONS.dragonfly;
}
// Draw an animated icon centred at (x,y), fitted into a box of `box` pixels.
function drawIcon(ctx, icon, x, y, box, t, opts = {}) {
  if (!icon) return;
  const n = icon.frames.length;
  let f = 0, bob = 0, rot = 0, sq = 1;
  switch (icon.kind) {
    case 'swim': f = n > 1 ? Math.floor(t * 7) % n : 0; bob = Math.sin(t * 3) * 0.06; rot = Math.sin(t * 3) * 0.09; break;
    case 'fly': f = n > 1 ? (Math.sin(t * 11) > 0 ? 0 : 1) : 0; bob = Math.sin(t * 5.5) * 0.12; break;
    case 'walk': f = n > 1 ? Math.floor(t * 6) % n : 0; bob = Math.abs(Math.sin(t * 5)) * -0.09; break;
    default: f = n > 1 ? Math.floor(t * 2) % n : 0; sq = 1 + Math.sin(t * 2.4) * 0.05; break;
  }
  const s = icon.frames[f];
  const k = Math.max(1, Math.floor(box / Math.max(s.w, s.h) * icon.scale)) * (opts.scale || 1);
  ctx.save();
  ctx.translate(Math.round(x), Math.round(y + bob * box));
  if (opts.alpha !== undefined) ctx.globalAlpha = opts.alpha;
  if (rot) ctx.rotate(rot);
  ctx.scale(k * (opts.flip ? -1 : 1), k * sq);
  if (opts.shadow) { ctx.globalAlpha = (opts.alpha ?? 1) * 0.35; ctx.drawImage(spriteWhite(s).c, -s.w / 2 + 1, -s.h / 2 + 1); ctx.globalAlpha = opts.alpha ?? 1; }
  ctx.drawImage(s.c, -Math.round(s.w / 2), -Math.round(s.h / 2));
  ctx.restore();
}

// ---------------------------------------------------------------------------
// DNA ORB: a double helix wound around a glowing sphere. Each acquired trait or
// path node is a base pair on the strand, carrying its animal icon.
// ---------------------------------------------------------------------------
const DNA = {
  // beads: [{color, icon, label}] oldest first
  draw(ctx, cx, cy, R, t, beads, opts = {}) {
    const rungs = opts.rungs || 22, spin = t * (opts.speed || 0.9), tilt = opts.tilt ?? 0.34;
    const glow = opts.glow || '#40f0c8';
    // --- sphere body ---
    const g = ctx.createRadialGradient(cx - R * 0.3, cy - R * 0.35, R * 0.1, cx, cy, R * 1.05);
    g.addColorStop(0, rgba(glow, 0.20)); g.addColorStop(0.55, rgba(glow, 0.07)); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, R * 1.05, 0, TAU); ctx.fill();
    // latitude rings, for volume
    ctx.strokeStyle = rgba(glow, 0.13); ctx.lineWidth = 1;
    for (let i = 1; i < 5; i++) {
      const yy = cy - R + (2 * R) * i / 5, rr = Math.sqrt(Math.max(0, R * R - (yy - cy) * (yy - cy)));
      ctx.beginPath(); ctx.ellipse(cx, yy, rr, rr * tilt, 0, 0, TAU); ctx.stroke();
    }
    ctx.strokeStyle = rgba(glow, 0.22); ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.stroke();
    // --- helix ---
    const pts = [];
    for (let i = 0; i <= rungs; i++) {
      const u = i / rungs, yy = cy - R * 0.94 + u * R * 1.88;
      const rr = Math.sqrt(Math.max(0, R * R - (yy - cy) * (yy - cy))) * 0.92;
      const a = spin + u * Math.PI * 3.4;
      pts.push({
        i, u, y: yy,
        ax: cx + Math.cos(a) * rr, az: Math.sin(a),
        bx: cx + Math.cos(a + Math.PI) * rr, bz: Math.sin(a + Math.PI),
      });
    }
    const dep = z => 0.35 + 0.65 * ((z + 1) / 2);
    // rungs first, back to front
    const order = pts.slice().sort((p, q) => Math.min(p.az, p.bz) - Math.min(q.az, q.bz));
    for (const p of order) {
      const d = dep((p.az + p.bz) / 2);
      ctx.strokeStyle = rgba(glow, 0.10 + 0.28 * d); ctx.lineWidth = Math.max(1, 1.6 * d);
      ctx.beginPath(); ctx.moveTo(p.ax, p.y); ctx.lineTo(p.bx, p.y); ctx.stroke();
    }
    // strand backbones
    for (const side of ['a', 'b']) {
      ctx.beginPath();
      pts.forEach((p, i) => { const X = side === 'a' ? p.ax : p.bx; if (i === 0) ctx.moveTo(X, p.y); else ctx.lineTo(X, p.y); });
      ctx.strokeStyle = rgba(glow, 0.5); ctx.lineWidth = 1.5; ctx.stroke();
    }
    // --- beads on the strand ---
    const slots = [];
    for (let i = 0; i < pts.length; i++) if (i % 2 === 1) slots.push(pts[i]);
    const drawn = [];
    beads.forEach((b, k) => {
      const p = slots[k % slots.length]; if (!p) return;
      const onA = k % 2 === 0;
      drawn.push({ b, x: onA ? p.ax : p.bx, y: p.y, z: onA ? p.az : p.bz });
    });
    drawn.sort((m, n) => m.z - n.z);
    for (const d of drawn) {
      const dp = dep(d.z), r = (opts.beadR || 7) * dp;
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = rgba(d.b.color, 0.30 * dp); ctx.beginPath(); ctx.arc(d.x, d.y, r * 1.9, 0, TAU); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = rgba('#04100e', 0.85); ctx.beginPath(); ctx.arc(d.x, d.y, r, 0, TAU); ctx.fill();
      ctx.strokeStyle = rgba(d.b.color, 0.4 + 0.6 * dp); ctx.lineWidth = 1.5; ctx.stroke();
      if (d.b.icon && dp > 0.55) drawIcon(ctx, d.b.icon, d.x, d.y, r * 1.9, t + d.y * 0.03, { alpha: dp });
    }
    // --- orbiting motes ---
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 14; i++) {
      const a = spin * 1.7 + i * TAU / 14, rr = R * (1.05 + 0.1 * Math.sin(t * 1.3 + i));
      const mx = cx + Math.cos(a) * rr, my = cy + Math.sin(a) * rr * tilt * 1.5;
      ctx.fillStyle = rgba(glow, 0.25 + 0.35 * ((Math.sin(a) + 1) / 2));
      ctx.fillRect(Math.round(mx), Math.round(my), 2, 2);
    }
    ctx.globalCompositeOperation = 'source-over';
  },
  // the player's genome as beads
  beads(P) {
    const out = [];
    for (const key of P.picked) {
      if (key.startsWith('mut:')) { out.push({ color: '#9aa8a0', icon: ICONS.dragonfly, label: key.slice(4) }); continue; }
      const [pk, tier] = key.split(':');
      const path = PATHS[pk]; if (!path) continue;
      out.push({ color: path.color, icon: ICONS[PATH_ICON[pk]], label: path.nodes[+tier].name });
    }
    for (const id of P.traits) { const t = TRAIT_BY_ID[id]; if (t) out.push({ color: t.color, icon: ICONS[TRAIT_ICON[id]], label: t.name }); }
    return out;
  },
  // compact HUD version: a slim helix strip
  drawMini(ctx, x, y, w, h, t, beads, glow) {
    const spin = t * 1.4;
    ctx.strokeStyle = rgba(glow, 0.35); ctx.lineWidth = 1;
    for (const off of [0, Math.PI]) {
      ctx.beginPath();
      for (let i = 0; i <= 24; i++) { const u = i / 24, px = x + u * w, a = spin + u * Math.PI * 2.6 + off; const py = y + h / 2 + Math.sin(a) * h / 2; if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py); }
      ctx.stroke();
    }
    beads.slice(-8).forEach((b, k) => {
      const u = (k + 0.5) / 8, px = x + u * w, a = spin + u * Math.PI * 2.6 + (k % 2 ? Math.PI : 0);
      const py = y + h / 2 + Math.sin(a) * h / 2, d = 0.45 + 0.55 * ((Math.cos(a) + 1) / 2);
      ctx.fillStyle = rgba(b.color, 0.5 + 0.5 * d); ctx.fillRect(Math.round(px - 1.5 * d), Math.round(py - 1.5 * d), Math.max(2, Math.round(3 * d)), Math.max(2, Math.round(3 * d)));
    });
  },
};

'use strict';
const Input = {
  keys: {}, pressed: {}, mouse: { x: 0, y: 0, down: false, rdown: false, clicked: false, rclicked: false, moved: false },
  touch: { active: false, joy: false, jx: 0, jy: 0, jid: null, sx: 0, sy: 0, cx: 0, cy: 0, bite: false, dash: false, biteHeld: false, biteId: null, dashId: null, holdT: 0, autoBite: false },
  init(canvas) {
    window.addEventListener('keydown', e => {
      if (!this.keys[e.code]) this.pressed[e.code] = true; this.keys[e.code] = true;
      if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
      SFX.init(); SFX.resume();
    });
    window.addEventListener('keyup', e => { this.keys[e.code] = false; });
    window.addEventListener('blur', () => { this.keys = {}; });
    canvas.addEventListener('mousemove', e => { this.setMouse(e); this.mouse.moved = true; });
    canvas.addEventListener('mousedown', e => { this.setMouse(e); if (e.button === 0) { this.mouse.down = true; this.mouse.clicked = true; } if (e.button === 2) { this.mouse.rdown = true; this.mouse.rclicked = true; } SFX.init(); SFX.resume(); e.preventDefault(); });
    window.addEventListener('mouseup', e => { if (e.button === 0) this.mouse.down = false; if (e.button === 2) this.mouse.rdown = false; });
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    this.initTouch(canvas);
  },
  // ---- on-screen (touch) controls ----
  pads() {
    const W = G.W, H = G.H;
    return {
      bite: { x: W - 54, y: H - 54, r: 30, label: 'BITE' },
      dash: { x: W - 112, y: H - 34, r: 21, label: 'DASH' },
      pause: { x: W - 15, y: 15, r: 13, label: 'II' },
      joyMax: W * 0.52,
    };
  },
  inPad(p, x, y) { return dist(x, y, p.x, p.y) < p.r + 12; },
  initTouch(canvas) {
    const tpos = t => G.toCanvas(t.clientX, t.clientY);
    const T = this.touch;
    canvas.addEventListener('touchstart', e => {
      SFX.init(); SFX.resume(); e.preventDefault(); T.active = true;
      const P = this.pads();
      for (const t of e.changedTouches) {
        const [x, y] = tpos(t);
        this.mouse.x = x; this.mouse.y = y; this.mouse.moved = true;
        if (G.state !== 'play') { this.mouse.clicked = true; if (this.inPad(P.pause, x, y)) this.pressed.Escape = true; continue; }
        if (this.inPad(P.bite, x, y)) { T.bite = true; T.biteHeld = true; T.biteId = t.identifier; T.holdT = 0.16; }
        else if (this.inPad(P.dash, x, y)) { T.dash = true; T.dashId = t.identifier; }
        else if (this.inPad(P.pause, x, y)) this.pressed.KeyP = true;
        else if (x < P.joyMax && !T.joy) { T.joy = true; T.jid = t.identifier; T.sx = x; T.sy = y; T.cx = x; T.cy = y; T.jx = 0; T.jy = 0; }
        else T.bite = true;
      }
    }, { passive: false });
    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      for (const t of e.changedTouches) {
        if (t.identifier !== T.jid) continue;
        const [x, y] = tpos(t); T.cx = x; T.cy = y;
        let dx = x - T.sx, dy = y - T.sy; let d = Math.hypot(dx, dy); const R = 32;
        if (d > R) { T.sx += dx * (1 - R / d); T.sy += dy * (1 - R / d); dx = x - T.sx; dy = y - T.sy; d = Math.hypot(dx, dy); }
        const k = Math.min(1, d / 24);
        T.jx = d > 3 ? dx / (d || 1) * k : 0; T.jy = d > 3 ? dy / (d || 1) * k : 0;
      }
    }, { passive: false });
    const end = e => {
      for (const t of e.changedTouches) {
        if (t.identifier === T.jid) { T.joy = false; T.jid = null; T.jx = 0; T.jy = 0; }
        if (t.identifier === T.biteId) { T.biteHeld = false; T.biteId = null; }
        if (t.identifier === T.dashId) T.dashId = null;
      }
    };
    canvas.addEventListener('touchend', end); canvas.addEventListener('touchcancel', end);
  },
  // holding the bite pad keeps chomping
  tickTouch(dt) {
    const T = this.touch; T.autoBite = false;
    if (T.biteHeld) { T.holdT -= dt; if (T.holdT <= 0) { T.holdT = 0.16; T.autoBite = true; } }
  },
  setMouse(e) { const p = G.toCanvas(e.clientX, e.clientY); this.mouse.x = p[0]; this.mouse.y = p[1]; },
  down(...codes) { return codes.some(c => this.keys[c]); },
  hit(...codes) { return codes.some(c => this.pressed[c]); },
  endFrame() { this.pressed = {}; this.mouse.clicked = false; this.mouse.rclicked = false; this.touch.bite = false; this.touch.dash = false; },
  axis() {
    let x = 0, y = 0;
    if (this.down('ArrowLeft', 'KeyA')) x -= 1; if (this.down('ArrowRight', 'KeyD')) x += 1; if (this.down('ArrowUp', 'KeyW')) y -= 1; if (this.down('ArrowDown', 'KeyS')) y += 1;
    if (this.touch.joy) { x = this.touch.jx; y = this.touch.jy; }
    else if (this.mouse.down && x === 0 && y === 0 && G.settings.mouseMove && G.player) { const [wx, wy] = G.cam.toWorld(this.mouse.x, this.mouse.y); const dx = wx - G.player.x, dy = wy - G.player.y, d = Math.hypot(dx, dy); if (d > 10) { x = dx / d; y = dy / d; } }
    return [x, y];
  },
  bitePressed() { return this.hit('Space', 'KeyJ', 'KeyZ') || this.mouse.rclicked || this.touch.bite || this.touch.autoBite; },
  dashPressed() { return this.hit('ShiftLeft', 'ShiftRight', 'KeyK', 'KeyX') || this.touch.dash; },
