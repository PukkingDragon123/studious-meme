'use strict';
// ---------------------------------------------------------------------------
// THE LABORATORY.
//
// Two benches, and almost no writing on either of them.
//
//   VIALS — a real rack. Every substance the project has ever drawn is a glass
//   tube on a shelf: full and lit if you have it, empty and dark if you do not.
//   Loading one is picking a tube up. What it does is shown by what it does to
//   the animal standing next to it, not by a paragraph.
//
//   DNA — a wall of gene specimens in culture jars, laid out in the six
//   lineages. A jar is lit when that line has been funded and the gene is in
//   the animal you are taking out; a shape and a colour say which.
//
// You read this room by looking at it.
// ---------------------------------------------------------------------------
const VIALS = [
  { id: 'adren', name: 'ADRENAL', col: '#ff8030', res: 'c.adren', up: 'SPEED', down: 'HEALTH',
    apply: P => { P.st.speed *= 1.16; P.st.dashCd *= 0.82; P.st.hpMul *= 0.9; } },
  { id: 'clot', name: 'CLOTTING', col: '#c02828', res: 'c.clot', up: 'MEND', down: 'SPEED',
    apply: P => { P.st.regen += 0.022; P.st.speed *= 0.92; } },
  { id: 'myo', name: 'MYOSTATIN', col: '#e8d060', res: 'c.myo', up: 'BITE', down: 'HUNGER',
    apply: P => { P.st.bite *= 1.24; P.st.hungerRate *= 1.22; } },
  { id: 'chitin', name: 'CHITIN', col: '#8a9a40', res: 'c.chitin', up: 'ARMOUR', down: 'GROWTH',
    apply: P => { P.st.armor += 0.16; P.st.growth *= 0.88; } },
  { id: 'lumen', name: 'LUMEN', col: '#40f0c8', res: 'c.filter', up: 'LURE', down: 'STEALTH',
    apply: P => { P.st.magnet = Math.max(P.st.magnet, 90); P.st.lure = 1; P.st.stealth *= 1.5; } },
  { id: 'baro', name: 'BAROPHILIC', col: '#4a9ac8', res: 'c.baro', up: 'DEPTH', down: 'SPEED',
    apply: P => { P.st.crushDepth *= 1.9; P.st.crushRes *= 1.6; P.st.speed *= 0.9; } },
  { id: 'bile', name: 'BILE', col: '#7a9a20', res: 'c.filter', up: 'STOMACH', down: 'BITE',
    apply: P => { P.st.ironStomach = true; P.st.swallow *= 1.25; P.st.bite *= 0.92; } },
  { id: 'neuro', name: 'NEURAL', col: '#a070ff', res: 'c.neuro', up: 'GENES', down: 'FRAME',
    apply: P => { P.vialTierBonus = (P.vialTierBonus || 0) + 2; P.st.hpMul *= 0.94; } },
];
const VIAL_BY_ID = {};
for (const v of VIALS) VIAL_BY_ID[v.id] = v;

const LabBench = {
  // a vial is on the rack once the biochemistry step that isolates it is funded
  have(v) { return Research.has(v.res); },
  loaded() { return (G.save && G.save.vial) || null; },
  load(id) { if (!G.save) return; G.save.vial = G.save.vial === id ? null : id; G.storeSave(); },
  applyTo(P) { const v = VIAL_BY_ID[this.loaded()]; if (v && this.have(v)) v.apply(P); },
  // the DNA wall: every gene as a jar, grouped by the line it belongs to
  jars() {
    const out = [];
    for (const g of GENES) {
      if (g.root) continue;
      out.push({ g, lin: g.lin || g.lin2, open: !Genome.researchBlocked(g) });
    }
    return out;
  },
};

/* ===== src/alarm.js ===== */
'use strict';
// ---------------------------------------------------------------------------
// BEING SEEN.
//
// A crocodile's whole life is the difference between being in the water and
// being in the open. This file is that difference, made into a number.
//
// CONCEALMENT is what the water is doing for you right now: how deep you are,
// whether there is weed over you, whether there is a roof, how dark the biome
// is, how much of a wake you are pushing. It is not a stat you buy. It is
// where you chose to be and how fast you chose to move.
//
// The ALARM is what the people on the surface have worked out. It only goes
// up when somebody actually sees something, and it comes down slowly while
// nobody does. Past three quarters the site calls it in, and a capture crew
// comes out with a net gun. A net that holds is not death — it is worse. It is
// going back in the tank.
// ---------------------------------------------------------------------------
const ALARM_STAGES = [
  { at: 0.00, id: 'calm', name: 'UNSEEN', col: '#4f9f90' },
  { at: 0.30, id: 'suspicious', name: 'SOMETHING IN THE WATER', col: '#e0c040' },
  { at: 0.62, id: 'alarmed', name: 'SIGHTED', col: '#ff8c40' },
  { at: 0.88, id: 'hunt', name: 'CAPTURE CREW INBOUND', col: '#ff4030' },
];

const Alarm = {
  level: 0, prev: 0, state: 'calm', flashT: 0, crew: null, crewT: 0,
  lastSeenX: 0, lastSeenY: 0, seenT: 0, quietT: 0, calls: 0,
  reset() {
    this.level = 0; this.prev = 0; this.state = 'calm'; this.flashT = 0;
    this.crew = null; this.crewT = 0; this.seenT = 0; this.quietT = 0; this.calls = 0;
  },
  stage() { let s = ALARM_STAGES[0]; for (const q of ALARM_STAGES) if (this.level >= q.at) s = q; return s; },
  at(id) { return this.stage().id === id; },
  hunting() { return this.level >= 0.88; },

  // ---------- concealment ----------
  // 0 is standing on a bank in daylight. 1 is a shape under four feet of tannin
  // with weed over it. Everything in between is a judgement you are making.
  concealment(P) {
    if (!P || P.dead) return 1;
    const surf = World.surface(P.x), fy = World.floorY(P.x);
    let c = 0;
    // depth under the surface is most of it
    const depth = P.y - surf;
    const B0 = Biome.at(P.x);
    // Clear water does not hide anything. On the shelf you are a shadow on
    // white sand from fifty feet up, and the only thing that helps is getting
    // something solid between you and the sky.
    const clarity = (B0 && B0.clarity) || 0;
    if (depth > 0) c += clamp(depth / (24 + 14 * P.vis), 0, 1) * 0.66 * (1 - clarity * 0.8);
    else c -= 0.16;                                    // hauled out in the open
    // a roof over the water is a roof over you
    const roof = World.roofY(P.x);
    if (roof !== null) c += 0.32;
    // how black the water is here, and how late it is
    if (B0 && B0.dark) c += B0.dark * 0.22;
    const night = G.day !== undefined ? clamp(1 - Math.abs(G.day - 0.5) * 2.6, 0, 1) : 0;
    c += night * 0.2;
    // cover you are actually inside: weed, roots, wreckage
    c += clamp(Foliage.coverAt ? Foliage.coverAt(P.x, P.y) : 0, 0, 1) * (0.26 + clarity * 0.4);
    // hard cover: a hull, a reef head, anything you can put between you and up
    for (const e of G.ents) {
      if (e.type !== 'structure' || e.remove) continue;
      if (e.kind !== 'wreck' && e.kind !== 'dock' && e.kind !== 'stilthouse' && e.kind !== 'shop' && e.kind !== 'seawall' && e.kind !== 'bridge') continue;
      if (Math.abs(e.x - P.x) > (e.r || 20) + 18) continue;
      if (P.y < e.y - 40) continue;
      c += 0.3 + clarity * 0.25; break;
    }
    // and everything you give away by moving
    const speed = Math.hypot(P.vx, P.vy);
    c -= clamp(speed / 420, 0, 1) * 0.34;
    if (P.onLand) c -= 0.3;
    if (depth > -4 && depth < 6 && speed > 90) c -= 0.12;   // a wake on the surface
    if (P.st && P.st.stealth) c += (P.st.stealth - 1) * 0.4;
    if (P.lure) c -= 0.25;
    return clamp(c, 0, 1);
  },
  hidden(P) { return this.concealment(P) > 0.58; },

  // ---------- somebody saw something ----------
  // `weight` is how sure they are. A glimpse of a wake is not a man on a bank
  // watching you take a dog.
  notice(weight, e, why) {
    const P = G.player; if (!P || P.dead) return;
    const before = this.level;
    this.level = clamp(this.level + weight, 0, 1);
    this.quietT = 0;
    if (e) { this.lastSeenX = P.x; this.lastSeenY = P.y; }
    if (this.level > before + 0.02) this.flashT = 0.5;
    // crossing a line is an event, not a number ticking over
    const a = ALARM_STAGES.filter(q => before < q.at && this.level >= q.at).pop();
    if (a) {
      this.state = a.id;
      G.banner = { text: a.name, sub: why || '', t: 2.4, max: 2.4, color: a.col };
      if (a.id === 'alarmed') { SFX.warning && SFX.warning(); this.calls++; }
      if (a.id === 'hunt') { SFX.warning && SFX.warning(); this.crewT = 4; }
      if (a.id === 'suspicious') SFX.ui && SFX.ui();
    }
  },
  // a loud thing happened at x: anyone near enough hears it whether or not
  // they were looking
  noise(x, y, radius, weight) {
    for (const e of G.ents) {
      if (!e.human || e.dead) continue;
      if (Math.abs(e.x - x) > radius) continue;
      e.alertT = Math.max(e.alertT || 0, 0.5);
      e.suspectX = x; e.suspectY = y;
    }
    if (weight) this.notice(weight, null, 'NOISE');
  },

  update(dt) {
    const P = G.player;
    if (this.flashT > 0) this.flashT -= dt;
    if (!P || P.dead) return;
    this.quietT += dt;
    // it comes down, but only after they have stopped finding anything, and
    // the more times they have called it in the slower it forgets
    if (this.quietT > 4) {
      const forget = (this.hunting() ? 0.012 : 0.03) / (1 + this.calls * 0.4);
      this.level = Math.max(0, this.level - forget * dt * 60 * 0.016 * 60 * 0.016);
      this.level = Math.max(0, this.level - forget * dt);
    }
    const st = this.stage();
    if (st.id !== this.state && this.level < this.prev) this.state = st.id;
    this.prev = this.level;
    // the crew: called once, and they take a while to get here
    if (this.crewT > 0) {
      this.crewT -= dt;
      if (this.crewT <= 0 && !this.crew) this.callCrew();
    }
    if (this.crew && (this.crew.dead || this.crew.remove)) { this.crew = null; if (this.level > 0.8) this.crewT = 14; }
  },
  callCrew() {
    const P = G.player; if (!P || P.dead) return;
    // put them on open water upwind of you, far enough that you get a moment
    const side = P.x > this.lastSeenX ? 1 : -1;
    let x = World.findX(P.x + side * 420, xx => World.floorY(xx) > 60, 900, 40);
    if (x === null) x = World.findX(P.x - side * 420, xx => World.floorY(xx) > 60, 900, 40);
    if (x === null) return;
    if (typeof CaptureBoat === 'undefined') return;
    this.crew = G.add(new CaptureBoat(x));
    G.banner = { text: 'CAPTURE CREW', sub: 'THEY WANT YOU ALIVE', t: 2.8, max: 2.8, color: '#ff4030' };
  },
};

/* ===== src/labyrinth.js ===== */
'use strict';
// ---------------------------------------------------------------------------
// LOCKED IN.
//
// A sewer run is not a stretch of water you swim along and leave when you have
// had enough. It is a system with a door at each end, and both doors are shut
// before you get there.
//
// You are put down inside the reach. The tunnel is barred east and west by
// sluice gates you cannot bite through, cannot climb and cannot squeeze past.
// Somewhere in between, in a vault or a sump or behind something that wants to
// eat you, is the site's relic — and the relic is the key. Carry it and the
// hydraulics start; swim out through an open gate and the run ends the way it
// is supposed to end, which is the only way out of here that is not a stomach.
// ---------------------------------------------------------------------------
const Labyrinth = {
  on: false, gates: [], x0: 0, x1: 0, done: false, nagT: 0,

  reset() { this.on = false; this.gates = []; this.done = false; this.nagT = 0; },

  // Called when a run begins. Only the sewer network is a labyrinth: the
  // swamp and the ocean you can leave whenever you like.
  begin(stage) {
    this.reset();
    if (!stage || stage.zone !== 'sewer') return;
    const span = 1500 + (stage.diff || 0) * 380;
    this.x0 = stage.x - span; this.x1 = stage.x + span;
    // put each gate on a stretch with a roof, so it reads as a door in a
    // tunnel and not a fence standing in open water
    const place = wx => {
      const gx = World.findX(wx, xx => World.roofY(xx) !== null && World.floorY(xx) > 30, 700, 30);
      if (gx === null) return null;
      const g = new Structure(gx, 'sluice'); G.add(g); this.gates.push(g); return g;
    };
    const a = place(this.x0), b = place(this.x1);
    if (!a && !b) return;
    this.on = true;
    G.banner = { text: 'THE GATES ARE DOWN', sub: 'FIND THE KEY', t: 4, max: 4, color: '#ff8c40' };
  },

  // you are holding the site's relic
  keyed() {
    if (!this.on) return true;
    const st = G.stage; if (!st) return false;
    const art = ARTIFACTS.find(a => a.stage === st.id);
    return !!(art && Missions.has(art.id));
  },

  // a closed gate is a wall. Push the animal back off it rather than letting
  // it tunnel through, and let it know what it just hit.
  clamp(P) {
    if (!this.on || this.done || !P || P.dead) return;
    for (const g of this.gates) {
      if (g.remove || g.open > 0.55) continue;
      const d = P.x - g.x;
      const pad = 12 + 5 * P.vis;
      if (Math.abs(d) > pad) continue;
      const side = d >= 0 ? 1 : -1;
      P.x = g.x + side * pad;
      if (P.vx * side < 0) { P.vx *= -0.25; if (Math.abs(P.vx) > 40) { G.shake(3); SFX.thud && SFX.thud(0); } }
      if (this.nagT <= 0) {
        this.nagT = 6;
        G.banner = { text: 'SHUT', sub: this.keyed() ? 'IT IS COMING UP' : 'THE KEY IS STILL IN HERE', t: 2.2, max: 2.2, color: '#ff8c40' };
      }
    }
  },

  update(dt) { if (this.nagT > 0) this.nagT -= dt; },

  // out through an open gate: the run ends, and it ends well
  escaped() {
    if (!this.on || this.done) return;
    this.done = true;
    const P = G.player;
    G.addScore(12000);
    G.banner = { text: 'OUT', sub: 'THE SYSTEM DID NOT KEEP YOU', t: 4, max: 4, color: '#3fd0a8' };
    SFX.levelup && SFX.levelup(); G.whiteFlash(0.5); G.slowmo(0.3, 1.2);
    if (P && !P.dead) P.die('ESCAPED');
  },

  // a marker on the HUD edge pointing at the nearest gate, so the reach always
  // has a shape even when you cannot see either end of it
  draw(ctx) {
    if (!this.on || this.done) return;
    const P = G.player; if (!P || P.dead) return;
    const keyed = this.keyed();
    let best = null, bd = 1e9;
    for (const g of this.gates) { if (g.remove) continue; const d = Math.abs(g.x - P.x); if (d < bd) { bd = d; best = g; } }
    if (!best) return;
    const [sx] = G.cam.toScreen(best.x, best.y);
    const y = 78, col = keyed ? '#3fd0a8' : '#ff8c40';
    if (sx > 12 && sx < G.W - 12) return;                       // it is on screen; you can see it
    const x = sx <= 12 ? 10 : G.W - 10, dir = sx <= 12 ? -1 : 1;
    ctx.fillStyle = 'rgba(6,14,14,0.7)'; ctx.fillRect(x - 8, y - 7, 16, 14);
    ctx.fillStyle = col;
    for (let i = 0; i < 5; i++) ctx.fillRect(Math.round(x + dir * (3 - i)), y - i, 2, 1), ctx.fillRect(Math.round(x + dir * (3 - i)), y + i, 2, 1);
    Font.draw(ctx, Math.round(bd / 10) + 'M', x, y + 9, { color: col, align: 'center' });
  },
};

/* ===== src/doc.js ===== */
'use strict';
// ---------------------------------------------------------------------------
// DOC CROC.
//
// The project's lead herpetologist spliced himself years ago and it took. He
// walks his own lab floor in a coat that does not fit any more, and he teaches
// you the building one job at a time.
//
// He is entirely optional. Every lesson is a thing you were going to do anyway;
// doing it pays you, and if you would rather just play you can send him away
// and he stays away.
// ---------------------------------------------------------------------------
const DOC_LESSONS = [
  { id: 'l.feed', ev: 'feed', pay: 6, icon: 'meat', line: 'FEED ONE' },
  { id: 'l.fund', ev: 'fund', pay: 8, icon: 'flask', line: 'FUND A STEP' },
  { id: 'l.point', ev: 'point', pay: 8, icon: 'star', line: 'SPEND A POINT' },
  { id: 'l.hatch', ev: 'hatch', pay: 10, icon: 'egg', line: 'HATCH ANOTHER' },
  { id: 'l.vial', ev: 'vial', pay: 8, icon: 'vial', line: 'LOAD A TUBE' },
  { id: 'l.gene', ev: 'gene', pay: 10, icon: 'hex', line: 'SPLICE IN THE FIELD' },
  { id: 'l.relic', ev: 'relic', pay: 15, icon: 'relic', line: 'BRING A RELIC BACK' },
  { id: 'l.zone', ev: 'zone', pay: 12, icon: 'globe', line: 'SURVEY A ZONE' },
];

// What he says when he walks into a room with you. Short: he is a crocodile
// with a doctorate, not a manual.
const DOC_SCRIPT = {
  research: [
    { icon: 'flask', line: 'DATA BUYS SCIENCE' },
    { icon: 'hex', line: 'SCIENCE BUYS TEETH' },
    { icon: 'star', line: 'PICK A COLUMN' },
  ],
  habitat: [
    { icon: 'egg', line: 'THEY ARE YOURS' },
    { icon: 'meat', line: 'FEED THEM' },
  ],
  bench: [
    { icon: 'vial', line: 'ONE TUBE PER RUN' },
  ],
};

const Doc = {
  // ---------- state ----------
  save() {
    const s = G.save; if (!s) return { done: [], off: false };
    if (!s.doc) s.doc = { done: [], off: false };
    if (!Array.isArray(s.doc.done)) s.doc.done = [];
    return s.doc;
  },
  off() { return !!this.save().off; },
  dismiss() { this.save().off = true; G.storeSave(); },
  recall() { this.save().off = false; G.storeSave(); },
  done(id) { return this.save().done.indexOf(id) >= 0; },
  // the lesson he is on: the first one you have not done
  current() { if (this.off() || (typeof Tutor !== 'undefined' && Tutor.on())) return null; for (const l of DOC_LESSONS) if (!this.done(l.id)) return l; return null; },
  progress() { const d = this.save(); return { got: d.done.length, tot: DOC_LESSONS.length }; },
  // Something happened. If it is what he was waiting for, pay up and move on.
  note(ev) {
    const l = this.current();
    if (!l || l.ev !== ev) return false;
    this.save().done.push(l.id);
    Research.addData(l.pay);
    this.cheer = 2.6; this.cheerPay = l.pay;
    G.storeSave();
    if (typeof SFX !== 'undefined' && SFX.levelup) SFX.levelup();
    return true;
  },
  cheer: 0, cheerPay: 0, t: 0, x: 196, dir: 1, waitT: 0, blink: 0,
  // ---------- talking in a room ----------
  // He walks on from the left, says his piece a line at a time, and then stays
  // in the corner reacting to what you do.
  scene: null,
  say(id) {
    if (this.off() || !DOC_SCRIPT[id]) { this.scene = null; return; }
    const seen = this.save().seen || (this.save().seen = {});
    this.scene = { id, i: 0, t: 0, walk: 0, hold: seen[id] ? 1 : 0 };
    seen[id] = (seen[id] || 0) + 1;
  },
  sceneNext() {
    const sc = this.scene; if (!sc) return false;
    const script = DOC_SCRIPT[sc.id] || [];
    if (sc.i < script.length - 1) { sc.i++; sc.t = 0; return true; }
    sc.done = true; return false;
  },
  // he walks in, then idles; the caller just draws him every frame
  drawScene(ctx, id, opts) {
    if (this.off()) return;
    const sc = this.scene;
    if (!sc || sc.id !== id) return;
    // where his bubble hangs. Rooms with a full-height panel in them put it low,
    // down on the floor beside him, so it never lands on what you are reading.
    sc.by = (opts && opts.bubbleY) || G.H - 104;
    sc.t += 1 / 60; sc.walk = Math.min(1, sc.walk + 1 / 36);
    const script = DOC_SCRIPT[id] || [];
    const line = sc.done ? null : script[Math.min(sc.i, script.length - 1)];
    const F = LAB.FLOOR;
    // he enters from off the left edge and settles at the bottom corner
    const x = Math.round(lerp(-44, 46, easeOut(sc.walk)));
    const prevX = this.x, prevDir = this.dir, prevWait = this.waitT, prevT = this.t;
    this.x = x; this.dir = 1; this.waitT = sc.walk >= 1 ? 9 : 0; this.t = prevT;
    const oldF = LAB.FLOOR;
    LAB.FLOOR = G.H - 14;
    this.draw(ctx);
    // and his bubble, off to the right of him so it never covers him
    if (line && sc.walk > 0.6) {
      const w = Math.max(62, Font.width(line.line, 1) + 36), h = 25;
      const bx = x + 24, by = sc.by;
      // it floats over whatever is behind it, so it needs to be solid, bordered
      // and shadowed or it reads as text lying loose on the screen
      ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(bx + 3, by + 3, w, h);
      ctx.fillStyle = '#0c2124'; ctx.fillRect(bx, by, w, h);
      ctx.fillStyle = '#1d4a46'; ctx.fillRect(bx, by, w, 1); ctx.fillRect(bx, by + h - 1, w, 1);
      ctx.fillRect(bx, by, 1, h); ctx.fillRect(bx + w - 1, by, 1, h);
      ctx.fillStyle = '#7affda'; ctx.fillRect(bx + 1, by + 1, w - 2, 2);
      // the tail, stepping down toward him
      for (let i = 0; i < 6; i++) { ctx.fillStyle = '#0c2124'; ctx.fillRect(bx - 1 - i, by + h - 10 + i, i + 2, 2); }
      this.icon(ctx, line.icon, bx + 14, by + 13, '#7affda');
      Font.draw(ctx, line.line, bx + 26, by + 10, { color: '#e2f0e8' });
      // the little chevron that says there is more
      if (Math.floor(this.t * 3) % 2) { ctx.fillStyle = '#7affda'; for (let i = 0; i < 3; i++) ctx.fillRect(bx + w - 10 + i, by + h - 10 + i, 2, 1); }
    } else if (this.cheer > 0 && sc.walk > 0.6) {
      const txt = '+' + this.cheerPay, w = 56, bx = x + 24, by = sc.by;
      ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(bx + 3, by + 3, w, 25);
      ctx.fillStyle = '#231c08'; ctx.fillRect(bx, by, w, 25);
      ctx.fillStyle = '#6a5a18'; ctx.fillRect(bx, by, w, 1); ctx.fillRect(bx, by + 24, w, 1); ctx.fillRect(bx, by, 1, 25); ctx.fillRect(bx + w - 1, by, 1, 25);
      ctx.fillStyle = '#ffe060'; ctx.fillRect(bx + 1, by + 1, w - 2, 2);
      this.icon(ctx, 'tick', bx + 14, by + 13, '#ffe060');
      Font.draw(ctx, txt, bx + 26, by + 10, { color: '#ffe060' });
    }
    LAB.FLOOR = oldF;
    this.x = prevX; this.dir = prevDir; this.waitT = prevWait;
  },
  sceneBubbleRect() {
    const sc = this.scene; if (!sc || this.off()) return null;
    const script = DOC_SCRIPT[sc.id] || [];
    const line = sc.done ? null : script[Math.min(sc.i, script.length - 1)];
    if (!line) return null;
    const w = Math.max(62, Font.width(line.line, 1) + 36);
    const x = Math.round(lerp(-44, 46, easeOut(sc.walk)));
    return { x: x + 24, y: sc.by || G.H - 104, w, h: 25 };
  },
  update(raw) {
    this.t += raw;
    if (this.cheer > 0) this.cheer -= raw;
    if (this.blink > 0) this.blink -= raw; else if (chance(raw * 0.4)) this.blink = 0.14;
    // he paces the middle of the floor, stopping to look at things
    if (this.waitT > 0) { this.waitT -= raw; return; }
    this.x += this.dir * raw * 16;
    if (this.x > 300) { this.x = 300; this.dir = -1; this.waitT = rand(1.4, 3.4); }
    if (this.x < 140) { this.x = 140; this.dir = 1; this.waitT = rand(1.4, 3.4); }
  },
  // ---------- the animal himself ----------
  // A crocodile's head and tail on a man's frame, in a lab coat that gave up.
  draw(ctx) {
    const F = LAB.FLOOR, x = Math.round(this.x), t = this.t;
    const walking = this.waitT <= 0;
    const bob = walking ? Math.round(Math.abs(Math.sin(t * 4)) * 2) : Math.round(Math.sin(t * 1.4) * 0.6);
    const y = F + 22 - bob, f = this.dir;
    const SKIN = '#4f6a45', SKIN_D = '#33472c', SKIN_L = '#6d8a5c', COAT = '#e4e8e0', COAT_D = '#b8bfb6';
    // mirroring has to flip the far edge of a rect, not just its origin, or
    // the animal comes apart when he turns round
    const px = (a, b, w, h, c) => {
      ctx.fillStyle = c;
      const ax = f > 0 ? x + a : x - a - w;
      ctx.fillRect(Math.round(ax), Math.round(y + b), Math.max(1, w), Math.max(1, h));
    };
    ctx.globalAlpha = 0.3; ctx.fillStyle = '#0a1114'; ctx.fillRect(x - 10, F + 20, 20, 3); ctx.globalAlpha = 1;
    // tail, swinging with the walk — the coat was never cut for it
    const sw = Math.sin(t * (walking ? 4 : 1.1)) * 3;
    for (let i = 0; i < 7; i++) {
      const tw = 5 - i * 0.6;
      px(-7 - i * 3, -8 + i * 1.4 + sw * (i / 7), tw, tw, i % 2 ? SKIN : SKIN_D);
    }
    // legs
    const st = walking ? Math.sin(t * 8) * 3 : 0;
    px(-5 + st, -10, 4, 10, '#2f3a44'); px(1 - st, -10, 4, 10, '#3a4550');
    px(-6 + st, -1, 6, 3, '#20262c'); px(0 - st, -1, 6, 3, '#20262c');
    // body in the coat
    px(-6, -28, 12, 19, COAT);
    px(-6, -28, 3, 19, COAT_D);
    px(-1, -28, 1, 19, COAT_D);
    // the coat does not close over the chest
    px(-3, -26, 5, 9, SKIN_L);
    for (let i = 0; i < 3; i++) px(-3, -25 + i * 3, 5, 1, SKIN_D);
    // arms: one holding a slate
    px(-9, -26, 3, 12, COAT); px(6, -26, 3, 11, COAT);
    px(-9, -15, 3, 3, SKIN); px(6, -16, 3, 3, SKIN);
    px(7, -22, 7, 9, '#2a3438'); px(8, -21, 5, 7, this.cheer > 0 ? '#8ce8a0' : '#3fd0a8');
    for (let i = 0; i < 3; i++) px(9, -20 + i * 2, 3 - i, 1, '#0d1a18');
    // neck and the head: long snout, brow ridge, a working eye
    px(-2, -33, 6, 6, SKIN);
    px(-4, -40, 10, 8, SKIN);
    px(-4, -40, 10, 2, SKIN_L);
    px(4, -38, 13, 5, SKIN);           // snout
    px(4, -38, 13, 1, SKIN_L);
    px(4, -34, 13, 1, SKIN_D);
    // teeth along the jaw line
    ctx.fillStyle = '#f2f4e8';
    for (let i = 0; i < 6; i++) px(5 + i * 2, -34, 1, 2, '#f2f4e8');
    // nostril, brow, eye
    px(15, -37, 2, 2, SKIN_D);
    px(1, -41, 5, 2, SKIN_D);
    if (this.blink > 0) px(2, -39, 3, 1, SKIN_D);
    else { px(2, -40, 3, 3, '#f0e8c0'); px(3, -39, 1, 2, '#101a10'); }
    // scutes down the skull
    for (let i = 0; i < 4; i++) px(-3 + i * 3, -41, 2, 2, SKIN_D);
    // round spectacles, pushed up onto the brow where they are no use
    ctx.strokeStyle = '#c8b070'; ctx.lineWidth = 1;
    Shape.ring(ctx, x + f * 4, y - 43, 3, 1, '#c8b070');
    Shape.ring(ctx, x + f * 10, y - 43, 3, 1, '#c8b070');
    px(5, -44, 3, 1, '#c8b070');
    // an ID badge on the coat
    px(-5, -20, 4, 5, '#d8d0a0'); px(-5, -20, 4, 1, '#8a8260');
  },
  // ---------- the speech bubble ----------
  // An icon and two or three words. He is a crocodile; he is not verbose.
  drawBubble(ctx) {
    const l = this.current();
    if (this.off() || (!l && this.cheer <= 0)) return;
    const x = Math.round(this.x), F = LAB.FLOOR;
    const cheering = this.cheer > 0;
    const txt = cheering ? '+' + this.cheerPay : (l ? l.line : '');
    const w = Math.max(58, Font.width(txt, 1) + 34), h = 24;
    const bx = clamp(x - w / 2, 6, G.W - w - 6), by = F - 78;
    ctx.fillStyle = 'rgba(6,16,16,0.92)'; ctx.fillRect(bx, by, w, h);
    ctx.fillStyle = cheering ? '#ffe060' : '#7affda'; ctx.fillRect(bx, by, w, 2);
    // the tail of the bubble, pointing at him
    ctx.fillStyle = 'rgba(6,16,16,0.92)';
    for (let i = 0; i < 5; i++) ctx.fillRect(clamp(x - 3 + i, bx, bx + w - 1), by + h + i, 5 - i, 1);
    this.icon(ctx, cheering ? 'tick' : (l ? l.icon : 'tick'), bx + 13, by + 12, cheering ? '#ffe060' : '#7affda');
    Font.draw(ctx, txt, bx + 25, by + 9, { color: cheering ? '#ffe060' : '#d8e8de' });
    // how far through the course you are, as pips
    const p = this.progress();
    for (let i = 0; i < p.tot; i++) { ctx.fillStyle = i < p.got ? '#3fd0a8' : '#1c2e2c'; ctx.fillRect(bx + 4 + i * 5, by + h - 5, 3, 3); }
  },
  // tiny pictograms, so a lesson is a picture with a caption rather than prose
  icon(ctx, id, x, y, col) {
    const px = (a, b, w, h, c) => { ctx.fillStyle = c || col; ctx.fillRect(Math.round(x + a), Math.round(y + b), Math.max(1, w), Math.max(1, h)); };
    switch (id) {
      case 'meat': for (let dy = -4; dy <= 4; dy++) { const w = 5 - Math.abs(dy) * 0.4; px(-w, dy, w * 2, 1, '#c0443a'); } px(-3, -3, 4, 2, '#e0685a'); px(1, 1, 4, 2, '#e8dcc0'); break;
      case 'flask': px(-1, -5, 3, 3, col); px(-4, -2, 9, 7, col); px(-2, 0, 5, 4, '#0d1a18'); break;
      case 'star': for (let i = 0; i < 5; i++) { px(-1, -5 + i, 3, 1, col); } px(-5, -1, 11, 3, col); break;
      case 'egg': for (let dy = -5; dy <= 4; dy++) { const w = 4 - Math.abs(dy + 1) * 0.35; px(-w, dy, w * 2, 1, col); } px(-2, -2, 4, 1, '#0d1a18'); break;
      case 'vial': px(-3, -6, 7, 2, col); px(-2, -4, 5, 9, col); px(-1, -1, 3, 5, '#0d1a18'); break;
      case 'hex': for (let dy = -4; dy <= 4; dy++) { const w = 4 - Math.abs(dy) * 0.5; px(-w, dy, w * 2, 1, col); } px(-2, -2, 4, 4, '#0d1a18'); break;
      case 'relic': px(-1, -6, 3, 12, col); px(-4, -3, 9, 3, col); px(-3, 3, 7, 2, col); break;
      case 'globe': Shape.ring(ctx, x, y, 5, 1, col); px(-5, -1, 11, 1, col); px(-1, -5, 2, 11, col); break;
      default: px(-5, 0, 3, 3, col); px(-3, 2, 3, 3, col); px(-1, 0, 3, 3, col); px(1, -2, 3, 3, col); px(3, -4, 3, 3, col); break;
    }
  },
  // the hit box for sending him away, or calling him back
  bubbleRect() {
    const l = this.current();
    if (!l) return null;
    const w = Math.max(58, Font.width(l.line, 1) + 34);
    return { x: clamp(Math.round(this.x) - w / 2, 6, G.W - w - 6), y: LAB.FLOOR - 78, w, h: 24 };
  },
};

/* ===== src/tutor.js ===== */
'use strict';
// ---------------------------------------------------------------------------
// THE FIRST HOUR.
//
// A new save owns nothing: no animal, no colour, no map but the one outside
// the door. So the first thing that happens is that Doc walks you through
// making a crocodile, and until it is made there is nothing else to press.
//
// This is not the optional course he teaches later. It is a rail: each step
// names one control, lights it, and refuses the others until you use it. Five
// steps and you are in the water.
// ---------------------------------------------------------------------------
const TUTOR_STEPS = [
  { id: 'tohabitat', room: 'title', icon: 'egg',
    line: 'EVERY TANK IN HERE IS EMPTY.', hint: 'OPEN THE HABITAT' },
  { id: 'hatch', room: 'habitat', icon: 'egg',
    line: 'PICK A STOCK. THE FIRST ONE IS ON THE PROJECT.', hint: 'GROW IT' },
  { id: 'feed', room: 'habitat', icon: 'meat',
    line: 'IT IS ALIVE, AND IT IS SMALL.', hint: 'FEED IT' },
  { id: 'release', room: 'habitat', icon: 'star',
    line: 'BIGGER. IT IS READY TO GO OUT.', hint: 'RELEASE IT' },
  { id: 'site', room: 'stages', icon: 'globe',
    line: 'YOUR CALL WHERE IT GOES IN THE WATER.', hint: 'PICK A SITE AND RELEASE' },
  // ---- and then he does not stop talking, because the water is the hard part
  { id: 'dive', room: 'play', icon: 'drop',
    line: 'YOU ARE FOUR INCHES LONG. GET UNDER.', hint: 'DIVE',
    test: P => P.y > World.surface(P.x) + 14 },
  { id: 'eat', room: 'play', icon: 'meat',
    line: 'EVERYTHING DOWN THERE IS SMALLER THAN YOU THINK.', hint: 'EAT SOMETHING',
    test: () => (G.stats && G.stats.eaten || 0) > 0 },
  { id: 'hide', room: 'play', icon: 'vial',
    line: 'DEEP AND STILL AND THEY LOSE YOU.', hint: 'GET HIDDEN',
    test: P => Alarm.hidden(P) },
  { id: 'grow', room: 'play', icon: 'star',
    line: 'KEEP EATING. NOTHING ELSE MATTERS YET.', hint: 'GROW A SIZE',
    test: P => P.tier > (Tutor.startTier || 0) },
];

const Tutor = {
  // ---------- state ----------
  on() { return !!(G.save && !G.save.tutDone); },
  index() { return clamp((G.save && G.save.tutStep) || 0, 0, TUTOR_STEPS.length - 1); },
  step() { return this.on() ? TUTOR_STEPS[this.index()] : null; },
  at(id) { const s = this.step(); return !!s && s.id === id; },
  // A save that already has animals in it, or runs on the clock, has plainly
  // been played before: it does not get put back through the induction.
  adopt() {
    const s = G.save; if (!s || s.tutDone) return;
    const lived = (s.runs || 0) > 0 || (Array.isArray(s.habitat) && s.habitat.some(c => c)) || (Array.isArray(s.research) && s.research.length);
    if (lived) { s.tutDone = true; s.tutStep = TUTOR_STEPS.length - 1; }
  },
  // the step is done; move on, and finish the whole thing at the end
  pass(id) {
    if (!this.at(id)) return false;
    const n = this.index() + 1;
    if (n >= TUTOR_STEPS.length) { G.save.tutDone = true; G.save.tutStep = n - 1; }
    else G.save.tutStep = n;
    G.storeSave();
    if (typeof SFX !== 'undefined' && SFX.ui) SFX.ui();
    this.flash = 0.5;
    return true;
  },
  flash: 0, startTier: 0,
  update(raw) {
    if (this.flash > 0) this.flash -= raw;
    // in the water he is not waiting for a button: he is watching you
    if (!this.on()) return;
    const s = this.step();
    if (!s || s.room !== 'play' || !s.test) return;
    const P = G.player;
    if (!P || P.dead || (G.state !== 'play' && G.state !== 'intro')) return;
    if (this.holdT === undefined) this.holdT = 0;
    if (s.test(P)) { this.holdT += raw; if (this.holdT > 0.5) { this.holdT = 0; this.pass(s.id); } }
    else this.holdT = 0;
  },
  // the field half of the induction starts when you hit the water
  enterField() {
    if (!this.on()) return;
    this.startTier = (G.player && G.player.tier) || 0;
    this.holdT = 0;
  },
  inField() { const s = this.step(); return !!s && s.room === 'play'; },
  // ---------- the rail ----------
  // Each of these answers "may I press that yet". Anything not named by the
  // step you are on says no, which is what makes it a tutorial and not a hint.
  // which door the induction will let you through right now
  wantStation() { return this.on() ? 'habitat' : null; },
  allowStation(id) { const w = this.on() && this.wantStation(); return !w || id === w; },
  allowHabRow(kind) {
    if (!this.on()) return true;
    if (this.at('feed')) return kind === 'feed';
    if (this.at('release')) return kind === 'go';
    return false;
  },
  // an empty enclosure has its own hatch panel; during the induction the only
  // way to make an animal is the bay, or the rail has a hole in it
  allowHabHatch() { return !this.on() || this.at('hatch'); },
  // ---------- the dialogue box ----------
  barRect() { return { x: 0, y: G.H - 42, w: G.W, h: 42 }; },
  // a bouncing chevron over whatever you are supposed to press
  point(ctx, r) {
    if (!this.on() || !r) return;
    const t = G.menuT, bob = Math.round(Math.abs(Math.sin(t * 4)) * 3);
    const x = Math.round(r.x + r.w / 2), y = Math.round(r.y) - 6 - bob;
    // a target right up against the top of the screen has nowhere to hang an
    // arrow; the pulsing frame says it well enough on its own
    if (r.y >= 28) {
      ctx.fillStyle = '#ffe060';
      for (let i = 0; i < 5; i++) { ctx.fillRect(x - 4 + i, y - i, 2, 1); ctx.fillRect(x + 4 - i, y - i, 2, 1); }
      ctx.fillRect(x - 1, y - 8, 2, 6);
    }
    // and a frame round the target, so there is no doubt which thing it is
    ctx.globalAlpha = 0.5 + Math.sin(t * 6) * 0.25;
    UI.bracket(ctx, r.x - 3, r.y - 3, r.w + 6, r.h + 6, '#ffe060', 8);
    ctx.globalAlpha = 1;
  },
  // his head, in a box, at the left of the bar
  portrait(ctx, x, y) {
    const t = G.menuT;
    const SKIN = '#4f6a45', SKIN_D = '#33472c', SKIN_L = '#6d8a5c';
    const px = (a, b, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x + a), Math.round(y + b), Math.max(1, w), Math.max(1, h)); };
    ctx.fillStyle = '#0a1c1a'; ctx.fillRect(x - 15, y - 15, 30, 30);
    ctx.fillStyle = '#16302c'; ctx.fillRect(x - 15, y - 15, 30, 1);
    px(-9, -9, 15, 11, SKIN);              // skull
    px(-9, -9, 15, 3, SKIN_L);
    px(4, -5, 11, 6, SKIN);                // snout
    px(4, -5, 11, 2, SKIN_L);
    px(4, 1, 11, 2, SKIN_D);
    for (let i = 0; i < 5; i++) px(5 + i * 2, 1, 1, 2, '#e8ecd8');   // teeth
    px(-9, 2, 13, 3, SKIN_D);              // jaw
    // the working eye, with a blink on a slow clock
    const shut = (t % 4.4) > 4.15;
    px(-4, -6, 5, shut ? 1 : 4, shut ? SKIN_D : '#0e1a10');
    if (!shut) { px(-3, -5, 2, 2, '#c8e860'); px(-3, -5, 1, 1, '#f0ffd0'); }
    px(-10, -8, 3, 4, SKIN_D);             // brow
    // the glasses he has never once looked through
    ctx.fillStyle = '#d8c840';
    ctx.fillRect(Math.round(x - 10), Math.round(y - 12), 13, 1);
    ctx.fillRect(Math.round(x - 10), Math.round(y - 14), 4, 3);
    ctx.fillRect(Math.round(x - 4), Math.round(y - 14), 4, 3);
    UI.bracket(ctx, x - 15, y - 15, 30, 30, 'rgba(122,255,218,0.45)', 7);
  },
  // the bar itself: who is talking, what they said, and what to do about it
  draw(ctx) {
    if (!this.on()) return;
    const s = this.step(); if (!s) return;
    const W = G.W, t = G.menuT, r = this.barRect();
    ctx.fillStyle = '#04100f'; ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.fillStyle = '#0a1f1d'; ctx.fillRect(r.x, r.y + 2, r.w, r.h - 2);
    ctx.fillStyle = this.flash > 0 ? '#ffe060' : '#7affda'; ctx.fillRect(r.x, r.y, r.w, 2);
    // a soft wash off the top edge so the bar sits in the room, not on it
    const g = ctx.createLinearGradient(0, r.y - 16, 0, r.y);
    g.addColorStop(0, 'rgba(4,16,15,0)'); g.addColorStop(1, 'rgba(4,16,15,0.85)');
    ctx.fillStyle = g; ctx.fillRect(0, r.y - 16, W, 16);
    this.portrait(ctx, 26, r.y + 21);
    const tx = 50;
    Font.draw(ctx, 'DOC CROC', tx, r.y + 6, { color: '#4f9f90' });
    Font.draw(ctx, s.line, tx, r.y + 17, { color: '#e2f0e8' });
    // the instruction, lit, with his icon on it
    Doc.icon(ctx, s.icon, tx + 6, r.y + 32, '#ffe060');
    Font.draw(ctx, s.hint, tx + 16, r.y + 29, { color: '#ffe060' });
    // six pips: how far along the induction you are
    const n = TUTOR_STEPS.length, i = this.index();
    for (let q = 0; q < n; q++) {
      ctx.fillStyle = q < i ? '#3fd0a8' : q === i ? (Math.floor(t * 3) % 2 ? '#ffe060' : '#8a7a20') : '#1c2e2c';
      ctx.fillRect(W - 14 - (n - q) * 9, r.y + 18, 6, 6);
    }
    Font.draw(ctx, (i + 1) + '/' + n, W - 14, r.y + 6, { color: '#4f7f74', align: 'right' });
  },
};

/* ===== src/drop.js ===== */
'use strict';
// ---------------------------------------------------------------------------
// THE DROP. Between the creation bay and the first frame of gameplay there is
// a release: a transport helicopter comes in over the site with a containment
// crate slung under it, holds, drops the crate, and the crate opens.
//
// It runs on real time and it is skippable. The world underneath is the real
// world, already loaded, so the camera simply hands over at the end.
// ---------------------------------------------------------------------------
const Drop = {
  DUR: 7.2,
  begin(stage) {
    const P = G.player;
    G.drop = {
      t: 0, dur: this.DUR, stage,
      hx: -180, hy: 62,            // helicopter, in world space relative to the site
      cy: 0, released: false, opened: false, landed: false,
      rotor: 0, tilt: 0, shake: 0,
      name: (stage && stage.name) || 'RELEASE SITE', sub: (stage && stage.sub) || '',
    };
    G.state = 'drop';
    P.frozen = true; P.invuln = 30; P.hidden = true;
    G.banner = null;
    SFX.warning && SFX.warning();
  },
  update(raw) {
    const D = G.drop, P = G.player; if (!D) return;
    D.t += raw;
    const u = D.t / D.dur;
    D.rotor += raw * 34;
    P.vx = 0; P.vy = 0;
    // camera: hold on the site, high and wide, then settle onto the animal
    const site = P.x;
    // --- 0.00-0.42  inbound. the helicopter crosses from the left and slows.
    if (u < 0.42) {
      const k = u / 0.42, e = 1 - Math.pow(1 - k, 3);
      D.hx = lerp(-320, 0, e);
      D.hy = lerp(96, 58, e);
      D.tilt = (1 - e) * 0.26;
      D.cy = D.hy + 40;
      G.cam.x = site + D.hx * 0.5;
      G.cam.y = -30;
      G.cam.zoom = 0.62;
      if (chance(raw * 26)) G.fx.add({ type: 'mote', x: site + D.hx + rand(-30, 30), y: -D.hy + rand(-8, 8), vx: rand(-30, -10), vy: rand(-4, 4), s: 1, color: '#cbb98e', seed: rand(TAU), life: 1.2 });
    // --- 0.42-0.58  hover. rotor wash flattens the water and the reeds.
    } else if (u < 0.58) {
      const k = (u - 0.42) / 0.16;
      D.hx = Math.sin(k * 6) * 3; D.hy = 58 - Math.sin(k * Math.PI) * 5;
      D.tilt = Math.sin(k * 9) * 0.03;
      D.cy = D.hy + 40;
      G.cam.x = site; G.cam.y = -20; G.cam.zoom = lerp(0.62, 0.8, k);
      this.wash(raw, site, 1);
    // --- 0.58-0.78  the crate falls.
    } else if (u < 0.78) {
      const k = (u - 0.58) / 0.20;
      D.released = true;
      D.hx = Math.sin(k * 3) * 2; D.hy = 54 - k * 6;
      D.cy = lerp(D.hy + 40, -6, k * k);
      G.cam.x = site; G.cam.y = lerp(-20, 20, k); G.cam.zoom = lerp(0.8, 1.05, k);
      this.wash(raw, site, 1 - k * 0.6);
      if (k > 0.95 && !D.landed) {
        D.landed = true;
        // it hits the water or the ground, hard
        const fy = World.floorY(site), su = World.surface(site);
        if (fy > su + 20) { G.fx.splash(site, 3.4, 0); Water.splash(site, 320, 40); SFX.splash(3); G.fx.bubbles(site, su + 20, 40, 40, -30); }
        else { G.fx.smoke(site, fy - 4, 12, '#8a7a5a'); G.fx.silt(site, fy - 2, 14, 60); SFX.thud(0); }
        G.shake(16); G.hitstop(0.06); D.shake = 1;
      }
    // --- 0.78-0.92  the crate opens and the specimen comes out.
    } else if (u < 0.92) {
      const k = (u - 0.78) / 0.14;
      D.released = true; D.landed = true;
      D.hx = k * 120; D.hy = 54 + k * 30; D.tilt = -0.2;
      if (!D.opened && k > 0.25) {
        D.opened = true;
        P.hidden = false;
        G.fx.splinters(P.x, P.y, 26, 150);
        G.whiteFlash(0.25); G.shake(9); SFX.crack && SFX.crack(4); SFX.roar(P.size);
        for (let i = 0; i < 10; i++) G.fx.glow(P.x + rand(-20, 20), P.y + rand(-10, 10), rand(2, 5), '#7affda', 0.5);
        if (P.inWater) G.fx.bubbles(P.x, P.y, 26, 26, -20);
      }
      G.cam.x = lerp(G.cam.x, P.x, Math.min(1, raw * 5));
      G.cam.y = lerp(G.cam.y, P.y, Math.min(1, raw * 5));
      G.cam.zoom = lerp(G.cam.zoom, 1.35, Math.min(1, raw * 3));
      if (D.opened) { P.frozen = false; P.vx = 40; }
    // --- 0.92-1.00  hand over.
    } else {
      D.hx += raw * 220; D.hy += raw * 20;
      if (D.shake > 0) D.shake -= raw * 2;
    }
    if (u >= 1 || Input.hit('Escape', 'Enter') || (Input.mouse.clicked && u > 0.15)) this.finish();
  },
  // rotor downwash: it presses the water down and drags the reeds flat
  wash(raw, site, k) {
    if (k <= 0) return;
    Water.splash(site + rand(-40, 40), 30 * k * raw * 60, 60);
    if (chance(raw * 40 * k)) G.fx.add({ type: 'drop', x: site + rand(-70, 70), y: World.surface(site) - rand(0, 26), vx: rand(-90, 90) * k, vy: rand(-30, 20), s: 1, color: '#cfe9e6', life: 0.9 });
    if (chance(raw * 22 * k)) G.fx.smoke(site + rand(-90, 90), World.surface(site) - rand(0, 14), 1, '#dff4f8');
    if (typeof Foliage !== 'undefined' && Foliage.disturb) Foliage.disturb(site + rand(-90, 90), 40 * k);
  },
  finish() {
    const D = G.drop, P = G.player; if (!D) return;
    P.frozen = false; P.hidden = false; P.invuln = 2.5;
    G.drop = null; G.state = 'play';
    G.banner = { text: D.name, sub: D.sub, t: 4, max: 4, color: '#8ce8a0' };
  },

  // ---------------------------------------------------------------------------
  // painting. The helicopter and the crate live in world space above the site.
  // ---------------------------------------------------------------------------
  drawWorld(ctx) {
    const D = G.drop, P = G.player; if (!D) return;
    const site = P.x, u = D.t / D.dur;
    const hx = site + D.hx, hy = -D.hy;
    // --- sling line and crate
    if (!D.landed || u < 0.8) {
      const cy = -D.cy;
      if (!D.released) { ctx.strokeStyle = '#2a2620'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(hx, hy + 8); ctx.lineTo(site, cy - 10); ctx.stroke(); }
      this.crate(ctx, site, cy, D);
    } else if (D.landed) {
      this.crate(ctx, site, World.floorY(site) > World.surface(site) + 20 ? World.surface(site) + 6 : World.floorY(site) - 10, D);
    }
    // --- the helicopter
    if (u < 0.99) this.heli(ctx, hx, hy, D);
  },
  // A transport helicopter in side elevation: boom, tail rotor, skids, glass,
  // and a disc of motion-blurred main rotor.
  heli(ctx, x, y, D) {
    const f = D.hx > 0 ? 1 : 1;
    ctx.save(); ctx.translate(Math.round(x), Math.round(y)); ctx.rotate(D.tilt);
    const body = '#2c3630', bodyL = '#414d44', bodyD = '#1a221d', glass = '#7fb8c8';
    // tail boom
    ctx.fillStyle = body; ctx.fillRect(10, -3, 46, 7);
    ctx.fillStyle = bodyL; ctx.fillRect(10, -3, 46, 2);
    ctx.fillStyle = bodyD; ctx.fillRect(10, 3, 46, 1);
    // tail fin and rotor
    ctx.fillStyle = body; ctx.fillRect(52, -16, 7, 16);
    ctx.fillStyle = bodyL; ctx.fillRect(52, -16, 7, 2);
    ctx.fillStyle = '#8a9a90';
    const tr = D.rotor * 2.2;
    for (let i = 0; i < 3; i++) { const a = tr + i * (TAU / 3); ctx.globalAlpha = 0.5 + 0.4 * Math.abs(Math.cos(a)); ctx.fillRect(Math.round(56 + Math.cos(a) * 9) - 1, Math.round(-8 + Math.sin(a) * 9) - 1, 2, 2); }
    ctx.globalAlpha = 1;
    // cabin
    ctx.fillStyle = body; Shape.blob(ctx, 0, 0, 15, body, 0.72);
    ctx.fillStyle = bodyL; ctx.fillRect(-13, -9, 24, 3);
    ctx.fillStyle = bodyD; ctx.fillRect(-12, 7, 24, 2);
    // cockpit glass, with a lit interior and a pilot silhouette
    ctx.fillStyle = glass; ctx.fillRect(-15, -6, 10, 9);
    ctx.fillStyle = '#b8e4ee'; ctx.fillRect(-15, -6, 10, 2);
    ctx.fillStyle = '#16221e'; ctx.fillRect(-11, -4, 3, 5);
    // side door, open, with a crewman leaning out
    ctx.fillStyle = '#101815'; ctx.fillRect(-2, -5, 9, 10);
    ctx.fillStyle = '#c8a888'; ctx.fillRect(1, -4, 3, 4);
    ctx.fillStyle = '#3a4a5a'; ctx.fillRect(1, 0, 3, 5);
    // skids
    ctx.fillStyle = '#8a9a90'; ctx.fillRect(-12, 9, 22, 1);
    ctx.fillRect(-8, 5, 1, 5); ctx.fillRect(6, 5, 1, 5);
    // markings
    ctx.fillStyle = '#a8b020'; ctx.fillRect(-6, -2, 8, 1);
    // main rotor: a blurred disc plus two crisp blades
    const rr = 44;
    ctx.globalAlpha = 0.16; ctx.fillStyle = '#c8d8d0';
    ctx.fillRect(-rr, -13, rr * 2, 2);
    ctx.globalAlpha = 0.5;
    for (let i = 0; i < 4; i++) {
      const a = D.rotor + i * (TAU / 4), c = Math.cos(a);
      ctx.globalAlpha = 0.25 + 0.5 * Math.abs(c);
      ctx.fillRect(Math.round(-rr * c), -13, Math.round(rr * c * 2) || 1, 2);
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#8a9a90'; ctx.fillRect(-2, -14, 4, 4);
    // strobe
    if (Math.sin(D.rotor * 0.5) > 0.85) { ctx.fillStyle = '#ff4030'; ctx.fillRect(-1, 8, 2, 2); Shape.star(ctx, 0, 9, 8, '#ff4030', 0.5); }
    ctx.restore();
  },
  // the containment crate: steel cage, hazard stripes, a hinged front
  crate(ctx, x, y, D) {
    const w = 30, h = 22;
    ctx.save(); ctx.translate(Math.round(x), Math.round(y));
    if (D.opened) ctx.rotate(0.25);
    ctx.fillStyle = '#3a3a34'; ctx.fillRect(-w / 2, -h, w, h);
    ctx.fillStyle = '#4d4d44'; ctx.fillRect(-w / 2, -h, w, 2);
    ctx.fillStyle = '#22221e'; ctx.fillRect(-w / 2, -3, w, 3);
    // bars
    ctx.fillStyle = '#151512';
    for (let i = 1; i < 6; i++) ctx.fillRect(-w / 2 + i * 5, -h + 3, 2, h - 6);
    // hazard stripes along the top
    for (let i = 0; i < 5; i++) { ctx.fillStyle = i % 2 ? '#c8a020' : '#22221e'; ctx.fillRect(-w / 2 + i * 6, -h + 2, 6, 3); }
    // the hinged front, swung open once it lands
    ctx.save();
    if (D.opened) ctx.rotate(-1.5);
    ctx.fillStyle = '#44443c'; ctx.fillRect(w / 2 - 3, -h, 4, h);
    ctx.fillStyle = '#56564c'; ctx.fillRect(w / 2 - 3, -h, 4, 2);
    ctx.restore();
    ctx.fillStyle = '#8a7420'; Font.draw(ctx, 'BIO-4', 0, -h / 2 - 3, { color: '#c8a020', align: 'center' });
    ctx.restore();
  },
  // screen space: the site card, bars, and the pilot chatter
  drawUI(ctx) {
    const D = G.drop; if (!D) return;
    const W = G.W, H = G.H, u = D.t / D.dur;
    const band = Math.round(30 * clamp(Math.min(u / 0.06, (1 - u) / 0.08), 0, 1));
    if (band > 0) {
      ctx.fillStyle = 'rgba(0,0,0,0.9)'; ctx.fillRect(0, 0, W, band); ctx.fillRect(0, H - band, W, band);
      ctx.fillStyle = 'rgba(140,220,200,0.14)'; ctx.fillRect(0, band, W, 1); ctx.fillRect(0, H - band - 1, W, 1);
    }
    // the site card, typed on
    if (u > 0.08 && u < 0.62) {
      const k = clamp((u - 0.08) / 0.1, 0, 1), out = clamp((0.62 - u) / 0.08, 0, 1);
      ctx.globalAlpha = Math.min(k, out);
      const n = Math.round(D.name.length * k);
      Font.draw(ctx, D.name.slice(0, n), 22, 48, { color: '#b8ffe8', scale: 3, outline: '#04120e' });
      if (k > 0.9) Font.draw(ctx, D.sub, 22, 74, { color: '#7f9f96', outline: '#04120e' });
      ctx.fillStyle = '#7affda'; ctx.fillRect(22, 42, Math.round(180 * k), 1);
      ctx.globalAlpha = 1;
    }
    // pilot chatter, bottom left
    const lines = [
      [0.10, 'BIO-4 TRANSPORT, TWO MINUTES OUT.'],
      [0.30, 'CRATE IS HOT. SUBJECT IS AWAKE.'],
      [0.46, 'ON STATION. HOLDING AT FIFTY FEET.'],
      [0.58, 'RELEASING.'],
      [0.80, 'SUBJECT IS IN THE WATER. GOOD LUCK.'],
    ];
    let msg = null;
    for (const [at, txt] of lines) if (u >= at) msg = [at, txt];
    if (msg && u - msg[0] < 0.16) {
      const k = clamp((u - msg[0]) / 0.03, 0, 1) * clamp((0.16 - (u - msg[0])) / 0.04, 0, 1);
      ctx.globalAlpha = clamp(k, 0, 1);
      ctx.fillStyle = 'rgba(4,10,12,0.75)'; ctx.fillRect(16, H - 52, Font.width(msg[1], 1) + 12, 14);
      Font.draw(ctx, msg[1], 22, H - 48, { color: '#9ef0c8' });
      ctx.globalAlpha = 1;
    }
    if (u > 0.2 && u < 0.95) Font.draw(ctx, 'ESC: SKIP', W - 8, H - 10, { color: 'rgba(150,190,180,0.5)', align: 'right' });
  },
};

/* ===== src/lab.js ===== */
'use strict';
// ---------------------------------------------------------------------------
// THE SCIENCE CENTER. The front end is not a title card over a screenshot any
// more, it is a room: a working genetics lab drawn in side elevation, with
// staff walking it, machines running, specimen tanks along the walls and the
// embryo you are about to become suspended in the middle of it.
//
// Everything is procedural and animated. The menu is furniture — you walk the
// camera along the room and the consoles are the buttons.
// ---------------------------------------------------------------------------
const LAB = {
  FLOOR: 300,        // top of the walk surface
  CEIL: 26,
  W: 640, H: 360,
};

const Lab = {
  t: 0, staff: [], sel: 0, ready: false, camX: 0, hint: 0,
  // the room's interactive stations, laid out left to right
  stations: [
    { id: 'create', x: 320, label: 'CREATE' },
    { id: 'research', x: 92, label: 'RESEARCH' },
  ],
  init() {
    this.t = 0; this.staff = []; this.ready = true;
    // Four staff on their own beats: two pacing the floor, one at the left
    // console, one at the right bench. Rigged humans, so they walk properly.
    const rig = typeof SPECIES !== 'undefined' && SPECIES.scientist ? rigOf(SPECIES.scientist, 0) : null;
    const spots = [
      { x: 150, x0: 96, x1: 268, mode: 'walk', spd: 22, v: 1 },
      { x: 470, x0: 386, x1: 566, mode: 'walk', spd: 17, v: 3 },
      { x: 96, x0: 96, x1: 96, mode: 'type', spd: 0, v: 5, face: 1 },
      { x: 566, x0: 566, x1: 566, mode: 'bench', spd: 0, v: 2, face: -1 },
      { x: 250, x0: 210, x1: 300, mode: 'clip', spd: 11, v: 4, face: -1 },
    ];
    for (const s of spots) {
      this.staff.push({
        x: s.x, x0: s.x0, x1: s.x1, mode: s.mode, spd: s.spd, dir: chance(0.5) ? 1 : -1,
        rig: typeof SPECIES !== 'undefined' && SPECIES.scientist ? rigOf(SPECIES.scientist, s.v) : rig,
        phase: rand(TAU), face: s.face || 1, waitT: rand(0, 3), anim: { phase: rand(TAU), speed: 0, mode: 'stand' },
      });
    }
  },
  update(raw) {
    if (!this.ready) this.init();
    this.t += raw;
    if (this.hint > 0) this.hint -= raw;
    if (this._spec) CrocView.update(this._spec, raw, 9.5);
    if (typeof Doc !== 'undefined') Doc.update(raw);
    for (const s of this.staff) {
      if (s.mode === 'walk' || s.mode === 'clip') {
        if (s.waitT > 0) { s.waitT -= raw; s.anim.speed = 0; }
        else {
          s.x += s.dir * s.spd * raw;
          if (s.x > s.x1) { s.x = s.x1; s.dir = -1; s.waitT = rand(1.4, 4); }
          if (s.x < s.x0) { s.x = s.x0; s.dir = 1; s.waitT = rand(1.4, 4); }
          s.face = s.dir;
          s.anim.speed = 1;
        }
        s.anim.phase += raw * (s.anim.speed ? 7 : 1.2);
        s.anim.mode = 'walk';
      } else {
        // stationary: small idle sway, hands up at the console
        s.anim.speed = 0; s.anim.phase += raw * 2.2;
        s.anim.mode = 'stand';
        s.anim.aim = s.mode === 'type' ? (Math.sin(this.t * 3 + s.phase) > -0.3) : false;
      }
    }
  },

  // ---------------------------------------------------------------------------
  // painting
  // ---------------------------------------------------------------------------
  draw(ctx) {
    const W = LAB.W, H = LAB.H, F = LAB.FLOOR, t = this.t;
    this.backWall(ctx, t);
    this.pipes(ctx, t);
    this.leftBank(ctx, t);
    this.rightBank(ctx, t);
    this.tank(ctx, W / 2, t);           // the centrepiece
    // the floor is the one layer of this room with nothing alive in it
    ctx.drawImage(UI.bake('labfloor', o => this.floor(o, 0)), 0, 0, G.W, G.H);
    this.acidBath(ctx, t);              // cut into the floor, so painted over it
    // staff walk between the machines and the railing
    for (const s of this.staff) this.drawStaff(ctx, s);
    // the man who runs the place, such as he still is
    if (typeof Doc !== 'undefined' && !Doc.off()) Doc.draw(ctx);
    this.acidFx(ctx, t);
    this.foreground(ctx, t);
    this.lighting(ctx, t);
  },

  // --- back wall: panel tiles, seams, grime, signage
  backWall(ctx, t) {
    const W = LAB.W, F = LAB.FLOOR;
    ctx.fillStyle = '#1b2b30'; ctx.fillRect(0, 0, W, F);
    // panel grid, with a lit top edge on each tile
    for (let y = LAB.CEIL; y < F; y += 24) {
      for (let x = 0; x < W; x += 32) {
        const n = ihash(x * 7 + y, 11);
        ctx.fillStyle = n > 0.7 ? '#213338' : n > 0.35 ? '#1e2f35' : '#1a2a2f';
        ctx.fillRect(x, y, 31, 23);
        ctx.fillStyle = 'rgba(150,200,205,0.06)'; ctx.fillRect(x, y, 31, 1);
        ctx.fillStyle = 'rgba(0,0,0,0.22)'; ctx.fillRect(x, y + 22, 31, 1);
        // bolt heads
        if (n > 0.55) { ctx.fillStyle = '#2c4046'; ctx.fillRect(x + 2, y + 2, 2, 2); ctx.fillRect(x + 27, y + 2, 2, 2); }
      }
    }
    // ceiling: cable tray, ducting, strip lights
    ctx.fillStyle = '#141f23'; ctx.fillRect(0, 0, W, LAB.CEIL);
    ctx.fillStyle = '#1c2b30'; ctx.fillRect(0, LAB.CEIL - 4, W, 4);
    for (let x = 6; x < W; x += 18) { ctx.fillStyle = '#26383d'; ctx.fillRect(x, 4, 10, 3); ctx.fillRect(x + 2, 7, 6, 2); }
    for (let x = 40; x < W; x += 128) {
      // fluorescent strip, one of them failing
      const bad = (x / 128) % 3 === 1;
      const on = bad ? (Math.sin(t * 26 + x) > -0.55 ? 1 : 0.12) : 1;
      ctx.fillStyle = '#2e4247'; ctx.fillRect(x - 3, LAB.CEIL - 1, 66, 5);
      ctx.globalAlpha = on; ctx.fillStyle = '#e8fbff'; ctx.fillRect(x, LAB.CEIL + 1, 60, 3);
      ctx.globalAlpha = on * 0.16;
      for (let i = 0; i < 5; i++) { ctx.fillStyle = '#cfeef4'; ctx.fillRect(x - i * 3, LAB.CEIL + 4 + i * 5, 60 + i * 6, 5); }
      ctx.globalAlpha = 1;
    }
    // signage: hazard stencils and a room number, painted on the wall
    this.stencil(ctx, 58, 104, 'BIO-4', '#c8a020');
    this.stencil(ctx, 420, 100, 'CONTAINMENT', '#b04030');
    ctx.fillStyle = 'rgba(200,160,32,0.5)';
    for (let i = 0; i < 6; i++) ctx.fillRect(180 + i * 7, 80, 4, 3);
    // grime running down from the ceiling
    ctx.globalAlpha = 0.14; ctx.fillStyle = '#0b1417';
    for (let x = 0; x < W; x += 7) { const h = ihash(x, 3) * 46; ctx.fillRect(x, LAB.CEIL, 3, h); }
    ctx.globalAlpha = 1;
  },
  stencil(ctx, x, y, txt, col) {
    ctx.globalAlpha = 0.45;
    Font.draw(ctx, txt, x, y, { color: col, scale: 2 });
    ctx.globalAlpha = 0.18; ctx.fillStyle = col;
    ctx.fillRect(x - 3, y - 4, Font.width(txt, 2) + 6, 1);
    ctx.fillRect(x - 3, y + 15, Font.width(txt, 2) + 6, 1);
    ctx.globalAlpha = 1;
  },

  // --- service pipes crossing the room, with valves and a steam vent
  pipes(ctx, t) {
    const W = LAB.W;
    const run = (y, h, c1, c2) => {
      ctx.fillStyle = c1; ctx.fillRect(0, y, W, h);
      ctx.fillStyle = c2; ctx.fillRect(0, y, W, 1);
      ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(0, y + h - 1, W, 1);
      for (let x = 20; x < W; x += 74) { ctx.fillStyle = c2; ctx.fillRect(x, y - 1, 5, h + 2); ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(x + 4, y - 1, 1, h + 2); }
    };
    run(34, 7, '#3e5257', '#546d73');
    run(46, 5, '#4a3a2c', '#63503c');
    // a valve wheel and a dripping joint
    ctx.fillStyle = '#7a4a2a'; ctx.fillRect(150, 44, 4, 9);
    Shape.ring(ctx, 152, 42, 6, 2, '#8a5a30');
    if (Math.sin(t * 1.4) > 0.9) { ctx.fillStyle = '#8fd8d0'; ctx.fillRect(152, 54 + ((t * 60) % 40), 1, 3); }
    // steam from a wall vent, drifting up
    ctx.fillStyle = '#26383d'; ctx.fillRect(596, 56, 30, 16);
    for (let i = 0; i < 5; i++) ctx.fillRect(598, 58 + i * 3, 26, 1);
    ctx.globalAlpha = 0.10; ctx.fillStyle = '#dff4f8';
    for (let i = 0; i < 9; i++) {
      const p = (t * 0.5 + i * 0.11) % 1;
      Shape.puff(ctx, 594 - p * 44, 62 - p * 34 + Math.sin(t + i) * 3, 4 + p * 9, '#dff4f8', i * 13);
    }
    ctx.globalAlpha = 1;
  },

  // --- left: server stack, DNA sequencer, wall of monitors
  leftBank(ctx, t) {
    const F = LAB.FLOOR;
    // server racks
    for (let r = 0; r < 2; r++) {
      const x = 8 + r * 44, y = F - 96, w = 38, h = 96;
      ctx.fillStyle = '#151f23'; ctx.fillRect(x, y, w, h);
      ctx.fillStyle = '#203136'; ctx.fillRect(x, y, w, 3);
      ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(x + w - 2, y, 2, h);
      for (let b = 0; b < 11; b++) {
        const by = y + 5 + b * 8;
        ctx.fillStyle = '#1b282d'; ctx.fillRect(x + 3, by, w - 6, 6);
        ctx.fillStyle = '#0e1518'; ctx.fillRect(x + 4, by + 1, w - 8, 4);
        // activity lights, blinking on their own clocks
        for (let l = 0; l < 4; l++) {
          const on = Math.sin(t * (3 + l * 2.1 + b) + b * 1.7 + r) > 0.1;
          ctx.fillStyle = on ? (l === 0 ? '#60ff90' : l === 3 ? '#ffb040' : '#40d0ff') : '#16232a';
          ctx.fillRect(x + 6 + l * 4, by + 2, 2, 2);
        }
      }
    }
    // the sequencer: a lit readout with a scrolling base-pair trace
    const sx = 8, sy = F - 150, sw = 82, sh = 46;
    ctx.fillStyle = '#101a1e'; ctx.fillRect(sx, sy, sw, sh);
    ctx.fillStyle = '#25383e'; ctx.fillRect(sx, sy, sw, 2); ctx.fillRect(sx, sy + sh - 2, sw, 2);
    ctx.fillStyle = '#04120e'; ctx.fillRect(sx + 3, sy + 4, sw - 6, sh - 10);
    // four base lanes scrolling right to left
    const cols = ['#40f0a0', '#ff6060', '#50a0ff', '#ffd040'];
    for (let lane = 0; lane < 4; lane++) {
      const ly = sy + 7 + lane * 8;
      ctx.fillStyle = 'rgba(120,200,180,0.12)'; ctx.fillRect(sx + 4, ly + 3, sw - 8, 1);
      for (let i = 0; i < 26; i++) {
        const px = sx + 5 + ((i * 3 - t * 22) % (sw - 10) + (sw - 10)) % (sw - 10);
        if (ihash(i * 4 + lane, 91) > 0.62) { ctx.fillStyle = cols[lane]; ctx.fillRect(Math.round(px), ly, 2, 4); }
      }
    }
    Font.draw(ctx, 'SEQ', sx + 4, sy + sh - 8, { color: '#3f7f74' });
    // three wall monitors above, one showing a rotating helix
    for (let m = 0; m < 3; m++) {
      const mx = 100 + m * 0, my = 0;
    }
    this.monitor(ctx, 104, F - 176, 62, 42, t, m => {
      // rotating double helix
      const cx = 104 + 31, top = F - 176 + 6;
      for (let i = 0; i < 16; i++) {
        const a = t * 1.6 + i * 0.42, y = top + i * 1.9;
        const x1 = cx + Math.sin(a) * 16, x2 = cx + Math.sin(a + Math.PI) * 16;
        const d1 = (Math.cos(a) + 1) * 0.5;
        ctx.globalAlpha = 0.35 + d1 * 0.6; ctx.fillStyle = '#7affda'; ctx.fillRect(Math.round(x1), Math.round(y), 2, 2);
        ctx.globalAlpha = 0.35 + (1 - d1) * 0.6; ctx.fillStyle = '#40b0ff'; ctx.fillRect(Math.round(x2), Math.round(y), 2, 2);
        if (i % 3 === 0) { ctx.globalAlpha = 0.25; ctx.fillStyle = '#cfeef4'; ctx.fillRect(Math.round(Math.min(x1, x2)), Math.round(y), Math.abs(x2 - x1), 1); }
      }
      ctx.globalAlpha = 1;
    });
    this.monitor(ctx, 104, F - 130, 62, 30, t, () => {
      // a growth curve creeping up
      const bx = 108, by = LAB.FLOOR - 104;
      ctx.fillStyle = '#1a4a3a';
      for (let i = 0; i < 54; i++) {
        const h = Math.round(2 + 18 * Math.pow(i / 54, 2.2) * (0.8 + 0.2 * Math.sin(t + i * 0.3)));
        ctx.fillRect(bx + i, by - h, 1, h);
      }
      ctx.fillStyle = '#7affda';
      for (let i = 0; i < 54; i++) {
        const h = Math.round(2 + 18 * Math.pow(i / 54, 2.2) * (0.8 + 0.2 * Math.sin(t + i * 0.3)));
        ctx.fillRect(bx + i, by - h, 1, 1);
      }
    });
  },
  monitor(ctx, x, y, w, h, t, inner) {
    ctx.fillStyle = '#0a1114'; ctx.fillRect(x - 2, y - 2, w + 4, h + 4);
    ctx.fillStyle = '#25383e'; ctx.fillRect(x - 2, y - 2, w + 4, 2);
    ctx.fillStyle = '#04100e'; ctx.fillRect(x, y, w, h);
    ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    inner(ctx);
    // scanlines and a phosphor sheen
    ctx.globalAlpha = 0.16; ctx.fillStyle = '#000000';
    for (let sy2 = y; sy2 < y + h; sy2 += 2) ctx.fillRect(x, sy2, w, 1);

    ctx.globalAlpha = 1;
    ctx.restore();
    ctx.fillStyle = 'rgba(140,220,210,0.25)'; ctx.fillRect(x, y, w, 1);
  },

  // --- right: specimen tanks, centrifuge, fume hood, whiteboard
  rightBank(ctx, t) {
    const F = LAB.FLOOR;
    // a run of small specimen jars on a shelf, each with something in it
    const shx = 392, shy = F - 116;

      // fluid

      ctx.fillStyle = ['rgba(90,190,150,0.4)', 'rgba(190,170,80,0.35)', 'rgba(180,90,90,0.35)'][j % 3];
      ctx.fillRect(jx + 1, shy + fl, jw - 2, jh - fl - 2);
      // specimen: a curled shape, a bone, an eye

      if (j % 3 === 0) { Shape.blob(ctx, jx + jw / 2, shy + jh - 9, 4, '#d8c8a8'); ctx.fillStyle = '#2a2018'; ctx.fillRect(jx + jw / 2 - 2, shy + jh - 11, 2, 2); }
      else if (j % 3 === 1) { ctx.fillRect(jx + 4, shy + jh - 12, 7, 2); ctx.fillRect(jx + 3, shy + jh - 13, 2, 4); ctx.fillRect(jx + 10, shy + jh - 13, 2, 4); }
      else { Shape.blob(ctx, jx + jw / 2, shy + jh - 10, 3, '#e8e0d0'); Shape.blob(ctx, jx + jw / 2, shy + jh - 10, 1.6, '#2a5a7a'); }
      // rim light and a lid
      ctx.fillStyle = 'rgba(220,250,250,0.3)'; ctx.fillRect(jx, shy, 1, jh);
      ctx.fillStyle = '#5a5248'; ctx.fillRect(jx - 1, shy - 3, jw + 2, 3);
      // slow bubbles
      if (ihash(j, 7) > 0.4) { const bp = (t * 0.4 + j * 0.3) % 1; ctx.fillStyle = 'rgba(230,255,255,0.5)'; ctx.fillRect(jx + 4 + (j % 4), shy + jh - 3 - bp * (jh - fl - 4), 1, 1); }
    }
    // centrifuge: a drum that spins, with a lit window
    const cx = 392, cy = F - 44;

    // spinning rotor: four arms, motion-blurred by drawing them faded
    const sp = t * 15;
    for (let k = 0; k < 4; k++) {
      const a = sp + k * (TAU / 4);
      ctx.globalAlpha = 0.85 - (k % 2) * 0.35;
      ctx.fillStyle = '#8fa8b0';
      ctx.fillRect(Math.round(cx + 20 + Math.cos(a) * 10) - 1, Math.round(cy + 18 + Math.sin(a) * 7) - 1, 3, 3);
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = Math.sin(t * 8) > 0 ? '#ff6040' : '#3a1a14'; ctx.fillRect(cx + 32, cy + 33, 3, 3);
    Font.draw(ctx, 'RPM', cx + 5, cy + 32, { color: '#4f7f74' });
    // fume hood with a raised sash and a burner
    const hx = 464, hy = F - 86, hw = 96, hh = 86;
    ctx.fillStyle = '#1d2c31'; ctx.fillRect(hx, hy, hw, hh);
    ctx.fillStyle = 'rgba(140,220,220,0.10)'; ctx.fillRect(hx + 4, hy + 4, hw - 8, 46);
    ctx.fillStyle = '#33474d'; ctx.fillRect(hx + 2, hy + 46, hw - 4, 4);
    ctx.fillStyle = '#2a3a40'; ctx.fillRect(hx, hy + hh - 12, hw, 12);
    // glassware on the bench inside: flask over a flame
    ctx.fillStyle = 'rgba(200,240,230,0.35)';
    ctx.fillRect(hx + 20, hy + 36, 12, 10); ctx.fillRect(hx + 24, hy + 30, 4, 6);
    ctx.fillStyle = 'rgba(120,240,170,0.5)'; ctx.fillRect(hx + 21, hy + 41, 10, 4);
    const fl2 = 2 + Math.round(Math.abs(Math.sin(t * 9)) * 2);
    ctx.fillStyle = '#40a0ff'; ctx.fillRect(hx + 25, hy + 46 - fl2, 2, fl2);
    ctx.fillStyle = '#a0e0ff'; ctx.fillRect(hx + 25, hy + 46 - fl2, 1, 1);
    // a rack of pipettes and a coiled tube
    for (let i = 0; i < 5; i++) { ctx.fillStyle = '#cfe8e4'; ctx.fillRect(hx + 54 + i * 4, hy + 30, 1, 16); }
    ctx.fillStyle = '#8a5a4a';
    for (let i = 0; i < 12; i++) ctx.fillRect(hx + 66 + Math.round(Math.sin(i * 0.9) * 5), hy + 6 + i * 2, 3, 1);
    // whiteboard with dense scrawl
    const bx = 536, by = F - 190, bw = 98, bh = 62;
    ctx.fillStyle = '#cfd8d0'; ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = '#a8b2ac'; ctx.fillRect(bx, by + bh - 3, bw, 3);
    ctx.globalAlpha = 0.75;
    for (let l = 0; l < 9; l++) {
      const ly = by + 5 + l * 6, len = 20 + ihash(l, 5) * 66;
      ctx.fillStyle = l % 3 === 0 ? '#b03030' : '#28323a';
      for (let i = 0; i < len; i += 2) if (ihash(i + l * 31, 17) > 0.25) ctx.fillRect(bx + 4 + i, ly, 2, 1);
    }
    // a sketched helix in the corner of the board
    ctx.fillStyle = '#2a6a8a';
    for (let i = 0; i < 14; i++) { const a = i * 0.5; ctx.fillRect(bx + 74 + Math.round(Math.sin(a) * 8), by + 34 + i * 2, 2, 1); ctx.fillRect(bx + 74 + Math.round(Math.sin(a + Math.PI) * 8), by + 34 + i * 2, 2, 1); }

  // --- the centrepiece: the embryo tank
  tank(ctx, cx, t) {
    const F = LAB.FLOOR, top = 96, bot = F - 6, w = 104;
    const x0 = Math.round(cx - w / 2), x1 = Math.round(cx + w / 2);
    // plinth and service block
    ctx.fillStyle = '#22343a'; ctx.fillRect(x0 - 10, bot - 6, w + 20, 12);
    ctx.fillStyle = '#2e454c'; ctx.fillRect(x0 - 10, bot - 6, w + 20, 2);
    // cabling into the base
    ctx.fillStyle = '#151f23';
    for (let i = 0; i < 5; i++) ctx.fillRect(x0 - 26 - i * 5, bot - 2 - i, 24, 3);
    // the fluid column
    const g = ctx.createLinearGradient(0, top, 0, bot);
    g.addColorStop(0, '#1e5e58'); g.addColorStop(0.5, '#18514f'); g.addColorStop(1, '#0e3a3c');
    ctx.fillStyle = g; ctx.fillRect(x0, top, w, bot - top);
    // suspended matter, drifting up
    ctx.globalAlpha = 0.5;
    for (let i = 0; i < 46; i++) {
      const px = x0 + 3 + (ihash(i, 31) * (w - 6));
      const py = bot - ((t * (6 + ihash(i, 32) * 12) + ihash(i, 33) * 400) % (bot - top - 8));
      ctx.fillStyle = ihash(i, 34) > 0.6 ? '#8fe8d0' : '#5fa89c';
      ctx.fillRect(Math.round(px), Math.round(py), 1, ihash(i, 35) > 0.8 ? 2 : 1);
    }
    ctx.globalAlpha = 1;
    // caustic banding inside the glass
    ctx.globalAlpha = 0.08; ctx.fillStyle = '#bfffee';
    for (let i = 0; i < 7; i++) {
      const yy = top + ((t * 14 + i * 30) % (bot - top));
      ctx.fillRect(x0 + 2, Math.round(yy), w - 4, 2);
    }
    ctx.globalAlpha = 1;
    // The specimen: the real animal, in the real art, floating in the acid.
    // Nothing in this room is a placeholder for something else.
    {
      if (!this._spec) this._spec = CrocView.make();
      const v = this._spec;
      const look = typeof Create !== 'undefined' ? Create.look() : CROC_LOOKS.base;
      const parts = buildCrocParts(look);
      // held under, drifting, occasionally testing the glass
      ctx.save();
      ctx.translate(cx + 8, (top + bot) / 2 - 6 + Math.sin(t * 0.6) * 5);
      ctx.rotate(-Math.PI / 2 + Math.sin(t * 0.35) * 0.22);
      drawCroc(ctx, v.chain, parts, 1.3, { jaw: v.jaw * 0.5, legPhase: v.legPhase, flipY: 1 });
      ctx.restore();
      // the light it sits in
      ctx.globalCompositeOperation = 'lighter';
      Shape.star(ctx, cx, (top + bot) / 2 + 4, 34, '#7affda', 0.10 + 0.04 * Math.sin(t * 1.9));
      ctx.globalCompositeOperation = 'source-over';
    }
    // umbilical feed from the top cap
    ctx.strokeStyle = '#8a6a5a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx + 2, top + 6);
    for (let i = 1; i <= 6; i++) ctx.lineTo(cx + 2 + Math.sin(t * 0.8 + i) * (3 + i), top + 6 + i * 9);
    ctx.stroke();
    // glass: rim highlights, a vertical specular band, ring seams
    ctx.globalAlpha = 0.30; ctx.fillStyle = '#dffdf4';
    ctx.fillRect(x0 + 7, top + 4, 3, bot - top - 8);
    ctx.globalAlpha = 0.13; ctx.fillRect(x0 + 13, top + 4, 1, bot - top - 8);
    ctx.fillRect(x1 - 9, top + 10, 2, bot - top - 22);
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(150,230,220,0.30)'; ctx.fillRect(x0, top, 2, bot - top); ctx.fillRect(x1 - 2, top, 2, bot - top);
    for (let ry = top + 26; ry < bot - 10; ry += 44) { ctx.fillStyle = '#3a565c'; ctx.fillRect(x0 - 2, ry, w + 4, 4); ctx.fillStyle = '#4e7078'; ctx.fillRect(x0 - 2, ry, w + 4, 1); }
    // top cap with valves and a pressure gauge
    ctx.fillStyle = '#2b4149'; ctx.fillRect(x0 - 6, top - 14, w + 12, 16);
    ctx.fillStyle = '#3d5c65'; ctx.fillRect(x0 - 6, top - 14, w + 12, 2);
    for (let i = 0; i < 3; i++) { ctx.fillStyle = '#7a4a2a'; ctx.fillRect(x0 + 12 + i * 30, top - 22, 6, 9); Shape.ring(ctx, x0 + 15 + i * 30, top - 24, 5, 2, '#8a5a30'); }
    Shape.blob(ctx, x1 - 4, top - 6, 5, '#cfe8e4');
    ctx.fillStyle = '#20303a'; ctx.fillRect(x1 - 5, top - 7, 3, 1);
    ctx.fillStyle = '#c03020'; ctx.fillRect(x1 - 4, top - 7, 1, Math.sin(t) > 0 ? -3 : -2);
    // label plate
    ctx.fillStyle = '#141e22'; ctx.fillRect(cx - 34, bot - 26, 68, 13);
    Font.draw(ctx, 'SUBJECT 7', cx, bot - 23, { color: '#7affda', align: 'center' });
  },

  // --- floor: grating, a service pit, light spill from the tank
  floor(ctx, t) {
    const W = LAB.W, F = LAB.FLOOR, H = LAB.H;
    ctx.fillStyle = '#16232a'; ctx.fillRect(0, F, W, H - F);
    // epoxy floor with a sheen and a painted safety line
    ctx.fillStyle = '#1d2f36'; ctx.fillRect(0, F, W, 26);
    ctx.fillStyle = 'rgba(160,220,220,0.05)'; ctx.fillRect(0, F, W, 2);
    ctx.fillStyle = '#8a7420'; ctx.fillRect(0, F + 22, W, 2);
    ctx.globalAlpha = 0.5; ctx.fillStyle = '#c8a020';
    for (let x = 0; x < W; x += 12) ctx.fillRect(x, F + 22, 6, 2);
    ctx.globalAlpha = 1;
    // grating over the service trench
    ctx.fillStyle = '#101a1f'; ctx.fillRect(0, F + 26, W, H - F - 26);
    for (let x = 0; x < W; x += 5) { ctx.fillStyle = '#243740'; ctx.fillRect(x, F + 26, 3, H - F - 26); }
    for (let y = F + 28; y < H; y += 9) { ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(0, y, W, 2); }
    // reflection of the tank light on the wet floor
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.10; ctx.fillStyle = '#5fe0c8';
    for (let i = 0; i < 9; i++) ctx.fillRect(W / 2 - 52 + i * 12, F + 2 + (i % 3), 8, 18);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  },

  // An open acid bath set into the floor to the left of the tank: a corroded
  // steel trough of green fluid, dissolving something, fuming steadily.
  acidBath(ctx, t) {
    const F = LAB.FLOOR, x = 64, w = 78, h = 20, y = F + 2;
    // trough, eaten away at the lip
    ctx.fillStyle = '#2a3a34'; ctx.fillRect(x - 4, y - 4, w + 8, h + 6);
    ctx.fillStyle = '#3d5249'; ctx.fillRect(x - 4, y - 4, w + 8, 2);
    ctx.fillStyle = '#1b2a26'; ctx.fillRect(x, y, w, h);
    // corrosion pitting the rim
    for (let i = 0; i < 22; i++) { const px2 = x - 3 + ihash(i, 81) * (w + 6); ctx.fillStyle = ihash(i, 82) > 0.5 ? '#6a7a3a' : '#4a5a28'; ctx.fillRect(Math.round(px2), y - 4 + Math.round(ihash(i, 83) * 3), 2, 2); }
    // the fluid: a lit surface, a darker body, and a meniscus that ripples
    const surf = y + 3 + Math.sin(t * 1.7) * 0.6;
    ctx.fillStyle = '#1d5a3c'; ctx.fillRect(x + 1, y + 3, w - 2, h - 4);
    ctx.fillStyle = '#2f8a54'; ctx.fillRect(x + 1, Math.round(surf), w - 2, 2);
    ctx.fillStyle = '#8fffc0'; ctx.fillRect(x + 1, Math.round(surf), w - 2, 1);
    // bubbles bursting at the surface
    for (let i = 0; i < 16; i++) {
      const bp = (t * (0.5 + ihash(i, 84) * 0.7) + ihash(i, 85)) % 1;
      const bx = x + 4 + ihash(i, 86) * (w - 8);
      const by = y + h - 3 - bp * (h - 7);
      ctx.globalAlpha = bp > 0.85 ? (1 - bp) / 0.15 : 0.7;
      ctx.fillStyle = '#b8ffd8';
      ctx.fillRect(Math.round(bx), Math.round(by), ihash(i, 87) > 0.7 ? 2 : 1, 1);
      ctx.globalAlpha = 1;
    }
    // something half dissolved, propped in it
    ctx.fillStyle = '#c8bfa0'; ctx.fillRect(x + 48, y - 6, 3, 10);
    ctx.fillStyle = '#a89878'; ctx.fillRect(x + 51, y - 3, 6, 4);
    ctx.fillStyle = '#8a9a58'; ctx.fillRect(x + 48, y + 2, 9, 2);
    // fumes lifting off it
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 10; i++) {
      const p = (t * 0.34 + i * 0.1) % 1;
      ctx.globalAlpha = (1 - p) * 0.10;
      Shape.puff(ctx, x + 10 + ihash(i, 88) * (w - 20) + Math.sin(t + i) * 4, y - p * 46, 3 + p * 10, '#8fffc0', i * 7);
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    // hazard plate
    ctx.fillStyle = '#141e22'; ctx.fillRect(x + 2, y + h + 2, 40, 9);
    Font.draw(ctx, 'CORROSIVE', x + 4, y + h + 4, { color: '#8a9a30' });
  },
  // Loose chemistry across the room: a dripping feed line, acid stains eating
  // into the floor, and a green cast to the air near the bath.
  acidFx(ctx, t) {
    const F = LAB.FLOOR, W = LAB.W;
    // corroded feed line running down the wall into the bath
    ctx.fillStyle = '#4a5a3a'; ctx.fillRect(102, 52, 4, F - 52);
    ctx.fillStyle = '#66784a'; ctx.fillRect(102, 52, 1, F - 52);
    for (let i = 0; i < 9; i++) { const yy = 70 + i * 24; ctx.fillStyle = '#7a8a3a'; ctx.fillRect(101, yy, 6, 3); }
    // a drip, falling on its own clock, splashing in the trough
    const dp = (t * 0.55) % 1;
    ctx.fillStyle = '#a8ffc8';
    ctx.fillRect(103, Math.round(60 + dp * (F - 46)), 2, dp > 0.5 ? 3 : 2);
    if (dp > 0.95) { ctx.globalAlpha = (1 - dp) / 0.05; Shape.ripple(ctx, 104, F + 6, 6, '#b8ffd8', 0.8); ctx.globalAlpha = 1; }
    // stains where it has been dripping for years
    ctx.globalAlpha = 0.28;
    Shape.pool(ctx, 104, F + 24, 22, '#3a5a2a', 5, 0.24);
    Shape.pool(ctx, 104, F + 24, 12, '#6a8a30', 9, 0.2);
    ctx.globalAlpha = 0.2;
    Shape.pool(ctx, 470, F + 25, 16, '#3a5a2a', 12, 0.22);
    ctx.globalAlpha = 1;
    // a spill creeping out from under the fume hood, and its fumes
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.05; ctx.fillStyle = '#7affb0';
    ctx.fillRect(34, F - 60, 150, 88);
    ctx.globalAlpha = 1;
    for (let i = 0; i < 6; i++) {
      const p = (t * 0.28 + i * 0.17) % 1;
      ctx.globalAlpha = (1 - p) * 0.07;
      Shape.puff(ctx, 470 + Math.sin(t * 0.7 + i) * 8, F - p * 40, 4 + p * 9, '#8fffc0', i * 11);
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  },
  drawStaff(ctx, s) {
    if (!s.rig) return;
    const F = LAB.FLOOR;
    // long shadow under the strip lights
    ctx.globalAlpha = 0.3; ctx.fillStyle = '#0a1114';
    ctx.fillRect(Math.round(s.x - 9), F + 20, 18, 3);
    ctx.globalAlpha = 1;
    s.rig.draw(ctx, s.x, F + 22, s.face, 0, s.anim, { scale: s.rig.scale * 1.05 });
    // what they are carrying: a clipboard, a tablet, a tray of vials
    if (s.mode === 'clip') {
      ctx.fillStyle = '#d8d0bc'; ctx.fillRect(Math.round(s.x + s.face * 6), F - 2, 6, 8);
      ctx.fillStyle = '#8a8272'; ctx.fillRect(Math.round(s.x + s.face * 6), F - 2, 6, 1);
    } else if (s.mode === 'bench') {
      for (let i = 0; i < 3; i++) { ctx.fillStyle = ['#7affda', '#ffa040', '#ff6070'][i]; ctx.fillRect(Math.round(s.x + s.face * 8 + i * 3), F - 4, 2, 5); }
    }
  },

  // --- foreground: a railing, cables underfoot, crates, dust in the beams
  foreground(ctx, t) {
    const W = LAB.W, H = LAB.H, F = LAB.FLOOR;
    // cables snaking across the floor
    ctx.strokeStyle = '#0e1518'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-4, F + 30);
    for (let x = 0; x < W + 10; x += 40) ctx.lineTo(x, F + 30 + Math.sin(x * 0.05) * 5);
    ctx.stroke();
    ctx.strokeStyle = '#7a3a2a'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-4, F + 30);
    for (let x = 0; x < W + 10; x += 40) ctx.lineTo(x, F + 29 + Math.sin(x * 0.05) * 5);
    ctx.stroke();
    // crates
    const crate = (x, y, w, h) => {
      ctx.fillStyle = '#4a3a26'; ctx.fillRect(x, y, w, h);
      ctx.fillStyle = '#5d4a30'; ctx.fillRect(x, y, w, 2);
      ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(x, y + h - 2, w, 2);
      ctx.fillStyle = '#3a2c1c'; ctx.fillRect(x + 3, y + 4, w - 6, 1); ctx.fillRect(x + 3, y + h - 6, w - 6, 1);
      Font.draw(ctx, 'BIO', x + w / 2, y + h / 2 - 3, { color: '#8a7420', align: 'center' });
    };
    crate(24, F + 6, 26, 18);
    crate(586, F + 4, 30, 20);
    // dust hanging in the light
    ctx.globalAlpha = 0.30; ctx.fillStyle = '#dff4f8';
    for (let i = 0; i < 40; i++) {
      const px = (ihash(i, 61) * W + t * (3 + ihash(i, 62) * 5)) % W;
      const py = 30 + ((ihash(i, 63) * 260 + Math.sin(t * 0.5 + i) * 12) % 260);
      ctx.fillRect(Math.round(px), Math.round(py), 1, 1);
    }
    ctx.globalAlpha = 1;
  },

  // --- lighting pass: beams, vignette, cold grade
  lighting(ctx, t) {
    const W = LAB.W, H = LAB.H;
    // light cones from the strips
    ctx.globalCompositeOperation = 'lighter';
    for (let x = 40; x < W; x += 128) {
      const bad = (x / 128) % 3 === 1;
      const on = bad ? (Math.sin(t * 26 + x) > -0.55 ? 1 : 0.1) : 1;
      const gg = ctx.createLinearGradient(0, LAB.CEIL, 0, 250);
      gg.addColorStop(0, `rgba(190,240,250,${(0.10 * on).toFixed(3)})`);
      gg.addColorStop(1, 'rgba(190,240,250,0)');
      ctx.fillStyle = gg;
      ctx.beginPath();
      ctx.moveTo(x, LAB.CEIL); ctx.lineTo(x + 60, LAB.CEIL);
      ctx.lineTo(x + 108, 250); ctx.lineTo(x - 48, 250); ctx.closePath(); ctx.fill();
    }
    // the tank throws its own green light across the room
    const tg = ctx.createRadialGradient(W / 2, 200, 20, W / 2, 200, 220);
    tg.addColorStop(0, 'rgba(70,220,190,0.13)'); tg.addColorStop(1, 'rgba(70,220,190,0)');
    ctx.fillStyle = tg; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
    // cold grade and a vignette
    ctx.fillStyle = 'rgba(20,50,60,0.10)'; ctx.fillRect(0, 0, W, H);
    const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.36, W / 2, H / 2, H * 0.95);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.5)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  },
};

'use strict';
const UI = {
  vignette: null,
  init() {
    const c = mkCanvas(G.W, G.H), x = c.getContext('2d');
    const g = x.createRadialGradient(G.W / 2, G.H / 2, G.H * 0.45, G.W / 2, G.H / 2, G.H * 0.95);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.55)');
    x.fillStyle = g; x.fillRect(0, 0, G.W, G.H); this.vignette = c;
  },
  bar(ctx, x, y, w, h, frac, col, bg = '#1a1a1a', border = '#000') {
    ctx.fillStyle = border; ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
    ctx.fillStyle = bg; ctx.fillRect(x, y, w, h);
    const fw = Math.round(w * clamp(frac, 0, 1));
    if (fw > 0) { ctx.fillStyle = col; ctx.fillRect(x, y, fw, h); ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(x, y, fw, 1); }

  panel(ctx, x, y, w, h, col = 'rgba(6,10,12,0.82)', border = '#3a4a3a') {

  // a chunky outlined meter

  drawHUD(ctx) {

  drawRollGauge(ctx, P, t) {
    const W = G.W, H = G.H;
    const gw = 214, gh = 15, gx = Math.round(W / 2 - gw / 2), gy = H - 60;
    const ph = P.qteT || 0;
    // window bounds as fractions of the bar, wrapped
    const wrap = v => ((v % 1) + 1) % 1;
    const zone = (c, half, col, h2, yoff) => {
      const a = wrap(c - half), b = wrap(c + half);
      ctx.fillStyle = col;
      if (a < b) ctx.fillRect(gx + Math.round(a * gw), gy + yoff, Math.round((b - a) * gw), h2);
      else { ctx.fillRect(gx, gy + yoff, Math.round(b * gw), h2); ctx.fillRect(gx + Math.round(a * gw), gy + yoff, gw - Math.round(a * gw), h2); }
    };
    // housing
    ctx.fillStyle = 'rgba(4,10,12,0.9)'; ctx.fillRect(gx - 5, gy - 12, gw + 10, gh + 26);
    this.bracket(ctx, gx - 5, gy - 12, gw + 10, gh + 26, 'rgba(255,180,90,0.55)', 7);
    // track
    ctx.fillStyle = '#101a1c'; ctx.fillRect(gx, gy, gw, gh);
    // the bands: a wide green tear window with a gold core inside it
    const RW = (P.st && P.st.rollWindow) || 1, WG = QTE_GOOD * RW, WP = QTE_PERFECT * RW;
    zone(QTE_AT, WG, '#1d5a4a', gh, 0);
    zone(QTE_AT, WP, '#8a6a10', gh, 0);
    zone(QTE_AT, WG, '#2f8a72', 2, 0);
    zone(QTE_AT, WP, '#ffd040', 2, 0);
    // tick marks along the track
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    for (let i = 1; i < 16; i++) ctx.fillRect(gx + Math.round(i * gw / 16), gy, 1, i % 4 === 0 ? gh : 3);
    // needle, with a trail behind it so the direction reads at a glance
    const nx = gx + Math.round(wrap(ph) * gw);
    const inWin = Math.min(Math.abs(ph - QTE_AT), 1 - Math.abs(ph - QTE_AT)) < WG;
    for (let k = 1; k <= 5; k++) {
      const tx = nx - k * 3;
      if (tx < gx) continue;
      ctx.globalAlpha = 0.32 - k * 0.05; ctx.fillStyle = '#ffffff';
      ctx.fillRect(tx, gy + 2, 2, gh - 4);
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#050a0c'; ctx.fillRect(nx - 2, gy - 3, 5, gh + 6);
    ctx.fillStyle = inWin ? '#ffffff' : '#bfe8ff'; ctx.fillRect(nx - 1, gy - 3, 3, gh + 6);
    // chevrons above and below the needle
    ctx.fillStyle = inWin ? '#ffd040' : '#5f9fbf';
    ctx.fillRect(nx - 3, gy - 6, 7, 2); ctx.fillRect(nx - 2, gy - 8, 5, 2);
    ctx.fillRect(nx - 3, gy + gh + 4, 7, 2); ctx.fillRect(nx - 2, gy + gh + 6, 5, 2);
